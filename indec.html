    function saveEditedGarment(e, garmentId) {
      e.preventDefault();
      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;
      grm.image = document.getElementById('edit-grm-img-data')?.value || '';
      grm.name = document.getElementById('edit-grm-name')?.value.trim() || grm.name;
      grm.price = Number(document.getElementById('edit-grm-price')?.value || 0);
      grm.karigorFee = Number(document.getElementById('edit-grm-kfee')?.value || 0);
      grm.completeFee = Number(document.getElementById('edit-grm-cfee')?.value || 30);
      const fRaw = document.getElementById('edit-grm-fields')?.value || '';
      grm.fields = fRaw.split(',').map((s) => s.trim()).filter(Boolean);
      grm.designs = [...pendingGarmentDesignList];
      persistState();
      closeModal();
      showToast(`${grm.name} আপডেট হয়েছে!`, 'success');
      renderApp();
    }

    function submitNewGarment(e) {
      e.preventDefault();
      const name = document.getElementById('new-grm-name')?.value.trim();
      if (!name) return;
      state.garments.push({
        id: 'GRM-' + Date.now(),
        name,
        icon: '👘',
        image: document.getElementById('new-grm-img-data')?.value || '',
        price: Number(document.getElementById('new-grm-price')?.value || 600),
        karigorFee: Number(document.getElementById('new-grm-kfee')?.value || 200),
        completeFee: Number(document.getElementById('new-grm-cfee')?.value || 30),
        fields: [...PANJABI_FIELDS],
        designs: [...SPECIAL_DESIGNS]
      });
      persistState();
      closeModal();
      showToast('নতুন টেইলার্স আইটেম যুক্ত হয়েছে!', 'success');
      renderApp();

    // 9. REPORTS & PROFIT

    function setReportQuickPreset(preset) {
      reportQuickPreset = preset;
      const now = new Date();
      const todayIso = now.toISOString().split('T')[0];
      if (preset === 'TODAY') {
        reportFromDate = todayIso;
        reportToDate = todayIso;
      } else if (preset === 'MONTH') {
        reportFromDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        reportToDate = todayIso;
      } else {
        reportFromDate = '';
        reportToDate = '';
      }
      renderApp();
    }

    function renderReports() {
      if (!isMasterAdmin()) return `<div class="p-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-extrabold text-center">⛔ শুধুমাত্র মাস্টার অ্যাডমিন রিপোর্ট ও লাভ-ক্ষতি দেখতে পারবেন।</div>`;

      const filteredOrders = state.orders.filter((o) => {
        const dStr = String(o.orderDate || o.createdAt || '').slice(0, 10);
        if (reportFromDate && dStr < reportFromDate) return false;
        if (reportToDate && dStr > reportToDate) return false;
        return true;

      const filteredExpenses = (state.expenses || []).filter((e) => {
        const dStr = String(e.date || '').slice(0, 10);

        if (reportToDate && dStr > reportToDate) return false;
        return true;

      const fin = calculateFinancials(filteredOrders);
      const totalExp = filteredExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
      const retailNetProfit = reportDeductExpFromRetail ? (fin.retailGrossProfit - totalExp) : fin.retailGrossProfit;
      const combinedNetProfit = fin.tailorNetProfit + retailNetProfit;

      const tabLabels = {

        RETAIL: { icon: '🧵', title: 'ফেব্রিক্স ও প্রোডাক্ট লাভ', desc: 'শুধুমাত্র গজ কাপড় ও পণ্যের লাভ (টেইলার্স ছাড়া)' },

              <button type="button" onclick="window.print()" class="px-4 py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-amber-300 font-extrabold flex items-center gap-1.5 shadow cursor-pointer">

          ${activeReportSubTab === 'RETAIL' ? `
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-4">

    function renderKarigorLedger() {
      const logs = state.workLogs || [];
      const karigorStats = (state.karigors || []).map((k) => {
        let sewingPieces = 0, completePieces = 0, totalEarned = 0;
        logs.forEach((lg) => {
          if (lg.workerName === k.name) {
            if (lg.stage === 'SEWING') sewingPieces += Number(lg.qty || 1);
            if (lg.stage === 'COMPLETE') completePieces += Number(lg.qty || 1);
            totalEarned += Number(lg.amount || 0);
          }
        });
        const paid = Number(k.paid || 0);
        const payable = Math.max(0, totalEarned - paid);
        return { ...k, sewingPieces, completePieces, totalEarned, paid, payable };
      });

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-slate-200 flex flex-wrap items-center justify-between gap-2">

              <h2 class="text-base font-extrabold text-slate-900">🪡 কারিগর ও কমপ্লিট ম্যান হিসাব + কাজের চার্ট লিস্ট</h2>

              <button type="button" onclick="karigorSubTab='WORKLOG'; state.unreadSignals=0; persistState(); renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-extrabold cursor-pointer ${karigorSubTab === 'WORKLOG' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">📋 কাজের পূর্ণাঙ্গ চার্ট লিস্ট (${toBnNum(logs.length)})</button>
              ${isMasterAdmin() ? `<button type="button" onclick="openAddKarigorModal()" class="px-3.5 py-2 rounded-xl bg-emerald-700 text-white text-xs font-extrabold cursor-pointer">+ নতুন কর্মী যোগ</button>` : ''}
            </div>
          </div>

          ${karigorSubTab === 'SUMMARY' ? `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              ${karigorStats.map((k) => `
                <div class="bg-white rounded-2xl p-4 border border-slate-200 space-y-2.5 text-xs">
                  <div>
                    <div class="font-extrabold text-sm text-slate-900">${k.name}</div>
                    <div class="text-slate-500">${k.workerType || 'কারিগর'} • 📞 ${k.phone || '-'} ${k.pin ? '• 🔒 পিন সেট' : ''}</div>
                  </div>
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                    <div class="flex justify-between"><span>সুইং (সেলাই) সম্পন্ন:</span><b>${toBnNum(k.sewingPieces)} পিস</b></div>
                    <div class="flex justify-between"><span>কমপ্লিট (ফিনিশিং) সম্পন্ন:</span><b>${toBnNum(k.completePieces)} পিস</b></div>
                    <div class="flex justify-between"><span>মোট অটো-জমা মজুরি:</span><b class="text-emerald-800">${formatTk(k.totalEarned)}</b></div>
                    <div class="flex justify-between"><span>পরিশোধিত:</span><b>${formatTk(k.paid)}</b></div>
                    <div class="flex justify-between border-t pt-1 font-extrabold"><span>বর্তমান পাওনা:</span><span class="text-rose-600">${formatTk(k.payable)}</span></div>
                  </div>
                  ${isMasterAdmin() ? `<button type="button" onclick="openPayKarigorModal('${k.id}', ${k.payable})" class="w-full py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold cursor-pointer">৳ মজুরি পরিশোধ করুন</button>` : ''}
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
              <div class="px-4 py-3 border-b border-slate-100">
                <h3 class="text-xs font-extrabold text-slate-900">📋 কোন কাজটা কোন কারিগর সেলাই ও কোন কমপ্লিট ম্যান কমপ্লিট করেছেন তার চার্ট লিস্ট</h3>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-extrabold">
                      <th class="p-3">তারিখ ও সময়</th>
                      <th class="p-3">মেমো ও কাস্টমার</th>
                      <th class="p-3">পোশাকের নাম</th>
                      <th class="p-3">কাজের ধাপ</th>
                      <th class="p-3">যিনি সম্পন্ন করেছেন</th>
                      <th class="p-3 text-right">জমাকৃত টাকা</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${logs.length === 0 ? `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-semibold">এখনো কোনো কারিগর বা কমপ্লিট ম্যান কাজ ডান করেননি।</td></tr>` : logs.map((lg) => `
                      <tr class="hover:bg-slate-50/70">
                        <td class="p-3 text-[11px] font-bold text-slate-600">${new Date(lg.date).toLocaleString('bn-BD', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded bg-emerald-900 text-amber-300 font-extrabold text-[10px]">#${String(lg.orderId || '').replace('ORD-', '')}</span> <span class="font-bold text-slate-900 ml-1">${lg.customerName}</span></td>
                        <td class="p-3 font-extrabold text-slate-900">${lg.garmentName} (x${toBnNum(lg.qty)})</td>
                        <td class="p-3">${lg.stage === 'SEWING' ? `<span class="px-2 py-0.5 rounded-full bg-blue-100 text-blue-900 font-extrabold text-[10px]">🪡 সুইং (সেলাই) ডান</span>` : `<span class="px-2 py-0.5 rounded-full bg-purple-100 text-purple-900 font-extrabold text-[10px]">✨ কমপ্লিট (ফিনিশিং) ডান</span>`}</td>
                        <td class="p-3 font-extrabold text-emerald-900">${lg.workerName}</td>
                        <td class="p-3 text-right font-extrabold text-emerald-700">+ ${formatTk(lg.amount)}</td>

                </table>
              </div>
            </div>
          `}

      `;

    function openAddKarigorModal() {
      if (!requireMasterGuard('নতুন কর্মী যোগ')) return;
      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">+ নতুন কারিগর / কমপ্লিট ম্যান যোগ করুন</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="submitNewKarigor(event)" class="p-5 space-y-3 text-xs">
          <div><label class="block font-bold mb-1">কর্মীর নাম *</label><input id="krg-new-name" type="text" required class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
          <div><label class="block font-bold mb-1">দায়িত্বের ধরন</label><select id="krg-new-role" class="w-full px-3 py-2 rounded-xl border font-bold"><option value="সেলাই কারিগর">সেলাই কারিগর (Sewing)</option><option value="কমপ্লিট ও ফিনিশিং">কমপ্লিট ও ফিনিশিং ম্যান (Complete)</option><option value="সেলাই ও কাটিং">সেলাই ও কাটিং মাস্টার</option></select></div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block font-bold mb-1">মোবাইল নম্বর</label><input id="krg-new-phone" type="text" class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
            <div><label class="block font-bold mb-1">ব্যক্তিগত পিন (ঐচ্ছিক)</label><input id="krg-new-pin" type="text" inputmode="numeric" maxlength="6" placeholder="যেমন: 1122" class="w-full px-3 py-2 rounded-xl border border-amber-400 font-extrabold" /></div>

          </div>
        </form>
      `;
      openModal(html, 'max-w-md');
    }

    function submitNewKarigor(e) {
      e.preventDefault();
      if (!requireMasterGuard('নতুন কর্মী যোগ')) return;
      const name = document.getElementById('krg-new-name')?.value.trim();
      if (!name) return;
      state.karigors.push({
        id: 'KRG-' + Date.now(),
        name,
        workerType: document.getElementById('krg-new-role')?.value.trim(),
        phone: document.getElementById('krg-new-phone')?.value.trim(),
        pin: document.getElementById('krg-new-pin')?.value.trim() || '',
        paid: 0
      });
      persistState();
      closeModal();
      showToast('নতুন কর্মী যুক্ত হয়েছে!', 'success');
      renderApp();
    }

    function openPayKarigorModal(krgId, payable) {
      if (!requireMasterGuard('মজুরি পরিশোধ')) return;
      const krg = state.karigors.find((k) => k.id === krgId);
      if (!krg) return;
      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">৳ মজুরি পরিশোধ — ${krg.name}</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="submitPayKarigor(event, '${krg.id}')" class="p-5 space-y-3 text-xs">
          <div><label class="block font-bold mb-1">পরিশোধের পরিমাণ (পাওনা: ${formatTk(payable)})</label><input id="krg-pay-amt" type="number" min="1" value="${payable > 0 ? payable : ''}" required class="w-full px-3 py-2 rounded-xl border border-emerald-500 font-extrabold text-base" /></div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ পরিশোধ করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-sm');
    }

    function submitPayKarigor(e, krgId) {
      e.preventDefault();
      const krg = state.karigors.find((k) => k.id === krgId);
      const amt = Number(document.getElementById('krg-pay-amt')?.value || 0);
      if (krg && amt > 0) krg.paid = Number(krg.paid || 0) + amt;
      persistState();
      closeModal();
      showToast(`${formatTk(amt)} মজুরি পরিশোধ করা হয়েছে!`, 'success');
      renderApp();
    }

    function renderExpenses() {
      const totalExp = (state.expenses || []).reduce((s, x) => s + Number(x.amount || 0), 0);
      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-slate-200 flex items-center justify-between">
            <div><h2 class="text-base font-extrabold text-slate-900">💸 দৈনিক খরচ খাতা (মোট: ${formatTk(totalExp)})</h2></div>
            <button type="button" onclick="openAddExpenseModal()" class="px-4 py-2 rounded-xl bg-emerald-700 text-white text-xs font-extrabold cursor-pointer">+ নতুন খরচ এন্ট্রি</button>
          </div>
          <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead><tr class="bg-slate-50 border-b font-extrabold"><th class="p-3">তারিখ</th><th class="p-3">বিবরণ</th><th class="p-3 text-right">পরিমাণ</th><th class="p-3 text-right">অ্যাকশন</th></tr></thead>
              <tbody class="divide-y">

                    <td class="p-3 text-right">${isMasterAdmin() ? `<button type="button" onclick="deleteExpenseRecord('${ex.id}')" class="px-2 py-1 rounded bg-rose-50 text-rose-700 font-bold cursor-pointer">✕</button>` : '-'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">+ দৈনিক খরচ যোগ করুন</h3>

          <div><label class="block font-bold mb-1">টাকার পরিমাণ (৳) *</label><input id="exp-amt" type="number" min="1" required class="w-full px-3 py-2 rounded-xl border font-extrabold" /></div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ সেভ</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-sm');
    }

    function submitNewExpense(e) {
      e.preventDefault();
      const title = document.getElementById('exp-title')?.value.trim();
      const amount = Number(document.getElementById('exp-amt')?.value || 0);
      if (!title || amount <= 0) return;
      state.expenses.unshift({ id: 'EXP-' + Date.now(), date: new Date().toISOString().split('T')[0], title, amount });
      persistState();
      closeModal();
      showToast('খরচ সংরক্ষিত হয়েছে!', 'success');
      renderApp();
    }

    function deleteExpenseRecord(expId) {
      if (!requireMasterGuard('খরচ ডিলিট')) return;
      state.expenses = state.expenses.filter((x) => x.id !== expId);
      persistState();
      showToast('খরচ এন্ট্রি মুছে ফেলা হয়েছে।', 'warn');
      renderApp();
    }

      const cust = state.customers.find((c) => c.phone === phone);

      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <div>
            <h3 class="text-sm font-extrabold text-amber-300">📏 পূর্বের অর্ডার ও মাপ — ${cust?.name || phone}</h3>
            <p class="text-[11px] text-emerald-200">মোট অর্ডার: ${toBnNum(custOrders.length)} টি • মোবাইল: ${phone}</p>

          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>

      const cust = state.customers.find((c) => c.id === custId);
      if (!cust) return;
      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">৳ বকেয়া আদায় — ${cust.name}</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>

    function submitCustomerDueCollection(e, custId) {
      e.preventDefault();
      const cust = state.customers.find((c) => c.id === custId);
      const amt = Number(document.getElementById('cust-due-pay')?.value || 0);
      if (!cust || amt <= 0) return;
      cust.due = Math.max(0, Number(cust.due || 0) - amt);
      let rem = amt;
      state.orders.forEach((o) => {
        if (rem > 0 && o.customerPhone === cust.phone) {
          const bd = calculateFinancials([o]).orderBreakdown[0];
          if (bd.due > 0) {
            const apply = Math.min(rem, bd.due);
            o.paidAmount = Number(o.paidAmount || 0) + apply;
            rem -= apply;
          }
        }
      });
      persistState();
      closeModal();
      showToast(`${formatTk(amt)} বকেয়া আদায় সম্পন্ন হয়েছে!`, 'success');
      renderApp();
    }

    function submitNewPurchase(e) {
      e.preventDefault();
      const sup = state.suppliers.find((s) => s.id === document.getElementById('pur-sup-id')?.value);
      const inv = state.inventory.find((i) => i.id === document.getElementById('pur-inv-id')?.value);
      const qty = Number(document.getElementById('pur-qty')?.value || 0);
      const cost = Number(document.getElementById('pur-cost')?.value || 0);
      const paid = Number(document.getElementById('pur-paid')?.value || 0);
      if (!sup || !inv || qty <= 0) return;

      const total = Math.round(qty * cost);
      const due = Math.max(0, total - paid);
      inv.stock = Number(inv.stock || 0) + qty;
      inv.costPrice = cost;
      sup.due = Number(sup.due || 0) + due;

      state.purchases.unshift({
        id: 'PUR-' + Date.now(),
        date: new Date().toISOString().split('T')[0],
        supplierName: sup.name,
        itemName: inv.name,
        qty,
        total,
        paid,
        due
      });
      persistState();
      closeModal();
      showToast(`${inv.name} স্টকে যুক্ত হয়েছে এবং ক্রয় হিসাব সেভ হয়েছে!`, 'success');
      renderApp();
    }

      e.preventDefault();
      if (!requireMasterGuard('নতুন অ্যাডমিন যুক্ত করা')) return;
      const role = document.getElementById('new-adm-role')?.value || 'MANAGER';
      const name = (document.getElementById('new-adm-name')?.value || '').trim();
      const phone = (document.getElementById('new-adm-phone')?.value || '').trim();
      const pin = (document.getElementById('new-adm-pin')?.value || '').trim();
      if (!name || !phone || !pin) {
        showToast('নাম, মোবাইল নম্বর এবং পাসওয়ার্ড দিন!', 'warn');
        return;
      }

      if (role === 'MASTER') {
        state.auth.masterAdmins.push({ id: 'MA-' + Date.now(), name, phone, pin });
      } else if (role === 'KARIGOR') {
        state.auth.karigorAdmins.push({ id: 'KRGA-' + Date.now(), name, phone, pin });
      } else {
        state.auth.managerAdmins.push({ id: 'MGR-' + Date.now(), name, phone, pin });
      }

      persistState();
      closeModal();
      showToast(`✓ "${name}" যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

      showToast('শোরুম, লোগো ও মেমো সেটিংস সেভ হয়েছে!', 'success');
      renderApp();
    }

    function saveWhatsAppApiSettings(e) {
      e.preventDefault();
      state.whatsappApi = {
        enabled: Boolean(document.getElementById('wa-api-enabled')?.checked),
        apiUrl: (document.getElementById('wa-api-url')?.value || '').trim(),
        instanceId: (document.getElementById('wa-api-inst')?.value || '').trim(),
        token: (document.getElementById('wa-api-token')?.value || '').trim()
      };
      persistState();
      showToast('📲 WhatsApp অটোমেশন সেটিংস সেভ হয়েছে!', 'success');
      renderApp();
    }

    function downloadJsonBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AlKarim_Backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function restoreJsonBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && parsed.shop) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            state = loadInitialState();
            persistState();
            showToast('ব্যাকআপ সফলভাবে রিস্টোর হয়েছে!', 'success');
            renderApp();
          }
        } catch (err) { showToast('সঠিক ব্যাকআপ ফাইল নয়!', 'warn'); }
      };
      reader.readAsText(file);
    }

    function renderSettings() {
      const masters = state.auth?.masterAdmins || [];
      const managers = state.auth?.managerAdmins || [];
      const karigorAdmins = state.auth?.karigorAdmins || [];
      const curRole = state.auth?.activeRole || 'MASTER';
      const curUser = state.auth?.activeUserName || 'মাস্টার অ্যাডমিন';
      const remembered = loadRememberedAuth();
      const waCfg = state.whatsappApi || {};
      const curSub = isMasterAdmin() ? activeSettingsSubTab : 'ADMIN';

      const serialRows = [];
      masters.forEach((m) => serialRows.push({ ...m, role: 'MASTER', badge: 'মাস্টার অ্যাডমিন' }));
      managers.forEach((mg) => serialRows.push({ ...mg, role: 'MANAGER', badge: 'ম্যানেজার অ্যাডমিন' }));
      karigorAdmins.forEach((kg) => serialRows.push({ ...kg, role: 'KARIGOR', badge: 'কারিগর অ্যাডমিন' }));

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-2xs flex flex-wrap items-center gap-2 text-xs">
            <button type="button" onclick="activeSettingsSubTab='ADMIN'; renderApp();" class="px-4 py-2 rounded-xl font-extrabold cursor-pointer ${curSub === 'ADMIN' ? 'royal-gradient text-amber-300 shadow-2xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
              🔐 ১. অ্যাডমিন, মোবাইল ও পাসওয়ার্ড
            </button>
            ${isMasterAdmin() ? `
              <button type="button" onclick="activeSettingsSubTab='SHOP'; renderApp();" class="px-4 py-2 rounded-xl font-extrabold cursor-pointer ${curSub === 'SHOP' ? 'royal-gradient text-amber-300 shadow-2xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                🏪 ২. দোকান, লোগো ও মেমো
              </button>
              <button type="button" onclick="activeSettingsSubTab='BACKUP'; renderApp();" class="px-4 py-2 rounded-xl font-extrabold cursor-pointer ${curSub === 'BACKUP' ? 'royal-gradient text-amber-300 shadow-2xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                💾 ৩. ব্যাকআপ ও WhatsApp
              </button>
            ` : ''}
          </div>

          ${curSub === 'ADMIN' ? `
            <div class="space-y-4">
              <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 space-y-3 text-xs">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 class="text-sm sm:text-base font-extrabold text-slate-900">অ্যাডমিন তালিকা (${curUser})</h2>
                    <p class="text-slate-500">${remembered?.remembered ? 'এই ডিভাইসে লগইন সেভ আছে' : 'মোবাইল ও পাসওয়ার্ড দিয়ে একবার লগইন করলেই সেভ হয়ে যাবে'}</p>
                  </div>
                  <div class="flex flex-wrap gap-1.5">
                    ${isMasterAdmin() ? `<button type="button" onclick="openAddSmartAdminModal('MANAGER')" class="px-3.5 py-1.5 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-amber-300 font-extrabold cursor-pointer">+ নতুন অ্যাডমিন</button>` : ''}
                    ${remembered?.remembered ? `<button type="button" onclick="clearRememberedAuth(); showToast('লগইন রিসেট হয়েছে।'); renderApp();" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold cursor-pointer">লগইন রিসেট</button>` : ''}
                  </div>
                </div>

                ${serialRows.length === 0
                  ? `<div class="p-4 rounded-xl bg-slate-50 border border-dashed border-slate-300 text-slate-500 text-center">এখনো কোনো অ্যাডমিন যুক্ত করা হয়নি। "+ নতুন অ্যাডমিন" বাটনে চাপ দিয়ে যুক্ত করুন।</div>`
                  : `<div class="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden">
                      ${serialRows.map((item, sIdx) => {
                        const isActive = curRole === item.role && state.auth.activeUserId === item.id;
                        return `
                          <div onclick="activateRoleWithRemember('${item.role}', '${item.id}', '${item.name}')" class="px-4 py-3 flex items-center justify-between gap-2 cursor-pointer transition ${isActive ? 'bg-emerald-50' : 'bg-white hover:bg-slate-50'}">
                            <div class="font-extrabold text-slate-900">
                              ${toBnNum(sIdx + 1)}. ${item.name} <span class="text-emerald-800 font-bold">— ${item.badge}</span>
                            </div>
                            <span class="text-[11px] font-extrabold ${isActive ? 'text-emerald-700' : 'text-slate-500'}">${isActive ? '✓ সক্রিয়' : 'নির্বাচন'}</span>
                          </div>
                        `;
                      }).join('')}
                    </div>`
                }
              </div>

              ${isMasterAdmin() ? `
                <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 space-y-3 text-xs">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <h3 class="text-sm sm:text-base font-extrabold text-slate-900">মোবাইল নম্বর ও পাসওয়ার্ড সেটআপ</h3>
                      <p class="text-slate-500">যে ক্যাটাগরিতে মোবাইল ও পাসওয়ার্ড দেবেন, লগইন করলে সেই প্যানেলের মালিক হবে</p>
                    </div>
                    <button type="button" onclick="openAddSmartAdminModal('MANAGER')" class="px-3.5 py-1.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-extrabold cursor-pointer">+ নতুন অ্যাডমিন</button>
                  </div>

                  <form onsubmit="saveAdminRolesSetup(event)" class="space-y-4">
                    <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
                      <div class="font-extrabold text-slate-900">মাস্টার অ্যাডমিন</div>
                      ${masters.length === 0 ? `<div class="text-slate-400">কোনো মাস্টার অ্যাডমিন নেই</div>` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          ${masters.map((m, idx) => `
                            <div class="flex flex-wrap sm:flex-nowrap items-center gap-1.5 bg-white p-2 rounded-xl border">
                              <input id="ma-name-${idx}" type="text" value="${m.name}" required placeholder="নাম" class="flex-1 min-w-[90px] px-2.5 py-1.5 rounded-lg border font-bold" />
                              <input id="ma-phone-${idx}" type="tel" value="${m.phone || ''}" placeholder="মোবাইল" class="w-28 px-2 py-1.5 rounded-lg border font-bold" />
                              <input id="ma-pin-${idx}" type="text" value="${m.pin || ''}" placeholder="পাসওয়ার্ড" class="w-24 px-2 py-1.5 rounded-lg border border-amber-400 font-extrabold text-center" />
                              <button type="button" onclick="deleteSmartAdminAccount('MASTER', '${m.id}')" class="px-2 py-1.5 rounded-lg bg-rose-50 text-rose-700 font-bold cursor-pointer">✕</button>
                            </div>
                          `).join('')}
                        </div>
                      `}
                    </div>

                    <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
                      <div class="font-extrabold text-slate-900">ম্যানেজার অ্যাডমিন</div>
                      ${managers.length === 0 ? `<div class="text-slate-400">কোনো ম্যানেজার অ্যাডমিন নেই</div>` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          ${managers.map((mg, idx) => `
                            <div class="flex flex-wrap sm:flex-nowrap items-center gap-1.5 bg-white p-2 rounded-xl border">
                              <input id="mgr-name-${idx}" type="text" value="${mg.name}" required placeholder="নাম" class="flex-1 min-w-[90px] px-2.5 py-1.5 rounded-lg border font-bold" />
                              <input id="mgr-phone-${idx}" type="tel" value="${mg.phone || ''}" placeholder="মোবাইল" class="w-28 px-2 py-1.5 rounded-lg border font-bold" />
                              <input id="mgr-pin-${idx}" type="text" value="${mg.pin || ''}" placeholder="পাসওয়ার্ড" class="w-24 px-2 py-1.5 rounded-lg border border-blue-300 font-extrabold text-center" />
                              <button type="button" onclick="deleteSmartAdminAccount('MANAGER', '${mg.id}')" class="px-2 py-1.5 rounded-lg bg-rose-50 text-rose-700 font-bold cursor-pointer">✕</button>
                            </div>
                          `).join('')}
                        </div>
                      `}
                    </div>

                    <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
                      <div class="font-extrabold text-slate-900">কারিগর অ্যাডমিন</div>
                      ${karigorAdmins.length === 0 ? `<div class="text-slate-400">কোনো কারিগর অ্যাডমিন নেই</div>` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          ${karigorAdmins.map((kg, idx) => `
                            <div class="flex flex-wrap sm:flex-nowrap items-center gap-1.5 bg-white p-2 rounded-xl border">
                              <input id="krga-name-${idx}" type="text" value="${kg.name}" required placeholder="নাম" class="flex-1 min-w-[90px] px-2.5 py-1.5 rounded-lg border font-bold" />
                              <input id="krga-phone-${idx}" type="tel" value="${kg.phone || ''}" placeholder="মোবাইল" class="w-28 px-2 py-1.5 rounded-lg border font-bold" />
                              <input id="krga-pin-${idx}" type="text" value="${kg.pin || ''}" placeholder="পাসওয়ার্ড" class="w-24 px-2 py-1.5 rounded-lg border border-emerald-300 font-extrabold text-center" />
                              <button type="button" onclick="deleteSmartAdminAccount('KARIGOR', '${kg.id}')" class="px-2 py-1.5 rounded-lg bg-rose-50 text-rose-700 font-bold cursor-pointer">✕</button>
                            </div>
                          `).join('')}
                        </div>
                      `}
                    </div>

                    ${serialRows.length > 0 ? `<button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">✓ সেভ করুন</button>` : ''}
                  </form>
                </div>
              ` : ''}
            </div>
          ` : ''}

          ${curSub === 'SHOP' && isMasterAdmin() ? `
            <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 space-y-3 text-xs">
              <h3 class="text-sm sm:text-base font-extrabold text-slate-900">🏪 শোরুম, লোগো ও মেমো শর্তাবলী সেটিংস</h3>
              <form onsubmit="saveShopSettingsForm(event)" class="space-y-3">
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center gap-3">
                  <div class="w-14 h-14 shrink-0">${getRoyalBrandLogoSvg('set-logo')}</div>
                  <div class="space-y-1">
                    <div class="font-extrabold text-slate-800">🖼️ দোকানের লোগো পরিবর্তন করুন</div>
                    <label class="inline-block px-3 py-1.5 rounded-lg bg-emerald-700 text-white font-extrabold cursor-pointer">
                      লোগো ছবি আপলোড
                      <input type="file" accept="image/*" onchange="handleFileToHiddenInput(event, 'set-shop-logo-data')" class="hidden" />
                    </label>
                    <input id="set-shop-logo-data" type="hidden" value="${state.shop.logoImage || ''}" />
                  </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div><label class="block font-bold mb-1">প্রতিষ্ঠানের নাম</label><input id="set-shop-bn" type="text" value="${state.shop.nameBn}" required class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
                  <div><label class="block font-bold mb-1">মোবাইল নম্বরসমূহ</label><input id="set-shop-phones" type="text" value="${state.shop.phones}" required class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
                </div>
                <div><label class="block font-bold mb-1">ঠিকানা</label><input id="set-shop-addr" type="text" value="${state.shop.address}" required class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
                <div><label class="block font-bold mb-1">মেমোর শর্তাবলী ও নোটিশ</label><textarea id="set-shop-notice" rows="4" class="w-full px-3 py-2 rounded-xl border font-bold">${state.shop.memoNotice}</textarea></div>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ শোরুম তথ্য সেভ করুন</button>
              </form>
            </div>
          ` : ''}

          ${curSub === 'BACKUP' && isMasterAdmin() ? `
            <div class="space-y-4">
              <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 space-y-3 text-xs">
                <div>
                  <h3 class="text-sm sm:text-base font-extrabold text-slate-900">📲 WhatsApp অটোমেশন সেটিংস (Ready ও Delivery মেসেজ)</h3>
                  <p class="text-slate-500">ডিফল্টভাবে ফ্রি ওয়ান-টাচ অটো মেসেজ চালু আছে। চাইলে থার্ড-পার্টি WhatsApp Gateway API বসিয়ে ব্যাকগ্রাউন্ডেও পাঠাতে পারবেন।</p>
                </div>
                <form onsubmit="saveWhatsAppApiSettings(event)" class="space-y-3">
                  <label class="flex items-center gap-2 font-extrabold text-emerald-950 cursor-pointer">
                    <input id="wa-api-enabled" type="checkbox" ${waCfg.enabled ? 'checked' : ''} class="accent-emerald-700 w-4 h-4" />
                    <span>ব্যাকগ্রাউন্ড WhatsApp API গেটওয়ে সক্রিয় করুন (ঐচ্ছিক)</span>
                  </label>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <div><label class="block font-bold mb-1">API Endpoint URL</label><input id="wa-api-url" type="text" value="${waCfg.apiUrl || ''}" placeholder="https://api.ultramsg.com/..." class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
                    <div><label class="block font-bold mb-1">Instance ID</label><input id="wa-api-inst" type="text" value="${waCfg.instanceId || ''}" placeholder="instance12345" class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
                    <div><label class="block font-bold mb-1">API Token</label><input id="wa-api-token" type="password" value="${waCfg.token || ''}" placeholder="••••••••••••" class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
                  </div>
                  <button type="submit" class="px-5 py-2.5 rounded-xl bg-green-700 text-white font-extrabold cursor-pointer">✓ WhatsApp সেটিংস সেভ করুন</button>
                </form>
              </div>

              <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 space-y-3 text-xs">
                <h3 class="text-sm sm:text-base font-extrabold text-slate-900">💾 ডাটা ব্যাকআপ, রিস্টোর ও রিসেট (Offline JSON)</h3>
                <div class="flex flex-wrap items-center gap-3">
                  <button type="button" onclick="downloadJsonBackup()" class="px-4 py-2.5 rounded-xl bg-slate-900 text-amber-300 font-extrabold cursor-pointer">⬇️ সম্পূর্ণ ব্যাকআপ ডাউনলোড করুন</button>
                  <label class="px-4 py-2.5 rounded-xl bg-emerald-50 text-emerald-900 border border-emerald-300 font-extrabold cursor-pointer">
                    ⬆️ ব্যাকআপ ফাইল রিস্টোর করুন
                    <input type="file" accept=".json" onchange="restoreJsonBackup(event)" class="hidden" />
                  </label>
                  <button type="button" onclick="openResetAllDataModal()" class="px-4 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 font-extrabold cursor-pointer">🗑️ সব ডাটা রিসেট করুন</button>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function openResetAllDataModal() {
      const html = `
        <div class="px-5 py-4 border-b bg-rose-700 text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold">⚠️ সতর্কতা — সব ডাটা রিসেট করবেন?</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <div class="p-5 space-y-3 text-xs">
          <p class="font-bold text-slate-700">এটি করলে বর্তমানের সব অর্ডার, কাস্টমার, খরচ ও কাজের লগ মুছে গিয়ে অ্যাপটি একদম নতুন অবস্থায় ফিরে যাবে। রিসেট করার আগে অবশ্যই ব্যাকআপ ডাউনলোড করে রাখুন।</p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="button" onclick="confirmResetAllData()" class="px-5 py-2 rounded-xl bg-rose-700 text-white font-extrabold cursor-pointer">✓ হ্যাঁ, রিসেট করুন</button>
          </div>
        </div>
      `;
      openModal(html, 'max-w-sm');
    }

    function confirmResetAllData() {
      localStorage.removeItem(STORAGE_KEY);
      state = loadInitialState();
      cartItems = [];
      editingOrderId = null;
      persistState();
      closeModal();
      showToast('অ্যাপের সব ডাটা সফলভাবে রিসেট হয়েছে!', 'warn');
      renderApp();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCloudFirestoreSync();
      renderApp();
    });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      initCloudFirestoreSync();
      renderApp();
    }
  </script>
</body>
</html>
