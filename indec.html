  <script>
    // ==========================================
    // 0. SAFE STORAGE & HTML VIEWER FALLBACK

    const memoryStorageFallback = {};
    function safeGetItem(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        return Object.prototype.hasOwnProperty.call(memoryStorageFallback, key) ? memoryStorageFallback[key] : null;
      }
    }
    function safeSetItem(key, val) {
      try {
        window.localStorage.setItem(key, val);
      } catch (e) {
        memoryStorageFallback[key] = val;
      }
    }
    function safeRemoveItem(key) {
      try {
        window.localStorage.removeItem(key);
      } catch (e) {
        delete memoryStorageFallback[key];
      }
    }

    // ==========================================
    // 1. CONSTANTS, DEFAULT DATA & STATE
    // ==========================================
    const STORAGE_KEY = 'ALKARIM_ERP_STATE_V6';

      try {
        const raw = safeGetItem(REMEMBERED_AUTH_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (err) {
        return null;
      }
    }

    function saveRememberedAuth(payload) {
      try {
        safeSetItem(REMEMBERED_AUTH_KEY, JSON.stringify(payload));
      } catch (err) {}
    }

    function clearRememberedAuth() {
      try {
        safeRemoveItem(REMEMBERED_AUTH_KEY);
      } catch (err) {}
    }

    function loadInitialState() {

        if (!raw) return fallback;
        const saved = JSON.parse(raw);
// ... existing code ... -->
    function persistState() {
      try {
        safeSetItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {}
      if (cloudDb && !isApplyingCloudUpdate) {
// ... existing code ... -->
              if (Array.isArray(remote.partners) && remote.partners.length) state.partners = remote.partners;
              if (typeof remote.unreadSignals === 'number') state.unreadSignals = remote.unreadSignals;
              try { safeSetItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
              isApplyingCloudUpdate = false;

        }, () => {

        });

    // ==========================================

    function restoreJsonBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && parsed.shop) {
            safeSetItem(STORAGE_KEY, JSON.stringify(parsed));
            state = loadInitialState();
            persistState();
            showToast('ব্যাকআপ সফলভাবে রিস্টোর হয়েছে!', 'success');
            renderApp();
          }
        } catch (err) { showToast('সঠিক ব্যাকআপ ফাইল নয়!', 'warn'); }
      };
      reader.readAsText(file);
    }

    function renderSettings() {
// ... existing code ... -->
    function confirmResetAllData() {
      safeRemoveItem(STORAGE_KEY);
      state = loadInitialState();
      cartItems = [];
      editingOrderId = null;
      persistState();
      closeModal();
      showToast('অ্যাপের সব ডাটা সফলভাবে রিসেট হয়েছে!', 'warn');
      renderApp();
    }

    function bootAlKarimErpApp() {
      try {
        renderApp();
      } catch (err) {
        const root = document.getElementById('app-root');
        if (root) {
          root.innerHTML = `<div style="padding:20px;margin:20px;background:#fee2e2;color:#991b1b;border-radius:12px;font-weight:bold;">অ্যাপ চালু হতে সমস্যা হয়েছে: ${err?.message || err}</div>`;
        }
      }
      try {
        initCloudFirestoreSync();
      } catch (e) {}
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootAlKarimErpApp);
    } else {
      bootAlKarimErpApp();
    }
