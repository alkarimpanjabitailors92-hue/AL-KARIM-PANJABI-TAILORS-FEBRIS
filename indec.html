    function initCloudFirestoreSync() {
      try {
        if (typeof firebase === 'undefined') {
          cloudSyncStatus = 'OFFLINE';
          return;
        }
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        cloudDb = firebase.firestore();
        cloudDb.collection('alkarim_erp_store').doc('main_state').onSnapshot((docSnap) => {
          cloudSyncStatus = 'LIVE';
          if (docSnap.exists) {
            const remote = docSnap.data();
            if (remote) {
              isApplyingCloudUpdate = true;
              if (remote.shop) state.shop = { ...state.shop, ...remote.shop };
              if (remote.auth) {
                if (Array.isArray(remote.auth.masterAdmins)) state.auth.masterAdmins = remote.auth.masterAdmins;
                if (Array.isArray(remote.auth.managerAdmins)) state.auth.managerAdmins = remote.auth.managerAdmins;
                if (Array.isArray(remote.auth.karigorAdmins)) state.auth.karigorAdmins = remote.auth.karigorAdmins;
              }
              if (remote.whatsappApi) state.whatsappApi = { ...state.whatsappApi, ...remote.whatsappApi };
              if (Array.isArray(remote.garments) && remote.garments.length) state.garments = remote.garments;
              if (Array.isArray(remote.inventory) && remote.inventory.length) state.inventory = remote.inventory;
              if (Array.isArray(remote.orders)) state.orders = remote.orders;
              if (Array.isArray(remote.customers)) state.customers = remote.customers;
              if (Array.isArray(remote.karigors) && remote.karigors.length) state.karigors = remote.karigors;
              if (Array.isArray(remote.workLogs)) state.workLogs = remote.workLogs;
              if (Array.isArray(remote.expenses)) state.expenses = remote.expenses;
              if (Array.isArray(remote.suppliers)) state.suppliers = remote.suppliers;
              if (Array.isArray(remote.purchases)) state.purchases = remote.purchases;
              if (Array.isArray(remote.partners) && remote.partners.length) state.partners = remote.partners;
              if (typeof remote.unreadSignals === 'number') state.unreadSignals = remote.unreadSignals;
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
              isApplyingCloudUpdate = false;
              renderApp();
            }
          } else {
            persistState();
          }
        }, () => {
          cloudSyncStatus = 'OFFLINE';
          renderApp();
        });
      } catch (err) {
        cloudSyncStatus = 'OFFLINE';
      }
    }

    function toBnNum(val) {
      const map = { '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯' };
      return String(val ?? '').replace(/[0-9]/g, (d) => map[d]);
    }

    function formatTk(num) {
      const n = Math.round(Number(num || 0));
      const sign = n < 0 ? '-' : '';
      const formatted = Math.abs(n).toLocaleString('en-IN');
      return `${sign}৳ ${toBnNum(formatted)}`;
    }

    function formatDateNice(iso) {
      if (!iso) return '-';
      const parts = String(iso).slice(0, 10).split('-');
      if (parts.length !== 3) return iso;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const mIdx = Math.max(0, Math.min(11, parseInt(parts[1], 10) - 1));
      return `${parts[2]} ${months[mIdx]} ${parts[0]}`;
    }

      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs font-extrabold ${bg} transition`;
      el.textContent = msg;

    function getDeliveryUrgencyInfo(ord) {
      if (!ord || ord.status === 'Delivered' || ord.status === 'Ready') return { daysLeft: 999, badgeHtml: '' };
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const deliv = new Date(String(ord.deliveryDate || '').slice(0, 10));
      deliv.setHours(0, 0, 0, 0);
      const diff = Math.round((deliv - today) / 86400000);
      if (diff <= 0) return { daysLeft: diff, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-extrabold">🔥 আজই ডেলিভারি</span>` };
      if (diff <= 3) return { daysLeft: diff, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 text-[10px] font-extrabold">⚡ ${toBnNum(diff)} দিন বাকি (জরুরি)</span>` };
      return { daysLeft: diff, badgeHtml: '' };
    }

    function sortOrdersByUrgency(list) {
      return [...list].sort((a, b) => {
        const ua = getDeliveryUrgencyInfo(a).daysLeft;
        const ub = getDeliveryUrgencyInfo(b).daysLeft;
        if (ua <= 3 || ub <= 3) return ua - ub;
        return String(b.id || '').localeCompare(String(a.id || ''));
      });
    }

    function calculateFinancials(ordersList) {
      let tailorGross = 0, karigorCost = 0, retailGross = 0, retailCost = 0;
      let totalCollected = 0, totalDue = 0;
      const orderBreakdown = [];

      (ordersList || []).forEach((ord) => {
        let subTailor = 0, subKarigor = 0, subRetail = 0, subRetailCost = 0;
        (ord.items || []).forEach((it) => {
          const qty = Number(it.qty || 1);
          const lineTotal = Number(it.price || 0) * qty;
          if (it.type === 'tailor') {
            subTailor += lineTotal;
            subKarigor += (Number(it.karigorFee || 0) + Number(it.completeFee || 0)) * qty;
          } else {
            subRetail += lineTotal;
            subRetailCost += Number(it.costPrice || 0) * qty;
          }
        });
        const disc = Number(ord.discount || 0);
        const gross = subTailor + subRetail;
        const netTotal = Math.max(0, gross - disc);
        const paid = Number(ord.paidAmount || 0);
        const due = Math.max(0, netTotal - paid);

        tailorGross += subTailor;
        karigorCost += subKarigor;
        retailGross += subRetail;
        retailCost += subRetailCost;
        totalCollected += paid;
        totalDue += due;

        orderBreakdown.push({ id: ord.id, subTailor, subRetail, netTotal, paid, due });
      });

      const tailorNetProfit = tailorGross - karigorCost;
      const retailGrossProfit = retailGross - retailCost;
      return { tailorGross, karigorCost, tailorNetProfit, retailGross, retailCost, retailGrossProfit, totalCollected, totalDue, orderBreakdown };
    }

    function buildWhatsAppOrderUrl(ord, mode = 'ORDER') {
      const cleanPhone = String(ord.customerPhone || '').replace(/[^0-9]/g, '');
      if (!cleanPhone) return '';
      const bdPhone = cleanPhone.startsWith('88') ? cleanPhone : (cleanPhone.startsWith('0') ? '88' + cleanPhone : '880' + cleanPhone);
      const bd = calculateFinancials([ord]).orderBreakdown[0];
      const memoNo = toBnNum(ord.id.replace('ORD-', ''));
      let text = '';
      if (mode === 'READY') {
        text = `আসসালামু আলাইকুম ${ord.customerName}, আপনার অর্ডারকৃত পোশাক (মেমো #${memoNo}) সম্পূর্ণ প্রস্তুত (Ready) হয়েছে। মোট বিল: ${formatTk(bd.netTotal)}, জমা: ${formatTk(ord.paidAmount)}, বাকি: ${formatTk(bd.due)}। ${state.shop.nameBn} থেকে ডেলিভারি নেওয়ার জন্য অনুরোধ রইল। ধন্যবাদ!`;
      } else if (mode === 'DELIVERED') {

    function dispatchAutomatedWhatsApp(ord, mode = 'READY') {
      const waUrl = buildWhatsAppOrderUrl(ord, mode);
      if (!waUrl) return;
      const cfg = state.whatsappApi || {};
      if (cfg.enabled && cfg.apiUrl && cfg.token) {
        const cleanPhone = String(ord.customerPhone || '').replace(/[^0-9]/g, '');
        const bdPhone = cleanPhone.startsWith('88') ? cleanPhone : (cleanPhone.startsWith('0') ? '88' + cleanPhone : '880' + cleanPhone);
        const msg = decodeURIComponent(waUrl.split('text=')[1] || '');
        fetch(cfg.apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: cfg.token, instanceId: cfg.instanceId, to: bdPhone, body: msg })
        }).catch(() => {});
        showToast('📲 ব্যাকগ্রাউন্ড WhatsApp API-তে মেসেজ পাঠানো হয়েছে!', 'success');
      } else {
        window.open(waUrl, '_blank');
      }
    }

    function handleDirectPhonePasswordLogin(e) {
      e.preventDefault();
      const enteredPhone = (document.getElementById('entry-login-phone')?.value || '').replace(/\D/g, '');
      const enteredPass = (document.getElementById('entry-login-pass')?.value || '').trim();
      const allAdmins = getAllConfiguredAdmins();

      const matched = allAdmins.find((acc) => {
        const accPhone = String(acc.phone || '').replace(/\D/g, '');
        const accPass = String(acc.pin || '').trim();
        return accPhone === enteredPhone && accPass === enteredPass;
      });

      if (!matched) {
        showToast('মোবাইল নম্বর বা পাসওয়ার্ড সঠিক নয়!', 'warn');
        return;
      }

      state.auth.activeRole = matched.role;
      state.auth.activeUserId = matched.id;
      state.auth.activeUserName = matched.name;
      adminPinUnlocked = (matched.role === 'MASTER');
      if (matched.role === 'KARIGOR') state.activeTab = 'orders';
      else state.activeTab = 'dashboard';

      saveRememberedAuth({
        role: matched.role,
        userId: matched.id,
        userName: matched.name,
        phone: enteredPhone,
        remembered: true
      });
      persistState();
      showToast(`স্বাগতম ${matched.name} (${matched.roleLabel})!`, 'success');

    function submitPhonePinLogin(e, role, userId, userName) {
      e.preventDefault();
      const enteredPhone = (document.getElementById('login-phone-inp')?.value || '').replace(/\D/g, '');
      const enteredPin = (document.getElementById('login-pin-inp')?.value || '').trim();

      const pool = role === 'MASTER'
        ? (state.auth?.masterAdmins || [])
        : role === 'MANAGER'
          ? (state.auth?.managerAdmins || [])
          : (state.auth?.karigorAdmins || []);
      const account = pool.find((a) => a.id === userId);
      if (!account) {
        showToast('অ্যাকাউন্ট পাওয়া যায়নি!', 'warn');
        return;
      }
      const expectedPhone = String(account.phone || '').replace(/\D/g, '');
      const expectedPin = String(account.pin || '').trim();

      if (expectedPhone && enteredPhone !== expectedPhone) {
        showToast('মোবাইল নম্বর মিলছে না!', 'warn');
        return;
      }
      if (expectedPin && enteredPin !== expectedPin) {
        showToast('পাসওয়ার্ড/পিন ভুল হয়েছে!', 'warn');
        return;
      }

      state.auth.activeRole = role;
      state.auth.activeUserId = account.id;
      state.auth.activeUserName = account.name;
      adminPinUnlocked = (role === 'MASTER');
      if (role === 'KARIGOR') state.activeTab = 'orders';
      saveRememberedAuth({
        role: state.auth.activeRole,
        userId: state.auth.activeUserId,
        userName: state.auth.activeUserName,
        phone: enteredPhone,
        remembered: true
      });
      persistState();
      closeModal();
      showToast(`✓ ${state.auth.activeUserName} সেভ হয়েছে! আর পাসওয়ার্ড দিতে হবে না।`, 'success');
      renderApp();
    }

    function activateRoleWithRemember(role, userId, userName) {
      const remembered = loadRememberedAuth();
      const pool = role === 'MASTER'
        ? (state.auth?.masterAdmins || [])
        : role === 'MANAGER'
          ? (state.auth?.managerAdmins || [])
          : (state.auth?.karigorAdmins || []);
      const account = pool.find((a) => a.id === userId);

      if (!account) {
        showToast('আগে এই অ্যাডমিন যুক্ত করুন!', 'warn');
        return;
      }

      const hasPin = Boolean(account?.pin && String(account.pin).trim() !== '');
      const hasPhone = Boolean(account?.phone && String(account.phone).trim() !== '');
      const alreadyVerified = Boolean(remembered && remembered.remembered && remembered.role === role && remembered.userId === userId);

      if ((hasPin || hasPhone) && !alreadyVerified) {
        openPhonePinLoginModal(role, userId, userName, '', '');
        return;
      }

      state.auth.activeRole = role;
      state.auth.activeUserId = userId;
      state.auth.activeUserName = userName;
      if (role === 'MASTER') adminPinUnlocked = true;
      if (role === 'KARIGOR') state.activeTab = 'orders';
      saveRememberedAuth({ role, userId, userName, remembered: true });
      persistState();
      showToast(`${userName} সক্রিয় হয়েছে!`, 'success');
      renderApp();
    }

    function setDashDatePreset(preset) {
      dashPreset = preset;
      const now = new Date();
      const todayIso = now.toISOString().split('T')[0];
      if (preset === 'TODAY') {
        dashFromDate = todayIso;
        dashToDate = todayIso;
      } else if (preset === 'YESTERDAY') {
        const yest = new Date(Date.now() - 86400000).toISOString().split('T')[0];
        dashFromDate = yest;
        dashToDate = yest;
      } else if (preset === 'MONTH') {
        dashFromDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        dashToDate = todayIso;
      } else {
        dashFromDate = '';
        dashToDate = '';
      }
      renderApp();
    }

    function renderDashboard() {
      const todayIso = new Date().toISOString().split('T')[0];

      const filteredOrders = state.orders.filter((o) => {
        const dStr = String(o.orderDate || o.createdAt || '').slice(0, 10);
        if (dashFromDate && dStr < dashFromDate) return false;
        if (dashToDate && dStr > dashToDate) return false;
        return true;
      });

      const filteredExpenses = (state.expenses || []).filter((e) => {
        const dStr = String(e.date || '').slice(0, 10);
        if (dashFromDate && dStr < dashFromDate) return false;
        if (dashToDate && dStr > dashToDate) return false;
        return true;
      });

      const fin = calculateFinancials(filteredOrders);
      const periodExpenses = filteredExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
      const totalPieces = filteredOrders.reduce((s, o) => s + (o.items || []).reduce((ps, it) => ps + Number(it.qty || 1), 0), 0);

      const cuttingQueue = sortOrdersByUrgency(
        state.orders.filter((o) => o.status !== 'Delivered' && o.status !== 'Ready')
      ).slice(0, 7);

      const deliveryQueue = state.orders.filter((o) =>
        o.status !== 'Delivered' && (o.status === 'Ready' || String(o.deliveryDate || '').slice(0, 10) <= todayIso)
      ).slice(0, 7);

      const recentLogs = (state.workLogs || []).slice(0, 5);
      const periodText = (!dashFromDate && !dashToDate)
        ? 'সর্বমোট (All Time)'
        : dashFromDate === dashToDate
          ? formatDateNice(dashFromDate)
          : `${formatDateNice(dashFromDate)} — ${formatDateNice(dashToDate)}`;

      return `
        <div class="space-y-4">
          <div class="royal-gradient rounded-2xl p-4 sm:p-5 text-white flex flex-wrap items-center justify-between gap-3 shadow-sm">
            <div>
              <div class="text-xs text-amber-300 font-bold">স্বাগতম, ${state.auth?.activeUserName || state.shop.masterName}</div>

                <button type="button" onclick="setDashDatePreset('ALL')" class="px-3.5 py-1.5 rounded-full font-extrabold cursor-pointer ${dashPreset === 'ALL' ? 'bg-emerald-800 text-amber-300 shadow-2xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">সর্বমোট</button>

            <div class="text-[11px] font-extrabold text-emerald-900">

            </div>
          </div>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs">
              <div class="flex items-center justify-between text-slate-500 font-bold"><span>মোট অর্ডার ও পিস</span><span class="text-base">🧾</span></div>
              <div class="text-xl font-extrabold text-slate-900 mt-1">${toBnNum(filteredOrders.length)} টি <span class="text-xs font-bold text-emerald-700">(${toBnNum(totalPieces)} পিস)</span></div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-emerald-200 shadow-2xs">
              <div class="flex items-center justify-between text-emerald-700 font-bold"><span>নগদ আদায়</span><span class="text-base">💰</span></div>
              <div class="text-xl font-extrabold text-emerald-900 mt-1">${formatTk(fin.totalCollected)}</div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-rose-200 shadow-2xs">
              <div class="flex items-center justify-between text-rose-700 font-bold"><span>কাস্টমার বাকি</span><span class="text-base">⏳</span></div>
              <div class="text-xl font-extrabold text-rose-700 mt-1">${formatTk(fin.totalDue)}</div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-amber-200 shadow-2xs">
              <div class="flex items-center justify-between text-amber-800 font-bold"><span>দৈনিক খরচ</span><span class="text-base">💸</span></div>
              <div class="text-xl font-extrabold text-amber-950 mt-1">${formatTk(periodExpenses)}</div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-2.5">
              <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h3 class="text-sm font-extrabold text-slate-900">✂️ আজ কাটিং ও জরুরি প্রোডাকশন সিরিয়াল</h3>
                <button type="button" onclick="navigateToTab('orders')" class="text-xs font-extrabold text-emerald-700 cursor-pointer">সব দেখুন →</button>
              </div>
              ${cuttingQueue.length === 0 ? `<div class="py-6 text-center text-xs text-slate-400 font-semibold">আজ কাটিং বা সেলাইয়ের কোনো পেন্ডিং কাজ নেই।</div>` : cuttingQueue.map((o) => {
                const urg = getDeliveryUrgencyInfo(o);
                const tailorItems = (o.items || []).filter((it) => it.type === 'tailor');
                const allCutDone = tailorItems.length > 0 && tailorItems.every((it) => it.cuttingDone || it.sewingDoneBy || it.completeDoneBy);
                return `
                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2 text-xs">
                    <div class="min-w-0">
                      <div class="font-extrabold text-slate-900 truncate">#${o.id.replace('ORD-', '')} — ${o.customerName}</div>
                      <div class="text-[11px] text-slate-600 truncate">${tailorItems.map((t) => `${t.name} (x${toBnNum(t.qty)})`).join(', ') || 'পণ্য/কাপড়'} • ডেলিভারি: ${formatDateNice(o.deliveryDate)}</div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      ${urg.badgeHtml}
                      ${tailorItems.length > 0 && !allCutDone ? `<button type="button" onclick="markOrderCuttingDone('${o.id}')" class="px-2.5 py-1 rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold cursor-pointer">✂️ কাটিং ডান</button>` : ''}
                      <button type="button" onclick="printOrderMemo('${o.id}')" class="px-2.5 py-1 rounded-lg bg-slate-900 text-amber-300 font-extrabold cursor-pointer">মেমো</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-2.5">
              <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h3 class="text-sm font-extrabold text-slate-900">📦 আজকের ডেলিভারি ও রেডি অর্ডার</h3>
                <button type="button" onclick="state.orderStatusFilter='Ready'; navigateToTab('orders');" class="text-xs font-extrabold text-emerald-700 cursor-pointer">রেডি তালিকা →</button>
              </div>
              ${deliveryQueue.length === 0 ? `<div class="py-6 text-center text-xs text-slate-400 font-semibold">আজ ডেলিভারি দেওয়ার মতো কোনো অর্ডার নেই।</div>` : deliveryQueue.map((o) => {
                const bd = calculateFinancials([o]).orderBreakdown[0];
                return `
                  <div class="p-2.5 rounded-xl bg-emerald-50/50 border border-emerald-200 flex items-center justify-between gap-2 text-xs">
                    <div class="min-w-0">
                      <div class="font-extrabold text-slate-900 truncate">#${o.id.replace('ORD-', '')} — ${o.customerName}</div>
                      <div class="text-[11px] font-bold ${bd.due > 0 ? 'text-rose-600' : 'text-emerald-700'}">
                        ${o.status === 'Ready' ? '✨ Ready' : '📅 আজ ডেলিভারি'} • বাকি: ${formatTk(bd.due)}
                      </div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <button type="button" onclick="openDeliveryCheckoutModal('${o.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold cursor-pointer">📦 ডেলিভারি দিন</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold text-slate-900">🔔 সাম্প্রতিক সুইং ও কমপ্লিট কাজের সংকেত</h3>
              <button type="button" onclick="karigorSubTab='WORKLOG'; navigateToTab('karigor');" class="text-xs font-extrabold text-emerald-700 cursor-pointer">পূর্ণাঙ্গ চার্ট লিস্ট →</button>
            </div>
            ${recentLogs.length === 0 ? `<div class="py-4 text-center text-xs text-slate-400">এখনো কোনো কারিগর বা কমপ্লিট ম্যান কাজ ডান করেননি।</div>` : `
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                ${recentLogs.map((lg) => `
                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2 text-xs">
                    <div>
                      <div class="font-extrabold text-slate-900">${lg.workerName} <span class="text-emerald-700">(${lg.stage === 'SEWING' ? 'সুইং ডান' : 'কমপ্লিট ডান'})</span></div>
                      <div class="text-[11px] text-slate-600">মেমো #${String(lg.orderId || '').replace('ORD-', '')} • ${lg.garmentName} (x${toBnNum(lg.qty)})</div>
                    </div>
                    <span class="font-extrabold text-emerald-800">+ ${formatTk(lg.amount)}</span>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function handleCustomerPhoneLookup(phoneVal) {
      state.orderForm.customerPhone = phoneVal;
      const clean = phoneVal.trim();
      if (clean.length >= 11) {
        const cust = state.customers.find((c) => c.phone === clean);
        if (cust) {
          state.orderForm.customerName = cust.name;
          state.orderForm.customerAddress = cust.address || '';
          const nameInp = document.getElementById('pos-cust-name');
          const addrInp = document.getElementById('pos-cust-addr');
          if (nameInp) nameInp.value = cust.name;
          if (addrInp) addrInp.value = cust.address || '';
          showToast(`পুরনো কাস্টমার "${cust.name}"-এর তথ্য পাওয়া গেছে!`, 'success');
        }
      }
    }

    function updateNewOrderLiveTotals() {
      const subTotal = cartItems.reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const disc = Math.max(0, Number(state.orderForm.discount || 0));
      const netTotal = Math.max(0, subTotal - disc);
      const paid = Math.max(0, Number(state.orderForm.paidAmount || 0));
      const due = Math.max(0, netTotal - paid);

      const netEl = document.getElementById('pos-net-total-val');
      if (netEl) netEl.textContent = formatTk(netTotal);

      const dueBox = document.getElementById('pos-due-box');
      const dueEl = document.getElementById('pos-due-val');
      if (dueEl) dueEl.textContent = formatTk(due);
      if (dueBox) {
        dueBox.className = due > 0
          ? 'p-2 rounded-xl bg-rose-50 border border-rose-200 text-right'
          : 'p-2 rounded-xl bg-emerald-50 border border-emerald-200 text-right';
        dueBox.firstElementChild.className = due > 0 ? 'text-[10px] font-bold text-rose-700' : 'text-[10px] font-bold text-emerald-700';
        dueBox.lastElementChild.className = due > 0 ? 'text-sm font-extrabold text-rose-700' : 'text-sm font-extrabold text-emerald-800';
      }
    }

    function applyFullPaidToNewOrder() {
      const subTotal = cartItems.reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const disc = Math.max(0, Number(state.orderForm.discount || 0));
      const netTotal = Math.max(0, subTotal - disc);
      state.orderForm.paidAmount = netTotal;
      const paidInp = document.getElementById('pos-paid-inp');
      if (paidInp) paidInp.value = netTotal > 0 ? netTotal : '';
      updateNewOrderLiveTotals();
    }

    function removeCartItem(uid) {
      cartItems = cartItems.filter((c) => c.uid !== uid);
      renderApp();
    }

    function renderNewOrder() {
      if (isKarigorAdmin()) return `<div class="p-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-extrabold text-center">⛔ কারিগর প্যানেল থেকে নতুন অর্ডার নেওয়া যাবে না।</div>`;

      const q = posSearchTerm.trim().toLowerCase();
      const filteredGarments = state.garments.filter((g) => !q || g.name.toLowerCase().includes(q));
      const filteredFabrics = state.inventory.filter((i) => i.category === 'Fabrics' && (!q || i.name.toLowerCase().includes(q)));
      const filteredProducts = state.inventory.filter((i) => i.category === 'Product' && (!q || i.name.toLowerCase().includes(q)));

      const subTotal = cartItems.reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const disc = Math.max(0, Number(state.orderForm.discount || 0));
      const netTotal = Math.max(0, subTotal - disc);
      const paid = Math.max(0, Number(state.orderForm.paidAmount || 0));
      const due = Math.max(0, netTotal - paid);

      return `
        <div class="space-y-4">
          ${editingOrderId ? `<div class="p-3 rounded-xl bg-amber-100 border border-amber-300 text-amber-950 text-xs font-extrabold flex justify-between items-center"><span>🔄 অর্ডার এডিট মোড চালু — মেমো #${editingOrderId.replace('ORD-', '')}</span><button type="button" onclick="startFreshNewOrder()" class="px-3 py-1 rounded-lg bg-white border font-bold cursor-pointer">নতুন অর্ডারে ফিরুন</button></div>` : ''}

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div class="lg:col-span-7 bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex gap-1.5">
                  <button type="button" onclick="activePosTab='TAILOR'; renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-extrabold cursor-pointer ${activePosTab === 'TAILOR' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">✂️ টেইলার্স (${toBnNum(state.garments.length)})</button>
                  <button type="button" onclick="activePosTab='FABRICS'; renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-extrabold cursor-pointer ${activePosTab === 'FABRICS' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">🧵 গজ কাপড় (${toBnNum(filteredFabrics.length)})</button>
                  <button type="button" onclick="activePosTab='PRODUCTS'; renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-extrabold cursor-pointer ${activePosTab === 'PRODUCTS' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">🧢 প্রোডাক্ট (${toBnNum(filteredProducts.length)})</button>
                </div>
                <input type="text" value="${posSearchTerm}" oninput="posSearchTerm=this.value; renderApp(); setTimeout(()=>{const el=document.getElementById('pos-cat-search'); if(el){el.focus(); el.setSelectionRange(el.value.length, el.value.length);}},0);" id="pos-cat-search" placeholder="আইটেম খুঁজুন..." class="px-3 py-1.5 rounded-xl border border-slate-300 text-xs font-bold outline-none focus:border-emerald-600" />
              </div>

              ${activePosTab === 'TAILOR' ? `
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-[62vh] overflow-y-auto pr-1">
                  ${filteredGarments.map((g) => `
                    <button type="button" onclick="openGarmentMeasureModal('${g.id}')" class="p-3 rounded-xl border border-slate-200 hover:border-emerald-600 hover:bg-emerald-50/60 text-left transition flex flex-col justify-between gap-1.5 cursor-pointer">
                      <div class="flex items-center gap-2">
                        ${g.image ? `<img src="${g.image}" class="w-10 h-10 rounded-lg object-cover border shrink-0" />` : `<span class="w-9 h-9 rounded-lg bg-amber-100 flex items-center justify-center text-lg shrink-0">${g.icon || '👘'}</span>`}
                        <span class="font-extrabold text-xs text-slate-900 leading-tight">${g.name}</span>
                      </div>
                      <div class="text-[11px] font-extrabold text-emerald-700">মজুরি: ${formatTk(g.price)}</div>
                    </button>
                  `).join('')}
                </div>
              ` : `
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-[62vh] overflow-y-auto pr-1">
                  ${(activePosTab === 'FABRICS' ? filteredFabrics : filteredProducts).map((it) => `
                    <button type="button" onclick="openInventorySellModal('${it.id}')" class="p-3 rounded-xl border border-slate-200 hover:border-emerald-600 hover:bg-emerald-50/60 text-left transition flex flex-col justify-between gap-1.5 cursor-pointer">
                      <div class="flex items-center gap-2">
                        ${it.image ? `<img src="${it.image}" class="w-10 h-10 rounded-lg object-cover border shrink-0" />` : `<span class="w-8 h-8 rounded-lg border flex items-center justify-center shrink-0" style="background:${it.colorHex || '#f1f5f9'}">${it.category === 'Fabrics' ? '🧵' : '🧢'}</span>`}
                        <span class="font-extrabold text-xs text-slate-900 leading-tight">${it.name}</span>
                      </div>
                      <div class="flex justify-between items-center text-[10px] font-bold">
                        <span class="text-slate-500">স্টক: ${toBnNum(it.stock)}</span>
                        <span class="text-emerald-700 font-extrabold">${formatTk(it.sellPrice)}</span>
                      </div>
                    </button>
                  `).join('')}
                </div>
              `}
            </div>

            <div class="lg:col-span-5 bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-3 flex flex-col justify-between">
              <div class="space-y-3 text-xs">
                <div class="font-extrabold text-sm text-slate-900 border-b pb-2">🧾 কাস্টমার তথ্য ও অর্ডার কার্ট</div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-0.5">মোবাইল নম্বর *</label>
                    <input type="tel" value="${state.orderForm.customerPhone || ''}" oninput="handleCustomerPhoneLookup(this.value)" placeholder="017XXXXXXXX" class="w-full px-2.5 py-2 rounded-xl border border-emerald-400 font-extrabold outline-none" />
                  </div>
                  <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-0.5">কাস্টমারের নাম *</label>
                    <input id="pos-cust-name" type="text" value="${state.orderForm.customerName || ''}" oninput="state.orderForm.customerName=this.value" placeholder="নাম লিখুন" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 font-bold outline-none" />
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                  <div>
                    <label class="block text-[10px] font-bold text-slate-600 mb-0.5">অর্ডার তারিখ</label>
                    <input type="date" value="${state.orderForm.orderDate}" onchange="state.orderForm.orderDate=this.value" class="w-full px-2 py-1.5 rounded-xl border border-slate-300 font-bold text-[11px]" />
                  </div>
                  <div>
                    <label class="block text-[10px] font-bold text-rose-700 mb-0.5">ডেলিভারি তারিখ *</label>
                    <input type="date" value="${state.orderForm.deliveryDate}" onchange="state.orderForm.deliveryDate=this.value" class="w-full px-2 py-1.5 rounded-xl border border-rose-300 font-extrabold text-[11px]" />
                  </div>
                  <div>
                    <label class="block text-[10px] font-bold text-slate-600 mb-0.5">ঠিকানা</label>
                    <input id="pos-cust-addr" type="text" value="${state.orderForm.customerAddress || ''}" oninput="state.orderForm.customerAddress=this.value" placeholder="ঠিকানা" class="w-full px-2 py-1.5 rounded-xl border border-slate-300 font-bold text-[11px]" />
                  </div>
                </div>

                <div class="space-y-1.5 max-h-52 overflow-y-auto border-t pt-2">
                  ${cartItems.length === 0 ? `<div class="py-6 text-center text-slate-400 font-semibold">বাম পাশ থেকে পোশাক, কাপড় বা প্রোডাক্ট বাছাই করুন</div>` : cartItems.map((c) => `
                    <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
                      <div class="min-w-0">
                        <div class="font-extrabold text-slate-900 truncate">${c.name} <span class="text-emerald-700">(x${toBnNum(c.qty)})</span></div>
                        <div class="text-[10px] text-slate-500">দর: ${formatTk(c.price)} • মোট: <b>${formatTk(Number(c.price || 0) * Number(c.qty || 1))}</b></div>
                      </div>

    function submitGarmentToCart(e, garmentId, editCartUid) {
      e.preventDefault();
      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;
      const existing = editCartUid ? cartItems.find((c) => c.uid === editCartUid) : null;

      const qty = Math.max(1, Number(document.getElementById('grm-qty')?.value || 1));
      const price = Number(document.getElementById('grm-price')?.value || grm.price);
      const karigorFee = Number(document.getElementById('grm-kfee')?.value || grm.karigorFee);
      const completeFee = Number(grm.completeFee || 30);
      const linkedFabric = document.getElementById('grm-linked-fabric')?.value || '';
      const extraNote = (document.getElementById('grm-extra-note')?.value || '').trim();
      const tagNote = (document.getElementById('grm-tag-note')?.value || '').trim();

      const measurements = {};
      document.querySelectorAll('.grm-meas-field').forEach((inp) => {
        measurements[inp.getAttribute('data-field')] = inp.value.trim();
      });

      const selectedDesigns = [];
      document.querySelectorAll('.grm-design-chk:checked').forEach((chk) => {
        selectedDesigns.push(chk.value);
      });

      const designNotes = [...selectedDesigns, extraNote].filter(Boolean).join(', ');

      const itemObj = {
        uid: editCartUid || 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        type: 'tailor',
        refId: grm.id,
        name: grm.name,
        qty,
        price,
        karigorFee,
        completeFee,
        cuttingDone: existing ? Boolean(existing.cuttingDone) : false,
        sewingDoneBy: existing ? (existing.sewingDoneBy || '') : '',
        completeDoneBy: existing ? (existing.completeDoneBy || '') : '',
        linkedFabric,
        measurements,
        selectedDesigns,
        extraNote,
        tagNote,
        designNotes
      };

      if (editCartUid) {
        const idx = cartItems.findIndex((c) => c.uid === editCartUid);
        if (idx !== -1) cartItems[idx] = itemObj;
      } else {
        cartItems.push(itemObj);
      }

      closeModal();
      showToast(`${grm.name} কার্টে যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function confirmAndSaveOrder() {
      const phone = (state.orderForm.customerPhone || '').trim();
      const name = (state.orderForm.customerName || '').trim();
      const deliv = state.orderForm.deliveryDate;
      if (!phone || !name || !deliv) {
        showToast('দয়া করে কাস্টমারের মোবাইল নম্বর, নাম এবং ডেলিভারি তারিখ দিন!', 'warn');
        return;
      }
      if (cartItems.length === 0) {
        showToast('কার্টে অন্তত একটি আইটেম যোগ করুন!', 'warn');
        return;
      }

      const fin = calculateFinancials([{ items: cartItems, discount: state.orderForm.discount, paidAmount: state.orderForm.paidAmount }]);
      const bd = fin.orderBreakdown[0];

      if (editingOrderId) {
        const idx = state.orders.findIndex((o) => o.id === editingOrderId);
        if (idx !== -1) {
          state.orders[idx] = {
            ...state.orders[idx],
            orderDate: state.orderForm.orderDate,
            deliveryDate: deliv,
            customerPhone: phone,
            customerName: name,
            customerAddress: state.orderForm.customerAddress || '',
            items: JSON.parse(JSON.stringify(cartItems)),
            discount: Number(state.orderForm.discount || 0),
            paidAmount: Number(state.orderForm.paidAmount || 0),
            paymentMethod: state.orderForm.paymentMethod || 'Cash'
          };
          const savedId = editingOrderId;
          editingOrderId = null;
          cartItems = [];
          persistState();
          showToast('অর্ডার সফলভাবে আপডেট হয়েছে!', 'success');
          printOrderMemo(savedId);
          navigateToTab('orders');
          return;
        }
      }

      const nextNum = 5655 + state.orders.length + 1;
      const newId = 'ORD-' + nextNum;

      cartItems.forEach((it) => {
        if (it.type !== 'tailor') {
          const inv = state.inventory.find((x) => x.id === it.refId);
          if (inv) inv.stock = Math.max(0, Number(inv.stock || 0) - Number(it.qty || 1));
        }
      });

      const existingCust = state.customers.find((c) => c.phone === phone);
      if (existingCust) {
        existingCust.name = name;
        existingCust.address = state.orderForm.customerAddress || existingCust.address;
        existingCust.due = Number(existingCust.due || 0) + Number(bd.due || 0);
      } else {
        state.customers.unshift({
          id: 'CUST-' + Date.now(),
          name,
          phone,
          address: state.orderForm.customerAddress || '',
          due: Number(bd.due || 0)
        });
      }

      state.orders.unshift({
        id: newId,
        orderDate: state.orderForm.orderDate,
        createdAt: new Date().toISOString(),
        deliveryDate: deliv,
        customerPhone: phone,
        customerName: name,
        customerAddress: state.orderForm.customerAddress || '',
        items: JSON.parse(JSON.stringify(cartItems)),
        discount: Number(state.orderForm.discount || 0),
        paidAmount: Number(state.orderForm.paidAmount || 0),
        paymentMethod: state.orderForm.paymentMethod || 'Cash',
        status: 'Cutting'
      });

      cartItems = [];
      persistState();
      showToast(`মেমো #${nextNum} সফলভাবে সেভ হয়েছে!`, 'success');
      printOrderMemo(newId);
      navigateToTab('orders');
    }

    function markOrderCuttingDone(orderId) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      (ord.items || []).forEach((it) => { if (it.type === 'tailor') it.cuttingDone = true; });
      if ((ord.status || 'Cutting') === 'Cutting') ord.status = 'Sewing';
      persistState();
      showToast(`✂️ মেমো #${ord.id.replace('ORD-', '')} কাটিং ডান সম্পন্ন হয়েছে!`, 'success');
      renderApp();
    }

    function markSingleItemCuttingDone(orderId, itemUid, refreshModal = false) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const item = (ord.items || []).find((it) => it.uid === itemUid);
      if (!item) return;
      item.cuttingDone = true;
      if ((ord.status || 'Cutting') === 'Cutting') ord.status = 'Sewing';
      persistState();
      showToast(`✂️ "${item.name}" কাটিং ডান সম্পন্ন হয়েছে!`, 'success');
      renderApp();
      if (refreshModal) openOrderMeasurementsViewModal(orderId);
    }

                    <span class="px-2 py-0.5 rounded bg-slate-900 text-amber-300 font-extrabold text-[11px]">আইটেম ${toBnNum(idx + 1)}</span>

                      ${measEntries.map(([k, v]) => `

                ${it.designNotes ? `

                    🎨 স্পেশাল ডিজাইন ও নোট: <span class="text-emerald-950 font-extrabold">${it.designNotes}</span>

                <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] font-bold text-slate-600 pt-1">

                  <span>কমপ্লিট ফি: ${formatTk(it.completeFee || 30)} ${it.completeDoneBy ? `(✓ ${it.completeDoneBy})` : ''}</span>
                </div>
              </div>
            `;
          }).join('')}

          ${otherItems.length > 0 ? `
            <div class="p-3 rounded-xl bg-slate-50 border border-slate-200">
              <div class="font-extrabold text-slate-800 mb-1">🛍️ অন্যান্য কাপড় ও প্রোডাক্ট:</div>
              <div class="text-slate-700 font-bold">${otherItems.map((x) => `${x.name} (x${toBnNum(x.qty)})`).join(', ')}</div>
            </div>
          ` : ''}

          <div class="flex flex-wrap justify-between items-center gap-2 pt-2 border-t">
            <div class="flex gap-2">
              <button type="button" onclick="closeModal(); printOrderMemo('${ord.id}');" class="px-3.5 py-2 rounded-xl bg-slate-900 text-amber-300 font-extrabold cursor-pointer">🖨️ মেমো প্রিন্ট</button>
              ${isMasterAdmin() && tailorItems.length > 0 ? `<button type="button" onclick="openOrderMeasurementOnlyEditModal('${ord.id}')" class="px-3.5 py-2 rounded-xl bg-blue-700 text-white font-extrabold cursor-pointer">✏️ শুধু মাপ এডিট করুন</button>` : ''}
            </div>
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বন্ধ করুন</button>
          </div>

            <p class="text-[11px] text-emerald-200">${ord.customerName} • বিল বা পেমেন্ট অপরিবর্তিত থাকবে</p>

          </div>
        </form>
      `;
      openModal(html, 'max-w-3xl');

    function saveOrderMeasurementOnlyEdit(e, orderId) {
      e.preventDefault();
      if (!requireMasterGuard('মেজারমেন্ট এডিট')) return;
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;

      document.querySelectorAll('[data-meas-item-uid]').forEach((box) => {
        const uid = box.getAttribute('data-meas-item-uid');
        const it = (ord.items || []).find((x) => x.uid === uid);
        if (!it) return;
        const updatedMeas = {};
        box.querySelectorAll('[data-edit-field]').forEach((inp) => {
          updatedMeas[inp.getAttribute('data-edit-field')] = inp.value.trim();
        });
        it.measurements = updatedMeas;
        const dNotesInp = box.querySelector('[data-edit-design-notes]');
        const tNoteInp = box.querySelector('[data-edit-tag-note]');
        if (dNotesInp) it.designNotes = dNotesInp.value.trim();
        if (tNoteInp) it.tagNote = tNoteInp.value.trim();
      });

      persistState();
      closeModal();
      showToast(`✓ মেমো #${ord.id.replace('ORD-', '')}-এর মেজারমেন্ট ও ডিজাইন আপডেট হয়েছে!`, 'success');
      renderApp();
    }

    function openSelfServiceDoneModal(orderId, stage) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const tailorItems = (ord.items || []).filter((it) => it.type === 'tailor');
      if (tailorItems.length === 0) {
        showToast('এই অর্ডারে কোনো সেলাই আইটেম নেই।', 'warn');
        return;
      }
      const isSewing = stage === 'SEWING';
      const title = isSewing ? '🪡 সুইং (সেলাই) কাজ শেষ — নিজের নাম বেছে নিন' : '✨ কমপ্লিট (ফিনিশিং) কাজ শেষ — নিজের নাম বেছে নিন';
      const pendingItems = tailorItems.filter((it) => (isSewing ? !it.sewingDoneBy : !it.completeDoneBy));
      const targetItems = pendingItems.length > 0 ? pendingItems : tailorItems;
      const totalPieces = targetItems.reduce((s, it) => s + Number(it.qty || 1), 0);
      const totalWage = targetItems.reduce((s, it) => s + Number(isSewing ? (it.karigorFee || 0) : (it.completeFee || 30)) * Number(it.qty || 1), 0);

      const html = `
        <div class="px-5 py-4 border-b border-slate-200 royal-gradient text-white flex items-center justify-between">
          <div>
            <h3 class="text-sm font-extrabold text-amber-300">${title}</h3>
            <p class="text-[11px] text-emerald-200">মেমো #${ord.id.replace('ORD-', '')} • কাস্টমার: ${ord.customerName} • মোট ${toBnNum(totalPieces)} পিস (${formatTk(totalWage)})</p>
          </div>
          <button type="button" onclick="closeModal()" class="p-1.5 text-white cursor-pointer">✕</button>
        </div>
        <div class="p-5 space-y-3 text-xs">
          ${pendingItems.length === 0 ? `
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-950 font-bold">
              ⚠️ এই অর্ডারের ${isSewing ? 'সুইং (সেলাই)' : 'কমপ্লিট'} কাজ ইতিমধ্যেই সম্পন্ন করা হয়েছে!
            </div>
          ` : `

    function confirmSelfServiceWorkerDone(orderId, stage, karigorId) {
      const krg = (state.karigors || []).find((k) => k.id === karigorId);
      if (!krg) return;
      if (krg.pin && String(krg.pin).trim() !== '') {
        const html = `
          <div class="px-5 py-4 border-b border-slate-200 royal-gradient text-white flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-amber-300">🔒 কারিগর পিন দিন — ${krg.name}</h3>
            <button type="button" onclick="closeModal()" class="p-1.5 text-white cursor-pointer">✕</button>
          </div>
          <form onsubmit="verifyWorkerPinAndCredit(event, '${orderId}', '${stage}', '${krg.id}')" class="p-5 space-y-3 text-xs">
            <input id="worker-pin-inp" type="password" inputmode="numeric" required placeholder="****" class="w-full px-4 py-2.5 rounded-xl border-2 border-emerald-500 text-center text-lg font-extrabold tracking-widest outline-none" />
            <div class="flex justify-end gap-2">
              <button type="button" onclick="openSelfServiceDoneModal('${orderId}', '${stage}')" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">ফিরে যান</button>
              <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ নিশ্চিত করুন</button>
            </div>
          </form>
        `;
        openModal(html, 'max-w-sm');
        setTimeout(() => document.getElementById('worker-pin-inp')?.focus(), 20);
        return;
      }
      executeWorkerDoneAndCredit(orderId, stage, krg);
    }

    function verifyWorkerPinAndCredit(e, orderId, stage, karigorId) {
      e.preventDefault();
      const krg = (state.karigors || []).find((k) => k.id === karigorId);
      const entered = (document.getElementById('worker-pin-inp')?.value || '').trim();
      if (!krg || entered !== String(krg.pin).trim()) {
        showToast('ভুল কারিগর পিন দেওয়া হয়েছে!', 'warn');
        return;
      }
      executeWorkerDoneAndCredit(orderId, stage, krg);
    }

    function executeWorkerDoneAndCredit(orderId, stage, krg) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const isSewing = stage === 'SEWING';
      let creditedTotal = 0;

      (ord.items || []).forEach((it) => {
        if (it.type !== 'tailor') return;
        const qty = Number(it.qty || 1);
        if (isSewing && !it.sewingDoneBy) {
          const wage = Number(it.karigorFee || 0) * qty;
          it.cuttingDone = true;
          it.sewingDoneBy = krg.name;
          creditedTotal += wage;
          state.workLogs.unshift({
            id: 'LOG-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            date: new Date().toISOString(),
            orderId: ord.id,
            customerName: ord.customerName,
            garmentName: it.name,
            qty,
            stage: 'SEWING',
            workerName: krg.name,
            amount: wage
          });
        } else if (!isSewing && !it.completeDoneBy) {
          const compWage = Number(it.completeFee || 30) * qty;
          it.cuttingDone = true;
          it.completeDoneBy = krg.name;
          creditedTotal += compWage;
          state.workLogs.unshift({
            id: 'LOG-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            date: new Date().toISOString(),
            orderId: ord.id,
            customerName: ord.customerName,
            garmentName: it.name,
            qty,
            stage: 'COMPLETE',
            workerName: krg.name,
            amount: compWage
          });
        }
      });

      const tailorItems = (ord.items || []).filter((it) => it.type === 'tailor');
      if (isSewing && tailorItems.every((it) => it.sewingDoneBy) && ord.status !== 'Delivered') ord.status = 'Sewing';

      let becameReadyNow = false;
      if (!isSewing && tailorItems.every((it) => it.completeDoneBy) && ord.status !== 'Delivered') {
        ord.status = 'Ready';
        becameReadyNow = true;
      }

      state.unreadSignals = Number(state.unreadSignals || 0) + 1;
      persistState();
      closeModal();
      showToast(`✓ ${krg.name}-এর অ্যাকাউন্টে ${formatTk(creditedTotal)} জমা হয়েছে এবং অ্যাডমিনের কাছে সংকেত পাঠানো হয়েছে!`, 'success');
      renderApp();

      if (becameReadyNow) {
        if (state.whatsappApi?.enabled && state.whatsappApi?.apiUrl && state.whatsappApi?.token) {
          dispatchAutomatedWhatsApp(ord, 'READY');
        } else {
          const readyWaUrl = buildWhatsAppOrderUrl(ord, 'READY');
          const readyHtml = `
            <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
              <h3 class="text-sm font-extrabold text-amber-300">✨ অর্ডার #${ord.id.replace('ORD-', '')} সম্পূর্ণ প্রস্তুত (Ready)!</h3>
              <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
            </div>
            <div class="p-5 space-y-3 text-xs">
              <p class="font-bold text-slate-700">কাস্টমার <b>${ord.customerName}</b> (${ord.customerPhone})-এর পোশাক ডেলিভারির জন্য প্রস্তুত। এখনই তার WhatsApp নম্বরে Ready মেসেজ পাঠিয়ে দিন:</p>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">পরে পাঠাব</button>
                ${readyWaUrl ? `<a href="${readyWaUrl}" target="_blank" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-green-600 hover:bg-green-700 text-white font-extrabold inline-flex items-center gap-1.5">📲 কাস্টমারকে WhatsApp মেসেজ পাঠান</a>` : ''}
              </div>
            </div>
          `;
          openModal(readyHtml, 'max-w-md');
        }
      }
    }

          </div>

          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="p-2.5 rounded-xl bg-slate-50 border">
              <div class="text-[10px] text-slate-500 font-bold">মোট বিল</div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">

                <option value="Cash">Cash</option>

          </div>

          <div>

            <input id="deliv-note-inp" type="text" value="${ord.deliveryNote || ''}" placeholder="যেমন: কাস্টমার নিজে নিয়েছেন / ভাই নিয়ে গেছেন" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />

          <label class="flex items-center gap-2 p-2.5 rounded-xl bg-green-50 border border-green-200 text-green-950 font-extrabold cursor-pointer">

    function updateDeliveryRemainingPreview(dueAmt) {
      const payingNow = Math.max(0, Number(document.getElementById('deliv-pay-now')?.value || 0));
      const rem = Math.max(0, Number(dueAmt || 0) - payingNow);
      const box = document.getElementById('deliv-rem-preview');
      if (!box) return;
      if (rem > 0) {
        box.className = 'p-2.5 rounded-xl bg-rose-50 border-rose-200 text-rose-800 border font-extrabold flex justify-between items-center';
        box.innerHTML = `<span>⚠️ ডেলিভারির পর অবশিষ্ট বাকি থাকবে (কাস্টমার খাতায় যুক্ত হবে):</span><span class="text-sm">${formatTk(rem)}</span>`;
      } else {
        box.className = 'p-2.5 rounded-xl bg-emerald-50 border-emerald-200 text-emerald-900 border font-extrabold flex justify-between items-center';
        box.innerHTML = `<span>✓ ডেলিভারির পর অবশিষ্ট বাকি থাকবে:</span><span class="text-sm">${formatTk(0)}</span>`;
      }
    }

    function confirmOrderDelivery(orderId, shouldPrintMemo = false) {
      if (isKarigorAdmin()) return;
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;

      const payNow = Math.max(0, Number(document.getElementById('deliv-pay-now')?.value || 0));
      const method = document.getElementById('deliv-pay-method')?.value || ord.paymentMethod || 'Cash';
      const note = (document.getElementById('deliv-note-inp')?.value || '').trim();
      const sendWa = Boolean(document.getElementById('deliv-send-wa-chk')?.checked);

      if (payNow > 0) {
        ord.paidAmount = Number(ord.paidAmount || 0) + payNow;
        ord.paymentMethod = method;
        const cust = state.customers.find((c) => c.phone === ord.customerPhone);
        if (cust) cust.due = Math.max(0, Number(cust.due || 0) - payNow);
      }

      ord.status = 'Delivered';
      ord.deliveredAt = new Date().toISOString();
      if (note) ord.deliveryNote = note;

      persistState();
      closeModal();
      showToast(`✅ মেমো #${ord.id.replace('ORD-', '')} ডেলিভারি সম্পন্ন হয়েছে!`, 'success');
      renderApp();

      if (sendWa) {
        dispatchAutomatedWhatsApp(ord, 'DELIVERED');
      }
      if (shouldPrintMemo) {
        printOrderMemo(ord.id);
      }
    }

                        </td>
                        <td class="p-3">
                          ${tailorItems.length === 0 ? `<span class="text-slate-400">শুধু কাপড়/পণ্য</span>` : `
                            <div class="space-y-1.5">
                              <div class="flex flex-wrap gap-1">
                                ${tailorItems.map((it) => {
                                  const itemCutDone = Boolean(it.cuttingDone || it.sewingDoneBy || it.completeDoneBy);
                                  return `
                                    <button type="button" onclick="markSingleItemCuttingDone('${ord.id}', '${it.uid}', false)" class="px-2 py-1 rounded-lg font-extrabold text-[10.5px] cursor-pointer ${itemCutDone ? 'bg-slate-200 text-slate-700' : 'bg-amber-500 hover:bg-amber-600 text-slate-950'}">
                                      ${itemCutDone ? `✓ ${it.name} (x${toBnNum(it.qty)}) কাটিং` : `✂️ ${it.name} (x${toBnNum(it.qty)}) কাটিং ডান`}
                                    </button>
                                  `;
                                }).join('')}
                              </div>
                              <div class="flex flex-wrap gap-1.5">
                                <button type="button" onclick="openSelfServiceDoneModal('${ord.id}', 'SEWING')" class="px-2.5 py-1 rounded-lg font-extrabold text-[11px] cursor-pointer ${allSewDone ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-blue-600 hover:bg-blue-700 text-white'}">
                                  ${allSewDone ? `✓ সুইং (${sewWorkers})` : '🪡 সুইং ডান'}
                                </button>
                                <button type="button" onclick="openSelfServiceDoneModal('${ord.id}', 'COMPLETE')" class="px-2.5 py-1 rounded-lg font-extrabold text-[11px] cursor-pointer ${allCompDone ? 'bg-purple-100 text-purple-900 border border-purple-300' : 'bg-emerald-700 hover:bg-emerald-800 text-white'}">
                                  ${allCompDone ? `✓ কমপ্লিট (${compWorkers})` : '✨ কমপ্লিট ডান'}
                                </button>
                              </div>
                            </div>
                          `}
                        </td>
                        ${!isKarigorAdmin() ? `
                          <td class="p-3">
                            <div class="font-bold">মোট: ${formatTk(bd.netTotal)}</div>
                            <div class="text-[11px] font-extrabold ${bd.due > 0 ? 'text-rose-600' : 'text-emerald-700'}">বাকি: ${formatTk(bd.due)}</div>
                          </td>
                        ` : ''}
                        <td class="p-3 text-right">
                          <div class="inline-flex flex-wrap justify-end gap-1">
                            <button type="button" onclick="openOrderMeasurementsViewModal('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-900 border border-emerald-300 font-extrabold cursor-pointer">📏 মাপ</button>
                            <button type="button" onclick="printOrderMemo('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-slate-900 text-amber-300 font-extrabold cursor-pointer">🖨️ মেমো</button>
                            ${!isKarigorAdmin() ? `
                              ${ord.status !== 'Delivered' ? `
                                <button type="button" onclick="openDeliveryCheckoutModal('${ord.id}')" class="px-2.5 py-1.5 rounded-lg ${ord.status === 'Ready' ? 'bg-amber-400 hover:bg-amber-300 text-slate-950 shadow-2xs' : 'bg-blue-600 hover:bg-blue-700 text-white'} font-extrabold cursor-pointer">📦 ডেলিভারি দিন</button>
                              ` : ''}
                              ${waUrl ? `<a href="${waUrl}" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-green-600 hover:bg-green-700 text-white font-extrabold">📲 ${ord.status === 'Ready' ? 'Ready WA' : 'WA'}</a>` : ''}
                              <button type="button" onclick="openOrderPaymentModal('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white font-extrabold cursor-pointer">৳ পেমেন্ট</button>
                            ` : ''}
                            ${isMasterAdmin() ? `
                              <select onchange="updateOrderStatus('${ord.id}', this.value)" class="px-2 py-1 rounded-lg border border-slate-300 font-bold text-[11px] bg-white">
                                ${['Cutting', 'Sewing', 'Ready', 'Delivered'].map((stOpt) => `<option value="${stOpt}" ${(ord.status || 'Cutting') === stOpt ? 'selected' : ''}>${stOpt}</option>`).join('')}
                              </select>
                              ${tailorItems.length > 0 ? `<button type="button" onclick="openOrderMeasurementOnlyEditModal('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-900 border border-blue-300 font-extrabold cursor-pointer">✏️ মাপ এডিট</button>` : ''}
                              <button type="button" onclick="loadOrderIntoFullEditor('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-amber-100 text-amber-950 border border-amber-300 font-extrabold cursor-pointer">🔄 মেমো এডিট</button>
                              <button type="button" onclick="deleteOrderRecord('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold cursor-pointer">✕</button>
                            ` : ''}
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function loadOrderIntoFullEditor(orderId) {
      if (!requireMasterGuard('অর্ডার এডিট')) return;
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      editingOrderId = ord.id;
      cartItems = JSON.parse(JSON.stringify(ord.items || []));
      state.orderForm = {
        orderDate: ord.orderDate,
        deliveryDate: ord.deliveryDate,
        customerPhone: ord.customerPhone,
        customerName: ord.customerName,
        customerAddress: ord.customerAddress || '',
        discount: ord.discount || 0,
        paidAmount: ord.paidAmount || 0,
        paymentMethod: ord.paymentMethod || 'Cash'
      };
      navigateToTab('new-order');
    }

    function updateOrderStatus(orderId, newStatus) {
      if (!requireMasterGuard('স্ট্যাটাস পরিবর্তন')) return;
      if (newStatus === 'Delivered') {
        openDeliveryCheckoutModal(orderId);
        return;
      }
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      ord.status = newStatus;
      persistState();
      showToast(`অর্ডার স্ট্যাটাস "${newStatus}" করা হয়েছে`, 'success');
      renderApp();
    }

    function openOrderPaymentModal(orderId) {
      if (isKarigorAdmin()) { showToast('⛔ কারিগর প্যানেল থেকে পেমেন্ট নেওয়া যাবে না।', 'warn'); return; }
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const bd = calculateFinancials([ord]).orderBreakdown[0];
      const dueAmt = Number(bd?.due || 0);
      const html = `
        <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between royal-gradient text-white">
          <div>
            <h3 class="text-base font-extrabold text-amber-300">৳ পেমেন্ট জমা নিন — #${ord.id.replace('ORD-', '')}</h3>
            <p class="text-[11px] text-emerald-200">${ord.customerName} (${ord.customerPhone})</p>
          </div>
          <button type="button" onclick="closeModal()" class="p-1.5 text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="submitOrderPayment(event, '${ord.id}')" class="p-5 space-y-3 text-xs">
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="p-2.5 rounded-xl bg-slate-50 border"><div class="text-[10px] text-slate-500 font-bold">মোট বিল</div><div class="text-sm font-extrabold">${formatTk(bd.netTotal)}</div></div>
            <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200"><div class="text-[10px] text-emerald-700 font-bold">পূর্বের জমা</div><div class="text-sm font-extrabold text-emerald-800">${formatTk(ord.paidAmount)}</div></div>
            <div class="p-2.5 rounded-xl bg-rose-50 border border-rose-200"><div class="text-[10px] text-rose-700 font-bold">বর্তমান বাকি</div><div class="text-sm font-extrabold text-rose-700">${formatTk(dueAmt)}</div></div>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">নতুন জমার পরিমাণ (৳)</label>
            <input id="pay-modal-amount" type="number" min="1" value="${dueAmt > 0 ? dueAmt : ''}" required class="w-full px-3 py-2.5 rounded-xl border border-emerald-400 font-extrabold text-base outline-none" />
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">পেমেন্ট মাধ্যম</label>
            <select id="pay-modal-method" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold">
              <option value="Cash">Cash</option><option value="bKash">bKash</option><option value="Nagad">Nagad</option><option value="Bank">Bank</option>
            </select>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold cursor-pointer">✓ জমা নিশ্চিত করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-md');
    }

    function submitOrderPayment(e, orderId) {
      e.preventDefault();
      if (isKarigorAdmin()) return;
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const addPay = Number(document.getElementById('pay-modal-amount')?.value || 0);
      if (addPay <= 0) return;
      ord.paidAmount = Number(ord.paidAmount || 0) + addPay;
      ord.paymentMethod = document.getElementById('pay-modal-method')?.value || ord.paymentMethod || 'Cash';
      const cust = state.customers.find((c) => c.phone === ord.customerPhone);
      if (cust) cust.due = Math.max(0, Number(cust.due || 0) - addPay);
      persistState();
      closeModal();
      showToast(`${formatTk(addPay)} পেমেন্ট সফলভাবে জমা হয়েছে!`, 'success');
      renderApp();
    }

    function deleteOrderRecord(orderId) {
      if (!requireMasterGuard('অর্ডার ডিলিট')) return;
      state.orders = state.orders.filter((o) => o.id !== orderId);
      persistState();
      showToast('অর্ডারটি তালিকা থেকে মুছে ফেলা হয়েছে।', 'warn');
      renderApp();
    }

    // ==========================================
    // 7. INVENTORY (STOCK, PRODUCTS, FABRICS + GALLERY & CUT-PIECE)
    // ==========================================
    function renderStockLedger() {
      if (!isMasterAdmin()) return `<div class="p-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-extrabold text-center">⛔ শুধুমাত্র মাস্টার অ্যাডমিন সম্পূর্ণ স্টক ও পুঁজি হিসাব দেখতে পারবেন।</div>`;

      const soldMap = {};
      let totalSoldRevenue = 0;
      (state.orders || []).forEach((ord) => {
        (ord.items || []).forEach((it) => {
          if (it.type !== 'tailor' && it.refId) {
            const qty = Number(it.qty || 0);
            const rev = Number(it.price || 0) * qty;
            if (!soldMap[it.refId]) soldMap[it.refId] = { qty: 0, rev: 0 };
            soldMap[it.refId].qty += qty;
            soldMap[it.refId].rev += rev;
            totalSoldRevenue += rev;
          }
        });
      });

      const totalPurchasedAmount = (state.purchases || []).reduce((s, p) => s + Number(p.total || 0), 0);

      let allCostVal = 0;
      let allSellVal = 0;
      (state.inventory || []).forEach((it) => {
        const stk = Number(it.stock || 0);
        allCostVal += stk * Number(it.costPrice || 0);
        allSellVal += stk * Number(it.sellPrice || 0);
      });
      const allExpectedProfit = allSellVal - allCostVal;

      const fabricsCount = state.inventory.filter((i) => i.category === 'Fabrics').length;
      const productsCount = state.inventory.filter((i) => i.category === 'Product').length;
      const lowStockCount = state.inventory.filter((i) => Number(i.stock || 0) <= 15).length;

      const q = stockLedgerSearch.trim().toLowerCase();
      const filteredList = (state.inventory || []).filter((it) => {
        const matchCat =
          stockLedgerFilter === 'ALL' ||
          (stockLedgerFilter === 'Fabrics' && it.category === 'Fabrics') ||
          (stockLedgerFilter === 'Product' && it.category === 'Product') ||
          (stockLedgerFilter === 'LOW' && Number(it.stock || 0) <= 15);
        const matchQ = !q || (it.name || '').toLowerCase().includes(q) || (it.id || '').toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      let tableCostTotal = 0;
      let tableSellTotal = 0;
      let tableSoldRevTotal = 0;

      const rowsHtml = filteredList.map((it, idx) => {
        const stk = Number(it.stock || 0);
        const costP = Number(it.costPrice || 0);
        const sellP = Number(it.sellPrice || 0);
        const curCostVal = Math.round(stk * costP);
        const curSellVal = Math.round(stk * sellP);
        const soldInfo = soldMap[it.id] || { qty: 0, rev: 0 };

        tableCostTotal += curCostVal;
        tableSellTotal += curSellVal;
        tableSoldRevTotal += soldInfo.rev;

        const isLow = stk <= 15;
        return `
          <tr class="${isLow ? 'bg-rose-50/40' : 'hover:bg-slate-50/80'}">
            <td class="p-2.5 font-extrabold text-slate-600">${toBnNum(idx + 1)}</td>
            <td class="p-2.5">
              <div class="font-extrabold text-slate-900">${it.name}</div>
              <span class="inline-block px-2 py-0.2 rounded-full text-[10px] font-bold ${it.category === 'Fabrics' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-blue-50 text-blue-800 border border-blue-200'}">
                ${it.category === 'Fabrics' ? '🧵 গজ কাপড়' : '🧢 প্রোডাক্ট'}
              </span>
            </td>
            <td class="p-2.5 text-right font-bold text-slate-700">${formatTk(costP)}</td>
            <td class="p-2.5 text-right font-bold text-emerald-800">${formatTk(sellP)}</td>
            <td class="p-2.5 text-center">
              <span class="px-2.5 py-1 rounded-lg font-extrabold ${isLow ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-900'}">
                ${toBnNum(stk)} ${it.unit}
              </span>
            </td>
            <td class="p-2.5 text-right">
              <div class="font-extrabold text-slate-800">${toBnNum(soldInfo.qty)} ${it.unit}</div>
              <div class="text-[10px] font-bold text-slate-500">${formatTk(soldInfo.rev)}</div>
            </td>
            <td class="p-2.5 text-right font-extrabold text-slate-900">${formatTk(curCostVal)}</td>
            <td class="p-2.5 text-right font-extrabold text-emerald-800">${formatTk(curSellVal)}</td>
          </tr>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-slate-200 flex flex-wrap items-center justify-between gap-2 shadow-2xs">
            <div>
              <h2 class="text-base font-extrabold text-slate-900">📦 সম্পূর্ণ স্টক ও পুঁজি হিসাব-নিকাশ (Stock Ledger)</h2>
              <p class="text-xs text-slate-500">দোকানে বর্তমানে কত টাকার মাল মজুত আছে, কেনা ও বিক্রয় মূল্য এবং মোট বিক্রির পূর্ণাঙ্গ সিরিয়াল হিসাব</p>
            </div>
            <button type="button" onclick="window.print()" class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-amber-300 text-xs font-extrabold flex items-center gap-1.5 shadow cursor-pointer">
              <span>🖨️</span>
              <span>স্টক হিসাব প্রিন্ট</span>
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
            <div class="bg-white rounded-2xl p-4 border-2 border-emerald-200 shadow-2xs">
              <div class="text-emerald-800 font-bold">১. বর্তমান স্টক মূল্য (কেনা দরে পুঁজি)</div>
              <div class="text-xl font-extrabold text-emerald-950 mt-1">${formatTk(allCostVal)}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">মোট ${toBnNum(state.inventory.length)} টি আইটেমের আসল পুঁজি</div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-blue-200 shadow-2xs">
              <div class="text-blue-800 font-bold">২. বর্তমান স্টকের বিক্রয় মূল্য</div>
              <div class="text-xl font-extrabold text-blue-950 mt-1">${formatTk(allSellVal)}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">সব মজুত মাল বিক্রি হলে প্রাপ্ত টাকা</div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-amber-300 shadow-2xs">
              <div class="text-amber-900 font-bold">৩. মজুত মাল থেকে সম্ভাব্য লাভ</div>
              <div class="text-xl font-extrabold text-amber-950 mt-1">${formatTk(allExpectedProfit)}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">বিক্রয় মূল্য − কেনা পুঁজি</div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs">
              <div class="text-slate-700 font-bold">৪. মোট স্টক বিক্রি ও ক্রয়</div>
              <div class="text-base font-extrabold text-emerald-800 mt-1">বিক্রি: ${formatTk(totalSoldRevenue)}</div>
              <div class="text-[11px] font-bold text-slate-600 mt-0.5">নতুন ক্রয় এন্ট্রি: ${formatTk(totalPurchasedAmount)}</div>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-3 text-xs">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap gap-1.5">
                <button type="button" onclick="stockLedgerFilter='ALL'; renderApp();" class="px-3 py-1.5 rounded-xl font-extrabold cursor-pointer ${stockLedgerFilter === 'ALL' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">সব মাল (${toBnNum(state.inventory.length)} টি)</button>
                <button type="button" onclick="stockLedgerFilter='Fabrics'; renderApp();" class="px-3 py-1.5 rounded-xl font-extrabold cursor-pointer ${stockLedgerFilter === 'Fabrics' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">🧵 শুধু গজ কাপড় (${toBnNum(fabricsCount)} টি)</button>
                <button type="button" onclick="stockLedgerFilter='Product'; renderApp();" class="px-3 py-1.5 rounded-xl font-extrabold cursor-pointer ${stockLedgerFilter === 'Product' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">🧢 শুধু প্রোডাক্ট (${toBnNum(productsCount)} টি)</button>
                <button type="button" onclick="stockLedgerFilter='LOW'; renderApp();" class="px-3 py-1.5 rounded-xl font-extrabold cursor-pointer ${stockLedgerFilter === 'LOW' ? 'bg-rose-700 text-white' : 'bg-rose-50 text-rose-800 border border-rose-200'}">⚠️ কম স্টক (${toBnNum(lowStockCount)} টি)</button>
              </div>
              <input id="stock-ledger-search" type="text" value="${stockLedgerSearch}" oninput="stockLedgerSearch=this.value; renderApp(); setTimeout(()=>{const el=document.getElementById('stock-ledger-search'); if(el){el.focus(); el.setSelectionRange(el.value.length, el.value.length);}},0);" placeholder="কাপড় বা পণ্যের নাম লিখুন..." class="px-3 py-1.5 rounded-xl border border-slate-300 font-bold outline-none focus:border-emerald-600" />
            </div>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-700 font-extrabold">
                    <th class="p-2.5">ক্রমিক</th>
                    <th class="p-2.5">আইটেমের নাম ও ধরন</th>
                    <th class="p-2.5 text-right">কেনা দর</th>
                    <th class="p-2.5 text-right">বিক্রয় দর</th>
                    <th class="p-2.5 text-center">বর্তমান মজুত</th>
                    <th class="p-2.5 text-right">মোট বিক্রি</th>
                    <th class="p-2.5 text-right">বর্তমান কেনা মূল্য (৳)</th>
                    <th class="p-2.5 text-right">বর্তমান বিক্রয় মূল্য (৳)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${filteredList.length === 0 ? `<tr><td colspan="8" class="p-8 text-center text-slate-400 font-bold">কোনো আইটেম পাওয়া যায়নি।</td></tr>` : rowsHtml}
                </tbody>
                <tfoot>
                  <tr class="bg-emerald-950 text-amber-300 font-extrabold text-xs">
                    <td colspan="5" class="p-3 text-right">সর্বমোট (Grand Total — ${toBnNum(filteredList.length)} টি আইটেম):</td>

      if (!it) return;

      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">+ নতুন কাপড় / প্রোডাক্ট যোগ করুন</h3>

            <div><label class="block font-bold mb-1">বিক্রয় দর</label><input id="new-inv-sell" type="number" value="300" class="w-full px-3 py-2 rounded-xl border font-bold" /></div>

      openModal(html, 'max-w-md');

    function submitNewInventory(e) {
      e.preventDefault();
      const category = document.getElementById('new-inv-cat')?.value || 'Fabrics';
      const unit = document.getElementById('new-inv-unit')?.value || 'গজ';
      const name = document.getElementById('new-inv-name')?.value.trim();
      if (!name) return;
      state.inventory.unshift({
        id: 'INV-' + Date.now(),
        category,
        name,
        unit,
        stock: Number(document.getElementById('new-inv-stock')?.value || 0),
        costPrice: Number(document.getElementById('new-inv-cost')?.value || 0),
        sellPrice: Number(document.getElementById('new-inv-sell')?.value || 0),
        colorHex: '#e2e8f0',
        colorName: '',
        image: '',
        cutPiecesNote: ''
      });
      persistState();
      closeModal();
      showToast('নতুন আইটেম যুক্ত হয়েছে!', 'success');
      renderApp();
    }

    function handleFileToHiddenInput(e, hiddenId) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const inp = document.getElementById(hiddenId);
        if (inp) inp.value = reader.result;
      };
      reader.readAsDataURL(file);
    }

                  ${g.image ? `<img src="${g.image}" class="w-12 h-12 rounded-xl object-cover border border-amber-300 shrink-0" />` : `<div class="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center text-xl shrink-0">${g.icon || '👘'}</div>`}

    function handleGarmentImageUpload(e, hiddenId, previewBoxId) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const hiddenInp = document.getElementById(hiddenId);
        if (hiddenInp) hiddenInp.value = dataUrl;
        const previewBox = document.getElementById(previewBoxId);
        if (previewBox) {
          previewBox.innerHTML = `<img src="${dataUrl}" class="w-14 h-14 rounded-xl object-cover border border-emerald-400" />`;
        }
      };
      reader.readAsDataURL(file);
    }

    function clearGarmentImagePreview(hiddenId, previewBoxId, fallbackIcon = '👘') {
      const hiddenInp = document.getElementById(hiddenId);
      if (hiddenInp) hiddenInp.value = '';
      const previewBox = document.getElementById(previewBoxId);
      if (previewBox) {
        previewBox.innerHTML = `<div class="w-14 h-14 rounded-xl bg-amber-100 flex items-center justify-center text-2xl">${fallbackIcon}</div>`;
      }
    }

      pendingGarmentDesignList.push(val);

      pendingGarmentDesignList.splice(idx, 1);

      const box = document.getElementById('garment-design-tags-box');

        </span>
