          ${activeReportSubTab === 'PARTNERS' ? `
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-4 text-xs">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 class="text-base font-extrabold text-slate-900">🤝 পার্টনারদের লভ্যাংশ, মূলধন ও উত্তোলন বণ্টন</h3>
                  <p class="text-slate-500">বণ্টনযোগ্য সর্বমোট নিট লাভ: <b class="text-emerald-800">${formatTk(combinedNetProfit)}</b></p>
                </div>
                <button type="button" onclick="openPartnerFormModal()" class="px-4 py-2 rounded-xl bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">+ নতুন পার্টনার যোগ</button>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                ${(state.partners || []).map((p, idx) => {
                  const baseProfit = p.scope === 'TAILOR' ? tailorNet : p.scope === 'RETAIL' ? retailNet : combinedNetProfit;
                  const shareEarned = Math.round((baseProfit * Number(p.sharePercent || 0)) / 100);
                  const logWithdrawn = filteredWithdrawals.filter((w) => w.partnerId === p.id).reduce((s, w) => s + Number(w.amount || 0), 0);
                  const totalWithdrawn = Number(p.withdrawn || 0) + logWithdrawn;
                  const remaining = shareEarned - totalWithdrawn;
                  return `
                    <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5">
                      <div class="flex items-center justify-between gap-1">
                        <input type="text" value="${p.name}" onchange="state.partners[${idx}].name=this.value; persistState();" class="flex-1 px-2.5 py-1.5 rounded-xl border bg-white font-extrabold" />
                        <button type="button" onclick="openPartnerFormModal('${p.id}')" class="px-2 py-1.5 rounded-lg bg-amber-100 text-amber-950 font-bold cursor-pointer">✏️</button>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block text-[10px] font-bold text-slate-500">মূলধন (৳)</label>
                          <input type="number" value="${p.capital || 0}" onchange="state.partners[${idx}].capital=Number(this.value||0); persistState();" class="w-full px-2.5 py-1.5 rounded-xl border bg-white font-bold" />
                        </div>
                        <div>
                          <label class="block text-[10px] font-bold text-slate-500">শেয়ার (%)</label>
                          <input type="number" value="${p.sharePercent || 0}" onchange="state.partners[${idx}].sharePercent=Number(this.value||0); persistState(); renderApp();" class="w-full px-2.5 py-1.5 rounded-xl border bg-white font-extrabold" />
                        </div>
                      </div>
                      <div class="p-2.5 rounded-xl bg-white border space-y-1">
                        <div class="flex justify-between"><span>লভ্যাংশ অংশ:</span><b class="text-emerald-800">${formatTk(shareEarned)}</b></div>
                        <div class="flex justify-between"><span>উত্তোলিত:</span><b>${formatTk(totalWithdrawn)}</b></div>
                        <div class="flex justify-between border-t pt-1 font-extrabold"><span>অবশিষ্ট পাওনা:</span><span class="text-emerald-900">${formatTk(remaining)}</span></div>
                      </div>
                      <button type="button" onclick="openPartnerWithdrawModal('${p.id}')" class="w-full py-2 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">💸 লভ্যাংশ উত্তোলন</button>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}

          ${activeReportSubTab === 'SUMMARY' ? `
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-3 text-sm">
              <h3 class="text-base font-extrabold text-slate-900">📋 পূর্ণাঙ্গ সারসংক্ষেপ (সব সেক্টর)</h3>
              <div class="flex justify-between"><span>টেইলার্স সেক্টর নিট লাভ:</span><b class="text-emerald-800">${formatTk(fin.tailorRevenue - fin.karigorCost)}</b></div>
              <div class="flex justify-between"><span>ফেব্রিক্স ও প্রোডাক্ট লাভ:</span><b class="text-emerald-800">${formatTk(fin.retailRevenue - fin.retailCost)}</b></div>
              <div class="flex justify-between"><span>বাদ (-): দৈনিক খরচ:</span><b class="text-rose-600">- ${formatTk(totalExp)}</b></div>
              <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 flex justify-between items-center">
                <span class="font-extrabold text-emerald-950">সর্বমোট নিট লাভ</span>
                <span class="text-2xl font-extrabold text-emerald-800">${formatTk((fin.tailorRevenue - fin.karigorCost) + (fin.retailRevenue - fin.retailCost) - totalExp)}</span>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ==========================================
    // 10. SETTINGS, BACKUP/RESTORE & APP RENDER
    // ==========================================
    function downloadFullBackupJson() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `alkarim-erp-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('ব্যাকআপ ফাইল ডাউনলোড হয়েছে!', 'success');
    }

    function restoreBackupJsonFromFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || typeof parsed !== 'object') {
            showToast('ভুল ব্যাকআপ ফাইল!', 'warn');
            return;
          }
          const def = createDefaultState();
          state = {
            ...def,
            ...parsed,
            shop: { ...def.shop, ...(parsed.shop || {}) },
            auth: { ...def.auth, ...(parsed.auth || {}) },
            orderForm: { ...def.orderForm, ...(parsed.orderForm || {}) }
          };
          persistState(false);
          showToast('ব্যাকআপ ফাইল থেকে ডাটা রিস্টোর সম্পন্ন হয়েছে!', 'success');
          renderApp();
        } catch (err) {
          showToast('ব্যাকআপ ফাইল পড়া যায়নি!', 'warn');
        }
      };
      reader.readAsText(file);
    }

    function renderSettings() {
      const masterObj = state.auth?.masterAdmins?.[0] || { name: 'মাস্টার অ্যাডমিন', phone: '', pin: '' };
      const managerObj = state.auth?.managerAdmins?.[0] || { name: 'ম্যানেজার কাউন্টার', phone: '', pin: '' };
      const masterPin = masterObj.pin || '';
      const masterPhone = masterObj.phone || '';
      const managerPin = managerObj.pin || '';
      const managerPhone = managerObj.phone || '';
      return `
        <div class="max-w-2xl space-y-4 text-xs">
          <div class="bg-white rounded-2xl p-5 border border-emerald-200 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 class="text-sm font-extrabold text-slate-900">🔐 প্যানেল ও রোল পরিবর্তন (বর্তমান: ${roleBadge})</h3>
                <p class="text-[11px] text-slate-500">মাস্টার অ্যাডমিন, ম্যানেজার বা কারিগর প্যানেলে এখান থেকেই পরিবর্তন করুন</p>
              </div>
              <button type="button" onclick="openRoleSwitcherModal()" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold cursor-pointer">🔄 প্যানেল পরিবর্তন করুন ▾</button>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 space-y-3">
            <h3 class="text-sm font-extrabold text-slate-900">⚙️ দোকানের তথ্য, লোগো, নিরাপত্তা পিন ও WhatsApp সেটিংস</h3>
            <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-emerald-700 shrink-0">${getRoyalBrandLogoSvg('set-logo')}</div>
                <div>
                  <div class="font-extrabold text-slate-900">দোকানের অফিশিয়াল লোগো (হেডার, ব্যানার ও মেমো প্রিন্ট)</div>
                  <div class="flex flex-wrap items-center gap-1.5 mt-1">
                    <label class="px-3 py-1 rounded-lg bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">
                      📷 লোগো আপলোড
                      <input type="file" accept="image/*" class="hidden" onchange="compressImageDataUrl(this.files[0], (url)=>{ state.shop.logoImage=url; persistState(); showToast('নতুন লোগো সেট হয়েছে!', 'success'); renderApp(); })" />
                    </label>
                    ${state.shop.logoImage ? `<button type="button" onclick="state.shop.logoImage=''; persistState(); showToast('ডিফল্ট গোল্ডেন লোগো ফিরিয়ে আনা হয়েছে।'); renderApp();" class="px-2.5 py-1 rounded-lg bg-rose-100 text-rose-800 font-bold cursor-pointer">✕ লোগো সরান</button>` : ''}
                  </div>
                </div>
              </div>
            </div>
            <div>
              <label class="block font-bold text-slate-600 mb-1">দোকানের নাম</label>
              <input id="set-shop-name" type="text" value="${state.shop.nameBn}" class="w-full px-3 py-2 rounded-xl border font-extrabold" />
            </div>
            <div>
              <label class="block font-bold text-slate-600 mb-1">ঠিকানা</label>
              <input id="set-shop-addr" type="text" value="${state.shop.address}" class="w-full px-3 py-2 rounded-xl border font-bold" />
            </div>
            <div>
              <label class="block font-bold text-slate-600 mb-1">মোবাইল নম্বর</label>
              <input id="set-shop-phone" type="text" value="${state.shop.phone}" class="w-full px-3 py-2 rounded-xl border font-bold" />
            </div>
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-300 space-y-2.5">
              <div class="font-extrabold text-amber-950">👑 মাস্টার অ্যাডমিন — মোবাইল ও পিন</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input id="set-master-phone" type="tel" value="${masterPhone}" placeholder="মাস্টার মোবাইল নম্বর" class="w-full px-3 py-1.5 rounded-xl border border-amber-400 bg-white font-bold" />
                <input id="set-master-pin" type="text" inputmode="numeric" value="${masterPin}" placeholder="মাস্টার পিন (যেমন: 1234)" class="w-full px-3 py-1.5 rounded-xl border border-amber-400 bg-white font-extrabold" />
              </div>
              <div class="font-extrabold text-blue-950 pt-1">📋 ম্যানেজার অ্যাডমিন — মোবাইল ও পিন (একবার ঢুকলে আর পিন লাগবে না)</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input id="set-manager-phone" type="tel" value="${managerPhone}" placeholder="ম্যানেজার মোবাইল নম্বর" class="w-full px-3 py-1.5 rounded-xl border border-blue-300 bg-white font-bold" />
                <input id="set-manager-pin" type="text" inputmode="numeric" value="${managerPin}" placeholder="ম্যানেজার পিন (যেমন: 5678)" class="w-full px-3 py-1.5 rounded-xl border border-blue-300 bg-white font-extrabold" />
              </div>
            </div>
            <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 space-y-2">
              <div class="font-extrabold text-emerald-950">📲 WhatsApp Cloud Gateway (ঐচ্ছিক)</div>
              <input id="set-wa-url" type="text" value="${state.shop.waGatewayUrl || ''}" placeholder="API Endpoint URL (না দিলে ফ্রি One-Touch WA চলবে)" class="w-full px-3 py-1.5 rounded-xl border bg-white font-bold" />
              <input id="set-wa-tok" type="text" value="${state.shop.waGatewayToken || ''}" placeholder="API Bearer Token" class="w-full px-3 py-1.5 rounded-xl border bg-white font-bold" />
            </div>
            <button type="button" onclick="state.shop.nameBn=document.getElementById('set-shop-name').value; state.shop.address=document.getElementById('set-shop-addr').value; state.shop.phone=document.getElementById('set-shop-phone').value; if(state.auth?.masterAdmins?.[0]){ state.auth.masterAdmins[0].phone=document.getElementById('set-master-phone').value.trim(); state.auth.masterAdmins[0].pin=document.getElementById('set-master-pin').value.trim(); } if(state.auth?.managerAdmins?.[0]){ state.auth.managerAdmins[0].phone=document.getElementById('set-manager-phone').value.trim(); state.auth.managerAdmins[0].pin=document.getElementById('set-manager-pin').value.trim(); } rememberedLoginKeys=[]; localStorage.removeItem('ALKARIM_REMEMBERED_LOGINS_V1'); persistState(); showToast('মোবাইল ও পিন সেটিংস সেভ হয়েছে!', 'success'); renderApp();" class="px-5 py-2.5 rounded-xl bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">✓ সেটিংস সেভ করুন</button>
          </div>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 space-y-3">
            <h3 class="text-sm font-extrabold text-slate-900">💾 পূর্ণাঙ্গ JSON ব্যাকআপ ও রিস্টোর</h3>
            <p class="text-[11px] text-slate-500">আপনার সব অর্ডার, মাপ, স্টক, কারিগর ও পার্টনার হিসাব ব্যাকআপ ফাইল হিসেবে ডাউনলোড বা রিস্টোর করুন।</p>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="downloadFullBackupJson()" class="px-4 py-2 rounded-xl bg-slate-900 text-amber-300 font-extrabold cursor-pointer">⬇️ ব্যাকআপ ফাইল ডাউনলোড</button>
              <label class="px-4 py-2 rounded-xl bg-emerald-800 text-white font-extrabold cursor-pointer">
                ⬆️ ব্যাকআপ ফাইল রিস্টোর
                <input type="file" accept="application/json,.json" class="hidden" onchange="restoreBackupJsonFromFile(this.files[0])" />
              </label>
            </div>
          </div>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      const role = state.auth?.activeRole || 'MASTER';
      const roleBadge = role === 'MASTER'
        ? `👑 ${state.auth?.activeUserName || 'মাস্টার অ্যাডমিন'}`
        : role === 'MANAGER'
          ? `📋 ${state.auth?.activeUserName || 'ম্যানেজার'}`
          : `🪡 কারিগর ও কমপ্লিট প্যানেল`;

      const navItems = role === 'KARIGOR'
        ? [{ id: 'orders', label: '📋 অর্ডার তালিকা', badge: state.orders.length }, { id: 'karigor', label: '🪡 কারিগর হিসাব', badge: state.unreadSignals || 0 }]
        : role === 'MANAGER'
          ? [
              { id: 'dashboard', label: '📊 ড্যাশবোর্ড' },
              { id: 'new-order', label: '➕ নতুন অর্ডার' },
              { id: 'orders', label: '📋 অর্ডার তালিকা', badge: state.orders.length },
              { id: 'customers', label: '👥 কাস্টমার খাতা' },
              { id: 'expenses', label: '💸 দৈনিক খরচ' },
              { id: 'karigor', label: '🪡 কারিগর হিসাব', badge: state.unreadSignals || 0 }
            ]
          : [
              { id: 'dashboard', label: '📊 ড্যাশবোর্ড' },
              { id: 'new-order', label: '➕ নতুন অর্ডার' },
              { id: 'orders', label: '📋 অর্ডার তালিকা', badge: state.orders.length },
              { id: 'stock-ledger', label: '📦 সম্পূর্ণ স্টক হিসাব' },
              { id: 'fabrics', label: '🧵 গজ কাপড়' },
              { id: 'products', label: '🧢 প্রোডাক্ট' },
              { id: 'services', label: '✂️ টেইলার্স আইটেম' },
              { id: 'purchases', label: '🚚 ক্রয় ও সাপ্লায়ার' },
              { id: 'customers', label: '👥 কাস্টমার খাতা' },
              { id: 'karigor', label: '🪡 কারিগর হিসাব', badge: state.unreadSignals || 0 },
              { id: 'expenses', label: '💸 দৈনিক খরচ' },
              { id: 'reports', label: '📈 রিপোর্ট ও লাভ-ক্ষতি' },
              { id: 'settings', label: '⚙️ সেটিংস ও ব্যাকআপ' }
            ];

      if (!navItems.some((n) => n.id === state.activeTab)) {
        state.activeTab = navItems[0]?.id || 'orders';
      }

      let pageHtml = '';
      switch (state.activeTab) {
        case 'dashboard': pageHtml = renderDashboard(); break;
        case 'new-order': pageHtml = renderNewOrder(); break;
        case 'orders': pageHtml = renderOrdersList(); break;
        case 'stock-ledger': pageHtml = renderStockLedger(); break;
        case 'fabrics': pageHtml = renderInventory('Fabrics'); break;
        case 'products': pageHtml = renderInventory('Product'); break;
        case 'services': pageHtml = renderServicesAndMeasurements(); break;
        case 'purchases': pageHtml = renderPurchasesAndSuppliers(); break;
        case 'customers': pageHtml = renderCustomers(); break;
        case 'karigor': pageHtml = renderKarigorLedger(); break;
        case 'expenses': pageHtml = renderExpenses(); break;
        case 'reports': pageHtml = renderReports(); break;
        case 'settings': pageHtml = renderSettings(); break;
        default: pageHtml = renderDashboard();
      }

      const syncBadgeHtml = cloudSyncStatus === 'LIVE'
        ? `<span class="hidden sm:inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-950/80 border border-emerald-400/40 text-emerald-300 text-[10px] font-extrabold">☁️ লাইভ সিঙ্ক</span>`
        : `<span class="hidden sm:inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-slate-900/70 border border-slate-500/40 text-slate-200 text-[10px] font-bold">💾 অফলাইন</span>`;

      root.innerHTML = `
        <div class="min-h-screen flex flex-col">
          <header class="royal-gradient text-white sticky top-0 z-30 shadow-md">
            <div class="max-w-7xl mx-auto px-3 sm:px-5 h-14 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <button type="button" onclick="state.sidebarOpen=!state.sidebarOpen; renderApp();" class="lg:hidden p-2 rounded-xl bg-white/10 hover:bg-white/20 text-amber-300 font-extrabold cursor-pointer">☰</button>
                <div class="w-9 h-9 rounded-full overflow-hidden shrink-0">${getRoyalBrandLogoSvg('top-logo')}</div>
                <div class="min-w-0">
                  <div class="text-xs sm:text-sm font-extrabold text-amber-300 truncate">${state.shop.nameBn}</div>
                  <div class="text-[10px] text-emerald-200 truncate hidden sm:block">${state.shop.address} • ${state.shop.phone}</div>
                </div>
              </div>

              <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                ${syncBadgeHtml}
                <button type="button" onclick="karigorSubTab='WORKLOG'; state.unreadSignals=0; persistState(); navigateToTab('karigor');" class="relative p-2 rounded-xl bg-white/10 hover:bg-white/20 text-amber-300 text-xs font-extrabold cursor-pointer" title="কাজের সংকেত">
                  🔔
                  ${Number(state.unreadSignals || 0) > 0 ? `<span class="absolute -top-1 -right-1 px-1.5 py-0.2 rounded-full bg-rose-600 text-white text-[10px] font-extrabold">${toBnNum(state.unreadSignals)}</span>` : ''}
                </button>
                ${!isKarigorAdmin() ? `<button type="button" onclick="startFreshNewOrder()" class="px-3 py-1.5 rounded-xl bg-emerald-950 hover:bg-black text-amber-300 border border-amber-400/50 text-xs font-extrabold cursor-pointer">+ নতুন অর্ডার</button>` : ''}
              </div>
            </div>
          </header>

          <div class="flex-1 max-w-7xl w-full mx-auto flex relative">
            ${state.sidebarOpen ? `<div onclick="state.sidebarOpen=false; renderApp();" class="fixed inset-0 bg-slate-950/50 z-30 lg:hidden"></div>` : ''}

            <aside class="${state.sidebarOpen ? 'fixed left-0 top-14 bottom-0 z-40 w-64 block' : 'hidden'} lg:block w-60 shrink-0 bg-white border-r border-slate-200 p-3 space-y-1">
              ${navItems.map((item) => {
                const active = state.activeTab === item.id;
                return `
                  <button type="button" onclick="navigateToTab('${item.id}')" class="w-full px-3.5 py-2.5 rounded-xl text-xs font-extrabold flex items-center justify-between transition cursor-pointer ${active ? 'bg-emerald-800 text-amber-300 shadow-2xs' : 'text-slate-700 hover:bg-slate-100'}">
                    <span>${item.label}</span>
                    ${item.badge ? `<span class="px-2 py-0.5 rounded-full text-[10px] ${active ? 'bg-amber-300 text-slate-950' : 'bg-emerald-100 text-emerald-900'}">${toBnNum(item.badge)}</span>` : ''}
                  </button>
                `;
              }).join('')}
            </aside>

            <main class="flex-1 p-3 sm:p-5 min-w-0">
              ${pageHtml}
            </main>
          </div>
        </div>
      `;
    }

    initCloudFirestoreSync();
    renderApp();
  </script>
</body>
</html>
