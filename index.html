    function toBnNum(val) {

      return String(val ?? '').replace(/[0-9]/g, (d) => map[d]);

    function calculateFinancials(ordersSubset = null) {
      const targetOrders = Array.isArray(ordersSubset) ? ordersSubset : state.orders;
      let totalSales = 0;
      let totalCollected = 0;
      let totalDue = 0;
      let tailorRevenue = 0;
      let tailorKarigorCost = 0;
      let retailRevenue = 0;
      let retailCost = 0;

      const orderBreakdown = targetOrders.map((ord) => {
        const sub = (ord.items || []).reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
        const disc = Number(ord.discount || 0);
        const netTotal = Math.max(0, sub - disc);
        const paid = Number(ord.paidAmount || 0);
        const due = Math.max(0, netTotal - paid);

        totalSales += netTotal;
        totalCollected += paid;
        totalDue += due;

        (ord.items || []).forEach((it) => {
          const lineTotal = Number(it.price || 0) * Number(it.qty || 1);
          if (it.type === 'tailor') {
            tailorRevenue += lineTotal;
            tailorKarigorCost += Number(it.karigorFee || 0) * Number(it.qty || 1);
          } else {
            retailRevenue += lineTotal;
            retailCost += Number(it.buyPrice || 0) * Number(it.qty || 1);
          }
        });

        return { id: ord.id, subTotal: sub, discount: disc, netTotal, paid, due };
      });

      const totalExpenses = ordersSubset ? 0 : (state.expenses || []).reduce((s, ex) => s + Number(ex.amount || 0), 0);
      const tailorProfit = tailorRevenue - tailorKarigorCost;
      const retailProfit = retailRevenue - retailCost;
      const netProfit = tailorProfit + retailProfit - totalExpenses;

      return {
        totalSales,
        totalCollected,
        totalDue,
        tailorRevenue,
        tailorKarigorCost,
        tailorProfit,
        retailRevenue,
        retailCost,
        retailProfit,
        totalExpenses,
        netProfit,
        orderBreakdown
      };
    }

    function buildWhatsAppOrderUrl(ord) {
      const phoneRaw = String(ord.customerPhone || '').replace(/[^0-9]/g, '');

      const bd = calculateFinancials([ord]).orderBreakdown[0];
      const msg = `আসসালামু আলাইকুম ${ord.customerName},\n${state.shop.nameBn} থেকে আপনার অর্ডার #${ord.id.replace('ORD-', '')} ডেলিভারির জন্য প্রস্তুত।\nমোট বিল: ৳${bd.netTotal}\nজমা: ৳${bd.paid}\nবাকি: ৳${bd.due}\nধন্যবাদ।`;
      return `https://wa.me/${intlPhone}?text=${encodeURIComponent(msg)}`;
    }

    function startFreshNewOrder(retailOnly = false) {
      editingOrderId = null;
      quickRetailOnlyMode = Boolean(retailOnly);
      orderFabricSearch = '';
      orderProductSearch = '';
      state.cart = [];
      state.draftCustomer = {
        name: '',
        phone: '',
        address: '',
        deliveryDate: new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0],
        discount: 0,
        paidAmount: 0,
        paymentMethod: 'Cash',
        note: ''
      };
      navigateToTab('new-order');
    }

    function handleDraftPhoneInput(phoneVal) {
      state.draftCustomer.phone = phoneVal;
      const clean = phoneVal.trim();
      if (clean.length >= 6) {
        const prevOrder = state.orders.find((o) => (o.customerPhone || '').includes(clean));
        const prevCust = state.customers.find((c) => (c.phone || '').includes(clean));
        if (prevOrder) {
          if (!state.draftCustomer.name) state.draftCustomer.name = prevOrder.customerName;
          if (!state.draftCustomer.address && prevOrder.customerAddress) state.draftCustomer.address = prevOrder.customerAddress;
        } else if (prevCust) {
          if (!state.draftCustomer.name) state.draftCustomer.name = prevCust.name;
          if (!state.draftCustomer.address && prevCust.address) state.draftCustomer.address = prevCust.address;
        }
      }
      renderApp();
      setTimeout(() => {
        const el = document.getElementById('draft-phone-inp');
        if (el) {
          el.focus();
          el.setSelectionRange(el.value.length, el.value.length);
        }
      }, 0);
    }

    function loadPreviousMeasurementsForCustomer() {
      const phone = (state.draftCustomer.phone || '').trim();
      const name = (state.draftCustomer.name || '').trim().toLowerCase();
      const prevOrd = state.orders.find(
        (o) =>
          (phone && phone !== 'N/A' && o.customerPhone === phone) ||
          (name && (o.customerName || '').toLowerCase() === name)
      );
      if (!prevOrd) {
        showToast('এই কাস্টমারের পূর্বের কোনো মাপ পাওয়া যায়নি।', 'warn');
        return;
      }
      const prevTailorItems = (prevOrd.items || []).filter((it) => it.type === 'tailor');
      if (prevTailorItems.length === 0) {
        showToast('পূর্বের অর্ডারে কোনো সেলাইয়ের মাপ ছিল না।', 'warn');
        return;
      }
      prevTailorItems.forEach((it) => {
        state.cart.push({
          ...JSON.parse(JSON.stringify(it)),
          uid: 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
        });
      });
      persistState();
      showToast(`পূর্বের অর্ডার #${prevOrd.id.replace('ORD-', '')} থেকে মাপ লোড হয়েছে!`, 'success');
      renderApp();
    }

      editingOrderId = ord.id;
      state.cart = JSON.parse(JSON.stringify(ord.items || []));
      state.draftCustomer = {
        name: ord.customerName || '',
        phone: ord.customerPhone || '',
        address: ord.customerAddress || '',
        deliveryDate: ord.deliveryDate || new Date().toISOString().split('T')[0],
        discount: Number(ord.discount || 0),
        paidAmount: Number(ord.paidAmount || 0),
        paymentMethod: ord.paymentMethod || 'Cash',
        note: ord.note || ''

      navigateToTab('new-order');

    function saveMeasurementOnlyEdit(e, orderId) {
      e.preventDefault();
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;

      document.querySelectorAll('.meas-edit-inp').forEach((inp) => {
        const uid = inp.getAttribute('data-item-uid');
        const key = inp.getAttribute('data-meas-key');
        const item = ord.items.find((x) => x.uid === uid);
        if (item && item.measurements) {
          item.measurements[key] = inp.value;
        }
      });

      document.querySelectorAll('.design-edit-inp').forEach((inp) => {
        const uid = inp.getAttribute('data-item-uid');
        const item = ord.items.find((x) => x.uid === uid);
        if (item) {
          item.designNotes = inp.value;
        }
      });

      persistState();
      closeModal();
      showToast('মেজারমেন্ট ও ডিজাইন আপডেট হয়েছে!', 'success');
      renderApp();
    }

      if (!grm) return;
      const existing = editCartUid ? state.cart.find((c) => c.uid === editCartUid) : null;
      const initMeas = existing?.measurements || {};

              <span id="fabric-yardage-hint" class="px-2.5 py-0.5 rounded-full bg-indigo-50 border border-indigo-200 text-indigo-800 text-[11px] font-extrabold">

            <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">

            <div class="font-extrabold text-slate-800 mb-1.5">🎨 ডিজাইন অপশন নির্বাচন করুন:</div>
            <div class="flex flex-wrap gap-1.5">
              ${(grm.designs || []).map((d) => {
                const checked = initDesigns.includes(d);
                return `

      setTimeout(updateEstimatedFabricYardage, 10);
    }

    function updateEstimatedFabricYardage() {
      const hintEl = document.getElementById('fabric-yardage-hint');
      if (!hintEl) return;
      const qty = Math.max(1, Number(document.getElementById('grm-qty')?.value || 1));
      let lengthVal = 0;
      let bodyVal = 0;
      document.querySelectorAll('.grm-meas-field').forEach((inp) => {
        const key = inp.getAttribute('data-field') || '';
        const num = parseFloat(inp.value);
        if (!isNaN(num)) {
          if (key === 'লম্বা' || key.includes('লম্বা')) lengthVal = num;
          if (key === 'বডি' || key === 'হিপ') bodyVal = num;
        }
      });

      let perPieceYards = 2.5;
      if (lengthVal > 0) {
        if (lengthVal <= 28) perPieceYards = 1.75;
        else if (lengthVal <= 36) perPieceYards = 2.0;
        else if (lengthVal <= 41) perPieceYards = 2.5;
        else if (lengthVal <= 46) perPieceYards = 2.75;
        else perPieceYards = 3.25;
      }
      if (bodyVal >= 44) perPieceYards += 0.25;

      const totalYards = (perPieceYards * qty).toFixed(2);
      hintEl.textContent = `🧵 আনুমানিক কাপড়: ${toBnNum(totalYards)} গজ`;
    }

    function submitGarmentToCart(e, garmentId, editCartUid) {
      e.preventDefault();
      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;

      const qty = Math.max(1, Number(document.getElementById('grm-qty')?.value || 1));
      const price = Number(document.getElementById('grm-price')?.value || grm.price);
      const karigorFee = Number(document.getElementById('grm-kfee')?.value || grm.karigorFee);
      const karigorName = document.getElementById('grm-karigor')?.value || (state.karigors[0]?.name || '');
      const extraNote = (document.getElementById('grm-extra-note')?.value || '').trim();

      const measurements = {};
      document.querySelectorAll('.grm-meas-field').forEach((inp) => {
        measurements[inp.getAttribute('data-field')] = inp.value.trim();
      });

      const selectedDesigns = [];
      document.querySelectorAll('.grm-design-chk:checked').forEach((chk) => {
        selectedDesigns.push(chk.value);
      });

      const designNotes = [...selectedDesigns, extraNote].filter(Boolean).join(', ');

      const itemObj = {
        uid: editCartUid || 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        type: 'tailor',
        refId: grm.id,
        name: grm.name,
        qty,
        price,
        karigorFee,
        karigorName,
        measurements,
        selectedDesigns,
        extraNote,
        designNotes
      };

      if (editCartUid) {
        const idx = state.cart.findIndex((c) => c.uid === editCartUid);
        if (idx !== -1) state.cart[idx] = itemObj;
      } else {
        state.cart.push(itemObj);
      }

      persistState();
      closeModal();
      showToast(`${grm.name} (${toBnNum(qty)}টি) কার্টে যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function addInventoryItemToCart(invId) {
      const inv = state.inventory.find((i) => i.id === invId);
      if (!inv) return;
      const existing = state.cart.find((c) => c.refId === inv.id && c.type !== 'tailor');
      if (existing) {
        existing.qty = Number(existing.qty || 1) + 1;
      } else {
        state.cart.push({
          uid: 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
          type: inv.category === 'Fabrics' ? 'fabric' : 'product',
          refId: inv.id,
          code: inv.code,
          name: inv.name,
          unit: inv.unit,
          qty: 1,
          price: Number(inv.sellPrice || 0),
          buyPrice: Number(inv.buyPrice || 0)
        });
      }
      persistState();
      showToast(`${inv.name} যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function updateCartItemQty(uid, newQty) {
      const item = state.cart.find((c) => c.uid === uid);
      if (!item) return;
      const q = Number(newQty);
      if (q <= 0) {
        state.cart = state.cart.filter((c) => c.uid !== uid);
      } else {
        item.qty = q;
      }
      persistState();
      renderApp();
    }

    function removeCartItem(uid) {
      state.cart = state.cart.filter((c) => c.uid !== uid);
      persistState();
      renderApp();
    }

    function renderNewOrder() {
      const subTotal = state.cart.reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const discount = Number(state.draftCustomer.discount || 0);
      const netTotal = Math.max(0, subTotal - discount);
      const paid = Number(state.draftCustomer.paidAmount || 0);

    function submitFinalOrder(e) {
      e.preventDefault();
      if (state.cart.length === 0) {
        showToast('অন্তত একটি পোশাক, কাপড় বা প্রোডাক্ট যোগ করুন!', 'warn');
        return;
      }

      const name = (state.draftCustomer.name || '').trim() || 'সম্মানিত কাস্টমার';
      const phone = (state.draftCustomer.phone || '').trim() || 'N/A';
      const address = (state.draftCustomer.address || '').trim();
      const deliveryDate = state.draftCustomer.deliveryDate;
      const discount = Number(state.draftCustomer.discount || 0);
      const paidAmount = Number(state.draftCustomer.paidAmount || 0);

      let orderId = editingOrderId;
      if (editingOrderId) {
        const existingIdx = state.orders.findIndex((o) => o.id === editingOrderId);
        if (existingIdx !== -1) {
          const oldOrd = state.orders[existingIdx];
          (oldOrd.items || []).forEach((it) => {
            if (it.type !== 'tailor') {
              const inv = state.inventory.find((x) => x.id === it.refId);
              if (inv) inv.stock = Number(inv.stock || 0) + Number(it.qty || 0);
            }
          });
          state.cart.forEach((it) => {
            if (it.type !== 'tailor') {
              const inv = state.inventory.find((x) => x.id === it.refId);
              if (inv) inv.stock = Math.max(0, Number(inv.stock || 0) - Number(it.qty || 0));
            }
          });
          state.orders[existingIdx] = {
            ...oldOrd,
            customerName: name,
            customerPhone: phone,
            customerAddress: address,
            deliveryDate,
            discount,
            paidAmount,
            items: JSON.parse(JSON.stringify(state.cart))
          };
        }
      } else {
        const nextSerial = 5660 + state.orders.length + 1;
        orderId = 'ORD-' + nextSerial;
        state.cart.forEach((it) => {
          if (it.type !== 'tailor') {
            const inv = state.inventory.find((x) => x.id === it.refId);
            if (inv) inv.stock = Math.max(0, Number(inv.stock || 0) - Number(it.qty || 0));
          }
        });
        state.orders.unshift({
          id: orderId,
          orderDate: new Date().toISOString(),
          deliveryDate,
          customerName: name,
          customerPhone: phone,
          customerAddress: address,
          status: 'Cutting',
          discount,
          paidAmount,
          paymentMethod: state.draftCustomer.paymentMethod || 'Cash',
          items: JSON.parse(JSON.stringify(state.cart))
        });
      }

      const subTotal = state.cart.reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const netTotal = Math.max(0, subTotal - discount);
      const due = Math.max(0, netTotal - paidAmount);
      let cust = state.customers.find((c) => phone !== 'N/A' && c.phone === phone);
      if (!cust) {
        state.customers.unshift({
          id: 'CUST-' + Date.now(),
          name,
          phone,
          address,
          due
        });
      } else {
        cust.name = name;
        if (address) cust.address = address;
      }

      editingOrderId = null;
      state.cart = [];
      state.draftCustomer = {
        name: '',
        phone: '',
        address: '',
        deliveryDate: new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0],
        discount: 0,
        paidAmount: 0,
        paymentMethod: 'Cash',
        note: ''
      };
      state.activeTab = 'orders';
      persistState();
      showToast('অর্ডার সফলভাবে সেভ হয়েছে!', 'success');
      renderApp();
      printOrderMemo(orderId);
    }

    // ==========================================
    // 6. DUAL A4 MEMO PRINT (CUSTOMER + KARIGOR)

    function buildDualA4MemoHtml(ord) {
      const serialNum = toBnNum(ord.id.replace('ORD-', ''));

        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      const delivDateStr = formatDateNice(ord.deliveryDate);

      const subTotal = (ord.items || []).reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const discount = Number(ord.discount || 0);
      const netTotal = Math.max(0, subTotal - discount);
      const paid = Number(ord.paidAmount || 0);
      const due = Math.max(0, netTotal - paid);

      const tailorItems = (ord.items || []).filter((it) => it.type === 'tailor');
      const sortedTailorItems = [...tailorItems].sort((a, b) => {
        const rank = (name) => {
          if (name.includes('পাঞ্জাবি') || name.includes('কাবলি') || name.includes('জুব্বা')) return 1;
          if (name.includes('পাজামা')) return 2;
          return 3;
        };
        return rank(a.name) - rank(b.name);
      });

      const pages = [];
      if (sortedTailorItems.length === 0) {
        pages.push([]);
      } else {
        for (let i = 0; i < sortedTailorItems.length; i += 6) {
          pages.push(sortedTailorItems.slice(i, i + 6));

      let codeSeq = Number(ord.id.replace('ORD-', '')) * 10;

              </div>
              <div style="text-align: right; font-size: 11px; font-weight: 800; border: 1px solid #000; padding: 3px 7px; border-radius: 4px;">

              </div>
            </div>

            <div style="display: flex; justify-content: space-between; background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 800; margin-bottom: 6px;">
              <span>কাস্টমারের নাম: ${ord.customerName}</span>
              <span>মোবাইল: ${ord.customerPhone}</span>
              <span>ডেলিভারি: ${delivDateStr}</span>
            </div>

            <div style="display: grid; grid-template-columns: 1.1fr 1.6fr 1fr; gap: 6px; font-size: 10px;">
              <div style="border: 1px solid #64748b; padding: 4px; border-radius: 4px;">
                <table style="width: 100%; border-collapse: collapse;">
                  <tr><td style="font-weight: 700;">Serial:</td><td style="font-weight: 800;">${serialNum}</td></tr>
                  <tr><td style="font-weight: 700;">Order Date:</td><td>${orderDateStr}</td></tr>
                  <tr><td style="font-weight: 700;">Delivery:</td><td style="font-weight: 800;">${delivDateStr}</td></tr>
                  <tr><td style="font-weight: 700;">Name:</td><td style="font-weight: 800;">${ord.customerName}</td></tr>
                  <tr><td style="font-weight: 700;">Mobile:</td><td style="font-weight: 800;">${ord.customerPhone}</td></tr>
                </table>
                <div style="margin-top: 4px; font-size: 8.5px; line-height: 1.25; white-space: pre-line; border-top: 1px dashed #94a3b8; padding-top: 3px;">
                  ${state.shop.memoNotice}
                </div>
              </div>

              <div style="border: 1px solid #64748b; padding: 4px; border-radius: 4px;">
                <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                  <thead>
                    <tr style="border-bottom: 1px solid #000; text-align: left;">
                      <th style="padding: 2px;">Description</th>
                      <th style="padding: 2px; text-align: center;">Qty</th>
                      <th style="padding: 2px; text-align: right;">Rate</th>
                      <th style="padding: 2px; text-align: right;">Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(ord.items || []).map((it) => `
                      <tr style="border-bottom: 1px dotted #cbd5e1;">
                        <td style="padding: 2px; font-weight: 700;">${it.name}</td>
                        <td style="padding: 2px; text-align: center;">×${toBnNum(it.qty)}</td>
                        <td style="padding: 2px; text-align: right;">${toBnNum(it.price)}</td>

                      </tr>

                  </tbody>
                </table>
              </div>

              <div style="border: 1px solid #64748b; padding: 4px; border-radius: 4px; display: flex; flex-direction: column; justify-content: space-between;">
                <table style="width: 100%; border-collapse: collapse; font-size: 10.5px;">
                  <tr><td style="padding: 2px;">Total</td><td style="text-align: right; font-weight: 700;">${toBnNum(subTotal)}</td></tr>
                  ${discount > 0 ? `<tr><td style="padding: 2px;">Discount</td><td style="text-align: right;">-${toBnNum(discount)}</td></tr>` : ''}
                  <tr style="border-top: 1px solid #000;"><td style="padding: 2px; font-weight: 800;">Payable</td><td style="text-align: right; font-weight: 800;">${toBnNum(netTotal)}</td></tr>

            ✂️ কারিগর কপি (শুধুমাত্র সেলাই ও মেজারমেন্ট) — Thank you, please come again ✂️
          </div>

          <!-- BOTTOM: KARIGOR COPY -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">
            ${pageCards.map((item) => {
              const qtyCount = Math.max(1, Math.round(Number(item.qty || 1)));
              const headerTags = [];
              for (let q = 0; q < qtyCount; q++) {

                headerTags.push({ serial: serialNum, code: toBnNum(codeSeq), name: ord.customerName, phone: ord.customerPhone });
              }
              const measPairs = Object.entries(item.measurements || {}).filter(([, val]) => String(val || '').trim() !== '');

          </div>

      `;
      openModal(html, 'max-w-md');

    function submitOrderPayment(e, orderId) {
      e.preventDefault();
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const addPay = Number(document.getElementById('pay-modal-amount')?.value || 0);
      if (addPay <= 0) return;

      ord.paidAmount = Number(ord.paidAmount || 0) + addPay;
      ord.paymentMethod = document.getElementById('pay-modal-method')?.value || ord.paymentMethod || 'Cash';

      const cust = state.customers.find(
        (c) => (ord.customerPhone && ord.customerPhone !== 'N/A' && c.phone === ord.customerPhone) || c.name === ord.customerName
      );
      if (cust) {
        cust.due = Math.max(0, Number((Number(cust.due || 0) - addPay).toFixed(2)));
      }

      persistState();
      closeModal();
      showToast(`${formatTk(addPay)} পেমেন্ট সফলভাবে জমা নেওয়া হয়েছে!`, 'success');
      renderApp();
    }

    function deleteOrderRecord(orderId) {
      const idx = state.orders.findIndex((o) => o.id === orderId);
      if (idx === -1) return;
      state.orders.splice(idx, 1);
      persistState();
      showToast('অর্ডারটি তালিকা থেকে মুছে ফেলা হয়েছে।', 'warn');
      renderApp();
    }

    // ==========================================
    function renderKarigorLedger() {
      const karigorStats = (state.karigors || []).map((k, idx) => {
        let totalPieces = 0;
        let totalEarned = 0;
        state.orders.forEach((ord) => {
          (ord.items || []).forEach((it) => {
            if (it.type === 'tailor') {
              const assigned = it.karigorName || state.karigors[0]?.name;
              if (assigned === k.name || (idx === 0 && !it.karigorName)) {
                totalPieces += Number(it.qty || 1);
                totalEarned += Number(it.karigorFee || 0) * Number(it.qty || 1);
              }
            }
          });
        });
        const paid = Number(k.paid || 0);
        const payable = Math.max(0, totalEarned - paid);
        return { ...k, totalPieces, totalEarned, paid, payable };
      });

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-slate-200 flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-extrabold text-slate-900">🪡 কারিগর ও মাস্টার হিসাব খাতা</h2>
              <p class="text-xs text-slate-500">প্রতিটি সেলাই অর্ডার থেকে কারিগরের পিস ও মজুরি স্বয়ংক্রিয়ভাবে হিসাব হয়</p>
            </div>
            <button type="button" onclick="openAddKarigorModal()" class="px-4 py-2 rounded-xl bg-emerald-700 text-white text-xs font-extrabold cursor-pointer">+ নতুন কারিগর যোগ</button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            ${karigorStats.map((k) => `
              <div class="bg-white rounded-2xl p-4 border border-slate-200 space-y-2.5 text-xs">
                <div>
                  <div class="font-extrabold text-sm text-slate-900">${k.name}</div>
                  <div class="text-slate-500">${k.role || 'কারিগর'} • 📞 ${k.phone || '-'}</div>
                </div>
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                  <div class="flex justify-between"><span>মোট সেলাই কাজ:</span><b>${toBnNum(k.totalPieces)} পিস</b></div>
                  <div class="flex justify-between"><span>মোট অর্জিত মজুরি:</span><b>${formatTk(k.totalEarned)}</b></div>
                  <div class="flex justify-between"><span>পরিশোধিত:</span><b class="text-emerald-700">${formatTk(k.paid)}</b></div>
                  <div class="flex justify-between border-t pt-1 font-extrabold"><span>বর্তমান পাওনা:</span><span class="text-rose-600">${formatTk(k.payable)}</span></div>
                </div>
                <button type="button" onclick="openPayKarigorModal('${k.id}', ${k.payable})" class="w-full py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold cursor-pointer">

                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      e.preventDefault();
      const date = document.getElementById('exp-date')?.value;
      const title = document.getElementById('exp-title')?.value.trim();
      const amount = Number(document.getElementById('exp-amount')?.value || 0);
      if (!title || amount <= 0) return;

      state.expenses.unshift({ id: 'EXP-' + Date.now(), date, title, amount });
      persistState();
      showToast('দৈনিক খরচ যুক্ত হয়েছে!', 'success');
      renderApp();
    }

    function deleteExpenseRecord(expId) {
      state.expenses = state.expenses.filter(x => x.id !== expId);
      persistState();
      showToast('খরচ এন্ট্রি মুছে ফেলা হয়েছে।', 'warn');
      renderApp();
    }

    function renderStockManagement() {
      const totalProductsQty = state.inventory.filter(i => i.category === 'Product').reduce((s, i) => s + Number(i.stock || 0), 0);

      const list = state.inventory.filter((i) => {
        if (f === 'LOW') return Number(i.stock || 0) <= Number(i.minStock || 5);

    function uploadInventoryPhoto(event, invId) {
      const file = event.target.files?.[0];
      if (!file) return;
      const item = state.inventory.find((i) => i.id === invId);
      if (!item) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxSide = 220;
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; } }
          else { if (h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; } }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          item.image = canvas.toDataURL('image/jpeg', 0.75);
          persistState();
          showToast(`${item.name}-এর ছবি যুক্ত হয়েছে!`, 'success');
          renderApp();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitCustomerDueCollection(e, custId) {
      e.preventDefault();
      const cust = state.customers.find(c => c.id === custId);
      if (!cust) return;
      let payAmt = Number(document.getElementById('cust-due-pay')?.value || 0);
      if (payAmt <= 0) return;

      cust.due = Math.max(0, Number(cust.due || 0) - payAmt);
      state.orders.forEach(o => {
        if (payAmt <= 0) return;
        if ((cust.phone && cust.phone !== 'N/A' && o.customerPhone === cust.phone) || o.customerName === cust.name) {
          const bd = calculateFinancials([o]).orderBreakdown[0];
          if (bd.due > 0) {
            const apply = Math.min(bd.due, payAmt);
            o.paidAmount = Number(o.paidAmount || 0) + apply;
            payAmt -= apply;
          }
        }
      });

      persistState();
      closeModal();
      showToast('বকেয়া আদায় সফল হয়েছে!', 'success');
      renderApp();

    function uploadGarmentPhoto(event, garmentId) {
      const file = event.target.files?.[0];
      if (!file) return;
      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxSide = 220;
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; } }
          else { if (h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; } }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          grm.image = canvas.toDataURL('image/jpeg', 0.75);
          persistState();
          showToast(`${grm.name}-এর ছবি সেভ হয়েছে!`, 'success');
          renderApp();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

              <div style="font-size: 20px; font-weight: 800;">${state.shop.nameBn}</div>
              <div style="font-size: 11px;">${state.shop.address} • মোবাইল: ${state.shop.phones}</div>
              <div style="margin-top: 4px; display: inline-block; background: #064e3b; color: #fde047; padding: 2px 12px; border-radius: 4px; font-size: 12px; font-weight: 800;">
                ${titleMap[mode] || titleMap.ALL}
              </div>
            </div>
            <div style="text-align: right; font-size: 10px; font-weight: 700;">
              প্রিন্ট তারিখ:<br/>${formatDateNice(new Date().toISOString())}
            </div>
          </div>

          <div style="background: #f1f5f9; border: 1px solid #94a3b8; border-radius: 4px; padding: 6px 10px; font-size: 12px; font-weight: 800; margin-bottom: 12px; display: flex; justify-content: space-between;">
            <span>সময়কাল: ${periodLabel}</span>
            <span>মোট অর্ডার সংখ্যা: ${toBnNum(filteredOrders.length)} টি</span>
          </div>

          ${tailorSectionHtml}
          ${fabricsSectionHtml}
          ${partnersSectionHtml}

          <div style="margin-top: 28px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 700;">
            <div style="border-top: 1px solid #000; padding-top: 4px; width: 150px; text-align: center;">হিসাবরক্ষক / ক্যাশিয়ার</div>
            <div style="border-top: 1px solid #000; padding-top: 4px; width: 170px; text-align: center;">মাস্টার অ্যাডমিন স্বাক্ষর</div>
          </div>
        </div>
      `;

      const printArea = document.getElementById('print-area');
      if (printArea) {
        printArea.innerHTML = reportHtml;
        printArea.classList.remove('hidden');
      }

      const modalHtml = `
        <div class="px-4 py-3 border-b border-slate-200 royal-gradient text-white flex items-center justify-between">
          <h3 class="text-sm font-extrabold text-amber-300">${titleMap[mode] || 'রিপোর্ট প্রিভিউ'}</h3>
          <div class="flex items-center gap-2">
            <button type="button" onclick="window.print()" class="px-4 py-1.5 rounded-xl bg-amber-400 text-slate-950 font-extrabold text-xs cursor-pointer">🖨️ এখনই প্রিন্ট করুন</button>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-white/10 text-white cursor-pointer">✕</button>
          </div>
        </div>
        <div class="p-3 bg-slate-200 max-h-[80vh] overflow-y-auto">
          <div class="bg-white shadow-md mx-auto max-w-[210mm]">
            ${reportHtml}
          </div>
        </div>
      `;
      openModal(modalHtml, 'max-w-4xl');
    }

    function renderSettings() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <form onsubmit="saveShopSettingsForm(event)" class="bg-white rounded-2xl p-5 border border-slate-200 space-y-3 text-xs">
            <h3 class="text-sm font-extrabold text-slate-900 border-b pb-2">🏪 শোরুম ও মেমো সেটিংস</h3>
            <div>
              <label class="block font-bold text-slate-700 mb-1">প্রতিষ্ঠানের নাম (বাংলা)</label>
              <input id="set-shop-bn" type="text" value="${state.shop.nameBn}" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">শোরুমের ঠিকানা</label>
              <input id="set-shop-addr" type="text" value="${state.shop.address}" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">মোবাইল নম্বরসমূহ</label>
              <input id="set-shop-phones" type="text" value="${state.shop.phones}" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">মেমোর শর্তাবলী নোট</label>
              <textarea id="set-shop-notice" rows="4" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold">${state.shop.memoNotice}</textarea>
            </div>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ সেটিংস সেভ করুন</button>
          </form>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 space-y-4 text-xs">
            <h3 class="text-sm font-extrabold text-slate-900 border-b pb-2">☁️ অফলাইন ও অটো-ব্যাকআপ ম্যানেজমেন্ট</h3>
            <div class="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 space-y-1">
              <div class="font-extrabold text-emerald-900">সর্বশেষ সিঙ্ক ও ব্যাকআপ: ${state.lastSyncedAt}</div>
              <p class="text-slate-600">অফলাইনে করা সব কাজ ফোনে সেভ থাকে এবং ইন্টারনেট সংযোগ পেলেই অটোমেটিক সিঙ্ক হয়ে যায়।</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="downloadJsonBackup()" class="px-4 py-2.5 rounded-xl bg-slate-900 text-amber-300 font-extrabold cursor-pointer">⬇️ ব্যাকআপ ডাউনলোড (JSON)</button>
              <label class="px-4 py-2.5 rounded-xl bg-amber-100 text-amber-950 border border-amber-300 font-extrabold cursor-pointer">
                ⬆️ ব্যাকআপ ফাইল রিস্টোর
                <input type="file" accept=".json" onchange="restoreJsonBackup(event)" class="hidden" />
              </label>
            </div>
          </div>
        </div>
      `;
    }

    function saveShopSettingsForm(e) {
      e.preventDefault();
      state.shop.nameBn = document.getElementById('set-shop-bn')?.value.trim() || state.shop.nameBn;
      state.shop.address = document.getElementById('set-shop-addr')?.value.trim() || state.shop.address;
      state.shop.phones = document.getElementById('set-shop-phones')?.value.trim() || state.shop.phones;
      state.shop.memoNotice = document.getElementById('set-shop-notice')?.value || state.shop.memoNotice;
      persistState();
      showToast('শোরুম ও মেমো সেটিংস সেভ হয়েছে!', 'success');
      renderApp();
    }

    function downloadJsonBackup() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement('a');
      a.setAttribute('href', dataStr);
      a.setAttribute('download', `Al_Karim_ERP_Backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('সম্পূর্ণ ব্যাকআপ ফাইল ডাউনলোড হয়েছে!', 'success');
    }

    function restoreJsonBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (imported && imported.shop && Array.isArray(imported.inventory)) {
            state = { ...state, ...imported };
            persistState();
            showToast('ব্যাকআপ সফলভাবে রিস্টোর হয়েছে!', 'success');
            renderApp();
          } else {
            showToast('সঠিক ব্যাকআপ ফাইল নয়!', 'warn');
          }
        } catch (err) {
          showToast('ফাইল পড়তে সমস্যা হয়েছে!', 'warn');
        }
      };
      reader.readAsText(file);
    }

    // ==========================================
    // 11. MAIN SHELL & CLEAN NAVIGATION
    // ==========================================
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      const isOnline = typeof navigator !== 'undefined' ? navigator.onLine !== false : true;

      const navGroups = [
        {
          title: 'প্রধান মেনু',
          items: [
            { id: 'dashboard', label: 'ড্যাশবোর্ড', icon: '🏠' },
            { id: 'new-order', label: 'নতুন অর্ডার', icon: '➕' },
            { id: 'orders', label: 'অর্ডার তালিকা', icon: '📋' },
            { id: 'menu-hub', label: 'মেনু হাব', icon: '🎛️' }
          ]
        },
        {
          title: 'স্টক, প্রোডাক্ট ও মাপ',
          items: [
            { id: 'stock', label: 'স্টক (Stock)', icon: '📦' },
            { id: 'products', label: `প্রোডাক্ট (${toBnNum(state.inventory.filter(i => i.category === 'Product').length)})`, icon: '🧢' },
            { id: 'fabrics', label: `ফেব্রিক্স (${toBnNum(state.inventory.filter(i => i.category === 'Fabrics').length)})`, icon: '🧵' },
            { id: 'services', label: 'পোশাক ও মাপ', icon: '✂️' }
          ]
        },
        {
          title: 'হিসাব ও সেটিংস',
          items: [
            { id: 'karigors', label: 'কারিগর হিসাব', icon: '🪡' },
            { id: 'expenses', label: 'দৈনিক খরচ', icon: '💸' },
            { id: 'customers', label: 'কাস্টমার খাতা', icon: '👥' },
            { id: 'purchases', label: 'ক্রয় ও সাপ্লায়ার', icon: '🚚' },
            { id: 'reports', label: 'রিপোর্ট ও লাভ', icon: '📊' },
            { id: 'settings', label: 'সেটিংস ও ব্যাকআপ', icon: '⚙️' }
          ]
        }
      ];

      const currentTitleMap = {
        dashboard: 'ড্যাশবোর্ড',
        'new-order': editingOrderId ? `মেমো এডিট (#${editingOrderId.replace('ORD-', '')})` : 'নতুন অর্ডার',
        orders: 'অর্ডার তালিকা',
        'menu-hub': 'সব মেনু হাব',
        stock: 'স্টক ম্যানেজমেন্ট',
        products: 'প্রোডাক্ট তালিকা',
        fabrics: 'ফেব্রিক্স তালিকা',
        services: 'পোশাক ও মাপ সেটআপ',
        karigors: 'কারিগর ও মাস্টার হিসাব',
        expenses: 'দৈনিক খরচ খাতা',
        customers: 'কাস্টমার খাতা',
        purchases: 'ক্রয় ও সাপ্লায়ার',
        reports: 'রিপোর্ট ও লাভ',
        settings: 'সেটিংস ও ব্যাকআপ'
      };

      let pageContent = '';
      switch (state.activeTab) {
        case 'dashboard': pageContent = renderDashboard(); break;
        case 'menu-hub': pageContent = renderMenuHub(); break;
        case 'new-order': pageContent = renderNewOrder(); break;
        case 'orders': pageContent = renderOrdersList(); break;
        case 'stock': pageContent = renderStockManagement(); break;
        case 'products': pageContent = renderInventory('Product'); break;
        case 'fabrics': pageContent = renderInventory('Fabrics'); break;
        case 'services': pageContent = renderServicesAndMeasurements(); break;
        case 'karigors': pageContent = renderKarigorLedger(); break;
        case 'expenses': pageContent = renderExpensesBook(); break;
        case 'customers': pageContent = renderCustomers(); break;
        case 'purchases': pageContent = renderPurchasesAndSuppliers(); break;
        case 'reports': pageContent = renderReports(); break;
        case 'settings': pageContent = renderSettings(); break;
        default: pageContent = renderDashboard();
      }

      const sidebarHtml = `
        <div class="flex flex-col h-full royal-gradient text-white">
          <div class="p-4 border-b border-white/10 flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-[#fdf8e8] border border-amber-300 p-0.5 shrink-0">
              ${getRoyalBrandLogoSvg('side')}
            </div>
            <div class="min-w-0">
              <div class="font-extrabold text-xs text-amber-300 truncate">${state.shop.nameBn}</div>
              <div class="text-[10px] text-emerald-200 truncate">বাকেরগঞ্জ, বরিশাল</div>
            </div>
          </div>

          <div class="flex-1 overflow-y-auto p-3 space-y-4">
            ${navGroups.map((grp) => `
              <div>
                <div class="px-2.5 text-[10px] font-extrabold uppercase tracking-wider text-amber-300/80 mb-1.5">${grp.title}</div>
                <div class="space-y-1">
                  ${grp.items.map((item) => {
                    const active = state.activeTab === item.id;
                    return `
                      <button type="button" onclick="${item.id === 'new-order' ? 'startFreshNewOrder()' : `navigateToTab('${item.id}')`}" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-bold transition cursor-pointer ${active ? 'bg-amber-400 text-slate-950 font-extrabold shadow-sm' : 'text-emerald-50 hover:bg-white/10'}">
                        <span>${item.icon}</span>
                        <span class="truncate">${item.label}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="p-3 border-t border-white/10 text-[11px]">
            <div class="p-2.5 rounded-xl bg-black/25 border border-white/10 flex items-center justify-between">
              <span class="flex items-center gap-1.5 font-bold ${isOnline ? 'text-emerald-300' : 'text-amber-300'}">
                <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-amber-400'}"></span>
                ${isOnline ? 'অনলাইন সিঙ্ক' : 'অফলাইন মোড'}
              </span>
              <button type="button" onclick="syncCloudBackupNow(false); renderApp();" class="text-[10px] underline text-amber-200 font-bold cursor-pointer">সিঙ্ক (${state.lastSyncedAt})</button>
            </div>
          </div>
        </div>
      `;

      root.innerHTML = `
        <div class="min-h-screen flex bg-slate-100">
          <!-- Desktop Sidebar -->
          <aside class="hidden lg:block w-64 shrink-0 sticky top-0 h-screen shadow-xl z-30">
            ${sidebarHtml}
          </aside>

          <!-- Mobile Drawer -->
          ${state.mobileDrawerOpen ? `
            <div class="fixed inset-0 z-50 lg:hidden flex">
              <div class="fixed inset-0 bg-slate-950/60" onclick="state.mobileDrawerOpen=false; renderApp();"></div>
              <div class="relative w-64 max-w-[80vw] h-full z-10 shadow-2xl">
                ${sidebarHtml}
              </div>
            </div>
          ` : ''}

          <!-- Main Content -->
          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-20 bg-white border-b border-slate-200 px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <button type="button" onclick="state.mobileDrawerOpen = !state.mobileDrawerOpen; renderApp();" class="lg:hidden p-2 rounded-xl bg-emerald-900 text-amber-300 font-extrabold cursor-pointer">
                  ☰
                </button>
                <h1 class="text-sm sm:text-base font-extrabold text-slate-900 truncate">${currentTitleMap[state.activeTab] || 'ড্যাশবোর্ড'}</h1>
              </div>

              <div class="flex items-center gap-2 shrink-0">
                ${state.activeTab !== 'new-order' ? `
                  <button type="button" onclick="startFreshNewOrder()" class="px-3.5 py-1.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold cursor-pointer">
                    + নতুন অর্ডার
                  </button>
                ` : `
                  <button type="button" onclick="navigateToTab('dashboard')" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-extrabold cursor-pointer">
                    🏠 ড্যাশবোর্ড
                  </button>
                `}
              </div>
            </header>

            <main class="flex-1 p-3 sm:p-5 max-w-7xl w-full mx-auto">
              ${pageContent}
            </main>
          </div>
        </div>
      `;
    }

    function navigateToTab(tabId) {
      state.activeTab = tabId;
      state.mobileDrawerOpen = false;
      renderApp();
    }

    window.addEventListener('online', () => {
      showToast('ইন্টারনেট সংযুক্ত হয়েছে — অটো ব্যাকআপ সিঙ্ক হচ্ছে...', 'success');
      syncCloudBackupNow(true);
      renderApp();
    });

    window.addEventListener('offline', () => {
      showToast('অফলাইন মোড চালু — সব কাজ ফোনে সেভ থাকবে।', 'warn');
      renderApp();
    });

    function initAppBoot() {
      try {
        renderApp();
      } catch (err) {
        const root = document.getElementById('app-root');
        if (root) {
          root.innerHTML = `<div class="p-6 m-4 rounded-2xl bg-rose-50 border border-rose-300 text-rose-800 text-sm font-bold">রেন্ডার ত্রুটি: ${err.message}</div>`;
        }
      }
    }

    initAppBoot();
    window.addEventListener('DOMContentLoaded', initAppBoot);
    window.addEventListener('load', initAppBoot);
  </script>
</body>
</html>
