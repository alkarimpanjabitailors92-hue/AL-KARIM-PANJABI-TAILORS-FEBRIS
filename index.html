    function toBnNum(val) {
      const bn = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return String(val ?? '').replace(/\d/g, (d) => bn[d]);
    }
    function formatTk(num) {
      return '৳' + toBnNum(Number(num || 0).toLocaleString('en-US'));

    function formatDateNice(iso) {
      if (!iso) return '-';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleDateString('bn-BD', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch (e) { return iso; }
    }

    function attemptSwitchAdminRole(role, userId) {
      if (role === 'KARIGOR') {

        state.auth.activeUserName = 'কারিগর ও কমপ্লিট টিম';

        if (!['orders', 'karigor'].includes(state.activeTab)) state.activeTab = 'orders';

        return;
      }
      const list = role === 'MASTER' ? (state.auth?.masterAdmins || []) : (state.auth?.managerAdmins || []);
      const userObj = list.find((u) => u.id === userId) || list[0];
      if (!userObj) return;

    function verifyRolePinAndSwitch(e, role, userId) {
      e.preventDefault();
      const list = role === 'MASTER' ? (state.auth?.masterAdmins || []) : (state.auth?.managerAdmins || []);
      const userObj = list.find((u) => u.id === userId);
      const entered = (document.getElementById('role-switch-pin')?.value || '').trim();
      if (!userObj || entered !== String(userObj.pin).trim()) {
        showToast('ভুল পিন দেওয়া হয়েছে!', 'warn');
        return;

      finalizeAdminRoleSwitch(role, userObj);

    function finalizeAdminRoleSwitch(role, userObj) {
      state.auth.currentRole = role;
      state.auth.activeUserName = userObj.name;

        state.activeTab = 'new-order';

      persistState();
      closeModal();

    function getDeliveryUrgencyInfo(ord) {
      if (!ord.deliveryDate || ord.status === 'Delivered' || ord.status === 'Ready') {
        return { daysLeft: 999, badgeHtml: '' };
      }
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const deliv = new Date(ord.deliveryDate);
      deliv.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((deliv - today) / 86400000);
      if (diffDays < 0) return { daysLeft: diffDays, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-extrabold">🔥 মেয়াদোত্তীর্ণ (${toBnNum(Math.abs(diffDays))} দিন)</span>` };
      if (diffDays === 0) return { daysLeft: 0, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-extrabold">⚠️ আজই ডেলিভারি</span>` };
      if (diffDays <= 3) return { daysLeft: diffDays, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 text-[10px] font-extrabold">🔥 জরুরি কাটিং — আর ${toBnNum(diffDays)} দিন বাকি</span>` };
      return { daysLeft: diffDays, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 text-[10px] font-bold">আর ${toBnNum(diffDays)} দিন</span>` };
    }

    function sortOrdersByUrgency(ordersList) {
      return [...ordersList].sort((a, b) => {
        const aActive = a.status !== 'Delivered' && a.status !== 'Ready';
        const bActive = b.status !== 'Delivered' && b.status !== 'Ready';
        if (aActive && !bActive) return -1;
        if (!aActive && bActive) return 1;
        if (aActive && bActive) {
          const da = a.deliveryDate ? new Date(a.deliveryDate).getTime() : Number.MAX_SAFE_INTEGER;
          const db = b.deliveryDate ? new Date(b.deliveryDate).getTime() : Number.MAX_SAFE_INTEGER;
          if (da !== db) return da - db;
        }
        return new Date(b.createdAt || b.orderDate || 0) - new Date(a.createdAt || a.orderDate || 0);
      });
    }

    function calculateFinancials(ordersSubset = state.orders) {
      let tailorSales = 0, retailSales = 0, retailCogs = 0, karigorWageTotal = 0, totalCollected = 0, totalDue = 0;
      const orderBreakdown = [];

      (ordersSubset || []).forEach((ord) => {
        let subTailor = 0, subRetail = 0, ordCogs = 0, ordWage = 0;
        (ord.items || []).forEach((it) => {
          const qty = Number(it.qty || 1);
          const lineTotal = Number(it.price || 0) * qty;
          if (it.type === 'tailor') {
            subTailor += lineTotal;
            ordWage += (Number(it.karigorFee || 0) + Number(it.completeFee || 0)) * qty;
          } else {
            subRetail += lineTotal;
            const invItem = state.inventory.find((x) => x.id === it.refId);
            const costUnit = Number(it.costPrice ?? invItem?.costPrice ?? 0);
            ordCogs += costUnit * qty;
          }
        });
        const disc = Number(ord.discount || 0);
        const netTotal = Math.max(0, subTailor + subRetail - disc);
        const paid = Number(ord.paidAmount || 0);
        const due = Math.max(0, netTotal - paid);

        tailorSales += subTailor;
        retailSales += subRetail;
        retailCogs += ordCogs;
        karigorWageTotal += ordWage;
        totalCollected += paid;
        totalDue += due;
        orderBreakdown.push({ orderId: ord.id, subTailor, subRetail, netTotal, paid, due });
      });

      const totalExpenses = (state.expenses || []).reduce((s, e) => s + Number(e.amount || 0), 0);
      const netProfit = Math.max(0, (tailorSales - karigorWageTotal) + (retailSales - retailCogs) - totalExpenses);

      return { tailorSales, retailSales, retailCogs, karigorWageTotal, totalCollected, totalDue, totalExpenses, netProfit, orderBreakdown };
    }

    function buildWhatsAppOrderUrl(ord) {
      const cleanPhone = String(ord.customerPhone || '').replace(/\D/g, '');
      if (!cleanPhone) return '';
      const intlPhone = cleanPhone.startsWith('88') ? cleanPhone : '88' + cleanPhone;
      const bd = calculateFinancials([ord]).orderBreakdown[0];
      const msg = `আসসালামু আলাইকুম ${ord.customerName},\n${state.shop.nameBn}-এ আপনার অর্ডার #${ord.id.replace('ORD-', '')} গৃহীত হয়েছে।\nডেলিভারি তারিখ: ${formatDateNice(ord.deliveryDate)}\nমোট বিল: ${formatTk(bd.netTotal)} | জমা: ${formatTk(ord.paidAmount)} | বাকি: ${formatTk(bd.due)}। ধন্যবাদ!`;
      return `https://wa.me/${intlPhone}?text=${encodeURIComponent(msg)}`;
    }

      const masterPin = (state.auth?.masterAdmins?.[0]?.pin || state.shop.adminPin || '').trim();
      if (masterPin && !adminPinUnlocked) {
        return `
          <div class="max-w-md mx-auto bg-white rounded-2xl p-6 border border-slate-200 shadow-sm text-center space-y-4">

            </div>
            <form onsubmit="unlockReportsWithPin(event)" class="space-y-3">
              <input id="rep-pin-inp" type="password" inputmode="numeric" required placeholder="****" class="w-full px-4 py-2.5 rounded-xl border-2 border-emerald-500 text-center text-lg font-extrabold tracking-widest outline-none" />

            </form>
          </div>
        `;
      }

      const filteredOrders = state.orders.filter((o) => {
        const dStr = String(o.orderDate || o.createdAt || '').slice(0, 10);
        if (reportFromDate && dStr < reportFromDate) return false;
        if (reportToDate && dStr > reportToDate) return false;
        return true;
      });
      const filteredExpenses = (state.expenses || []).filter((e) => {
        const dStr = String(e.date || '').slice(0, 10);
        if (reportFromDate && dStr < reportFromDate) return false;
        if (reportToDate && dStr > reportToDate) return false;
        return true;
      });

      const fin = calculateFinancials(filteredOrders);
      const periodExpenses = filteredExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
      const tailorNetProfit = Math.max(0, fin.tailorSales - fin.karigorWageTotal);
      const retailGrossProfit = Math.max(0, fin.retailSales - fin.retailCogs);
      const retailNetProfit = Math.max(0, retailGrossProfit - (reportDeductExpFromRetail ? periodExpenses : 0));
      const grandNetProfit = Math.max(0, tailorNetProfit + retailNetProfit - (!reportDeductExpFromRetail ? periodExpenses : 0));

      const sectorOptions = [
        { key: 'TAILOR', icon: '✂️', title: 'টেইলার্স মজুরি লাভ', desc: 'শুধুমাত্র সেলাই আয় ও কারিগর মজুরি বাদে নিট লাভ' },

      ];

    function startFreshNewOrder() {
      editingOrderId = null;
      cartItems = [];
      const todayStr = new Date().toISOString().split('T')[0];
      const nextWeek = new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0];
      state.orderForm = { orderDate: todayStr, deliveryDate: nextWeek, customerPhone: '', customerName: '', customerAddress: '', discount: 0, paidAmount: 0, paymentMethod: 'Cash' };
      navigateToTab('new-order');
    }

    function handleCustomerPhoneLookup(phoneVal) {
      state.orderForm.customerPhone = phoneVal;
      const clean = phoneVal.trim();
      const banner = document.getElementById('returning-cust-banner');
      if (clean.length >= 6) {
        const cust = state.customers.find((c) => c.phone === clean);
        const pastOrd = state.orders.find((o) => o.customerPhone === clean && (o.items || []).some((it) => it.type === 'tailor'));
        if (cust) {
          state.orderForm.customerName = cust.name || state.orderForm.customerName;
          state.orderForm.customerAddress = cust.address || state.orderForm.customerAddress;
          const nInp = document.getElementById('ord-cust-name');
          const aInp = document.getElementById('ord-cust-addr');
          if (nInp) nInp.value = state.orderForm.customerName;
          if (aInp) aInp.value = state.orderForm.customerAddress;
        }
        if (banner) {
          if (pastOrd) {
            banner.classList.remove('hidden');
            banner.innerHTML = `
              <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-amber-100 border border-amber-300 text-amber-950 text-xs font-extrabold">
                <span>✨ পুরানো কাস্টমার শনাক্ত হয়েছে! আগের মাপ লোড করবেন?</span>
                <button type="button" onclick="loadPreviousMeasurementsByPhone('${clean}')" class="px-3 py-1 rounded-lg bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">📏 আগের মাপ আনুন</button>
              </div>
            `;
          } else {
            banner.classList.add('hidden');
          }
        }
      } else if (banner) {
        banner.classList.add('hidden');
      }
    }

    function loadPreviousMeasurementsByPhone(phone) {
      const pastOrd = state.orders.find((o) => o.customerPhone === phone && (o.items || []).some((it) => it.type === 'tailor'));
      if (!pastOrd) return;
      const pastTailors = (pastOrd.items || []).filter((it) => it.type === 'tailor');
      pastTailors.forEach((it) => {
        cartItems.push({
          ...JSON.parse(JSON.stringify(it)),
          uid: 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
          cuttingDone: false,
          sewingDoneBy: '',
          completeDoneBy: ''
        });
      });
      showToast('পূর্বের অর্ডারের সেলাই মাপ কার্টে যুক্ত হয়েছে!', 'success');
      renderApp();
    }

    function submitGarmentToCart(e, garmentId, editCartUid) {
      e.preventDefault();
      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;
      const existing = editCartUid ? cartItems.find((c) => c.uid === editCartUid) : null;

      const qty = Math.max(1, Number(document.getElementById('grm-qty')?.value || 1));
      const price = Number(document.getElementById('grm-price')?.value || grm.price);
      const karigorFee = Number(document.getElementById('grm-kfee')?.value || grm.karigorFee);
      const completeFee = Number(grm.completeFee || 30);
      const linkedFabric = document.getElementById('grm-linked-fabric')?.value || '';
      const extraNote = (document.getElementById('grm-extra-note')?.value || '').trim();
      const tagNote = (document.getElementById('grm-tag-note')?.value || '').trim();

      const measurements = {};
      document.querySelectorAll('.grm-meas-field').forEach((inp) => {
        measurements[inp.getAttribute('data-field')] = inp.value.trim();
      });

      const selectedDesigns = [];
      document.querySelectorAll('.grm-design-chk:checked').forEach((chk) => {
        selectedDesigns.push(chk.value);
      });

      const designNotes = [...selectedDesigns, extraNote].filter(Boolean).join(', ');

      const itemObj = {
        uid: editCartUid || 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        type: 'tailor',
        refId: grm.id,
        name: grm.name,
        qty,
        price,
        karigorFee,
        completeFee,
        cuttingDone: existing ? Boolean(existing.cuttingDone) : false,
        sewingDoneBy: existing ? (existing.sewingDoneBy || '') : '',
        completeDoneBy: existing ? (existing.completeDoneBy || '') : '',
        linkedFabric,
        measurements,
        selectedDesigns,
        extraNote,
        tagNote,
        designNotes
      };

      if (editCartUid) {
        const idx = cartItems.findIndex((c) => c.uid === editCartUid);
        if (idx !== -1) cartItems[idx] = itemObj;
      } else {
        cartItems.push(itemObj);
      }

      closeModal();
      showToast(`${grm.name} কার্টে যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function confirmAndSaveOrder() {
      const phone = (state.orderForm.customerPhone || '').trim();
      const name = (state.orderForm.customerName || '').trim();
      const deliv = state.orderForm.deliveryDate;
      if (!phone || !name || !deliv) {
        showToast('দয়া করে কাস্টমারের মোবাইল নম্বর, নাম এবং ডেলিভারি তারিখ দিন!', 'warn');
        return;
      }
      if (cartItems.length === 0) {
        showToast('কার্টে অন্তত একটি আইটেম যোগ করুন!', 'warn');
        return;
      }

      const fin = calculateFinancials([{ items: cartItems, discount: state.orderForm.discount, paidAmount: state.orderForm.paidAmount }]);
      const bd = fin.orderBreakdown[0];

      if (editingOrderId) {
        const idx = state.orders.findIndex((o) => o.id === editingOrderId);
        if (idx !== -1) {
          state.orders[idx] = {
            ...state.orders[idx],
            orderDate: state.orderForm.orderDate,
            deliveryDate: deliv,
            customerPhone: phone,
            customerName: name,
            customerAddress: state.orderForm.customerAddress || '',
            items: JSON.parse(JSON.stringify(cartItems)),
            discount: Number(state.orderForm.discount || 0),
            paidAmount: Number(state.orderForm.paidAmount || 0),
            paymentMethod: state.orderForm.paymentMethod || 'Cash'
          };
          const savedId = editingOrderId;
          editingOrderId = null;
          cartItems = [];
          persistState();
          showToast('অর্ডার সফলভাবে আপডেট হয়েছে!', 'success');
          printOrderMemo(savedId);
          navigateToTab('orders');
          return;
        }
      }

      const nextNum = 5655 + state.orders.length + 1;
      const newId = 'ORD-' + nextNum;

      cartItems.forEach((it) => {
        if (it.type !== 'tailor') {
          const inv = state.inventory.find((x) => x.id === it.refId);
          if (inv) inv.stock = Math.max(0, Number(inv.stock || 0) - Number(it.qty || 1));
        }
      });

      const existingCust = state.customers.find((c) => c.phone === phone);
      if (existingCust) {
        existingCust.name = name;
        existingCust.address = state.orderForm.customerAddress || existingCust.address;
        existingCust.due = Number(existingCust.due || 0) + Number(bd.due || 0);
      } else {
        state.customers.unshift({
          id: 'CUST-' + Date.now(),
          name,
          phone,
          address: state.orderForm.customerAddress || '',
          due: Number(bd.due || 0)
        });
      }

      state.orders.unshift({
        id: newId,
        orderDate: state.orderForm.orderDate,
        createdAt: new Date().toISOString(),
        deliveryDate: deliv,
        customerPhone: phone,
        customerName: name,
        customerAddress: state.orderForm.customerAddress || '',
        items: JSON.parse(JSON.stringify(cartItems)),
        discount: Number(state.orderForm.discount || 0),
        paidAmount: Number(state.orderForm.paidAmount || 0),
        paymentMethod: state.orderForm.paymentMethod || 'Cash',
        status: 'Cutting'
      });

      cartItems = [];
      persistState();
      showToast(`মেমো #${nextNum} সফলভাবে সেভ হয়েছে!`, 'success');

              }).join('');

    // ==========================================
    // 6. ORDERS LIST, WORKFLOW DONE & PAYMENT
    // ==========================================
    function markOrderCuttingDone(orderId) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      (ord.items || []).forEach((it) => { if (it.type === 'tailor') it.cuttingDone = true; });
      if ((ord.status || 'Cutting') === 'Cutting') ord.status = 'Sewing';
      persistState();
      showToast(`✂️ মেমো #${ord.id.replace('ORD-', '')} কাটিং ডান সম্পন্ন হয়েছে!`, 'success');
      renderApp();
    }

    function openSelfServiceDoneModal(orderId, stage) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const tailorItems = (ord.items || []).filter((it) => it.type === 'tailor');
      if (tailorItems.length === 0) {
        showToast('এই অর্ডারে কোনো সেলাই আইটেম নেই।', 'warn');
        return;
      }
      const isSewing = stage === 'SEWING';
      const title = isSewing ? '🪡 সুইং (সেলাই) কাজ শেষ — নিজের নাম বেছে নিন' : '✨ কমপ্লিট (ফিনিশিং) কাজ শেষ — নিজের নাম বেছে নিন';
      const pendingItems = tailorItems.filter((it) => (isSewing ? !it.sewingDoneBy : !it.completeDoneBy));
      const targetItems = pendingItems.length > 0 ? pendingItems : tailorItems;
      const totalPieces = targetItems.reduce((s, it) => s + Number(it.qty || 1), 0);
      const totalWage = targetItems.reduce((s, it) => s + Number(isSewing ? (it.karigorFee || 0) : (it.completeFee || 30)) * Number(it.qty || 1), 0);

      const html = `
        <div class="px-5 py-4 border-b border-slate-200 royal-gradient text-white flex items-center justify-between">
          <div>
            <h3 class="text-sm font-extrabold text-amber-300">${title}</h3>
            <p class="text-[11px] text-emerald-200">মেমো #${ord.id.replace('ORD-', '')} • কাস্টমার: ${ord.customerName} • মোট ${toBnNum(totalPieces)} পিস (${formatTk(totalWage)})</p>
          </div>
          <button type="button" onclick="closeModal()" class="p-1.5 text-white cursor-pointer">✕</button>
        </div>
        <div class="p-5 space-y-3 text-xs">
          ${pendingItems.length === 0 ? `
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-950 font-bold">
              ⚠️ এই অর্ডারের ${isSewing ? 'সুইং (সেলাই)' : 'কমপ্লিট'} কাজ ইতিমধ্যেই সম্পন্ন করা হয়েছে!
            </div>
          ` : `
            <div class="font-extrabold text-slate-800">যিনি কাজটি করেছেন, নিজের নামের ওপর ট্যাপ করুন (সরাসরি আপনার অ্যাকাউন্টে ${formatTk(totalWage)} জমা হবে):</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-64 overflow-y-auto">
              ${(state.karigors || []).map((k) => `
                <button type="button" onclick="confirmSelfServiceWorkerDone('${ord.id}', '${stage}', '${k.id}')" class="p-3 rounded-xl border-2 border-slate-200 hover:border-emerald-600 hover:bg-emerald-50 text-left transition flex items-center justify-between cursor-pointer">
                  <div>
                    <div class="font-extrabold text-sm text-slate-900">${k.name}</div>
                    <div class="text-[10px] text-slate-500">${k.workerType || 'কারিগর'}</div>
                  </div>
                  <span class="px-2.5 py-1 rounded-lg bg-emerald-700 text-white font-extrabold text-[11px]">✓ আমি করেছি</span>
                </button>
              `).join('')}
            </div>
          `}
        </div>
      `;
      openModal(html, 'max-w-lg');
    }

    function confirmSelfServiceWorkerDone(orderId, stage, karigorId) {
      const krg = (state.karigors || []).find((k) => k.id === karigorId);
      if (!krg) return;
      if (krg.pin && String(krg.pin).trim() !== '') {
        const html = `
          <div class="px-5 py-4 border-b border-slate-200 royal-gradient text-white flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-amber-30">🔒 কারিগর পিন দিন — ${krg.name}</h3>
            <button type="button" onclick="closeModal()" class="p-1.5 text-white cursor-pointer">✕</button>
          </div>
          <form onsubmit="verifyWorkerPinAndCredit(event, '${orderId}', '${stage}', '${krg.id}')" class="p-5 space-y-3 text-xs">
            <input id="worker-pin-inp" type="password" inputmode="numeric" required placeholder="****" class="w-full px-4 py-2.5 rounded-xl border-2 border-emerald-500 text-center text-lg font-extrabold tracking-widest outline-none" />
            <div class="flex justify-end gap-2">
              <button type="button" onclick="openSelfServiceDoneModal('${orderId}', '${stage}')" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">ফিরে যান</button>
              <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ নিশ্চিত করুন</button>
            </div>
          </form>
        `;
        openModal(html, 'max-w-sm');
        setTimeout(() => document.getElementById('worker-pin-inp')?.focus(), 20);
        return;
      }
      executeWorkerDoneAndCredit(orderId, stage, krg);
    }

    function verifyWorkerPinAndCredit(e, orderId, stage, karigorId) {
      e.preventDefault();
      const krg = (state.karigors || []).find((k) => k.id === karigorId);
      const entered = (document.getElementById('worker-pin-inp')?.value || '').trim();
      if (!krg || entered !== String(krg.pin).trim()) {
        showToast('ভুল কারিগর পিন দেওয়া হয়েছে!', 'warn');
        return;
      }
      executeWorkerDoneAndCredit(orderId, stage, krg);
    }

    function executeWorkerDoneAndCredit(orderId, stage, krg) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const isSewing = stage === 'SEWING';
      let creditedTotal = 0;

      (ord.items || []).forEach((it) => {
        if (it.type !== 'tailor') return;
        const qty = Number(it.qty || 1);
        if (isSewing && !it.sewingDoneBy) {
          const wage = Number(it.karigorFee || 0) * qty;
          it.cuttingDone = true;
          it.sewingDoneBy = krg.name;
          creditedTotal += wage;
          state.workLogs.unshift({
            id: 'LOG-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            date: new Date().toISOString(),
            orderId: ord.id,
            customerName: ord.customerName,
            garmentName: it.name,
            qty,
            stage: 'SEWING',
            workerName: krg.name,
            amount: wage
          });
        } else if (!isSewing && !it.completeDoneBy) {
          const compWage = Number(it.completeFee || 30) * qty;
          it.cuttingDone = true;
          it.completeDoneBy = krg.name;
          creditedTotal += compWage;
          state.workLogs.unshift({
            id: 'LOG-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            date: new Date().toISOString(),
            orderId: ord.id,
            customerName: ord.customerName,
            garmentName: it.name,
            qty,
            stage: 'COMPLETE',
            workerName: krg.name,
            amount: compWage
          });
        }
      });

      const tailorItems = (ord.items || []).filter((it) => it.type === 'tailor');
      if (isSewing && tailorItems.every((it) => it.sewingDoneBy) && ord.status !== 'Delivered') ord.status = 'Sewing';
      if (!isSewing && tailorItems.every((it) => it.completeDoneBy) && ord.status !== 'Delivered') ord.status = 'Ready';

      state.unreadSignals = Number(state.unreadSignals || 0) + 1;
      persistState();
      closeModal();
      showToast(`✓ ${krg.name}-এর অ্যাকাউন্টে ${formatTk(creditedTotal)} জমা হয়েছে এবং অ্যাডমিনের কাছে সংকেত পাঠানো হয়েছে!`, 'success');
      renderApp();
    }

    function renderOrdersList() {
      const q = (state.orderSearch || '').trim().toLowerCase();
      const st = state.orderStatusFilter || 'ALL';
      const filteredRaw = state.orders.filter((o) => {
        const matchQ = !q || o.id.toLowerCase().includes(q) || o.id.replace('ORD-', '').toLowerCase().includes(q) || (o.customerName || '').toLowerCase().includes(q) || (o.customerPhone || '').toLowerCase().includes(q);

        return matchQ && matchSt;

      return `

                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>

              </div>
              ${!isKarigorAdmin() ? `<button type="button" onclick="startFreshNewOrder()" class="px-4 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold shrink-0 cursor-pointer">+ নতুন অর্ডার</button>` : ''}

                ${['ALL', 'Cutting', 'Sewing', 'Ready', 'Delivered'].map((s) => {

                  const active = st === s;
                  return `<button type="button" onclick="state.orderStatusFilter='${s}'; renderApp();" class="px-3 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer ${active ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">${labels[s]}</button>`;
                }).join('')}
              </div>
              <span class="text-[11px] font-bold text-amber-800">⚡ ডেলিভারির ৩ দিন আগের জরুরি কাটিং অর্ডারগুলো সবার ওপরে সাজানো</span>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-extrabold">
                    <th class="p-3">মেমো ও অগ্রাধিকার</th>
                    <th class="p-3">কাস্টমার ও পোশাক</th>
                    <th class="p-3">প্রোডাকশন (কাটিং → সুইং → কমপ্লিট)</th>
                    ${!isKarigorAdmin() ? `<th class="p-3">বিল ও বাকি</th>` : ''}
                    <th class="p-3 text-right">অ্যাকশন</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${filtered.length === 0 ? `<tr><td colspan="5" class="p-8 text-center text-slate-400 font-semibold">কোনো অর্ডার পাওয়া যায়নি।</td></tr>` : filtered.map((ord) => {
                    const bd = calculateFinancials([ord]).orderBreakdown[0];
                    const waUrl = buildWhatsAppOrderUrl(ord);
                    const urg = getDeliveryUrgencyInfo(ord);
                    const tailorItems = (ord.items || []).filter((it) => it.type === 'tailor');
                    const allCutDone = tailorItems.length > 0 && tailorItems.every((it) => it.cuttingDone || it.sewingDoneBy || it.completeDoneBy);
                    const allSewDone = tailorItems.length > 0 && tailorItems.every((it) => it.sewingDoneBy);
                    const allCompDone = tailorItems.length > 0 && tailorItems.every((it) => it.completeDoneBy);
                    const sewWorkers = Array.from(new Set(tailorItems.map((it) => it.sewingDoneBy).filter(Boolean))).join(', ');
                    const compWorkers = Array.from(new Set(tailorItems.map((it) => it.completeDoneBy).filter(Boolean))).join(', ');

                    return `
                      <tr class="${urg.daysLeft <= 3 ? 'bg-amber-50/40' : ''} hover:bg-slate-50/80">
                        <td class="p-3">
                          <div class="flex flex-wrap items-center gap-1">
                            <span class="px-2 py-0.5 rounded-md bg-emerald-900 text-amber-300 font-extrabold">#${ord.id.replace('ORD-', '')}</span>
                            ${urg.badgeHtml}
                          </div>
                          <div class="text-[11px] font-bold text-slate-700 mt-1">ডেলিভারি: ${formatDateNice(ord.deliveryDate)}</div>
                        </td>
                        <td class="p-3">
                          <div class="font-extrabold text-slate-900">${ord.customerName}</div>
                          <div class="text-[11px] text-slate-500">${ord.customerPhone}</div>
                          <div class="text-[10px] font-bold text-emerald-800 mt-0.5">${tailorItems.map((t) => `${t.name} (x${toBnNum(t.qty)})`).join(', ')}</div>
                        </td>
                        <td class="p-3">
                          ${tailorItems.length === 0 ? `<span class="text-slate-400">শুধু কাপড়/পণ্য</span>` : `
                            <div class="flex flex-wrap gap-1.5">
                              <button type="button" onclick="markOrderCuttingDone('${ord.id}')" class="px-2.5 py-1 rounded-lg font-extrabold text-[11px] cursor-pointer ${allCutDone ? 'bg-slate-200 text-slate-700' : 'bg-amber-500 hover:bg-amber-600 text-slate-950'}">
                                ${allCutDone ? '✓ কাটিং ডান' : '✂️ কাটিং ডান দিন'}
                              </button>
                              <button type="button" onclick="openSelfServiceDoneModal('${ord.id}', 'SEWING')" class="px-2.5 py-1 rounded-lg font-extrabold text-[11px] cursor-pointer ${allSewDone ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-blue-600 hover:bg-blue-700 text-white'}">
                                ${allSewDone ? `✓ সুইং (${sewWorkers})` : '🪡 সুইং ডান'}
                              </button>
                              <button type="button" onclick="openSelfServiceDoneModal('${ord.id}', 'COMPLETE')" class="px-2.5 py-1 rounded-lg font-extrabold text-[11px] cursor-pointer ${allCompDone ? 'bg-purple-100 text-purple-900 border border-purple-300' : 'bg-emerald-700 hover:bg-emerald-800 text-white'}">
                                ${allCompDone ? `✓ কমপ্লিট (${compWorkers})` : '✨ কমপ্লিট ডান'}
                              </button>
                            </div>
                          `}
                        </td>
                        ${!isKarigorAdmin() ? `
                          <td class="p-3">
                            <div class="font-bold">মোট: ${formatTk(bd.netTotal)}</div>
                            <div class="text-[11px] font-extrabold ${bd.due > 0 ? 'text-rose-600' : 'text-emerald-700'}">বাকি: ${formatTk(bd.due)}</div>
                          </td>
                        ` : ''}
                        <td class="p-3 text-right">
                          <div class="inline-flex flex-wrap justify-end gap-1">
                            <button type="button" onclick="printOrderMemo('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-slate-900 text-amber-300 font-extrabold cursor-pointer">🖨️ মেমো</button>
                            ${!isKarigorAdmin() ? `
                              ${waUrl ? `<a href="${waUrl}" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-green-600 hover:bg-green-700 text-white font-extrabold">📲 WA</a>` : ''}
                              <button type="button" onclick="openOrderPaymentModal('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white font-extrabold cursor-pointer">৳ পেমেন্ট</button>
                            ` : ''}
                            ${isMasterAdmin() ? `
                              <select onchange="updateOrderStatus('${ord.id}', this.value)" class="px-2 py-1 rounded-lg border border-slate-300 font-bold text-[11px] bg-white">
                                ${['Cutting', 'Sewing', 'Ready', 'Delivered'].map((stOpt) => `<option value="${stOpt}" ${(ord.status || 'Cutting') === stOpt ? 'selected' : ''}>${stOpt}</option>`).join('')}
                              </select>
                              <button type="button" onclick="loadOrderIntoFullEditor('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-amber-100 text-amber-950 border border-amber-300 font-extrabold cursor-pointer">🔄 এডিট</button>
                              <button type="button" onclick="deleteOrderRecord('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold cursor-pointer">✕</button>
                            ` : ''}
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function loadOrderIntoFullEditor(orderId) {
      if (!requireMasterGuard('অর্ডার এডিট')) return;
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      editingOrderId = ord.id;
      cartItems = JSON.parse(JSON.stringify(ord.items || []));
      state.orderForm = {
        orderDate: ord.orderDate,
        deliveryDate: ord.deliveryDate,
        customerPhone: ord.customerPhone,
        customerName: ord.customerName,
        customerAddress: ord.customerAddress || '',
        discount: ord.discount || 0,
        paidAmount: ord.paidAmount || 0,
        paymentMethod: ord.paymentMethod || 'Cash'
      };
      navigateToTab('new-order');
    }

    function updateOrderStatus(orderId, newStatus) {
      if (!requireMasterGuard('স্ট্যাটাস পরিবর্তন')) return;
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      ord.status = newStatus;
      persistState();
      showToast(`অর্ডার স্ট্যাটাস "${newStatus}" করা হয়েছে`, 'success');
      renderApp();
    }

    function openOrderPaymentModal(orderId) {
      if (isKarigorAdmin()) { showToast('⛔ কারিগর প্যানেল থেকে পেমেন্ট নেওয়া যাবে না।', 'warn'); return; }
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const bd = calculateFinancials([ord]).orderBreakdown[0];
      const dueAmt = Number(bd?.due || 0);
      const html = `
        <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between royal-gradient text-white">
          <div>
            <h3 class="text-base font-extrabold text-amber-300">৳ পেমেন্ট জমা নিন — #${ord.id.replace('ORD-', '')}</h3>
            <p class="text-[11px] text-emerald-200">${ord.customerName} (${ord.customerPhone})</p>
          </div>
          <button type="button" onclick="closeModal()" class="p-1.5 text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="submitOrderPayment(event, '${ord.id}')" class="p-5 space-y-3 text-xs">
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="p-2.5 rounded-xl bg-slate-50 border"><div class="text-[10px] text-slate-500 font-bold">মোট বিল</div><div class="text-sm font-extrabold">${formatTk(bd.netTotal)}</div></div>
            <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200"><div class="text-[10px] text-emerald-700 font-bold">পূর্বের জমা</div><div class="text-sm font-extrabold text-emerald-800">${formatTk(ord.paidAmount)}</div></div>
            <div class="p-2.5 rounded-xl bg-rose-50 border border-rose-200"><div class="text-[10px] text-rose-700 font-bold">বর্তমান বাকি</div><div class="text-sm font-extrabold text-rose-700">${formatTk(dueAmt)}</div></div>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">নতুন জমার পরিমাণ (৳)</label>
            <input id="pay-modal-amount" type="number" min="1" value="${dueAmt > 0 ? dueAmt : ''}" required class="w-full px-3 py-2.5 rounded-xl border border-emerald-400 font-extrabold text-base outline-none" />
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">পেমেন্ট মাধ্যম</label>
            <select id="pay-modal-method" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold">
              <option value="Cash">Cash</option><option value="bKash">bKash</option><option value="Nagad">Nagad</option><option value="Bank">Bank</option>
            </select>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold cursor-pointer">✓ জমা নিশ্চিত করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-md');
    }

    function submitOrderPayment(e, orderId) {
      e.preventDefault();
      if (isKarigorAdmin()) return;
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const addPay = Number(document.getElementById('pay-modal-amount')?.value || 0);
      if (addPay <= 0) return;
      ord.paidAmount = Number(ord.paidAmount || 0) + addPay;
      ord.paymentMethod = document.getElementById('pay-modal-method')?.value || ord.paymentMethod || 'Cash';
      const cust = state.customers.find((c) => c.phone === ord.customerPhone);
      if (cust) cust.due = Math.max(0, Number(cust.due || 0) - addPay);
      persistState();
      closeModal();
      showToast(`${formatTk(addPay)} পেমেন্ট সফলভাবে জমা হয়েছে!`, 'success');
      renderApp();
    }

    function deleteOrderRecord(orderId) {
      if (!requireMasterGuard('অর্ডার ডিলিট')) return;
      state.orders = state.orders.filter((o) => o.id !== orderId);
      persistState();
      showToast('অর্ডারটি তালিকা থেকে মুছে ফেলা হয়েছে।', 'warn');
      renderApp();
    }

    function renderInventory(catFilter = 'ALL') {

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-slate-200 flex items-center justify-between">
            <div>
              <h2 class="text-base font-extrabold text-slate-900">${catFilter === 'Fabrics' ? '🧵 গজ কাপড় (Fabrics)' : catFilter === 'Product' ? '🧢 রেডিমেড প্রোডাক্ট' : '📦 সম্পূর্ণ স্টক তালিকা'}</h2>
              <p class="text-xs text-slate-500">কালার/ছবি গ্যালারি, দর এডিট ও কাট-পিস নোট পরিচালনা করুন</p>
            </div>
            <button type="button" onclick="openAddInventoryModal('${catFilter === 'Product' ? 'Product' : 'Fabrics'}')" class="px-4 py-2 rounded-xl bg-emerald-700 text-white text-xs font-extrabold cursor-pointer">+ নতুন যোগ করুন</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            ${list.map((it) => `
              <div class="bg-white rounded-2xl p-3.5 border border-slate-200 flex flex-col justify-between gap-2 text-xs">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2.5">
                    ${it.image ? `<img src="${it.image}" class="w-11 h-11 rounded-xl object-cover border" />` : `<span class="w-10 h-10 rounded-xl border flex items-center justify-center font-extrabold" style="background:${it.colorHex || '#f1f5f9'}">${it.category === 'Fabrics' ? '🧵' : '🧢'}</span>`}
                    <div>
                      <div class="font-extrabold text-slate-900">${it.name}</div>
                      <div class="text-[11px] text-slate-500">স্টক: <b>${toBnNum(it.stock)} ${it.unit}</b> • বিক্রয়: <b class="text-emerald-700">${formatTk(it.sellPrice)}</b></div>
                    </div>
                  </div>
                </div>
                ${it.cutPiecesNote ? `<div class="px-2.5 py-1 rounded-lg bg-amber-50 border border-amber-200 text-amber-900 font-bold text-[11px]">✂️ কাট-পিস: ${it.cutPiecesNote}</div>` : ''}
                <div class="flex gap-1.5 pt-1 border-t">
                  <button type="button" onclick="openInventoryGalleryModal('${it.id}')" class="flex-1 py-1.5 rounded-lg bg-purple-50 text-purple-900 border border-purple-200 font-extrabold cursor-pointer">🎨 কালার/ছবি</button>
                  <button type="button" onclick="openEditInventoryModal('${it.id}')" class="flex-1 py-1.5 rounded-lg bg-amber-100 text-amber-950 border border-amber-300 font-extrabold cursor-pointer">✏️ এডিট</button>
                  <button type="button" onclick="openCutPieceModal('${it.id}')" class="flex-1 py-1.5 rounded-lg bg-slate-100 text-slate-800 border font-extrabold cursor-pointer">✂️ কাট-পিস</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

          <h3 class="text-sm font-extrabold text-amber-300">🎨 কালার ও ছবি গ্যালারি — ${it.name}</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>

      const html = `

    function submitNewInventory(e) {
      e.preventDefault();
      const category = document.getElementById('new-inv-cat')?.value || 'Fabrics';
      const unit = document.getElementById('new-inv-unit')?.value || 'গজ';
      const name = document.getElementById('new-inv-name')?.value.trim();
      if (!name) return;
      state.inventory.unshift({
        id: 'INV-' + Date.now(),
        category,
        name,
        unit,
        stock: Number(document.getElementById('new-inv-stock')?.value || 0),
        costPrice: Number(document.getElementById('new-inv-cost')?.value || 0),
        sellPrice: Number(document.getElementById('new-inv-sell')?.value || 0),
        colorHex: '#e2e8f0',
        colorName: '',
        image: '',
        cutPiecesNote: ''
      });
      persistState();
      closeModal();
      showToast('নতুন আইটেম যুক্ত হয়েছে!', 'success');
      renderApp();
    }

    function handleFileToHiddenInput(e, hiddenId) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const inp = document.getElementById(hiddenId);
        if (inp) inp.value = reader.result;
      };
      reader.readAsDataURL(file);
    }

            <div>
              <h2 class="text-base font-extrabold text-slate-900">✂️ টেইলার্স আইটেম ও ডিজাইন ট্যাগ এডিটর (${toBnNum(state.garments.length)} টি)</h2>
              <p class="text-xs text-slate-500">পোশাকের সেলাই মজুরি, সুইং কারিগর ফি ও কমপ্লিট ফি সেট করুন</p>

            ${state.garments.map((g) => `
              <div class="bg-white rounded-2xl p-3.5 border border-slate-200 flex items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-2.5 min-w-0">
                  <div class="w-11 h-11 rounded-xl bg-amber-100 flex items-center justify-center text-xl shrink-0">${g.icon || '👘'}</div>

      pendingGarmentDesignList = [...(grm.designs || [])];
      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">✏️ টেইলার্স আইটেম এডিট — ${grm.name}</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="saveEditedGarment(event, '${grm.id}')" class="p-5 space-y-3 text-xs max-h-[82vh] overflow-y-auto">

          <div class="grid grid-cols-3 gap-2">
            <div><label class="block font-bold mb-1">কাস্টমার মজুরি (৳)</label><input id="edit-grm-price" type="number" value="${grm.price}" required class="w-full px-2.5 py-2 rounded-xl border border-emerald-400 font-extrabold" /></div>
            <div><label class="block font-bold mb-1">সুইং কারিগর (৳)</label><input id="edit-grm-kfee" type="number" value="${grm.karigorFee}" required class="w-full px-2.5 py-2 rounded-xl border font-bold" /></div>
            <div><label class="block font-bold mb-1">কমপ্লিট ফি (৳)</label><input id="edit-grm-cfee" type="number" value="${grm.completeFee || 30}" required class="w-full px-2.5 py-2 rounded-xl border border-purple-300 font-bold" /></div>

              <button type="button" onclick="addGarmentDesignTagInModal()" class="px-3 py-1.5 rounded-lg bg-emerald-700 text-white font-extrabold cursor-pointer">+ যোগ</button>
            </div>
            <div id="garment-design-tags-box" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto pt-1">
              ${pendingGarmentDesignList.map((d, idx) => `
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-white border border-emerald-300 text-[11px] font-bold text-slate-800">
                  <span>${d}</span>

              `).join('')}

          </div>
          <div class="flex justify-end gap-2 pt-2">

          </div>
        </form>
      `;
      openModal(html, 'max-w-lg');
    }

    function addGarmentDesignTagInModal() {
      const inp = document.getElementById('new-design-tag-inp');
      const val = (inp?.value || '').trim();
      if (!val) return;
      pendingGarmentDesignList.push(val);
      inp.value = '';
      refreshGarmentDesignTagsBox();
    }

    function removeGarmentDesignTagInModal(idx) {
      pendingGarmentDesignList.splice(idx, 1);
      refreshGarmentDesignTagsBox();
    }

    function refreshGarmentDesignTagsBox() {
      const box = document.getElementById('garment-design-tags-box');
      if (!box) return;
      box.innerHTML = pendingGarmentDesignList.map((d, idx) => `
        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-white border border-emerald-300 text-[11px] font-bold text-slate-800">
          <span>${d}</span>
          <button type="button" onclick="removeGarmentDesignTagInModal(${idx})" class="text-rose-600 font-extrabold cursor-pointer">✕</button>
        </span>
      `).join('');
    }

    function saveEditedGarment(e, garmentId) {
      e.preventDefault();
      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;
      grm.name = document.getElementById('edit-grm-name')?.value.trim() || grm.name;
      grm.price = Number(document.getElementById('edit-grm-price')?.value || 0);
      grm.karigorFee = Number(document.getElementById('edit-grm-kfee')?.value || 0);
      grm.completeFee = Number(document.getElementById('edit-grm-cfee')?.value || 30);
      const fRaw = document.getElementById('edit-grm-fields')?.value || '';
      grm.fields = fRaw.split(',').map((s) => s.trim()).filter(Boolean);
      grm.designs = [...pendingGarmentDesignList];
      persistState();
      closeModal();
      showToast(`${grm.name} আপডেট হয়েছে!`, 'success');
      renderApp();
    }

      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">+ নতুন টেইলার্স আইটেম যোগ করুন</h3>

            <div><label class="block font-bold mb-1">কমপ্লিট ফি (৳)</label><input id="new-grm-cfee" type="number" value="30" class="w-full px-2.5 py-2 rounded-xl border font-bold" /></div>

      if (!name) return;

        icon: '👘',

        price: Number(document.getElementById('new-grm-price')?.value || 600),

    }

    // ==========================================
    // 9. KARIGOR LEDGER + WORK LOG CHART, EXPENSES, CUSTOMERS, SUPPLIERS, REPORTS & SETTINGS
    // ==========================================
    function renderKarigorLedger() {
      const logs = state.workLogs || [];
      const karigorStats = (state.karigors || []).map((k) => {
        let sewingPieces = 0, completePieces = 0, totalEarned = 0;
        logs.forEach((lg) => {
          if (lg.workerName === k.name) {
            if (lg.stage === 'SEWING') sewingPieces += Number(lg.qty || 1);
            if (lg.stage === 'COMPLETE') completePieces += Number(lg.qty || 1);
            totalEarned += Number(lg.amount || 0);
          }
        });
        const paid = Number(k.paid || 0);
        const payable = Math.max(0, totalEarned - paid);
        return { ...k, sewingPieces, completePieces, totalEarned, paid, payable };
      });

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-slate-200 flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-extrabold text-slate-900">🪡 কারিগর ও কমপ্লিট ম্যান হিসাব + কাজের চার্ট লিস্ট</h2>
              <p class="text-xs text-slate-500">যে কারিগর বা কমপ্লিট ম্যান কাজ শেষ করে বাটনে চাপ দেবেন, তার অ্যাকাউন্টে অটোমেটিক টাকা জমা হবে</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="karigorSubTab='SUMMARY'; renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-extrabold cursor-pointer ${karigorSubTab === 'SUMMARY' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">💰 মজুরি সারসংক্ষেপ</button>
              <button type="button" onclick="karigorSubTab='WORKLOG'; state.unreadSignals=0; persistState(); renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-extrabold cursor-pointer ${karigorSubTab === 'WORKLOG' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">📋 কাজের পূর্ণাঙ্গ চার্ট লিস্ট (${toBnNum(logs.length)})</button>
              ${isMasterAdmin() ? `<button type="button" onclick="openAddKarigorModal()" class="px-3.5 py-2 rounded-xl bg-emerald-700 text-white text-xs font-extrabold cursor-pointer">+ নতুন কর্মী যোগ</button>` : ''}
            </div>
          </div>

          ${karigorSubTab === 'SUMMARY' ? `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              ${karigorStats.map((k) => `
                <div class="bg-white rounded-2xl p-4 border border-slate-200 space-y-2.5 text-xs">
                  <div>
                    <div class="font-extrabold text-sm text-slate-900">${k.name}</div>
                    <div class="text-slate-500">${k.workerType || 'কারিগর'} • 📞 ${k.phone || '-'} ${k.pin ? '• 🔒 পিন সেট' : ''}</div>
                  </div>
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                    <div class="flex justify-between"><span>সুইং (সেলাই) সম্পন্ন:</span><b>${toBnNum(k.sewingPieces)} পিস</b></div>
                    <div class="flex justify-between"><span>কমপ্লিট (ফিনিশিং) সম্পন্ন:</span><b>${toBnNum(k.completePieces)} পিস</b></div>
                    <div class="flex justify-between"><span>মোট অটো-জমা মজুরি:</span><b class="text-emerald-800">${formatTk(k.totalEarned)}</b></div>
                    <div class="flex justify-between"><span>পরিশোধিত:</span><b>${formatTk(k.paid)}</b></div>
                    <div class="flex justify-between border-t pt-1 font-extrabold"><span>বর্তমান পাওনা:</span><span class="text-rose-600">${formatTk(k.payable)}</span></div>
                  </div>
                  ${isMasterAdmin() ? `<button type="button" onclick="openPayKarigorModal('${k.id}', ${k.payable})" class="w-full py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold cursor-pointer">৳ মজুরি পরিশোধ করুন</button>` : ''}
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
              <div class="px-4 py-3 border-b border-slate-100">
                <h3 class="text-xs font-extrabold text-slate-900">📋 কোন কাজটা কোন কারিগর সেলাই ও কোন কমপ্লিট ম্যান কমপ্লিট করেছেন তার চার্ট লিস্ট</h3>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-extrabold">
                      <th class="p-3">তারিখ ও সময়</th>
                      <th class="p-3">মেমো ও কাস্টমার</th>
                      <th class="p-3">পোশাকের নাম</th>
                      <th class="p-3">কাজের ধাপ</th>
                      <th class="p-3">যিনি সম্পন্ন করেছেন</th>
                      <th class="p-3 text-right">জমাকৃত টাকা</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${logs.length === 0 ? `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-semibold">এখনো কোনো কারিগর বা কমপ্লিট ম্যান কাজ ডান করেননি।</td></tr>` : logs.map((lg) => `
                      <tr class="hover:bg-slate-50/70">
                        <td class="p-3 text-[11px] font-bold text-slate-600">${new Date(lg.date).toLocaleString('bn-BD', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded bg-emerald-900 text-amber-300 font-extrabold text-[10px]">#${String(lg.orderId || '').replace('ORD-', '')}</span> <span class="font-bold text-slate-900 ml-1">${lg.customerName}</span></td>
                        <td class="p-3 font-extrabold text-slate-900">${lg.garmentName} (x${toBnNum(lg.qty)})</td>
                        <td class="p-3">${lg.stage === 'SEWING' ? `<span class="px-2 py-0.5 rounded-full bg-blue-100 text-blue-900 font-extrabold text-[10px]">🪡 সুইং (সেলাই) ডান</span>` : `<span class="px-2 py-0.5 rounded-full bg-purple-100 text-purple-900 font-extrabold text-[10px]">✨ কমপ্লিট (ফিনিশিং) ডান</span>`}</td>
                        <td class="p-3 font-extrabold text-emerald-900">${lg.workerName}</td>
                        <td class="p-3 text-right font-extrabold text-emerald-700">+ ${formatTk(lg.amount)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `}
        </div>
      `;
    }

    function openAddKarigorModal() {
      if (!requireMasterGuard('নতুন কর্মী যোগ')) return;

      const html = `

    function submitCustomerDueCollection(e, custId) {
      e.preventDefault();
      const cust = state.customers.find((c) => c.id === custId);
      const amt = Number(document.getElementById('cust-due-pay')?.value || 0);
      if (!cust || amt <= 0) return;
      cust.due = Math.max(0, Number(cust.due || 0) - amt);
      let rem = amt;
      state.orders.forEach((o) => {
        if (rem > 0 && o.customerPhone === cust.phone) {
          const bd = calculateFinancials([o]).orderBreakdown[0];
          if (bd.due > 0) {
            const apply = Math.min(rem, bd.due);
            o.paidAmount = Number(o.paidAmount || 0) + apply;
            rem -= apply;
          }
        }
      });
      persistState();
      closeModal();
      showToast(`${formatTk(amt)} বকেয়া আদায় সম্পন্ন হয়েছে!`, 'success');
      renderApp();
    }

      persistState();

      showToast('নতুন মহাজন যুক্ত হয়েছে!', 'success');
      renderApp();
    }

    function openNewPurchaseModal() {
      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">+ নতুন কাপড় / পণ্য ক্রয় (Stock In)</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="submitNewPurchase(event)" class="p-5 space-y-3 text-xs">
          <div>
            <label class="block font-bold mb-1">মহাজন নির্বাচন করুন *</label>
            <select id="pur-sup-id" class="w-full px-3 py-2 rounded-xl border font-bold">
              ${state.suppliers.map((s) => `<option value="${s.id}">${s.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block font-bold mb-1">স্টকের কাপড়/পণ্য নির্বাচন করুন *</label>
            <select id="pur-inv-id" class="w-full px-3 py-2 rounded-xl border font-bold">
              ${state.inventory.map((i) => `<option value="${i.id}">${i.name} (বর্তমান: ${toBnNum(i.stock)} ${i.unit})</option>`).join('')}
            </select>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div><label class="block font-bold mb-1">পরিমাণ *</label><input id="pur-qty" type="number" step="0.25" min="0.25" value="20" required class="w-full px-2.5 py-2 rounded-xl border font-extrabold" /></div>
            <div><label class="block font-bold mb-1">কেনা দর (৳) *</label><input id="pur-cost" type="number" min="1" value="220" required class="w-full px-2.5 py-2 rounded-xl border font-extrabold" /></div>
            <div><label class="block font-bold mb-1">নগদ পরিশোধ (৳)</label><input id="pur-paid" type="number" min="0" value="0" class="w-full px-2.5 py-2 rounded-xl border font-extrabold" /></div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ ক্রয় ও স্টক যোগ করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-md');
    }

    function submitNewPurchase(e) {
      e.preventDefault();
      const sup = state.suppliers.find((s) => s.id === document.getElementById('pur-sup-id')?.value);
      const inv = state.inventory.find((i) => i.id === document.getElementById('pur-inv-id')?.value);
      const qty = Number(document.getElementById('pur-qty')?.value || 0);
      const cost = Number(document.getElementById('pur-cost')?.value || 0);
      const paid = Number(document.getElementById('pur-paid')?.value || 0);
      if (!sup || !inv || qty <= 0) return;

      const total = Math.round(qty * cost);
      const due = Math.max(0, total - paid);
      inv.stock = Number(inv.stock || 0) + qty;
      inv.costPrice = cost;
      sup.due = Number(sup.due || 0) + due;

      state.purchases.unshift({
        id: 'PUR-' + Date.now(),
        date: new Date().toISOString().split('T')[0],
        supplierName: sup.name,
        itemName: inv.name,
        qty,
        total,
        paid,
        due
      });
      persistState();
      closeModal();
      showToast(`${inv.name} স্টকে যুক্ত হয়েছে এবং ক্রয় হিসাব সেভ হয়েছে!`, 'success');
      renderApp();
    }

    function openPaySupplierModal(supId) {
      const sup = state.suppliers.find((s) => s.id === supId);
      if (!sup) return;
      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">৳ মহাজন বাকি পরিশোধ — ${sup.name}</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="submitPaySupplier(event, '${sup.id}')" class="p-5 space-y-3 text-xs">
          <div><label class="block font-bold mb-1">পরিশোধের পরিমাণ (বাকি: ${formatTk(sup.due || 0)})</label><input id="sup-pay-amt" type="number" min="1" value="${sup.due || 0}" required class="w-full px-3 py-2 rounded-xl border border-emerald-500 font-extrabold text-base" /></div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ পরিশোধ করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-sm');
    }

    function submitPaySupplier(e, supId) {
      e.preventDefault();
      const sup = state.suppliers.find((s) => s.id === supId);
      const amt = Number(document.getElementById('sup-pay-amt')?.value || 0);
      if (sup && amt > 0) sup.due = Math.max(0, Number(sup.due || 0) - amt);
      persistState();
      closeModal();
      showToast(`${formatTk(amt)} মহাজন বাকি পরিশোধ হয়েছে!`, 'success');
      renderApp();
    }

    function openPartnerWithdrawModal(partnerId, remaining) {
      const prt = state.partners.find((p) => p.id === partnerId);
      if (!prt) return;
      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">💸 লভ্যাংশ উত্তোলন — ${prt.name}</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="submitPartnerWithdraw(event, '${prt.id}')" class="p-5 space-y-3 text-xs">
          <div><label class="block font-bold mb-1">উত্তোলনের পরিমাণ (অবশিষ্ট: ${formatTk(remaining)})</label><input id="prt-wd-amt" type="number" min="1" value="${remaining > 0 ? remaining : ''}" required class="w-full px-3 py-2 rounded-xl border border-emerald-500 font-extrabold text-base" /></div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ নিশ্চিত করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-sm');
    }

    function submitPartnerWithdraw(e, partnerId) {
      e.preventDefault();
      const prt = state.partners.find((p) => p.id === partnerId);
      const amt = Number(document.getElementById('prt-wd-amt')?.value || 0);
      if (prt && amt > 0) prt.withdrawn = Number(prt.withdrawn || 0) + amt;
      persistState();
      closeModal();
      showToast(`${formatTk(amt)} লভ্যাংশ উত্তোলন এন্ট্রি হয়েছে!`, 'success');
      renderApp();
    }

    function saveAdminRolesSetup(e) {
      e.preventDefault();
      state.auth.masterAdmins = (state.auth.masterAdmins || []).map((m, idx) => ({
        ...m,
        name: document.getElementById(`ma-name-${idx}`)?.value.trim() || m.name,
        pin: document.getElementById(`ma-pin-${idx}`)?.value.trim() || ''
      }));
      state.auth.managerAdmins = (state.auth.managerAdmins || []).map((mg, idx) => ({
        ...mg,
        name: document.getElementById(`mgr-name-${idx}`)?.value.trim() || mg.name,
        pin: document.getElementById(`mgr-pin-${idx}`)?.value.trim() || ''
      }));
      persistState();
      showToast('৩ স্তরের অ্যাডমিন ও পিন সংরক্ষিত হয়েছে!', 'success');
      renderApp();
    }

    function saveShopSettingsForm(e) {
      e.preventDefault();
      state.shop.nameBn = document.getElementById('set-shop-bn')?.value.trim() || state.shop.nameBn;
      state.shop.address = document.getElementById('set-shop-addr')?.value.trim() || state.shop.address;
      state.shop.phones = document.getElementById('set-shop-phones')?.value.trim() || state.shop.phones;
      state.shop.memoNotice = document.getElementById('set-shop-notice')?.value || state.shop.memoNotice;
      persistState();
      showToast('শোরুম ও মেমো সেটিংস সেভ হয়েছে!', 'success');
      renderApp();
    }

    function downloadJsonBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AlKarim_Backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function restoreJsonBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && parsed.shop) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            state = loadInitialState();
            showToast('ব্যাকআপ সফলভাবে রিস্টোর হয়েছে!', 'success');
            renderApp();
          }
        } catch (err) { showToast('সঠিক ব্যাকআপ ফাইল নয়!', 'warn'); }
      };
      reader.readAsText(file);
    }

    function addManagerAdminSlot() {
      if (!requireMasterGuard('ম্যানেজার যোগ')) return;
      state.auth.managerAdmins.push({
        id: 'MGR-' + Date.now(),
        name: `ম্যানেজার-${toBnNum(state.auth.managerAdmins.length + 1)}`,
        pin: ''
      });
      persistState();
      renderApp();
    }

    function removeManagerAdminSlot(mgrId) {
      if (!requireMasterGuard('ম্যানেজার মুছা')) return;
      if (state.auth.managerAdmins.length <= 1) {
        showToast('অন্তত একজন ম্যানেজার রাখা প্রয়োজন।', 'warn');
        return;
      }
      state.auth.managerAdmins = state.auth.managerAdmins.filter((m) => m.id !== mgrId);
      persistState();
      renderApp();
    }

    function renderSettings() {
      if (!isMasterAdmin()) return `<div class="p-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-extrabold text-center">⛔ শুধুমাত্র মাস্টার অ্যাডমিন সেটিংস ও ব্যাকআপ পরিচালনা করতে পারবেন।</div>`;

      const masters = state.auth?.masterAdmins || [];
      const managers = state.auth?.managerAdmins || [];

      return `
        <div class="space-y-4">
          <!-- 1. 3-Tier Admin & PIN Security Setup -->
          <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 space-y-3 text-xs">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-sm sm:text-base font-extrabold text-slate-900">🔐 ৩ স্তরের অ্যাডমিন প্যানেল ও পিন লক সেটআপ</h2>
                <p class="text-slate-500">মাস্টার অ্যাডমিন (১ বা ২ জন) ও ম্যানেজার অ্যাডমিন (একাধিক) এবং তাদের গোপন পিন নির্ধারণ করুন</p>
              </div>
              <button type="button" onclick="addManagerAdminSlot()" class="px-3 py-1.5 rounded-xl bg-blue-700 text-white font-extrabold cursor-pointer">+ ম্যানেজার যোগ</button>
            </div>

            <form onsubmit="saveAdminRolesSetup(event)" class="space-y-4">
              <div class="p-3.5 rounded-xl bg-amber-50/70 border border-amber-300 space-y-2.5">
                <div class="font-extrabold text-amber-950">👑 মাস্টার অ্যাডমিন (সর্বোচ্চ ক্ষমতা — এডিট, ডিলিট ও রিপোর্ট)</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${masters.map((m, idx) => `
                    <div class="grid grid-cols-3 gap-2 bg-white p-2 rounded-xl border">
                      <input id="ma-name-${idx}" type="text" value="${m.name}" required placeholder="মাস্টার নাম" class="col-span-2 px-2.5 py-1.5 rounded-lg border font-bold" />
                      <input id="ma-pin-${idx}" type="text" inputmode="numeric" value="${m.pin || ''}" placeholder="পিন (ঐচ্ছিক)" class="px-2.5 py-1.5 rounded-lg border border-amber-400 font-extrabold text-center" />
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="p-3.5 rounded-xl bg-blue-50/70 border border-blue-200 space-y-2.5">
                <div class="font-extrabold text-blue-950">📋 ম্যানেজার অ্যাডমিন (শুধু নতুন অর্ডার, পেমেন্ট ও খরচ এন্ট্রি — এডিট/ডিলিট লক)</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${managers.map((mg, idx) => `
                    <div class="flex items-center gap-1.5 bg-white p-2 rounded-xl border">
                      <input id="mgr-name-${idx}" type="text" value="${mg.name}" required placeholder="ম্যানেজার নাম" class="flex-1 px-2.5 py-1.5 rounded-lg border font-bold" />
                      <input id="mgr-pin-${idx}" type="text" inputmode="numeric" value="${mg.pin || ''}" placeholder="পিন" class="w-20 px-2 py-1.5 rounded-lg border border-blue-300 font-extrabold text-center" />
                      ${managers.length > 1 ? `<button type="button" onclick="removeManagerAdminSlot('${mg.id}')" class="px-2 py-1.5 rounded-lg bg-rose-50 text-rose-700 font-bold cursor-pointer">✕</button>` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>

              <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">✓ অ্যাডমিন ও পিন সেভ করুন</button>
            </form>
          </div>

          <!-- 2. Showroom & Memo Settings -->
          <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 space-y-3 text-xs">
            <h3 class="text-sm sm:text-base font-extrabold text-slate-900">🏪 শোরুম ও মেমো শর্তাবলী সেটিংস</h3>
            <form onsubmit="saveShopSettingsForm(event)" class="space-y-3">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label class="block font-bold mb-1">প্রতিষ্ঠানের নাম</label><input id="set-shop-bn" type="text" value="${state.shop.nameBn}" required class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
                <div><label class="block font-bold mb-1">মোবাইল নম্বরসমূহ</label><input id="set-shop-phones" type="text" value="${state.shop.phones}" required class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
              </div>
              <div><label class="block font-bold mb-1">ঠিকানা</label><input id="set-shop-addr" type="text" value="${state.shop.address}" required class="w-full px-3 py-2 rounded-xl border font-bold" /></div>
              <div><label class="block font-bold mb-1">মেমোর শর্তাবলী ও নোটিশ</label><textarea id="set-shop-notice" rows="4" class="w-full px-3 py-2 rounded-xl border font-bold">${state.shop.memoNotice}</textarea></div>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ শোরুম তথ্য সেভ করুন</button>
            </form>
          </div>

          <!-- 3. JSON Backup & Restore -->
          <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 space-y-3 text-xs">
            <h3 class="text-sm sm:text-base font-extrabold text-slate-900">💾 ডাটা ব্যাকআপ, রিস্টোর ও রিসেট (Offline JSON)</h3>
            <div class="flex flex-wrap items-center gap-3">
              <button type="button" onclick="downloadJsonBackup()" class="px-4 py-2.5 rounded-xl bg-slate-900 text-amber-300 font-extrabold cursor-pointer">⬇️ সম্পূর্ণ ব্যাকআপ ডাউনলোড করুন</button>
              <label class="px-4 py-2.5 rounded-xl bg-emerald-50 text-emerald-900 border border-emerald-300 font-extrabold cursor-pointer">
                ⬆️ ব্যাকআপ ফাইল রিস্টোর করুন
                <input type="file" accept=".json" onchange="restoreJsonBackup(event)" class="hidden" />
              </label>
              <button type="button" onclick="openResetAllDataModal()" class="px-4 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 font-extrabold cursor-pointer">🗑️ সব ডাটা রিসেট করুন</button>
            </div>
          </div>
        </div>
      `;
    }

    function openResetAllDataModal() {
      const html = `
        <div class="px-5 py-4 border-b bg-rose-700 text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold">⚠️ সতর্কতা — সব ডাটা রিসেট করবেন?</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <div class="p-5 space-y-3 text-xs">
          <p class="font-bold text-slate-700">এটি করলে বর্তমানের সব অর্ডার, কাস্টমার, খরচ ও কাজের লগ মুছে গিয়ে অ্যাপটি একদম নতুন অবস্থায় ফিরে যাবে। রিসেট করার আগে অবশ্যই ব্যাকআপ ডাউনলোড করে রাখুন।</p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="button" onclick="confirmResetAllData()" class="px-5 py-2 rounded-xl bg-rose-700 text-white font-extrabold cursor-pointer">✓ হ্যাঁ, রিসেট করুন</button>
          </div>
        </div>
      `;
      openModal(html, 'max-w-sm');
    }

    function confirmResetAllData() {
      localStorage.removeItem(STORAGE_KEY);
      state = loadInitialState();
      cartItems = [];
      editingOrderId = null;
      persistState();
      closeModal();
      showToast('অ্যাপের সব ডাটা সফলভাবে রিসেট হয়েছে!', 'warn');
      renderApp();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      renderApp();
    }
  </script>
</body>
</html>
