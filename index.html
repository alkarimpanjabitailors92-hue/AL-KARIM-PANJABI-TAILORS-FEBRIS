    function initCloudFirestoreSync() {
      try {
        if (!window.firebase) return;
        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
        cloudDb = firebase.firestore(app);
        cloudDb.collection('erp_stores').doc('al_karim_main').onSnapshot((docSnap) => {
          cloudSyncStatus = 'LIVE';
          if (docSnap.exists) {
            const data = docSnap.data() || {};
            if (Array.isArray(data.orders)) state.orders = data.orders;
            if (Array.isArray(data.customers)) state.customers = data.customers;
            if (Array.isArray(data.garments) && data.garments.length) state.garments = data.garments;
            if (Array.isArray(data.inventory) && data.inventory.length) state.inventory = data.inventory;
            if (Array.isArray(data.suppliers)) state.suppliers = data.suppliers;
            if (Array.isArray(data.purchases)) state.purchases = data.purchases;
            if (Array.isArray(data.karigors)) state.karigors = data.karigors;
            if (Array.isArray(data.workLogs)) state.workLogs = data.workLogs;
            if (Array.isArray(data.karigorPayments)) state.karigorPayments = data.karigorPayments;
            if (Array.isArray(data.expenses)) state.expenses = data.expenses;
            if (Array.isArray(data.partners) && data.partners.length) state.partners = data.partners;
            if (Array.isArray(data.partnerWithdrawals)) state.partnerWithdrawals = data.partnerWithdrawals;
            if (data.lastMemoNo) state.lastMemoNo = Math.max(Number(state.lastMemoNo || 5660), Number(data.lastMemoNo));
            if (typeof data.unreadSignals === 'number') state.unreadSignals = data.unreadSignals;
            if (data.shop) state.shop = { ...state.shop, ...data.shop };
            if (data.auth?.masterAdmins) state.auth.masterAdmins = data.auth.masterAdmins;
            if (data.auth?.managerAdmins) state.auth.managerAdmins = data.auth.managerAdmins;
            persistState(true);
            renderApp();
          } else {
            persistState(false);
            renderApp();
          }
        }, () => {
          cloudSyncStatus = 'OFFLINE';
        });
      } catch (e) {
        cloudSyncStatus = 'OFFLINE';
      }
    }

    function toBnNum(num) {
      const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return String(num ?? 0).replace(/\d/g, (d) => bnDigits[Number(d)]);
    }

    function formatQtyBn(qty) {
      const n = Number(qty || 0);
      const formatted = Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, '');
      return toBnNum(formatted);
    }

    function formatTk(amount) {
      const num = Math.round(Number(amount || 0));
      return '৳' + toBnNum(num.toLocaleString('en-US'));
    }

    function formatDateNice(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(String(dateStr).slice(0, 10) + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return String(dateStr);
      return toBnNum(d.getDate()) + '/' + toBnNum(d.getMonth() + 1) + '/' + toBnNum(d.getFullYear());
    }

    function calculateFinancials(ordersSubset = state.orders) {
      let totalBilled = 0, totalCollected = 0, totalDue = 0;
      let tailorRevenue = 0, karigorCost = 0, retailRevenue = 0, retailCost = 0;
      (ordersSubset || []).forEach((o) => {
        totalBilled += Number(o.grandTotal || 0);
        totalCollected += Number(o.paidAmount || 0);
        totalDue += Math.max(0, Number(o.dueAmount || 0));
        (o.items || []).forEach((it) => {
          const lineTotal = Number(it.lineTotal || (Number(it.unitPrice || 0) * Number(it.qty || 1)));
          if (it.type === 'tailor') {
            tailorRevenue += lineTotal;
            karigorCost += (Number(it.karigorFee || 0) + Number(it.completeFee || 0)) * Number(it.qty || 1);
          } else {
            retailRevenue += lineTotal;
            const inv = (state.inventory || []).find((x) => x.id === it.invId);
            const unitCost = Number(it.costPrice ?? inv?.costPrice ?? 0);
            retailCost += unitCost * Number(it.qty || 1);
          }
        });
      });
      return { totalBilled, totalCollected, totalDue, tailorRevenue, karigorCost, retailRevenue, retailCost };
    }

    function getDeliveryUrgencyInfo(ord) {
      if (ord.status === 'Delivered') {
        return { daysLeft: 999, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-extrabold">✅ Delivered</span>` };
      }
      const today = new Date(new Date().toISOString().split('T')[0] + 'T00:00:00');
      const del = new Date(String(ord.deliveryDate || '').slice(0, 10) + 'T00:00:00');
      const diffDays = Number.isNaN(del.getTime()) ? 7 : Math.round((del - today) / 86400000);
      if (diffDays < 0) return { daysLeft: diffDays, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-extrabold">🚨 সময় পার (${toBnNum(Math.abs(diffDays))} দিন)</span>` };
      if (diffDays === 0) return { daysLeft: 0, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 border border-rose-300 text-[10px] font-extrabold">🔥 আজ ডেলিভারি</span>` };
      if (diffDays <= 2) return { daysLeft: diffDays, badgeHtml: `<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 text-[10px] font-extrabold">⏰ আর ${toBnNum(diffDays)} দিন</span>` };

    }

    function sortOrdersByUrgency(list) {
      return [...(list || [])].sort((a, b) => {
        if (a.status === 'Delivered' && b.status !== 'Delivered') return 1;
        if (a.status !== 'Delivered' && b.status === 'Delivered') return -1;
        return getDeliveryUrgencyInfo(a).daysLeft - getDeliveryUrgencyInfo(b).daysLeft;
      });
    }

    function normalizeBdPhone(phone) {
      const digits = String(phone || '').replace(/\D/g, '');
      if (digits.startsWith('880')) return digits;
      if (digits.startsWith('0')) return '88' + digits;
      return digits ? '880' + digits : '';
    }

    function compressImageDataUrl(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 480;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.78));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function upsertCustomerRecord(phone, name, address, addedDue = 0, lastMeasurements = null) {
      const cleanPhone = String(phone || '').trim();
      if (!cleanPhone) return;
      let cust = state.customers.find((c) => c.phone === cleanPhone);
      if (!cust) {
        cust = {
          id: 'CUST-' + Date.now(),
          phone: cleanPhone,
          name: name || 'সম্মানিত কাস্টমার',
          address: address || '',
          totalDue: Math.max(0, Number(addedDue || 0)),
          savedMeasurements: lastMeasurements || {}
        };
        state.customers.unshift(cust);
      } else {
        if (name) cust.name = name;
        if (address) cust.address = address;
        cust.totalDue = Math.max(0, Number(cust.totalDue || 0) + Number(addedDue || 0));
        if (lastMeasurements) {
          cust.savedMeasurements = { ...(cust.savedMeasurements || {}), ...lastMeasurements };
        }
      }
    }

        dashFromDate = todayIso;
        dashToDate = todayIso;
      } else if (preset === 'YESTERDAY') {

        dashFromDate = yIso;
        dashToDate = yIso;
      } else if (preset === 'MONTH') {
        dashFromDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];

      state.orderForm.customerPhone = val;

      if (clean.length >= 6) {
        const cust = (state.customers || []).find((c) => c.phone === clean);
        if (cust) {
          state.orderForm.customerName = cust.name || state.orderForm.customerName;
          state.orderForm.customerAddress = cust.address || state.orderForm.customerAddress;

      renderPreviousOrdersPreviewBox();

    function saveGarmentToCart(e, garmentId, editCartUid) {
      e.preventDefault();
      const g = (state.garments || []).find((x) => x.id === garmentId);
      if (!g) return;
      const qty = Math.max(1, Number(document.getElementById('grm-qty')?.value || 1));
      const unitPrice = Math.max(0, Number(document.getElementById('grm-price')?.value || 0));
      const fabricNote = (document.getElementById('grm-fabric')?.value || '').trim();
      const tagNote = (document.getElementById('grm-tag')?.value || '').trim();

      const measurements = {};
      document.querySelectorAll('[data-mfield]').forEach((inp) => {
        const key = inp.getAttribute('data-mfield');
        const val = inp.value.trim();
        if (val) measurements[key] = val;
      });

      const selectedDesigns = [];
      document.querySelectorAll('input[name="grm-design"]:checked').forEach((cb) => {
        selectedDesigns.push(cb.value);
      });

      let extraDesignCharge = 0;
      selectedDesigns.forEach((d) => {
        if (d.includes('+৳৫০')) extraDesignCharge += 50;
        else if (d.includes('+৳১০০')) extraDesignCharge += 100;
        else if (d.includes('+৳১৫০')) extraDesignCharge += 150;
        else if (d.includes('+৳২০০')) extraDesignCharge += 200;
      });

      const finalUnitPrice = unitPrice + (editCartUid ? 0 : extraDesignCharge);
      const itemObj = {
        uid: editCartUid || ('CART-' + Date.now()),
        type: 'tailor',
        garmentId: g.id,
        name: g.name,
        qty,
        unitPrice: finalUnitPrice,
        lineTotal: finalUnitPrice * qty,
        karigorFee: Number(g.karigorFee || 0),
        completeFee: Number(g.completeFee || 0),
        measurements,
        selectedDesigns,
        fabricNote,
        tagNote,
        cuttingDone: false,
        sewingDoneBy: '',
        completeDoneBy: ''
      };

      if (editCartUid) {
        const idx = cartItems.findIndex((c) => c.uid === editCartUid);
        if (idx >= 0) cartItems[idx] = { ...cartItems[idx], ...itemObj };
      } else {
        cartItems.push(itemObj);
      }

      closeModal();
      showToast(`"${g.name}" কার্টে যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function recalcRetailModalTotal() {
      const q = Math.max(0, Number(document.getElementById('rtl-qty-inp')?.value || 0));
      const p = Math.max(0, Number(document.getElementById('rtl-price-inp')?.value || 0));
      const el = document.getElementById('rtl-modal-total');

    function saveRetailItemToCart(e, invId, editCartUid) {
      e.preventDefault();
      const inv = (state.inventory || []).find((x) => x.id === invId);
      if (!inv) return;
      const qty = Math.max(0.05, Number(document.getElementById('rtl-qty-inp')?.value || 1));
      const unitPrice = Math.max(0, Number(document.getElementById('rtl-price-inp')?.value || 0));
      const lineTotal = Math.round(qty * unitPrice);

      if (Number(inv.stock || 0) < qty && !editCartUid) {
        showToast(`সতর্কতা: মজুত আছে ${formatQtyBn(inv.stock)} ${inv.unit}, তবুও কার্টে যোগ হলো।`, 'warn');
      }

      if (editCartUid) {
        const idx = cartItems.findIndex((c) => c.uid === editCartUid);
        if (idx >= 0) {
          cartItems[idx] = { ...cartItems[idx], qty, unitPrice, lineTotal };
        }
      } else {
        cartItems.push({
          uid: 'CART-' + Date.now(),
          type: 'retail',
          invId: inv.id,
          name: inv.name,
          unit: inv.unit || 'গজ',
          qty,
          unitPrice,
          costPrice: Number(inv.costPrice || 0),
          lineTotal
        });
      }

      closeModal();
      showToast(`"${inv.name}" (${formatQtyBn(qty)} ${inv.unit}) কার্টে যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function updateCartItemQty(uid, delta) {
      const idx = cartItems.findIndex((c) => c.uid === uid);
      if (idx < 0) return;
      const step = cartItems[idx].unit === 'গজ' ? (delta > 0 ? 0.25 : -0.25) : delta;
      const newQty = Math.round((Number(cartItems[idx].qty || 1) + step) * 100) / 100;
      if (newQty <= 0) {
        cartItems.splice(idx, 1);
      } else {
        cartItems[idx].qty = newQty;
        cartItems[idx].lineTotal = Math.round(newQty * Number(cartItems[idx].unitPrice || 0));
      }
      renderApp();
    }

    function syncPosTotalsLive() {
      const subTotal = cartItems.reduce((s, it) => s + Number(it.lineTotal || 0), 0);
      const disc = Math.max(0, Number(document.getElementById('pos-discount-inp')?.value || 0));
      const paid = Math.max(0, Number(document.getElementById('pos-paid-inp')?.value || 0));
      state.orderForm.discount = disc;
      state.orderForm.paidAmount = paid;
      const grandTotal = Math.max(0, subTotal - disc);
      const due = Math.max(0, grandTotal - paid);

      const grandEl = document.getElementById('pos-grand-display');
      const dueEl = document.getElementById('pos-due-display');
      if (grandEl) grandEl.textContent = formatTk(grandTotal);
      if (dueEl) {
        dueEl.textContent = formatTk(due);
        dueEl.className = `text-base font-extrabold ${due > 0 ? 'text-rose-700' : 'text-emerald-700'}`;
      }
    }

    function setPosFullPaid() {
      const subTotal = cartItems.reduce((s, it) => s + Number(it.lineTotal || 0), 0);
      const disc = Math.max(0, Number(document.getElementById('pos-discount-inp')?.value || 0));
      const grandTotal = Math.max(0, subTotal - disc);
      state.orderForm.paidAmount = grandTotal;
      const paidInp = document.getElementById('pos-paid-inp');
      if (paidInp) paidInp.value = grandTotal;
      syncPosTotalsLive();
    }

    function saveFinalOrder(andPrint = false) {
      if (cartItems.length === 0) {
        showToast('আগে অন্তত একটি পোশাক বা কাপড় কার্টে যোগ করুন!', 'warn');
        return;
      }
      const customerName = (document.getElementById('pos-cust-name')?.value || state.orderForm.customerName || '').trim() || 'সম্মানিত কাস্টমার';
      const customerPhone = (document.getElementById('pos-cust-phone')?.value || state.orderForm.customerPhone || '').trim();
      const customerAddress = (document.getElementById('pos-cust-addr')?.value || state.orderForm.customerAddress || '').trim();
      const orderDate = document.getElementById('pos-order-date')?.value || state.orderForm.orderDate;
      const deliveryDate = document.getElementById('pos-del-date')?.value || state.orderForm.deliveryDate;
      const discount = Math.max(0, Number(document.getElementById('pos-discount-inp')?.value ?? state.orderForm.discount ?? 0));
      const paidAmount = Math.max(0, Number(document.getElementById('pos-paid-inp')?.value ?? state.orderForm.paidAmount ?? 0));
      const paymentMethod = document.getElementById('pos-pay-method')?.value || state.orderForm.paymentMethod || 'Cash';

      const subTotal = cartItems.reduce((s, it) => s + Number(it.lineTotal || 0), 0);
      const grandTotal = Math.max(0, subTotal - discount);
      const dueAmount = Math.max(0, grandTotal - paidAmount);

      const measMap = {};
      cartItems.forEach((it) => {
        if (it.type === 'tailor' && it.measurements) measMap[it.name] = it.measurements;
      });

      let savedOrder = null;
      if (editingOrderId) {
        const idx = state.orders.findIndex((o) => o.id === editingOrderId);
        if (idx >= 0) {
          const oldOrder = state.orders[idx];
          const dueDiff = dueAmount - Number(oldOrder.dueAmount || 0);
          savedOrder = {
            ...oldOrder,
            orderDate,
            deliveryDate,
            customerName,
            customerPhone,
            customerAddress,
            items: JSON.parse(JSON.stringify(cartItems)),
            subTotal,
            discount,
            grandTotal,
            paidAmount,
            dueAmount,
            paymentMethod
          };
          state.orders[idx] = savedOrder;
          upsertCustomerRecord(customerPhone, customerName, customerAddress, dueDiff, measMap);
        }
        editingOrderId = null;
      } else {
        state.lastMemoNo = Number(state.lastMemoNo || 5660) + 1;
        const newId = 'ORD-' + state.lastMemoNo;
        cartItems.forEach((it) => {
          if (it.type === 'retail' && it.invId) {
            const inv = state.inventory.find((x) => x.id === it.invId);
            if (inv) inv.stock = Math.max(0, Math.round((Number(inv.stock || 0) - Number(it.qty || 1)) * 100) / 100);
          }
        });
        savedOrder = {
          id: newId,
          orderDate,
          deliveryDate,
          customerName,
          customerPhone,
          customerAddress,
          items: JSON.parse(JSON.stringify(cartItems)),
          subTotal,
          discount,
          grandTotal,
          paidAmount,
          dueAmount,
          paymentMethod,
          status: 'Pending',
          createdAt: new Date().toISOString()
        };
        state.orders.unshift(savedOrder);
        upsertCustomerRecord(customerPhone, customerName, customerAddress, dueAmount, measMap);
      }

      cartItems = [];
      state.orderForm.customerName = '';
      state.orderForm.customerPhone = '';
      state.orderForm.customerAddress = '';
      state.orderForm.discount = 0;
      state.orderForm.paidAmount = 0;
      persistState();
      showToast(`অর্ডার #${savedOrder.id.replace('ORD-', '')} সফলভাবে সেভ হয়েছে!`, 'success');
      if (andPrint && savedOrder) {
        navigateToTab('orders');
        printOrderMemo(savedOrder.id);
      } else {
        navigateToTab('orders');
      }
    }

    function saveMeasurementsOnlyEdit(e, orderId) {
      e.preventDefault();
      const ord = (state.orders || []).find((o) => o.id === orderId);
      if (!ord) return;
      const measMap = {};
      (ord.items || []).forEach((it) => {
        if (it.type !== 'tailor') return;
        const newMeas = {};
        document.querySelectorAll(`[data-edit-uid="${it.uid}"]`).forEach((inp) => {
          const f = inp.getAttribute('data-edit-field');
          const v = inp.value.trim();
          if (v) newMeas[f] = v;
        });
        it.measurements = newMeas;
        measMap[it.name] = newMeas;
        const noteInp = document.querySelector(`[data-edit-note-uid="${it.uid}"]`);
        if (noteInp) it.tagNote = noteInp.value.trim();
      });
      upsertCustomerRecord(ord.customerPhone, ord.customerName, ord.customerAddress, 0, measMap);
      persistState();
      closeModal();
      showToast('পোশাকের মাপ ও ট্যাগ নোট আপডেট করা হয়েছে!', 'success');
      renderApp();

    function deleteOrder(orderId) {
      if (!requireMasterGuard('অর্ডার ডিলিট')) return;
      const idx = state.orders.findIndex((o) => o.id === orderId);
      if (idx < 0) return;
      const ord = state.orders[idx];
      upsertCustomerRecord(ord.customerPhone, ord.customerName, ord.customerAddress, -Number(ord.dueAmount || 0));
      state.orders.splice(idx, 1);
      persistState();
      showToast(`মেমো #${orderId.replace('ORD-', '')} ডিলিট করা হয়েছে।`, 'warn');
      renderApp();

    function submitWorkerStageComplete(e, orderId, stage) {
      e.preventDefault();
      const ord = (state.orders || []).find((o) => o.id === orderId);
      const workerId = document.getElementById('wrk-select-id')?.value;
      const worker = (state.karigors || []).find((k) => k.id === workerId);
      if (!ord || !worker) return;

      const selectedUids = [];
      document.querySelectorAll('input[name="wrk-item-uid"]:checked').forEach((cb) => selectedUids.push(cb.value));
      if (selectedUids.length === 0) {
        showToast('অন্তত একটি পোশাক সিলেক্ট করুন!', 'warn');
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      selectedUids.forEach((uid) => {
        const it = (ord.items || []).find((x) => x.uid === uid);
        if (!it) return;
        const wage = (stage === 'SEWING' ? Number(it.karigorFee || 0) : Number(it.completeFee || 0)) * Number(it.qty || 1);
        if (stage === 'SEWING') {
          it.cuttingDone = true;
          it.sewingDoneBy = worker.name;
        } else {
          it.completeDoneBy = worker.name;
        }
        worker.totalEarned = Number(worker.totalEarned || 0) + wage;
        state.workLogs.unshift({
          id: 'LOG-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
          date: today,
          workerId: worker.id,
          workerName: worker.name,
          stage,
          orderId: ord.id,
          garmentName: it.name,
          qty: it.qty,
          amount: wage
        });
      });

      const tItems = (ord.items || []).filter((it) => it.type === 'tailor');
      const allComplete = tItems.length > 0 && tItems.every((it) => it.completeDoneBy);
      if (allComplete && ord.status !== 'Delivered') {
        ord.status = 'Ready';
        state.unreadSignals = Number(state.unreadSignals || 0) + 1;
        persistState();
        closeModal();
        showToast(`মেমো #${ord.id.replace('ORD-', '')} এখন সম্পূর্ণ Ready!`, 'success');
        if (normalizeBdPhone(ord.customerPhone)) {

            <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between items-center">
              <h3 class="text-sm font-extrabold text-amber-300">✨ পোশাক প্রস্তুত (Ready) — WhatsApp বার্তা</h3>

            </div>
            <div class="p-5 space-y-3 text-xs">
              <p class="font-bold text-slate-700">কাস্টমার <b>${ord.customerName}</b> (${ord.customerPhone}) কে পোশাক প্রস্তুত হওয়ার WhatsApp মেসেজ পাঠাতে নিচের বাটনে চাপ দিন:</p>
              <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">পরে পাঠাবো</button>
                <button type="button" onclick="dispatchAutomatedWhatsApp(state.orders.find(o=>o.id==='${ord.id}'), 'READY', true); closeModal();" class="px-5 py-2 rounded-xl bg-emerald-600 text-white font-extrabold cursor-pointer">📲 WhatsApp মেসেজ পাঠান</button>
              </div>
            </div>
          `;
          openModal(waHtml, 'max-w-md');
        }
      } else {
        ord.status = 'In-Progress';
        state.unreadSignals = Number(state.unreadSignals || 0) + 1;
        persistState();
        closeModal();
        showToast(`${worker.name} এর কাজের বিল যোগ হয়েছে!`, 'success');
      }
      renderApp();
    }

    function confirmOrderDelivery(orderId, andPrint = false) {
      const ord = (state.orders || []).find((o) => o.id === orderId);
      if (!ord) return;
      const nowPaid = Math.max(0, Number(document.getElementById('del-now-paid')?.value || 0));
      const payMethod = document.getElementById('del-pay-method')?.value || 'Cash';
      const delNote = (document.getElementById('del-note')?.value || '').trim();
      const sendWa = Boolean(document.getElementById('del-send-wa')?.checked);

      const prevDue = Math.max(0, Number(ord.dueAmount || 0));
      ord.paidAmount = Number(ord.paidAmount || 0) + nowPaid;
      ord.dueAmount = Math.max(0, Number(ord.grandTotal || 0) - ord.paidAmount);
      ord.paymentMethod = payMethod;
      ord.deliveryNote = delNote;
      ord.deliveredAt = new Date().toISOString();
      ord.status = 'Delivered';

      const dueReduction = prevDue - ord.dueAmount;
      if (dueReduction !== 0) {

    function renderStockLedger() {
      const soldMap = {};
      (state.orders || []).forEach((o) => {
        (o.items || []).forEach((it) => {
          if (it.type === 'retail' && it.invId) {
            soldMap[it.invId] = Math.round(((soldMap[it.invId] || 0) + Number(it.qty || 0)) * 100) / 100;
          }
        });
      });

      const purchasedAmount = (state.purchases || []).reduce((s, p) => s + Number(p.totalAmount || 0), 0);
      let totalCostValue = 0, totalSellValue = 0, totalSoldValue = 0;
      (state.inventory || []).forEach((inv) => {
        const st = Number(inv.stock || 0);
        const cp = Number(inv.costPrice || 0);
        const sp = Number(inv.sellPrice || 0);
        totalCostValue += st * cp;
        totalSellValue += st * sp;
        totalSoldValue += (soldMap[inv.id] || 0) * sp;
      });
      const potentialProfit = Math.max(0, totalSellValue - totalCostValue);

      const q = stockLedgerSearch.trim().toLowerCase();
      const rows = (state.inventory || []).filter((inv) => {
        if (stockLedgerFilter === 'FABRICS' && inv.category !== 'Fabrics') return false;
        if (stockLedgerFilter === 'PRODUCTS' && inv.category !== 'Product') return false;
        if (stockLedgerFilter === 'LOW' && Number(inv.stock || 0) > 15) return false;
        return !q || inv.name.toLowerCase().includes(q);
      });

      return `
        <div class="space-y-4 text-xs">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="bg-white rounded-2xl p-4 border border-emerald-200 shadow-2xs">
              <div class="text-emerald-800 font-bold">বর্তমান স্টক মূল্য (কেনা দরে পুঁজি)</div>
              <div class="text-xl font-extrabold text-emerald-950 mt-1">${formatTk(totalCostValue)}</div>
              <div class="text-[10px] text-slate-500 mt-0.5">মজুত মালের আসল কেনা মূল্য</div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs">
              <div class="text-slate-600 font-bold">বর্তমান স্টকের বিক্রয় মূল্য</div>
              <div class="text-xl font-extrabold text-slate-900 mt-1">${formatTk(totalSellValue)}</div>
              <div class="text-[10px] text-slate-500 mt-0.5">সব মাল বিক্রি হলে প্রাপ্ত টাকা</div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-amber-300 shadow-2xs">
              <div class="text-amber-900 font-bold">মজুত মাল থেকে সম্ভাব্য লাভ</div>
              <div class="text-xl font-extrabold text-amber-800 mt-1">${formatTk(potentialProfit)}</div>
              <div class="text-[10px] text-slate-500 mt-0.5">বিক্রয় মূল্য - কেনা মূল্য</div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-blue-200 shadow-2xs">

    function saveInventoryItemForm(e, category, invId) {
      e.preventDefault();
      const name = (document.getElementById('inv-f-name')?.value || '').trim();
      const unit = (document.getElementById('inv-f-unit')?.value || 'গজ').trim();
      const stock = Number(document.getElementById('inv-f-stock')?.value || 0);
      const costPrice = Number(document.getElementById('inv-f-cost')?.value || 0);
      const sellPrice = Number(document.getElementById('inv-f-sell')?.value || 0);
      const colorName = (document.getElementById('inv-f-cname')?.value || '').trim();
      const colorHex = document.getElementById('inv-f-chex')?.value || '#ffffff';
      const cutPiecesNote = (document.getElementById('inv-f-note')?.value || '').trim();

      if (invId) {
        const idx = state.inventory.findIndex((x) => x.id === invId);
        if (idx >= 0) {
          state.inventory[idx] = { ...state.inventory[idx], name, unit, stock, costPrice, sellPrice, colorName, colorHex, cutPiecesNote };
        }
      } else {
        state.inventory.unshift({
          id: (category === 'Fabrics' ? 'FAB-' : 'PRD-') + Date.now(),
          category, name, unit, stock, costPrice, sellPrice, colorName, colorHex, image: '', cutPiecesNote
        });
      }
      persistState();
      closeModal();
      showToast(`"${name}" সংরক্ষণ করা হয়েছে!`, 'success');
      renderApp();
    }

    function deleteInventoryItem(invId) {
      if (!requireMasterGuard('আইটেম ডিলিট')) return;
      state.inventory = state.inventory.filter((x) => x.id !== invId);
      persistState();
      showToast('আইটেম ডিলিট করা হয়েছে।', 'warn');
      renderApp();
    }

      if (!box) return;

          ${d}

        </span>
      `).join('');
    }

    function saveGarmentCatalogForm(e, garmentId) {
      e.preventDefault();
      const name = (document.getElementById('grm-cat-name')?.value || '').trim();
      const icon = (document.getElementById('grm-cat-icon')?.value || '👘').trim();
      const image = document.getElementById('grm-cat-img-data')?.value || '';
      const price = Number(document.getElementById('grm-cat-price')?.value || 0);
      const karigorFee = Number(document.getElementById('grm-cat-kfee')?.value || 0);
      const completeFee = Number(document.getElementById('grm-cat-cfee')?.value || 0);
      const fields = (document.getElementById('grm-cat-fields')?.value || '').split(',').map((s) => s.trim()).filter(Boolean);

      if (garmentId) {
        const idx = state.garments.findIndex((x) => x.id === garmentId);
        if (idx >= 0) {
          state.garments[idx] = { ...state.garments[idx], name, icon, image, price, karigorFee, completeFee, fields, designs: [...pendingGarmentDesignList] };
        }
      } else {
        state.garments.push({
          id: 'GRM-' + Date.now(),
          name, icon, image, price, karigorFee, completeFee,
          fields: fields.length ? fields : [...PANJABI_FIELDS],
          designs: [...pendingGarmentDesignList]
        });
      }
      persistState();
      closeModal();
      showToast(`"${name}" সংরক্ষণ করা হয়েছে!`, 'success');
      renderApp();
    }

    function deleteGarmentCatalogItem(garmentId) {

      state.garments = state.garments.filter((x) => x.id !== garmentId);
      persistState();
      showToast('টেইলার্স আইটেম ডিলিট করা হয়েছে।', 'warn');
      renderApp();
    }

    function addPurchaseDraftRow() {
      const firstInv = state.inventory[0];
      if (!firstInv) return;
      purchaseDraftItems.push({ invId: firstInv.id, name: firstInv.name, unit: firstInv.unit, qty: 10, costPrice: firstInv.costPrice, sellPrice: firstInv.sellPrice });
      renderPurchaseDraftRows();
    }

    function createAndAddQuickInventoryToPurchase() {
      const category = document.getElementById('qn-cat')?.value || 'Fabrics';
      const name = (document.getElementById('qn-name')?.value || '').trim();
      const unit = (document.getElementById('qn-unit')?.value || 'গজ').trim();
      const costPrice = Number(document.getElementById('qn-cost')?.value || 0);
      if (!name) return;
      const newInv = {
        id: (category === 'Fabrics' ? 'FAB-' : 'PRD-') + Date.now(),
        category, name, unit, stock: 0, costPrice, sellPrice: Math.round(costPrice * 1.4), colorHex: '#ffffff', colorName: 'নতুন', image: '', cutPiecesNote: ''
      };
      state.inventory.unshift(newInv);
      purchaseDraftItems.push({ invId: newInv.id, name: newInv.name, unit: newInv.unit, qty: 10, costPrice, sellPrice: newInv.sellPrice });
      document.getElementById('qn-name').value = '';
      document.getElementById('pur-quick-new-item').classList.add('hidden');
      renderPurchaseDraftRows();
    }

    function renderPurchaseDraftRows() {
      const box = document.getElementById('pur-draft-rows');
      if (!box) return;
      box.innerHTML = purchaseDraftItems.map((row, idx) => `
        <div class="p-2 rounded-xl bg-white border border-slate-200 grid grid-cols-12 gap-1.5 items-center">
          <select onchange="const inv=state.inventory.find(x=>x.id===this.value); if(inv){ purchaseDraftItems[${idx}]={...purchaseDraftItems[${idx}], invId:inv.id, name:inv.name, unit:inv.unit, costPrice:inv.costPrice, sellPrice:inv.sellPrice}; renderPurchaseDraftRows(); }" class="col-span-5 px-2 py-1.5 rounded-lg border font-bold text-[11px]">
            ${(state.inventory || []).map((inv) => `<option value="${inv.id}" ${inv.id === row.invId ? 'selected' : ''}>${inv.name}</option>`).join('')}
          </select>
          <input type="number" step="0.5" min="0.5" value="${row.qty}" oninput="purchaseDraftItems[${idx}].qty=Number(this.value||0); recalcPurchaseDraftTotals();" placeholder="পরিমাণ" class="col-span-2 px-2 py-1.5 rounded-lg border font-extrabold text-center" />
          <input type="number" min="0" value="${row.costPrice}" oninput="purchaseDraftItems[${idx}].costPrice=Number(this.value||0); recalcPurchaseDraftTotals();" placeholder="কেনা দর" class="col-span-2 px-2 py-1.5 rounded-lg border font-extrabold text-center" />
          <input type="number" min="0" value="${row.sellPrice}" oninput="purchaseDraftItems[${idx}].sellPrice=Number(this.value||0);" placeholder="বিক্রয় দর" class="col-span-2 px-2 py-1.5 rounded-lg border font-bold text-center text-emerald-800" />
          <button type="button" onclick="purchaseDraftItems.splice(${idx}, 1); renderPurchaseDraftRows();" class="col-span-1 text-rose-600 font-extrabold cursor-pointer">✕</button>
        </div>
      `).join('');
      recalcPurchaseDraftTotals();
    }

    function recalcPurchaseDraftTotals() {
      const total = purchaseDraftItems.reduce((s, r) => s + (Number(r.qty || 0) * Number(r.costPrice || 0)), 0);
      const paid = Math.max(0, Number(document.getElementById('pur-paid-amt')?.value || 0));
      const due = Math.max(0, total - paid);
      const tEl = document.getElementById('pur-total-bill');
      const dEl = document.getElementById('pur-due-bill');
      if (tEl) tEl.textContent = formatTk(total);
      if (dEl) dEl.textContent = formatTk(due);
    }

    function saveMultiPurchaseInvoice(e) {
      e.preventDefault();
      if (purchaseDraftItems.length === 0) return;
      const supplierId = document.getElementById('pur-sup-id')?.value;
      const supplier = (state.suppliers || []).find((s) => s.id === supplierId);
      const challanNo = (document.getElementById('pur-challan-no')?.value || 'CH-' + Date.now().toString().slice(-4)).trim();
      const date = document.getElementById('pur-date')?.value || new Date().toISOString().split('T')[0];
      const totalAmount = purchaseDraftItems.reduce((s, r) => s + (Number(r.qty || 0) * Number(r.costPrice || 0)), 0);
      const paidAmount = Math.max(0, Number(document.getElementById('pur-paid-amt')?.value || 0));
      const dueAmount = Math.max(0, totalAmount - paidAmount);

      purchaseDraftItems.forEach((r) => {
        const inv = state.inventory.find((x) => x.id === r.invId);
        if (inv) {
          inv.stock = Number(inv.stock || 0) + Number(r.qty || 0);
          inv.costPrice = Number(r.costPrice || inv.costPrice);
          inv.sellPrice = Number(r.sellPrice || inv.sellPrice);
        }
      });

      if (supplier) {
        supplier.due = Number(supplier.due || 0) + dueAmount;
      }

      state.purchases.unshift({
        id: 'PUR-' + Date.now(),
        date,
        challanNo,
        supplierId: supplier?.id || '',
        supplierName: supplier?.name || 'মহাজন',
        items: JSON.parse(JSON.stringify(purchaseDraftItems)),
        totalAmount,
        paidAmount,
        dueAmount
      });

      persistState();
      closeModal();
      showToast(`ক্রয় চালান (${challanNo}) সেভ ও স্টক আপডেট হয়েছে!`, 'success');
      renderApp();
    }

    function paySupplierDue(e, supplierId) {
      e.preventDefault();

      sup.due = Math.max(0, Number(sup.due || 0) - amt);
      persistState();
      closeModal();
      showToast(`${sup.name} কে ${formatTk(amt)} পরিশোধ করা হয়েছে!`, 'success');
      renderApp();
    }

          <input id="cust-col-amt" type="number" min="1" max="${cust.totalDue}" value="${cust.totalDue}" required class="w-full px-3 py-2 rounded-xl border-2 border-emerald-600 font-extrabold text-base" />

          </div>
        </form>
      `;
      openModal(html, 'max-w-sm');
    }

    function submitCustomerDueCollect(e, custId) {
      e.preventDefault();
      const cust = (state.customers || []).find((c) => c.id === custId);
      let amt = Number(document.getElementById('cust-col-amt')?.value || 0);
      if (!cust || amt <= 0) return;
      cust.totalDue = Math.max(0, Number(cust.totalDue || 0) - amt);
      (state.orders || []).forEach((o) => {
        if (amt > 0 && o.customerPhone === cust.phone && Number(o.dueAmount || 0) > 0) {
          const pay = Math.min(amt, Number(o.dueAmount || 0));
          o.paidAmount = Number(o.paidAmount || 0) + pay;
          o.dueAmount = Math.max(0, Number(o.dueAmount || 0) - pay);
          amt -= pay;
        }
      });
      persistState();
      closeModal();
      showToast('কাস্টমারের বকেয়া জমা নেওয়া হয়েছে!', 'success');
      renderApp();
    }

    function saveKarigorForm(e, karigorId) {
      e.preventDefault();
      const name = (document.getElementById('krg-f-name')?.value || '').trim();
      const roleType = document.getElementById('krg-f-role')?.value || 'SEWING';
      const phone = (document.getElementById('krg-f-phone')?.value || '').trim();
      if (!name) return;

      if (karigorId) {
        const idx = state.karigors.findIndex((x) => x.id === karigorId);
        if (idx >= 0) {
          state.karigors[idx] = { ...state.karigors[idx], name, roleType, phone };
        }
        showToast(`"${name}" এর তথ্য আপডেট হয়েছে!`, 'success');
      } else {
        state.karigors.push({
          id: (roleType === 'COMPLETE' ? 'CMP-' : 'KRG-') + Date.now(),
          name,
          roleType,
          phone,
          totalEarned: 0,
          totalPaid: 0
        });
        showToast(`নতুন কারিগর "${name}" যুক্ত হয়েছে!`, 'success');
      }
      persistState();
      closeModal();
      renderApp();
    }

    function submitKarigorPayment(e, karigorId) {
      e.preventDefault();
      const k = (state.karigors || []).find((x) => x.id === karigorId);
      const amt = Number(document.getElementById('krg-pay-amt')?.value || 0);
      const note = (document.getElementById('krg-pay-note')?.value || '').trim();
      if (!k || amt <= 0) return;
      k.totalPaid = Number(k.totalPaid || 0) + amt;
      state.karigorPayments.unshift({
        id: 'KPAY-' + Date.now(),
        date: new Date().toISOString().split('T')[0],
        karigorId: k.id,
        karigorName: k.name,
        amount: amt,
        note
      });
      persistState();
      closeModal();
      showToast(`${k.name} কে ${formatTk(amt)} মজুরি পরিশোধ হয়েছে!`, 'success');
      renderApp();

      const date = document.getElementById('exp-date')?.value || new Date().toISOString().split('T')[0];

      state.expenses.unshift({ id: 'EXP-' + Date.now(), date, title, amount });
      persistState();
      showToast('দৈনিক খরচ যুক্ত হয়েছে!', 'success');
      renderApp();
    }

                <div class="flex items-center gap-2">
                  <span class="font-extrabold text-rose-700">${formatTk(ex.amount)}</span>
                  ${isMasterAdmin() ? `<button type="button" onclick="state.expenses=state.expenses.filter(x=>x.id!=='${ex.id}'); persistState(); renderApp();" class="text-rose-600 font-extrabold cursor-pointer">✕</button>` : ''}

    // ==========================================
    // 9. REPORTS, SECTOR DROPDOWN & PARTNERS
    // ==========================================
    function setReportQuickPreset(preset) {
      reportQuickPreset = preset;
      const now = new Date();
      const todayIso = now.toISOString().split('T')[0];
      if (preset === 'TODAY') {
        reportFromDate = todayIso;
        reportToDate = todayIso;
      } else if (preset === 'MONTH') {
        reportFromDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        reportToDate = todayIso;
      } else {
        reportFromDate = '';
        reportToDate = '';
      }
      renderApp();
    }

    function openPartnerFormModal(partnerId = null) {
      if (!requireMasterGuard('পার্টনার যোগ/এডিট')) return;
      const p = partnerId ? (state.partners || []).find((x) => x.id === partnerId) : null;
      const html = `
        <div class="px-5 py-3.5 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">${p ? `✏️ পার্টনার এডিট — ${p.name}` : '🤝 নতুন পার্টনার যোগ করুন'}</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="savePartnerForm(event, '${partnerId || ''}'); return false;" class="p-4 space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">পার্টনারের নাম *</label>
            <input id="prt-name" type="text" required value="${p?.name || ''}" placeholder="পার্টনারের নাম" class="w-full px-3 py-2 rounded-xl border font-extrabold" />
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block font-bold text-slate-700 mb-1">মূলধন (৳)</label>
              <input id="prt-cap" type="number" min="0" value="${p?.capital ?? 0}" class="w-full px-3 py-2 rounded-xl border font-bold" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">লাভের শেয়ার (%)</label>
              <input id="prt-share" type="number" min="0" max="100" step="0.5" required value="${p?.sharePercent ?? 50}" class="w-full px-3 py-2 rounded-xl border font-extrabold text-emerald-800" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">বিভাগ</label>
              <select id="prt-scope" class="w-full px-2.5 py-2 rounded-xl border font-extrabold">
                <option value="BOTH" ${p?.scope === 'BOTH' || !p?.scope ? 'selected' : ''}>উভয় বিভাগ</option>
                <option value="TAILOR" ${p?.scope === 'TAILOR' ? 'selected' : ''}>টেইলার্স</option>
                <option value="RETAIL" ${p?.scope === 'RETAIL' ? 'selected' : ''}>ফেব্রিক্স/পণ্য</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">মোবাইল নম্বর</label>
            <input id="prt-phone" type="tel" value="${p?.phone || ''}" placeholder="017XXXXXXXX" class="w-full px-3 py-2 rounded-xl border font-bold" />
          </div>
          <div class="flex justify-end gap-2 pt-2 border-t">
            ${partnerId && state.partners.length > 1 ? `<button type="button" onclick="state.partners=state.partners.filter(x=>x.id!=='${partnerId}'); persistState(); closeModal(); renderApp();" class="px-3 py-2 rounded-xl bg-rose-50 text-rose-700 font-extrabold cursor-pointer">🗑️ ডিলিট</button>` : ''}
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">✓ সেভ করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-md');
    }

    function savePartnerForm(e, partnerId) {
      e.preventDefault();
      const name = (document.getElementById('prt-name')?.value || '').trim();
      const capital = Number(document.getElementById('prt-cap')?.value || 0);
      const sharePercent = Number(document.getElementById('prt-share')?.value || 0);
      const scope = document.getElementById('prt-scope')?.value || 'BOTH';
      const phone = (document.getElementById('prt-phone')?.value || '').trim();
      if (!name) return;
      if (partnerId) {
        const idx = state.partners.findIndex((x) => x.id === partnerId);
        if (idx >= 0) state.partners[idx] = { ...state.partners[idx], name, capital, sharePercent, scope, phone };
      } else {
        state.partners.push({ id: 'PRT-' + Date.now(), name, capital, sharePercent, withdrawn: 0, scope, phone });
      }
      persistState();
      closeModal();
      showToast('পার্টনার তথ্য সেভ হয়েছে!', 'success');
      renderApp();
    }

    function openPartnerWithdrawModal(partnerId) {
      if (!requireMasterGuard('পার্টনার উত্তোলন এন্ট্রি')) return;
      const today = new Date().toISOString().split('T')[0];
      const html = `
        <div class="px-5 py-3.5 border-b royal-gradient text-white flex justify-between items-center">
          <h3 class="text-sm font-extrabold text-amber-300">💸 লভ্যাংশ উত্তোলন (Withdraw)</h3>
          <button type="button" onclick="closeModal()" class="text-white cursor-pointer">✕</button>
        </div>
        <form onsubmit="savePartnerWithdraw(event); return false;" class="p-4 space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">পার্টনার নির্বাচন *</label>
            <select id="pw-prt-id" required class="w-full px-3 py-2 rounded-xl border font-extrabold">
              ${(state.partners || []).map((p) => `<option value="${p.id}" ${p.id === partnerId ? 'selected' : ''}>${p.name} (${toBnNum(p.sharePercent)}%)</option>`).join('')}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-700 mb-1">টাকার পরিমাণ (৳) *</label>
              <input id="pw-amt" type="number" min="1" required placeholder="0" class="w-full px-3 py-2 rounded-xl border-2 border-emerald-600 font-extrabold text-base" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">তারিখ</label>
              <input id="pw-date" type="date" value="${today}" required class="w-full px-3 py-2 rounded-xl border font-bold" />
            </div>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">নোট</label>
            <input id="pw-note" type="text" placeholder="যেমন: লভ্যাংশ উত্তোলন" class="w-full px-3 py-2 rounded-xl border font-bold" />
          </div>
          <div class="flex justify-end gap-2 pt-2 border-t">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">✓ উত্তোলন সেভ করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-sm');
    }

    function savePartnerWithdraw(e) {
      e.preventDefault();
      const partnerId = document.getElementById('pw-prt-id')?.value;
      const partner = (state.partners || []).find((x) => x.id === partnerId);
      const amount = Number(document.getElementById('pw-amt')?.value || 0);
      const date = document.getElementById('pw-date')?.value || new Date().toISOString().split('T')[0];
      const note = (document.getElementById('pw-note')?.value || '').trim();
      if (!partner || amount <= 0) return;
      state.partnerWithdrawals.unshift({
        id: 'PW-' + Date.now(),
        date,
        partnerId: partner.id,
        partnerName: partner.name,
        amount,
        note
      });
      persistState();
      closeModal();
      showToast(`${partner.name} এর ${formatTk(amount)} উত্তোলন রেকর্ড হয়েছে!`, 'success');
      renderApp();
    }

    function renderReports() {
      if (!isMasterAdmin()) return `<div class="p-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-extrabold text-center">⛔ শুধুমাত্র মাস্টার অ্যাডমিন রিপোর্ট ও লাভ-ক্ষতি দেখতে পারবেন।</div>`;

      const masterPin = (state.auth?.masterAdmins?.[0]?.pin || '').trim();
      if (masterPin && !adminPinUnlocked) {
        return `
          <div class="max-w-sm mx-auto bg-white rounded-2xl p-6 border border-slate-200 text-center space-y-3 text-xs">
            <div class="text-3xl">🔒</div>
            <h3 class="text-base font-extrabold text-slate-900">রিপোর্ট ও লাভ-ক্ষতি সুরক্ষিত</h3>
            <p class="text-slate-500">হিসাব দেখতে মাস্টার অ্যাডমিনের গোপন পিন দিন</p>
            <form onsubmit="if(document.getElementById('rep-unlock-pin').value.trim()==='${masterPin}'){adminPinUnlocked=true; renderApp();}else{showToast('ভুল পিন!','warn');} return false;" class="space-y-3">
              <input id="rep-unlock-pin" type="password" inputmode="numeric" required placeholder="****" class="w-full px-4 py-2.5 rounded-xl border-2 border-emerald-500 text-center text-lg font-extrabold tracking-widest" />
              <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">✓ আনলক করুন</button>
            </form>
          </div>
        `;
      }

      const filteredOrders = (state.orders || []).filter((o) => {
        const dStr = String(o.orderDate || o.createdAt || '').slice(0, 10);
        if (reportFromDate && dStr < reportFromDate) return false;
        if (reportToDate && dStr > reportToDate) return false;
        return true;
      });

      const filteredExpenses = (state.expenses || []).filter((e) => {
        const dStr = String(e.date || '').slice(0, 10);
        if (reportFromDate && dStr < reportFromDate) return false;
        if (reportToDate && dStr > reportToDate) return false;
        return true;
      });

      const filteredWithdrawals = (state.partnerWithdrawals || []).filter((w) => {
        const dStr = String(w.date || '').slice(0, 10);
        if (reportFromDate && dStr < reportFromDate) return false;
        if (reportToDate && dStr > reportToDate) return false;
        return true;
      });

      const fin = calculateFinancials(filteredOrders);
      const totalExp = filteredExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
      const tailorNet = fin.tailorRevenue - fin.karigorCost;
      const retailGrossProfit = fin.retailRevenue - fin.retailCost;
      const retailNet = reportDeductExpFromRetail ? (retailGrossProfit - totalExp) : retailGrossProfit;
      const combinedNetProfit = tailorNet + retailNet;

      const tabLabels = {
        TAILOR: { icon: '✂️', title: 'টেইলার্স মজুরি লাভ', desc: 'শুধুমাত্র সেলাই আয় ও কারিগর মজুরি বাদে নিট লাভ' },
        RETAIL: { icon: '🧵', title: 'ফেব্রিক্স ও প্রোডাক্ট লাভ', desc: 'শুধুমাত্র গজ কাপড় ও পণ্যের লাভ (টেইলার্স ছাড়া)' },
        PARTNERS: { icon: '🤝', title: 'পার্টনারদের লভ্যাংশ ও মূলধন', desc: 'পার্টনারদের নাম, মূলধন, শেয়ার %, উত্তোলন ও নিট পাওনা' },
        SUMMARY: { icon: '📋', title: 'পূর্ণাঙ্গ সারসংক্ষেপ (সব সেক্টর)', desc: 'একনজরে সব সেক্টরের হিসাব ও প্রিন্ট' }
      };
      const curTab = tabLabels[activeReportSubTab] || tabLabels.TAILOR;
      const periodLabel = (!reportFromDate && !reportToDate)
        ? 'সর্বমোট (All Time)'
        : `${formatDateNice(reportFromDate)} — ${formatDateNice(reportToDate)}`;

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-2xs space-y-4 text-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 relative">
              <div class="relative">
                <button type="button" onclick="reportDropdownOpen=!reportDropdownOpen; renderApp();" class="px-4 py-2.5 rounded-2xl royal-gradient text-amber-300 font-extrabold text-xs sm:text-sm shadow flex items-center gap-2 cursor-pointer">
                  <span>${curTab.icon}</span>
                  <span>${curTab.title}</span>
                  <span>${reportDropdownOpen ? '▴' : '▾'}</span>
                </button>

                ${reportDropdownOpen ? `
                  <div class="absolute left-0 mt-2 w-72 sm:w-80 bg-white rounded-2xl shadow-2xl border border-slate-200 z-30 overflow-hidden">
                    <div class="px-4 py-2.5 bg-slate-50 border-b text-[11px] font-extrabold text-slate-500">📊 লাভের সেক্টর নির্বাচন করুন</div>
                    ${Object.entries(tabLabels).map(([k, info]) => `
                      <button type="button" onclick="activeReportSubTab='${k}'; reportDropdownOpen=false; renderApp();" class="w-full px-4 py-3 text-left flex items-start gap-2.5 border-b border-slate-100 last:border-0 hover:bg-emerald-50/70 cursor-pointer ${activeReportSubTab === k ? 'bg-emerald-50' : ''}">
                        <span class="text-lg mt-0.5">${info.icon}</span>
                        <div class="min-w-0 flex-1">
                          <div class="font-extrabold text-slate-900 flex items-center justify-between">
                            <span>${info.title}</span>
                            ${activeReportSubTab === k ? '<span class="text-emerald-700">✓</span>' : ''}
                          </div>
                          <div class="text-[11px] text-slate-500 mt-0.5">${info.desc}</div>
                        </div>
                      </button>
                    `).join('')}
                  </div>
                ` : ''}
              </div>

              <button type="button" onclick="printCurrentPageReport()" class="px-4 py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-amber-300 font-extrabold flex items-center gap-1.5 shadow cursor-pointer">
                <span>🖨️</span>
                <span>প্রিন্ট করুন</span>
              </button>
            </div>

            <div class="grid grid-cols-2 gap-3 max-w-md">
              <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1">শুরুর তারিখ (From)</label>
                <input type="date" value="${reportFromDate}" onchange="reportFromDate=this.value; reportQuickPreset='CUSTOM'; renderApp();" class="w-full px-3 py-2 rounded-2xl border border-slate-300 font-extrabold text-slate-800 bg-slate-50" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1">শেষ তারিখ (To)</label>
                <input type="date" value="${reportToDate}" onchange="reportToDate=this.value; reportQuickPreset='CUSTOM'; renderApp();" class="w-full px-3 py-2 rounded-2xl border border-slate-300 font-extrabold text-slate-800 bg-slate-50" />
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <button type="button" onclick="setReportQuickPreset('TODAY')" class="px-4 py-1.5 rounded-full font-extrabold cursor-pointer ${reportQuickPreset === 'TODAY' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">আজ</button>
              <button type="button" onclick="setReportQuickPreset('MONTH')" class="px-4 py-1.5 rounded-full font-extrabold cursor-pointer ${reportQuickPreset === 'MONTH' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">চলতি মাস</button>
              <button type="button" onclick="setReportQuickPreset('ALL')" class="px-4 py-1.5 rounded-full font-extrabold cursor-pointer ${reportQuickPreset === 'ALL' ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">সর্বমোট</button>
            </div>

            <div class="text-xs font-bold text-slate-600">
              সময়কালঃ <span class="font-extrabold text-slate-900">${periodLabel}</span>
            </div>
          </div>

          ${activeReportSubTab === 'TAILOR' ? `
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-4">
              <div class="flex items-center justify-between gap-2">
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900 flex items-center gap-2"><span>✂️</span><span>টেইলার্স মজুরি সেক্টর লাভ</span></h3>
                <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-[11px] font-extrabold">শুধুমাত্র সেলাই হিসাব</span>
              </div>
              <div class="space-y-2.5 text-sm">
                <div class="flex justify-between items-center text-slate-700"><span>মোট সেলাই অর্ডার আয়ঃ</span><span class="font-extrabold text-slate-900">${formatTk(fin.tailorRevenue)}</span></div>
                <div class="flex justify-between items-center text-slate-700"><span>বাদ (-): কারিগর ও কমপ্লিট মজুরিঃ</span><span class="font-extrabold text-rose-600">- ${formatTk(fin.karigorCost)}</span></div>
              </div>
              <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-between">
                <span class="text-base font-extrabold text-emerald-950">টেইলার্স সেক্টরের নিট লাভ</span>
                <span class="text-2xl font-extrabold text-emerald-800">${formatTk(tailorNet)}</span>
              </div>
            </div>
          ` : ''}

          ${activeReportSubTab === 'RETAIL' ? `
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-4">
              <div class="flex items-center justify-between gap-2">
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900 flex items-center gap-2"><span>🧵</span><span>ফেব্রিক্স ও প্রোডাক্ট সেক্টর লাভ</span></h3>
                <span class="px-3 py-1 rounded-full bg-blue-50 text-blue-800 border border-blue-200 text-[11px] font-extrabold">টেইলার্স ছাড়া</span>
              </div>
              <div class="space-y-2.5 text-sm">
                <div class="flex justify-between items-center text-slate-700"><span>মোট গজ কাপড় ও পণ্য বিক্রিঃ</span><span class="font-extrabold text-slate-900">${formatTk(fin.retailRevenue)}</span></div>
                <div class="flex justify-between items-center text-slate-700"><span>বাদ (-): ক্রয়মূল্য (Cost):</span><span class="font-extrabold text-rose-600">- ${formatTk(fin.retailCost)}</span></div>
                <label class="flex items-center gap-2 text-xs font-bold text-slate-700 pt-1 cursor-pointer">
                  <input type="checkbox" ${reportDeductExpFromRetail ? 'checked' : ''} onchange="reportDeductExpFromRetail=this.checked; renderApp();" class="accent-emerald-700 w-4 h-4" />
                  <span>দৈনিক খরচ (${formatTk(totalExp)}) ফেব্রিক্স লাভ থেকে বাদ দিন</span>
                </label>
              </div>
              <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-between">
                <span class="text-base font-extrabold text-emerald-950">ফেব্রিক্স ও পণ্যের নিট লাভ</span>
                <span class="text-2xl font-extrabold text-emerald-800">${formatTk(retailNet)}</span>
              </div>
            </div>
