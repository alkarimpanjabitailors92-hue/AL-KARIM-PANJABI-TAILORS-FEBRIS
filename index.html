    function toBnNum(val) {

    function formatDateNice(isoStr) {

    }

    function compressImageFileToDataUrl(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxSide = 240;
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; } }
          else { if (h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; } }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function calculateFinancials(ordersSubset = null) {
      const targetOrders = Array.isArray(ordersSubset) ? ordersSubset : state.orders;
      let totalSales = 0;
      let totalCollected = 0;
      let totalDue = 0;
      let tailorRevenue = 0;
      let tailorKarigorCost = 0;
      let retailRevenue = 0;
      let retailCost = 0;

      const orderBreakdown = targetOrders.map((ord) => {
        const sub = (ord.items || []).reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
        const disc = Number(ord.discount || 0);
        const netTotal = Math.max(0, sub - disc);
        const paid = Number(ord.paidAmount || 0);
        const due = Math.max(0, netTotal - paid);

        totalSales += netTotal;
        totalCollected += paid;
        totalDue += due;

        (ord.items || []).forEach((it) => {
          const lineTotal = Number(it.price || 0) * Number(it.qty || 1);
          if (it.type === 'tailor') {
            tailorRevenue += lineTotal;
            tailorKarigorCost += Number(it.karigorFee || 0) * Number(it.qty || 1);
          } else {
            retailRevenue += lineTotal;
            retailCost += Number(it.buyPrice || 0) * Number(it.qty || 1);
          }
        });

        return { id: ord.id, subTotal: sub, discount: disc, netTotal, paid, due };
      });

      const totalExpenses = ordersSubset ? 0 : (state.expenses || []).reduce((s, ex) => s + Number(ex.amount || 0), 0);
      const tailorProfit = tailorRevenue - tailorKarigorCost;
      const retailProfit = retailRevenue - retailCost;
      const netProfit = tailorProfit + retailProfit - totalExpenses;

      return {
        totalSales,
        totalCollected,
        totalDue,
        tailorRevenue,
        tailorKarigorCost,
        tailorProfit,
        retailRevenue,
        retailCost,
        retailProfit,
        totalExpenses,
        netProfit,
        orderBreakdown
      };
    }

    function startFreshNewOrder() {
      editingOrderId = null;
      orderCatalogTab = 'tailor';
      orderFabricSearch = '';
      orderProductSearch = '';
      state.cart = [];
      state.draftCustomer = {
        name: '',
        phone: '',
        address: '',
        deliveryDate: new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0],
        discount: 0,
        paidAmount: 0,
        paymentMethod: 'Cash',
        note: ''
      };
      navigateToTab('new-order');
    }

    function handleDraftPhoneInput(phoneVal) {
      state.draftCustomer.phone = phoneVal;
      const clean = phoneVal.trim();
      if (clean.length >= 6) {
        const prevOrder = state.orders.find((o) => (o.customerPhone || '').includes(clean));
        const prevCust = state.customers.find((c) => (c.phone || '').includes(clean));
        if (prevOrder) {
          if (!state.draftCustomer.name) state.draftCustomer.name = prevOrder.customerName;
          if (!state.draftCustomer.address && prevOrder.customerAddress) state.draftCustomer.address = prevOrder.customerAddress;
        } else if (prevCust) {
          if (!state.draftCustomer.name) state.draftCustomer.name = prevCust.name;
          if (!state.draftCustomer.address && prevCust.address) state.draftCustomer.address = prevCust.address;
        }
      }
      renderApp();
      setTimeout(() => {
        const el = document.getElementById('draft-phone-inp');
        if (el) {
          el.focus();
          el.setSelectionRange(el.value.length, el.value.length);
        }
      }, 0);
    }

    function loadPreviousMeasurementsForCustomer() {
      const phone = (state.draftCustomer.phone || '').trim();
      const name = (state.draftCustomer.name || '').trim().toLowerCase();
      const prevOrd = state.orders.find(
        (o) =>
          (phone && phone !== 'N/A' && o.customerPhone === phone) ||
          (name && (o.customerName || '').toLowerCase() === name)
      );
      if (!prevOrd) {
        showToast('এই কাস্টমারের পূর্বের কোনো মাপ পাওয়া যায়নি।', 'warn');
        return;
      }
      const prevTailorItems = (prevOrd.items || []).filter((it) => it.type === 'tailor');
      if (prevTailorItems.length === 0) {
        showToast('পূর্বের অর্ডারে কোনো সেলাইয়ের মাপ ছিল না।', 'warn');
        return;
      }
      prevTailorItems.forEach((it) => {
        state.cart.push({
          ...JSON.parse(JSON.stringify(it)),
          uid: 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
        });
      });
      persistState();
      showToast(`পূর্বের অর্ডার #${prevOrd.id.replace('ORD-', '')} থেকে মাপ লোড হয়েছে!`, 'success');
      renderApp();
    }

    function loadOrderIntoFullEditor(orderId) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      editingOrderId = ord.id;

    function addInstantDesignCheckbox(garmentId) {
      const inp = document.getElementById('instant-new-design-inp');
      const box = document.getElementById('modal-design-options-box');
      if (!inp || !box) return;
      const val = inp.value.trim();
      if (!val) return;
      const lbl = document.createElement('label');
      lbl.className = 'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-emerald-400 bg-emerald-50 cursor-pointer font-bold';
      lbl.innerHTML = `<input type="checkbox" value="${val.replace(/"/g, '&quot;')}" checked class="grm-design-chk accent-emerald-700" /><span>${val}</span>`;
      box.appendChild(lbl);
      const grm = state.garments.find((g) => g.id === garmentId);
      if (grm && Array.isArray(grm.designs) && !grm.designs.includes(val)) {
        grm.designs.push(val);
        persistState();
      }
      inp.value = '';
    }

    function updateEstimatedFabricYardage() {
      const hintEl = document.getElementById('fabric-yardage-hint');
      if (!hintEl) return;
      const qty = Math.max(1, Number(document.getElementById('grm-qty')?.value || 1));
      let lengthVal = 0;
      let bodyVal = 0;
      document.querySelectorAll('.grm-meas-field').forEach((inp) => {
        const key = inp.getAttribute('data-field') || '';
        const num = parseFloat(inp.value);
        if (!isNaN(num)) {
          if (key === 'লম্বা' || key.includes('লম্বা')) lengthVal = num;
          if (key === 'বডি' || key === 'হিপ') bodyVal = num;
        }
      });

      let perPieceYards = 2.5;
      if (lengthVal > 0) {
        if (lengthVal <= 28) perPieceYards = 1.75;
        else if (lengthVal <= 36) perPieceYards = 2.0;
        else if (lengthVal <= 41) perPieceYards = 2.5;
        else if (lengthVal <= 46) perPieceYards = 2.75;
        else perPieceYards = 3.25;
      }
      if (bodyVal >= 44) perPieceYards += 0.25;

      const totalYards = (perPieceYards * qty).toFixed(2);
      hintEl.textContent = `🧵 আনুমানিক কাপড়: ${toBnNum(totalYards)} গজ`;
    }

    function submitGarmentToCart(e, garmentId, editCartUid) {
      e.preventDefault();
      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;

      const qty = Math.max(1, Number(document.getElementById('grm-qty')?.value || 1));
      const price = Number(document.getElementById('grm-price')?.value || grm.price);
      const karigorFee = Number(document.getElementById('grm-kfee')?.value || grm.karigorFee);
      const karigorName = document.getElementById('grm-karigor')?.value || (state.karigors[0]?.name || '');
      const linkedFabric = document.getElementById('grm-linked-fabric')?.value || '';
      const extraNote = (document.getElementById('grm-extra-note')?.value || '').trim();
      const tagNote = (document.getElementById('grm-tag-note')?.value || '').trim();

      const measurements = {};
      document.querySelectorAll('.grm-meas-field').forEach((inp) => {
        measurements[inp.getAttribute('data-field')] = inp.value.trim();
      });

      const selectedDesigns = [];
      document.querySelectorAll('.grm-design-chk:checked').forEach((chk) => {
        selectedDesigns.push(chk.value);
      });

      const designNotes = [...selectedDesigns, extraNote].filter(Boolean).join(', ');

      const itemObj = {
        uid: editCartUid || 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        type: 'tailor',
        refId: grm.id,
        name: grm.name,
        qty,
        price,
        karigorFee,
        karigorName,
        linkedFabric,
        measurements,
        selectedDesigns,
        extraNote,
        tagNote,
        designNotes
      };

      if (editCartUid) {
        const idx = state.cart.findIndex((c) => c.uid === editCartUid);
        if (idx !== -1) state.cart[idx] = itemObj;
      } else {
        state.cart.push(itemObj);
      }

      persistState();
      closeModal();
      showToast(`${grm.name} (${toBnNum(qty)}টি) কার্টে যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function submitInventorySelectToCart(e, invId) {
      e.preventDefault();
      const inv = state.inventory.find((i) => i.id === invId);
      if (!inv) return;
      const qty = Number(document.getElementById('sel-inv-qty')?.value || 0);
      const price = Number(document.getElementById('sel-inv-rate')?.value || inv.sellPrice);
      const variantName = document.querySelector('input[name="sel-inv-variant"]:checked')?.value || '';
      if (qty <= 0) return;

      const displayName = variantName ? `${inv.name} (${variantName})` : inv.name;
      state.cart.push({
        uid: 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        type: inv.category === 'Fabrics' ? 'fabric' : 'product',
        refId: inv.id,
        code: inv.code,
        name: displayName,
        unit: inv.unit,
        qty,
        price,
        buyPrice: Number(inv.buyPrice || 0)
      });

      persistState();
      closeModal();
      showToast(`${displayName} (${toBnNum(qty)} ${inv.unit}) যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function updateCartItemQty(uid, newQty) {
      const item = state.cart.find((c) => c.uid === uid);
      if (!item) return;
      const q = Number(newQty);
      if (q <= 0) {
        state.cart = state.cart.filter((c) => c.uid !== uid);
      } else {
        item.qty = q;
      }
      persistState();
      renderApp();
    }

    function removeCartItem(uid) {
      state.cart = state.cart.filter((c) => c.uid !== uid);
      persistState();
      renderApp();
    }

    function renderNewOrder() {
      const subTotal = state.cart.reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const discount = Number(state.draftCustomer.discount || 0);
      const netTotal = Math.max(0, subTotal - discount);
      const paid = Number(state.draftCustomer.paidAmount || 0);
      const due = Math.max(0, netTotal - paid);

      const fQuery = (orderFabricSearch || '').trim().toLowerCase();
      const pQuery = (orderProductSearch || '').trim().toLowerCase();

      const fabricsList = state.inventory.filter(
        (i) => i.category === 'Fabrics' && (!fQuery || i.name.toLowerCase().includes(fQuery) || i.code.toLowerCase().includes(fQuery))
      );
      const productsList = state.inventory.filter(
        (i) => i.category === 'Product' && (!pQuery || i.name.toLowerCase().includes(pQuery) || i.code.toLowerCase().includes(pQuery))
      );

      const draftPhone = (state.draftCustomer.phone || '').trim();

              <button type="button" onclick="startFreshNewOrder()" class="px-3 py-1 rounded-lg bg-white border border-amber-400 text-xs font-bold cursor-pointer">নতুন অর্ডারে ফিরুন</button>
            </div>
          ` : ''}

          <!-- 1. TOP COLORFUL CUSTOMER DETAILS CARD (ALWAYS FIRST) -->
          <div class="rounded-2xl overflow-hidden shadow-md border-2 border-emerald-700/40 bg-white">
            <div class="royal-gradient px-4 py-3 text-white flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-lg">👤</span>
                <span class="text-sm sm:text-base font-extrabold text-amber-300">১. কাস্টমারের তথ্য ও ডেলিভারি তারিখ</span>
              </div>
              <span class="px-2.5 py-0.5 rounded-full bg-amber-400/20 border border-amber-300/40 text-amber-200 text-[11px] font-bold">
                মোবাইল ও নাম আবশ্যক *
              </span>
            </div>

            <div class="p-4 bg-gradient-to-br from-emerald-50/70 via-white to-amber-50/50 space-y-3">

                <div>
                  <label class="block text-xs font-extrabold text-emerald-950 mb-1">📞 মোবাইল নম্বর <span class="text-rose-600">*</span></label>
                  <input
                    id="draft-phone-inp"
                    type="tel"
                    required
                    value="${state.draftCustomer.phone}"
                    oninput="handleDraftPhoneInput(this.value)"
                    placeholder="01XXXXXXXXX"
                    class="w-full px-3.5 py-3 rounded-xl border-2 border-emerald-500 bg-white font-extrabold text-sm sm:text-base text-slate-900 outline-none focus:ring-2 focus:ring-emerald-500/30"
                  />
                </div>

                <div>
                  <label class="block text-xs font-extrabold text-emerald-950 mb-1">✍️ কাস্টমারের নাম <span class="text-rose-600">*</span></label>
                  <input
                    id="draft-name-inp"
                    type="text"
                    required
                    value="${state.draftCustomer.name}"
                    oninput="state.draftCustomer.name = this.value"
                    placeholder="কাস্টমারের পূর্ণ নাম লিখুন"
                    class="w-full px-3.5 py-3 rounded-xl border-2 border-emerald-500 bg-white font-extrabold text-sm sm:text-base text-slate-900 outline-none focus:ring-2 focus:ring-emerald-500/30"
                  />
                </div>

                <div>
                  <label class="block text-xs font-extrabold text-amber-950 mb-1">📅 ডেলিভারি তারিখ <span class="text-rose-600">*</span></label>
                  <input
                    type="date"
                    required
                    value="${state.draftCustomer.deliveryDate}"
                    onchange="state.draftCustomer.deliveryDate = this.value"

                  <label class="block text-xs font-bold text-slate-700 mb-1">📍 ঠিকানা (ঐচ্ছিক)</label>

                  />
                </div>
              </div>

              ${hasPrevOrder ? `
                <div class="p-2.5 rounded-xl bg-amber-100/80 border border-amber-400 flex items-center justify-between gap-2">

                </div>

            </div>
          </div>

          <!-- 2. THREE SIDE-BY-SIDE CATALOG TABS + CART SUMMARY -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

                <span class="text-[11px] font-bold text-slate-500">ট্যাব বেছে আইটেমে চাপুন</span>

              <!-- 3 Side-by-Side Buttons: Fabrics, Product, Tailors Item -->

                <button type="button" onclick="orderCatalogTab='product'; renderApp();" class="py-2.5 px-2 rounded-xl font-extrabold text-xs text-center border-2 transition cursor-pointer ${orderCatalogTab === 'product' ? 'bg-teal-700 text-white border-teal-700 shadow-sm' : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-teal-400'}">
                  🧢 প্রোডাক্ট<br/><span class="text-[10px] opacity-90">(Product — ${toBnNum(productsList.length)}টি)</span>

                <button type="button" onclick="orderCatalogTab='tailor'; renderApp();" class="py-2.5 px-2 rounded-xl font-extrabold text-xs text-center border-2 transition cursor-pointer ${orderCatalogTab === 'tailor' ? 'bg-emerald-800 text-amber-300 border-emerald-800 shadow-sm' : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-emerald-500'}">
                  ✂️ টেইলার্স আইটেম<br/><span class="text-[10px] opacity-90">(Tailors — ${toBnNum(state.garments.length)}টি)</span>
                </button>
              </div>

              ${orderCatalogTab === 'tailor' ? `
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-[430px] overflow-y-auto pr-1">
                  ${state.garments.map((g) => `
                    <button type="button" onclick="openGarmentMeasurementModal('${g.id}')" class="p-3 rounded-xl border border-slate-200 hover:border-emerald-600 hover:bg-emerald-50/70 text-left transition flex flex-col justify-between gap-1.5 cursor-pointer">
                      <div class="flex items-center justify-between gap-1">
                        ${g.image ? `<img src="${g.image}" class="w-10 h-10 rounded-lg object-cover border border-slate-200" />` : `<span class="text-2xl">${g.icon || '👘'}</span>`}
                        <span class="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 font-extrabold text-[11px]">${formatTk(g.price)}</span>
                      </div>
                      <div class="font-extrabold text-xs text-slate-900 leading-snug">${g.name}</div>
                      <div class="text-[10px] text-emerald-700 font-extrabold">+ মাপ ও ডিজাইন দিন</div>
                    </button>
                  `).join('')}
                </div>
              ` : ''}

              ${orderCatalogTab === 'fabric' ? `
                <div class="space-y-2.5">
                  <input
                    id="order-fab-search"
                    type="text"
                    value="${orderFabricSearch}"
                    oninput="orderFabricSearch = this.value; renderApp(); setTimeout(() => { const el = document.getElementById('order-fab-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0);"
                    placeholder="🔍 গজ কাপড়ের নাম বা কোড লিখে খুঁজুন..."
                    class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold outline-none focus:border-indigo-600"
                  />
                  <div class="space-y-2 max-h-96 overflow-y-auto pr-1">
                    ${fabricsList.map((f) => `
                      <div class="p-2.5 rounded-xl border border-slate-200 flex items-center justify-between gap-2 bg-slate-50/60">
                        <div class="flex items-center gap-2.5 min-w-0">
                          <div class="w-10 h-10 rounded-lg border border-slate-200 bg-white flex items-center justify-center overflow-hidden shrink-0">
                            ${f.image ? `<img src="${f.image}" class="w-full h-full object-cover" />` : `<span class="text-lg">🧵</span>`}
                          </div>
                          <div class="min-w-0">
                            <div class="font-extrabold text-xs text-indigo-950 truncate">Code: ${f.code} ${f.name}</div>
                            <div class="text-[11px] text-slate-600">দর: <b>${formatTk(f.sellPrice)}</b>/গজ • স্টক: ${toBnNum(f.stock)} ${f.cutNote ? `• <span class="text-amber-700 font-bold">✂️ ${f.cutNote}</span>` : ''}</div>
                          </div>
                        </div>
                        <button type="button" onclick="openInventorySelectForCartModal('${f.id}')" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold shrink-0 cursor-pointer">নির্বাচন</button>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              ${orderCatalogTab === 'product' ? `
                <div class="space-y-2.5">
                  <input
                    id="order-prd-search"
                    type="text"
                    value="${orderProductSearch}"
                    oninput="orderProductSearch = this.value; renderApp(); setTimeout(() => { const el = document.getElementById('order-prd-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0);"
                    placeholder="🔍 প্রোডাক্টের নাম বা কোড লিখে খুঁজুন..."
                    class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold outline-none focus:border-teal-600"
                  />
                  <div class="space-y-2 max-h-96 overflow-y-auto pr-1">
                    ${productsList.map((p) => `
                      <div class="p-2.5 rounded-xl border border-slate-200 flex items-center justify-between gap-2 bg-slate-50/60">
                        <div class="flex items-center gap-2.5 min-w-0">
                          <div class="w-10 h-10 rounded-lg border border-slate-200 bg-white flex items-center justify-center overflow-hidden shrink-0">
                            ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover" />` : `<span class="text-lg">🧢</span>`}
                          </div>
                          <div class="min-w-0">
                            <div class="font-extrabold text-xs text-teal-950 truncate">Code: ${p.code} ${p.name}</div>
                            <div class="text-[11px] text-slate-600">দর: <b>${formatTk(p.sellPrice)}</b> • স্টক: ${toBnNum(p.stock)}</div>
                          </div>
                        </div>
                        <button type="button" onclick="openInventorySelectForCartModal('${p.id}')" class="px-3 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-extrabold shrink-0 cursor-pointer">নির্বাচন</button>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Right Column: Cart & Payment Summary -->
            <div class="lg:col-span-5">
              <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3.5 text-xs">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                  <h3 class="text-sm font-extrabold text-slate-900">🧾 ৩. নির্বাচিত আইটেম ও বিল হিসাব</h3>
                  <span class="px-2.5 py-0.5 rounded-md bg-emerald-100 text-emerald-800 font-extrabold">${toBnNum(state.cart.length)} আইটেম</span>
                </div>

                <div class="space-y-2 max-h-64 overflow-y-auto">
                  ${state.cart.length === 0 ? `
                    <div class="text-center py-6 text-slate-400 font-semibold">বাম পাশ থেকে টেইলার্স আইটেম, গজ কাপড় বা প্রোডাক্ট যোগ করুন</div>
                  ` : state.cart.map((it) => `
                    <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
                      <div class="min-w-0 flex-1">
                        <div class="font-extrabold text-slate-900 truncate">
                          ${it.type === 'tailor' ? '✂️' : it.type === 'fabric' ? '🧵' : '🧢'} ${it.name}
                        </div>
                        <div class="text-[10px] text-slate-500">
                          দর: ${formatTk(it.price)} × ${toBnNum(it.qty)} = <b>${formatTk(Math.round(it.price * it.qty))}</b>
                        </div>
                        ${it.linkedFabric ? `<div class="text-[10px] text-indigo-700 font-bold">🧵 কাপড়: ${it.linkedFabric}</div>` : ''}
                        ${it.tagNote ? `<div class="text-[10px] text-amber-800 font-extrabold">🏷️ ট্যাগ নোট: ${it.tagNote}</div>` : ''}
                        ${it.type === 'tailor' ? `
                          <button type="button" onclick="openGarmentMeasurementModal('${it.refId}', '${it.uid}')" class="mt-1 text-[10px] font-extrabold text-emerald-700 underline cursor-pointer">📏 মাপ ও ডিজাইন এডিট</button>
                        ` : ''}
                      </div>
                      <div class="flex items-center gap-1 shrink-0">
                        <input type="number" step="any" min="0.25" value="${it.qty}" onchange="updateCartItemQty('${it.uid}', this.value)" class="w-14 px-1.5 py-1 rounded-lg border border-slate-300 text-center font-extrabold" />
                        <button type="button" onclick="removeCartItem('${it.uid}')" class="p-1.5 rounded-lg bg-rose-50 text-rose-600 font-bold cursor-pointer">✕</button>
                      </div>
                    </div>
                  `).join('')}
                </div>

                <div class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                  <div class="flex justify-between font-bold text-slate-700">
                    <span>মোট বিল (Sub Total):</span>
                    <span>${formatTk(subTotal)}</span>
                  </div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-bold text-slate-700">ডিসকাউন্ট (৳):</span>
                    <input type="number" min="0" value="${discount}" oninput="state.draftCustomer.discount = Number(this.value || 0); renderApp();" class="w-24 px-2 py-1 rounded-lg border border-slate-300 text-right font-extrabold" />
                  </div>
                  <div class="flex justify-between font-extrabold text-sm text-slate-900 border-t border-slate-200 pt-1.5">
                    <span>সর্বমোট প্রদেয়:</span>
                    <span>${formatTk(netTotal)}</span>
                  </div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-bold text-emerald-800">অগ্রিম / জমা (৳):</span>
                    <input type="number" min="0" value="${paid}" oninput="state.draftCustomer.paidAmount = Number(this.value || 0); renderApp();" class="w-24 px-2 py-1 rounded-lg border border-emerald-400 bg-white text-right font-extrabold text-emerald-800" />
                  </div>
                  <div class="flex justify-between font-extrabold text-sm ${due > 0 ? 'text-rose-600' : 'text-emerald-700'}">

                    <span>${formatTk(due)}</span>
                  </div>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl royal-gradient text-amber-300 font-extrabold text-sm shadow-md hover:opacity-95 transition cursor-pointer">
                  ${editingOrderId ? '✓ কাস্টমাইজ অর্ডার আপডেট ও মেমো প্রিন্ট' : '✓ অর্ডার সেভ ও A4 মেমো প্রিন্ট'}

      `;
    }

    function submitFinalOrder(e) {
      e.preventDefault();
      const phone = (state.draftCustomer.phone || '').trim();
      const name = (state.draftCustomer.name || '').trim();
      const address = (state.draftCustomer.address || '').trim();
      const deliveryDate = state.draftCustomer.deliveryDate;

      if (!phone) {
        showToast('অনুগ্রহ করে কাস্টমারের মোবাইল নম্বর লিখুন!', 'warn');
        document.getElementById('draft-phone-inp')?.focus();
        return;
      }
      if (!name) {
        showToast('অনুগ্রহ করে কাস্টমারের নাম লিখুন!', 'warn');
        document.getElementById('draft-name-inp')?.focus();
        return;
      }
      if (state.cart.length === 0) {
        showToast('অন্তত একটি পোশাক, কাপড় বা প্রোডাক্ট যোগ করুন!', 'warn');
        return;
      }

      const discount = Number(state.draftCustomer.discount || 0);
      const paidAmount = Number(state.draftCustomer.paidAmount || 0);

      let orderId = editingOrderId;
      if (editingOrderId) {
        const existingIdx = state.orders.findIndex((o) => o.id === editingOrderId);
        if (existingIdx !== -1) {
          const oldOrd = state.orders[existingIdx];
          (oldOrd.items || []).forEach((it) => {
            if (it.type !== 'tailor') {
              const inv = state.inventory.find((x) => x.id === it.refId);
              if (inv) inv.stock = Number(inv.stock || 0) + Number(it.qty || 0);
            }
          });
          state.cart.forEach((it) => {
            if (it.type !== 'tailor') {
              const inv = state.inventory.find((x) => x.id === it.refId);
              if (inv) inv.stock = Math.max(0, Number(inv.stock || 0) - Number(it.qty || 0));
            }
          });
          state.orders[existingIdx] = {
            ...oldOrd,
            customerName: name,
            customerPhone: phone,
            customerAddress: address,
            deliveryDate,
            discount,
            paidAmount,
            items: JSON.parse(JSON.stringify(state.cart))
          };
        }
      } else {
        const nextSerial = 5660 + state.orders.length + 1;
        orderId = 'ORD-' + nextSerial;
        state.cart.forEach((it) => {
          if (it.type !== 'tailor') {
            const inv = state.inventory.find((x) => x.id === it.refId);
            if (inv) inv.stock = Math.max(0, Number(inv.stock || 0) - Number(it.qty || 0));
          }
        });
        state.orders.unshift({
          id: orderId,
          orderDate: new Date().toISOString(),
          deliveryDate,
          customerName: name,
          customerPhone: phone,
          customerAddress: address,
          status: 'Cutting',
          discount,
          paidAmount,
          paymentMethod: state.draftCustomer.paymentMethod || 'Cash',
          items: JSON.parse(JSON.stringify(state.cart))
        });
      }

      const custOrdersAll = state.orders.filter(
        (o) => (phone !== 'N/A' && o.customerPhone === phone) || o.customerName === name
      );
      const recalculatedCustDue = custOrdersAll.reduce((s, o) => s + calculateFinancials([o]).totalDue, 0);

      let cust = state.customers.find((c) => phone !== 'N/A' && c.phone === phone);
      if (!cust) {
        state.customers.unshift({
          id: 'CUST-' + Date.now(),
          name,
          phone,
          address,
          due: recalculatedCustDue
        });
      } else {
        cust.name = name;
        if (address) cust.address = address;
        cust.due = recalculatedCustDue;
      }

      editingOrderId = null;
      state.cart = [];
      state.draftCustomer = {
        name: '',
        phone: '',
        address: '',
        deliveryDate: new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0],
        discount: 0,
        paidAmount: 0,
        paymentMethod: 'Cash',
        note: ''
      };
      state.activeTab = 'orders';
      persistState();
      showToast('অর্ডার সফলভাবে সেভ হয়েছে!', 'success');
      renderApp();
      printOrderMemo(orderId);
    }

    // ==========================================
    // 5. DUAL A4 MEMO PRINT (CUSTOMER + KARIGOR)
    // ==========================================
    function buildDualA4MemoHtml(ord) {
      const serialNum = toBnNum(ord.id.replace('ORD-', ''));
      const orderDateStr = new Date(ord.orderDate || Date.now()).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      const delivDateStr = formatDateNice(ord.deliveryDate);

      const subTotal = (ord.items || []).reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const discount = Number(ord.discount || 0);
      const netTotal = Math.max(0, subTotal - discount);
      const paid = Number(ord.paidAmount || 0);
      const due = Math.max(0, netTotal - paid);

      const custOrders = state.orders.filter(
        (o) => o.id !== ord.id && ((ord.customerPhone && ord.customerPhone !== 'N/A' && o.customerPhone === ord.customerPhone) || o.customerName === ord.customerName)
      );
      const prevDue = custOrders.reduce((s, o) => s + calculateFinancials([o]).totalDue, 0);
      const totalDueWithPrev = prevDue + due;

      const tailorItems = (ord.items || []).filter((it) => it.type === 'tailor');
      const sortedTailorItems = [...tailorItems].sort((a, b) => {
        const rank = (name) => {
          if (name.includes('পাঞ্জাবি') || name.includes('কাবলি') || name.includes('জুব্বা') || name.includes('একছাট') || name.includes('কাস্টমার') || name.includes('ফতুয়া')) return 1;
          if (name.includes('পাজামা') || name.includes('সালোয়ার')) return 2;
          return 3;
        };
        return rank(a.name) - rank(b.name);
      });

      const pages = [];
      if (sortedTailorItems.length === 0) {
        pages.push([]);
      } else {
        for (let i = 0; i < sortedTailorItems.length; i += 4) {
          pages.push(sortedTailorItems.slice(i, i + 4));
        }
      }

      let codeSeq = Number(ord.id.replace('ORD-', '')) * 10;

      return pages.map((pageCards, pageIdx) => `
        <div style="page-break-after: ${pageIdx < pages.length - 1 ? 'always' : 'auto'}; font-family: 'Hind Siliguri', sans-serif; color: #000; padding: 3mm 4mm;">
          <!-- TOP: CUSTOMER COPY -->
          <div style="border: 1.5px solid #000; border-radius: 6px; padding: 6px 9px; margin-bottom: 6px; background: #ffffff;">
            <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 5px; margin-bottom: 6px; border-bottom: 1.5px solid #cbd5e1;">
              <div style="width: 58px; height: 58px; flex-shrink: 0;">${getRoyalBrandLogoSvg('memo_' + pageIdx)}</div>
              <div style="text-align: center; flex: 1; padding: 0 6px;">
                <div style="font-size: 20px; font-weight: 800; line-height: 1.15; color: #063d2c;">${state.shop.nameBn}</div>
                <div style="font-size: 11.5px; font-weight: 700; color: #1e293b; margin-top: 1px;">${state.shop.address}</div>
                <div style="display: inline-block; background: #0f172a; color: #ffffff; font-size: 12px; font-weight: 800; padding: 2px 14px; border-radius: 999px; margin-top: 3px; letter-spacing: 0.3px;">
                  মোবাইলঃ ${state.shop.phones}
                </div>
              </div>
              <div style="text-align: center; font-size: 10px; font-weight: 800; border: 1.5px solid #000; padding: 4px 8px; border-radius: 5px; background: #f8fafc;">
                কাস্টমার কপি<br/>
                <span style="font-size: 12px;">Serial: ${serialNum}</span>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1.15fr 1.55fr 0.95fr; gap: 7px; font-size: 10.5px;">
              <!-- Left Column: Serial Table + Organized Bigger Terms -->
              <div style="display: flex; flex-direction: column; justify-content: space-between;">
                <table style="width: 100%; border-collapse: collapse; border: 1px solid #334155; font-size: 10.5px;">
                  <tr style="border-bottom: 1px solid #64748b;"><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b; width: 42%;">Serial:</td><td style="padding: 2.5px 5px; font-weight: 800;">${serialNum}</td></tr>
                  <tr style="border-bottom: 1px solid #64748b;"><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b;">Order Date:</td><td style="padding: 2.5px 5px; font-weight: 600;">${orderDateStr}</td></tr>
                  <tr style="border-bottom: 1px solid #64748b;"><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b;">Delivery Date:</td><td style="padding: 2.5px 5px; font-weight: 800;">${delivDateStr}</td></tr>
                  <tr style="border-bottom: 1px solid #64748b;"><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b;">Name:</td><td style="padding: 2.5px 5px; font-weight: 800;">${ord.customerName}</td></tr>
                  <tr><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b;">Mobile No:</td><td style="padding: 2.5px 5px; font-weight: 800;">${ord.customerPhone}</td></tr>
                </table>

                <div style="margin-top: 5px; padding: 5px 6px; border: 1px solid #94a3b8; border-radius: 4px; background: #f8fafc; font-size: 10px; line-height: 1.38; font-weight: 600; color: #0f172a; white-space: pre-line;">
                  ${state.shop.memoNotice}
                </div>
              </div>

              <!-- Middle Column: Items Table -->
              <div style="border: 1px solid #334155;">
                <table style="width: 100%; border-collapse: collapse; font-size: 10.5px;">
                  <thead>
                    <tr style="border-bottom: 1px solid #334155; background: #f1f5f9; text-align: left;">
                      <th style="padding: 3px 5px; border-right: 1px solid #94a3b8;">Description</th>
                      <th style="padding: 3px 4px; text-align: center; border-right: 1px solid #94a3b8; width: 34px;">Qty</th>
                      <th style="padding: 3px 5px; text-align: right; border-right: 1px solid #94a3b8; width: 48px;">Rate</th>
                      <th style="padding: 3px 5px; text-align: right; width: 54px;">Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(ord.items || []).map((it) => `
                      <tr style="border-bottom: 1px solid #cbd5e1;">
                        <td style="padding: 3px 5px; font-weight: 700; border-right: 1px solid #cbd5e1;">${it.name}</td>
                        <td style="padding: 3px 4px; text-align: center; border-right: 1px solid #cbd5e1;">x${toBnNum(it.qty)}</td>
                        <td style="padding: 3px 5px; text-align: right; border-right: 1px solid #cbd5e1;">৳${toBnNum(it.price)}</td>
                        <td style="padding: 3px 5px; text-align: right; font-weight: 800;">৳${toBnNum(Math.round(it.price * it.qty))}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <!-- Right Column: Financial Summary & Signature -->
              <div style="display: flex; flex-direction: column; justify-content: space-between;">
                <table style="width: 100%; border-collapse: collapse; border: 1px solid #334155; font-size: 10.5px;">
                  <tr style="border-bottom: 1px solid #64748b;"><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b;">Total</td><td style="padding: 2.5px 5px; text-align: right; font-weight: 800;">৳${toBnNum(subTotal)}</td></tr>
                  ${discount > 0 ? `<tr style="border-bottom: 1px solid #64748b;"><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b;">Discount</td><td style="padding: 2.5px 5px; text-align: right;">-৳${toBnNum(discount)}</td></tr>` : ''}
                  <tr style="border-bottom: 1px solid #64748b;"><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b;">Previous Due</td><td style="padding: 2.5px 5px; text-align: right; font-weight: 700;">৳${toBnNum(prevDue)}</td></tr>
                  <tr style="border-bottom: 1px solid #64748b; background: #f8fafc;"><td style="padding: 2.5px 5px; font-weight: 800; border-right: 1px solid #64748b;">Payable Total</td><td style="padding: 2.5px 5px; text-align: right; font-weight: 800;">৳${toBnNum(netTotal)}</td></tr>
                  <tr style="border-bottom: 1px solid #64748b;"><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b;">Paid</td><td style="padding: 2.5px 5px; text-align: right; font-weight: 800;">৳${toBnNum(paid)}</td></tr>
                  <tr style="border-bottom: 1px solid #64748b;"><td style="padding: 2.5px 5px; font-weight: 700; border-right: 1px solid #64748b;">Total Due</td><td style="padding: 2.5px 5px; text-align: right; font-weight: 800;">৳${toBnNum(totalDueWithPrev)}</td></tr>
                  <tr><td style="padding: 2.5px 5px; font-weight: 800; border-right: 1px solid #64748b;">Due</td><td style="padding: 2.5px 5px; text-align: right; font-weight: 800;">৳${toBnNum(due)}</td></tr>
                </table>

                <div style="text-align: center; margin-top: 16px;">
                  <div style="font-size: 10px; font-weight: 800; border-top: 1.5px solid #000; padding-top: 2px; display: inline-block; min-width: 110px;">
                    Authority Signature
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- MIDDLE DIVIDER BAR: LARGER THANK YOU MESSAGE -->
          <div style="background: #0f172a; color: #ffffff; text-align: center; font-size: 13px; font-weight: 800; padding: 4px 8px; border-radius: 4px; margin: 6px 0; border-top: 1.5px dashed #000; border-bottom: 1.5px dashed #000; letter-spacing: 0.3px;">
            ★★ ধন্যবাদ, আবার আসবেন — Thank you, please come again ★★
          </div>

          <!-- BOTTOM: KARIGOR COPY (1 CARD PER ITEM, QTY-BASED TAG BOXES WITH TAG NOTE) -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">
            ${pageCards.map((item) => {
              const qtyCount = Math.max(1, Math.round(Number(item.qty || 1)));
              const headerTags = [];
              for (let q = 0; q < qtyCount; q++) {
                codeSeq += 1;
                headerTags.push({
                  serial: serialNum,
                  code: toBnNum(codeSeq),
                  name: ord.customerName,
                  phone: ord.customerPhone,
                  tagNote: item.tagNote || ''
                });
              }
              const measPairs = Object.entries(item.measurements || {}).filter(([, val]) => String(val || '').trim() !== '');

              return `
                <div style="border: 1.5px solid #334155; border-radius: 5px; padding: 6px; font-size: 10.5px; display: flex; flex-direction: column; justify-content: space-between; background: #fff;">
                  <div>
                    <!-- Small Tag Boxes (Scales with Qty, Includes Tag Note) -->
                    <div style="display: grid; grid-template-columns: repeat(${Math.min(headerTags.length, 2)}, 1fr); gap: 4px; margin-bottom: 5px;">
                      ${headerTags.map((tag) => `
                        <div style="border: 1px solid #64748b; background: #f8fafc; padding: 3.5px 6px; border-radius: 3px; font-size: 9.5px; font-weight: 800; line-height: 1.3;">
                          <div style="display: flex; justify-content: space-between;">
                            <span>Serial: ${tag.serial}</span>
                            <span>Code: ${tag.code}</span>
                          </div>
                          <div>${tag.name} - ${tag.phone}</div>
                          ${tag.tagNote ? `<div style="margin-top: 1.5px; padding-top: 1.5px; border-top: 1px dashed #94a3b8; color: #063d2c; font-size: 9.5px;">🏷️ ${tag.tagNote}</div>` : ''}
                        </div>
                      `).join('')}
                    </div>

                    <!-- Garment Title Strip -->
                    <div style="display: grid; grid-template-columns: 1.3fr 0.9fr 1.2fr 0.6fr; border: 1px solid #475569; font-weight: 800; font-size: 10px; margin-bottom: 4px; background: #f1f5f9;">
                      <div style="padding: 2.5px 4px; border-right: 1px solid #64748b;">${item.name}</div>
                      <div style="padding: 2.5px 4px; border-right: 1px solid #64748b;">Serial: ${serialNum}</div>
                      <div style="padding: 2.5px 4px; border-right: 1px solid #64748b;">Delivery: ${delivDateStr}</div>
                      <div style="padding: 2.5px 4px; text-align: center;">Qty: ${toBnNum(qtyCount)}</div>
                    </div>

                    ${item.linkedFabric ? `
                      <div style="font-size: 10px; font-weight: 800; color: #1e3a8a; margin-bottom: 3px;">
                        কাপড়: ${item.linkedFabric}
                      </div>
                    ` : ''}

                    ${item.designNotes ? `
                      <div style="border: 1px solid #94a3b8; padding: 2.5px 5px; font-size: 10px; font-weight: 700; margin-bottom: 4px;">
                        ${item.name} ডিজাইন: ${item.designNotes}
                      </div>
                    ` : ''}

                    <div style="font-size: 11px; font-weight: 800; margin-bottom: 5px;">
                      Karigor Fee: ৳${toBnNum(item.karigorFee || 0)} ${item.karigorName ? `<span style="font-size: 9.5px; font-weight: 700;">(${item.karigorName})</span>` : ''}
                    </div>

                    <!-- Slash-separated Measurement Grid -->
                    <div style="display: flex; flex-wrap: wrap; gap: 6px 8px; text-align: center; margin-top: 2px;">
                      ${measPairs.map(([k, v]) => `
                        <div style="border-right: 1px solid #475569; padding-right: 7px; min-width: 34px;">
                          <div style="font-size: 9.5px; font-weight: 700; color: #1e293b;">${k}</div>
                          <div style="font-size: 11.5px; font-weight: 800;">${toBnNum(v)}</div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                  <div style="text-align: right; font-size: 9.5px; font-weight: 800; margin-top: 6px; color: #334155;">AKPT</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function printOrderMemo(orderId) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const memoHtml = buildDualA4MemoHtml(ord);
      const printArea = document.getElementById('print-area');
      if (printArea) {
        printArea.innerHTML = memoHtml;
        printArea.classList.remove('hidden');
      }

      const modalHtml = `
        <div class="px-4 py-3 border-b border-slate-200 royal-gradient text-white flex items-center justify-between">
          <h3 class="text-sm font-extrabold text-amber-300">🖨️ A4 মেমো প্রিভিউ — #${ord.id.replace('ORD-', '')}</h3>
          <div class="flex items-center gap-2">
            <button type="button" onclick="window.print()" class="px-3.5 py-1.5 rounded-xl bg-amber-400 text-slate-950 font-extrabold text-xs cursor-pointer">🖨️ এখনই প্রিন্ট করুন</button>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-white/10 text-white cursor-pointer">✕</button>
          </div>
        </div>
        <div class="p-3 bg-slate-200 max-h-[80vh] overflow-y-auto">
          <div class="bg-white shadow-md mx-auto max-w-[210mm]">
            ${memoHtml}
          </div>
        </div>
      `;
      openModal(modalHtml, 'max-w-4xl');
    }

    // ==========================================
    // 6. ORDERS LIST & PAYMENT
    // ==========================================
    function renderOrdersList() {
      const q = (state.orderSearch || '').trim().toLowerCase();
      const st = state.orderStatusFilter || 'ALL';

      const filtered = state.orders.filter((o) => {
        const matchQ =
          !q ||
          o.id.toLowerCase().includes(q) ||
          o.id.replace('ORD-', '').toLowerCase().includes(q) ||
          (o.customerName || '').toLowerCase().includes(q) ||
          (o.customerPhone || '').toLowerCase().includes(q);
        const matchSt = st === 'ALL' || (o.status || 'Cutting') === st;
        return matchQ && matchSt;
      });

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-3">
            <div class="flex flex-col sm:flex-row gap-2.5 justify-between">
              <div class="relative flex-1">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
                <input
                  type="text"
                  value="${state.orderSearch || ''}"
                  oninput="state.orderSearch = this.value; renderApp(); setTimeout(() => { const el = document.getElementById('orders-search-inp'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0);"
                  id="orders-search-inp"
                  placeholder="মেমো নম্বর, কাস্টমারের নাম বা মোবাইল দিয়ে সার্চ করুন..."
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm font-semibold outline-none focus:border-emerald-600"
                />
              </div>
              <button type="button" onclick="startFreshNewOrder()" class="px-4 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold shrink-0 cursor-pointer">
                + নতুন অর্ডার
              </button>
            </div>

            <div class="flex flex-wrap gap-1.5">
              ${['ALL', 'Cutting', 'Sewing', 'Ready', 'Delivered'].map((s) => {
                const labels = { ALL: 'সব অর্ডার', Cutting: 'কাটিং', Sewing: 'সেলাই', Ready: 'রেডি', Delivered: 'ডেলিভারি' };
                const active = st === s;
                return `
                  <button type="button" onclick="state.orderStatusFilter='${s}'; renderApp();" class="px-3 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer ${active ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                    ${labels[s]}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-extrabold">
                    <th class="p-3">মেমো ও তারিখ</th>
                    <th class="p-3">কাস্টমার</th>
                    <th class="p-3">ডেলিভারি</th>
                    <th class="p-3">বিল ও বাকি</th>
                    <th class="p-3">স্ট্যাটাস</th>
                    <th class="p-3 text-right">অ্যাকশন</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${filtered.length === 0 ? `
                    <tr><td colspan="6" class="p-8 text-center text-slate-400 font-semibold">কোনো অর্ডার পাওয়া যায়নি।</td></tr>
                  ` : filtered.map((ord) => {
                    const bd = calculateFinancials([ord]).orderBreakdown[0];
                    const waUrl = buildWhatsAppOrderUrl(ord);
                    return `
                      <tr class="hover:bg-slate-50/80">
                        <td class="p-3">
                          <span class="px-2 py-0.5 rounded-md bg-emerald-900 text-amber-300 font-extrabold">#${ord.id.replace('ORD-', '')}</span>
                          <div class="text-[10px] text-slate-500 mt-1">${formatDateNice(ord.orderDate)}</div>
                        </td>
                        <td class="p-3">
                          <div class="font-extrabold text-slate-900">${ord.customerName}</div>
                          <div class="text-[11px] text-slate-500">${ord.customerPhone}</div>
                        </td>
                        <td class="p-3 font-bold text-slate-700">${formatDateNice(ord.deliveryDate)}</td>
                        <td class="p-3">
                          <div class="font-bold">মোট: ${formatTk(bd.netTotal)}</div>
                          <div class="text-[11px] font-extrabold ${bd.due > 0 ? 'text-rose-600' : 'text-emerald-700'}">বাকি: ${formatTk(bd.due)}</div>
                        </td>
                        <td class="p-3">
                          <select onchange="updateOrderStatus('${ord.id}', this.value)" class="px-2 py-1 rounded-lg border border-slate-300 font-bold text-[11px] bg-white">
                            ${['Cutting', 'Sewing', 'Ready', 'Delivered'].map((stOpt) => `
                              <option value="${stOpt}" ${(ord.status || 'Cutting') === stOpt ? 'selected' : ''}>${stOpt}</option>
                            `).join('')}
                          </select>
                        </td>
                        <td class="p-3 text-right">
                          <div class="inline-flex flex-wrap justify-end gap-1">
                            ${waUrl ? `<a href="${waUrl}" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-green-600 hover:bg-green-700 text-white font-extrabold" title="WhatsApp মেসেজ পাঠান">📲 WA</a>` : ''}
                            <button type="button" onclick="printOrderMemo('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-slate-900 text-amber-300 font-extrabold cursor-pointer">🖨️ মেমো</button>
                            <button type="button" onclick="openOrderPaymentModal('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white font-extrabold cursor-pointer">৳ পেমেন্ট</button>
                            <button type="button" onclick="loadOrderIntoFullEditor('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-amber-100 text-amber-950 border border-amber-300 font-extrabold cursor-pointer">🔄 সম্পূর্ণ এডিট</button>
                            <button type="button" onclick="openMeasurementOnlyEditModal('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-blue-50 text-blue-800 border border-blue-200 font-extrabold cursor-pointer">📏 মাপ</button>
                            <button type="button" onclick="deleteOrderRecord('${ord.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold cursor-pointer">✕</button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function updateOrderStatus(orderId, newStatus) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      ord.status = newStatus;
      persistState();
      showToast(`অর্ডার স্ট্যাটাস "${newStatus}" করা হয়েছে`, 'success');
      renderApp();
    }

    function openOrderPaymentModal(orderId) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const fin = calculateFinancials([ord]);
      const bd = fin.orderBreakdown[0];
      const dueAmt = Number(bd?.due || 0);

      const html = `
        <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between royal-gradient text-white">
          <div>

              <div class="text-sm font-extrabold text-emerald-800">${formatTk(ord.paidAmount)}</div>

            <input id="pay-modal-amount" type="number" min="1" value="${dueAmt > 0 ? dueAmt : ''}" required class="w-full px-3 py-2.5 rounded-xl border border-emerald-400 font-extrabold text-base outline-none" />
          </div>

            <label class="block font-bold text-slate-700 mb-1">পেমেন্ট মাধ্যম</label>
            <select id="pay-modal-method" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold">
              <option value="Cash">Cash (নগদ)</option>

          </div>

      `;
      openModal(html, 'max-w-md');

    function submitOrderPayment(e, orderId) {
      e.preventDefault();
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const addPay = Number(document.getElementById('pay-modal-amount')?.value || 0);
      if (addPay <= 0) return;

      ord.paidAmount = Number(ord.paidAmount || 0) + addPay;
      ord.paymentMethod = document.getElementById('pay-modal-method')?.value || ord.paymentMethod || 'Cash';

      const cust = state.customers.find(
        (c) => (ord.customerPhone && ord.customerPhone !== 'N/A' && c.phone === ord.customerPhone) || c.name === ord.customerName
      );
      if (cust) {
        cust.due = Math.max(0, Number((Number(cust.due || 0) - addPay).toFixed(2)));
      }

      persistState();
      closeModal();
      showToast(`${formatTk(addPay)} পেমেন্ট সফলভাবে জমা নেওয়া হয়েছে!`, 'success');
      renderApp();
    }

    function deleteOrderRecord(orderId) {
      const idx = state.orders.findIndex((o) => o.id === orderId);
      if (idx === -1) return;
      state.orders.splice(idx, 1);
      persistState();
      showToast('অর্ডারটি তালিকা থেকে মুছে ফেলা হয়েছে।', 'warn');
      renderApp();
    }

                </div>
                <div class="text-slate-600"><b>মাপের ঘর:</b> ${(g.fields || []).join(', ')}</div>
                <div class="text-slate-500 truncate"><b>ডিজাইন (${toBnNum((g.designs || []).length)}টি):</b> ${(g.designs || []).join(', ')}</div>

      pendingGarmentDesignList = [...(grm.designs || [])];

        </div>
        <form onsubmit="saveEditedGarment(event, '${grm.id}')" class="p-5 space-y-3.5 text-xs max-h-[82vh] overflow-y-auto">
          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
            <div class="flex items-center gap-3">
              <div id="edit-grm-preview" class="w-14 h-14 rounded-xl border border-slate-300 bg-white flex items-center justify-center overflow-hidden shrink-0">

              </div>
              <div class="flex-1">

              <div class="text-[10px] font-bold text-slate-500 mb-1">অথবা রেডিমেড আইকন বেছে নিন:</div>
              <div class="flex flex-wrap gap-1.5">
                ${iconChoices.map((ic) => `
                  <button type="button" onclick="selectGarmentIconChoice('${ic}')" class="w-8 h-8 rounded-lg border border-slate-300 bg-white hover:bg-emerald-50 text-base flex items-center justify-center cursor-pointer">${ic}</button>
                `).join('')}
              </div>
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">পোশাকের নাম *</label>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block font-bold text-slate-700 mb-1">কাস্টমার সেলাই মজুরি (৳) *</label>
              <input id="edit-grm-price" type="number" min="0" required value="${grm.price}" class="w-full px-3 py-2 rounded-xl border border-emerald-400 font-extrabold text-sm" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">কারিগর ফি (৳)</label>

            </div>

    function renderGarmentDesignTagsUI() {
      const box = document.getElementById('edit-grm-design-tags');
      if (!box) return;
      box.innerHTML = pendingGarmentDesignList.map((tag, idx) => `
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white border border-slate-300 font-bold text-[11px]">
          <span>${tag}</span>
          <button type="button" onclick="removeGarmentDesignTag(${idx})" class="text-rose-600 font-extrabold cursor-pointer">✕</button>
        </span>
      `).join('');
    }

    function addGarmentDesignTag() {
      const inp = document.getElementById('new-design-tag-inp');
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) return;
      if (!pendingGarmentDesignList.includes(val)) {
        pendingGarmentDesignList.push(val);
        renderGarmentDesignTagsUI();
      }
      inp.value = '';
    }

    function removeGarmentDesignTag(idx) {
      pendingGarmentDesignList.splice(idx, 1);
      renderGarmentDesignTagsUI();
    }

    function selectGarmentIconChoice(iconStr) {
      const iconInp = document.getElementById('edit-grm-icon-val');
      const imgInp = document.getElementById('edit-grm-img-data');
      const prev = document.getElementById('edit-grm-preview');
      if (iconInp) iconInp.value = iconStr;
      if (imgInp) imgInp.value = '';
      if (prev) prev.innerHTML = `<span class="text-2xl">${iconStr}</span>`;
    }

    function previewEditGarmentPhoto(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      compressImageFileToDataUrl(file, (dataUrl) => {
        const imgInp = document.getElementById('edit-grm-img-data');
        const prev = document.getElementById('edit-grm-preview');
        if (imgInp) imgInp.value = dataUrl;
        if (prev) prev.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover" />`;
      });
    }

    function saveEditedGarment(e, garmentId) {
      e.preventDefault();
      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;
      grm.name = document.getElementById('edit-grm-name')?.value.trim() || grm.name;
      grm.price = Number(document.getElementById('edit-grm-price')?.value || 0);
      grm.karigorFee = Number(document.getElementById('edit-grm-kfee')?.value || 0);
      grm.image = document.getElementById('edit-grm-img-data')?.value || '';
      grm.icon = document.getElementById('edit-grm-icon-val')?.value || grm.icon || '👘';
      const fRaw = document.getElementById('edit-grm-fields')?.value || '';
      grm.fields = fRaw.split(',').map((s) => s.trim()).filter(Boolean);
      grm.designs = [...pendingGarmentDesignList];

      persistState();
      closeModal();
      showToast(`${grm.name} আপডেট হয়েছে!`, 'success');
      renderApp();
    }

      const html = `

          <h3 class="text-sm font-extrabold text-amber-300">+ নতুন সেলাই পোশাক যোগ করুন</h3>

          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-700 mb-1">কাস্টমার মজুরি (৳)</label>

            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">কারিগর ফি (৳)</label>
              <input id="grm-new-kfee" type="number" min="0" required value="220" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />

          <div>
            <label class="block font-bold text-slate-700 mb-1">মাপের ঘরসমূহ (কমা দিয়ে লিখুন)</label>
            <input id="grm-new-fields" type="text" value="${PANJABI_FIELDS.join(', ')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold" />

            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>

          </div>
        </form>
      `;
      openModal(html, 'max-w-md');

    function submitNewGarment(e) {
      e.preventDefault();
      const name = document.getElementById('grm-new-name')?.value.trim();
      const price = Number(document.getElementById('grm-new-price')?.value || 600);
      const karigorFee = Number(document.getElementById('grm-new-kfee')?.value || 200);
      const fieldsRaw = document.getElementById('grm-new-fields')?.value || '';
      if (!name) return;

      const fields = fieldsRaw.split(',').map((s) => s.trim()).filter(Boolean);
      state.garments.push({
        id: 'GRM-' + Date.now(),
        name,
        icon: '👘',
        image: '',
        price,
        karigorFee,
        fields,
        designs: [...SPECIAL_DESIGNS]
      });
      persistState();
      closeModal();
      showToast('নতুন টেইলার্স আইটেম যুক্ত হয়েছে!', 'success');
      renderApp();
    }

            ` : item.variants.map((v, idx) => `
              <div class="p-2.5 rounded-xl border border-slate-200 bg-slate-50 flex flex-col justify-between gap-2">
                <div class="h-24 rounded-lg bg-white border border-slate-200 overflow-hidden flex items-center justify-center">

                </div>
                <div class="flex items-center justify-between">
                  <span class="font-extrabold text-slate-900 truncate">${v.colorName}</span>
                  <button type="button" onclick="deleteInventoryVariant('${item.id}', ${idx})" class="text-rose-600 font-extrabold cursor-pointer">✕</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      openModal(html, 'max-w-lg');
    }

    function addVariantToInventoryItem(e, invId) {
      e.preventDefault();
      const item = state.inventory.find((i) => i.id === invId);
      if (!item) return;
      const colorName = document.getElementById('var-color-name')?.value.trim();
      const colorHex = document.getElementById('var-color-hex')?.value || '#10b981';
      const file = document.getElementById('var-color-file')?.files?.[0];
      if (!colorName) return;

      const finishSave = (imgDataUrl) => {
        item.variants.push({ colorName, colorHex, image: imgDataUrl || '' });
        persistState();
        showToast(`"${colorName}" কালার যুক্ত হয়েছে!`, 'success');
        openItemVariantsGalleryModal(invId);
        renderApp();
      };

      if (file) {
        compressImageFileToDataUrl(file, finishSave);
      } else {
        finishSave('');
      }
    }

    function deleteInventoryVariant(invId, idx) {
      const item = state.inventory.find((i) => i.id === invId);
      if (!item || !Array.isArray(item.variants)) return;
      item.variants.splice(idx, 1);
      persistState();
      openItemVariantsGalleryModal(invId);
      renderApp();
    }

            <div id="edit-inv-img-prev" class="w-12 h-12 rounded-lg border bg-white flex items-center justify-center overflow-hidden shrink-0">

              <label class="block font-bold text-slate-700 mb-1">নাম *</label>

              <label class="block font-bold text-slate-700 mb-1">ক্রয় দর (৳)</label>

            <div>
              <label class="block font-bold text-slate-700 mb-1">স্টক (${item.unit})</label>
              <input id="edit-inv-stock" type="number" step="any" min="0" required value="${item.stock}" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 font-bold" />

          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ পরিবর্তন সেভ করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-md');
    }

    function previewEditInvPhoto(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      compressImageFileToDataUrl(file, (dataUrl) => {
        const inp = document.getElementById('edit-inv-img-val');
        const prev = document.getElementById('edit-inv-img-prev');
        if (inp) inp.value = dataUrl;
        if (prev) prev.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover" />`;
      });
    }

    function saveEditedInventoryItem(e, invId) {
      e.preventDefault();
      const item = state.inventory.find((i) => i.id === invId);
      if (!item) return;
      item.code = document.getElementById('edit-inv-code')?.value.trim() || item.code;
      item.name = document.getElementById('edit-inv-name')?.value.trim() || item.name;
      item.buyPrice = Number(document.getElementById('edit-inv-buy')?.value || 0);
      item.sellPrice = Number(document.getElementById('edit-inv-sell')?.value || 0);
      item.stock = Number(document.getElementById('edit-inv-stock')?.value || 0);
      item.image = document.getElementById('edit-inv-img-val')?.value || '';

      persistState();
      closeModal();
      showToast(`${item.name} আপডেট হয়েছে!`, 'success');
      renderApp();
    }

          </div>
        </form>
      `;
      openModal(html, 'max-w-md');
    }

    function submitNewInventoryItem(e) {
      e.preventDefault();
      const cat = document.getElementById('new-inv-cat')?.value || 'Fabrics';
      const code = document.getElementById('new-inv-code')?.value.trim() || '৯৯';
      const name = document.getElementById('new-inv-name')?.value.trim();
      const buyPrice = Number(document.getElementById('new-inv-buy')?.value || 0);
      const sellPrice = Number(document.getElementById('new-inv-sell')?.value || 0);
      const stock = Number(document.getElementById('new-inv-stock')?.value || 0);
      if (!name) return;

      state.inventory.unshift({
        id: (cat === 'Fabrics' ? 'FAB-' : 'PRD-') + Date.now(),
        code,
        name,
        category: cat,
        unit: cat === 'Fabrics' ? 'গজ' : 'পিস',
        buyPrice,
        sellPrice,
        stock,
        minStock: 10,
        image: '',
        variants: []
      });
      persistState();
      closeModal();
      showToast(`${name} সফলভাবে যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function renderStockManagement() {
      const totalProductsQty = state.inventory.filter((i) => i.category === 'Product').reduce((s, i) => s + Number(i.stock || 0), 0);
      const totalFabricsQty = state.inventory.filter((i) => i.category === 'Fabrics').reduce((s, i) => s + Number(i.stock || 0), 0);
      const lowStockItems = state.inventory.filter((i) => Number(i.stock || 0) <= Number(i.minStock || 5));

      const f = state.stockFilter || 'ALL';
      const list = state.inventory.filter((i) => {
        if (f === 'LOW') return Number(i.stock || 0) <= Number(i.minStock || 5);
        if (f === 'FABRICS') return i.category === 'Fabrics';
        if (f === 'PRODUCT') return i.category === 'Product';
        return true;
      });

      return `
        <div class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-bold text-slate-500">মোট ফেব্রিক্স স্টক</div>
              <div class="text-2xl font-extrabold text-indigo-700 mt-1">${toBnNum(totalFabricsQty)} গজ</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-bold text-slate-500">মোট প্রোডাক্ট স্টক</div>
              <div class="text-2xl font-extrabold text-teal-700 mt-1">${toBnNum(totalProductsQty)} পিস</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-bold text-slate-500">কম স্টক অ্যালার্ট</div>
              <div class="text-2xl font-extrabold text-rose-600 mt-1">${toBnNum(lowStockItems.length)} টি আইটেম</div>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap gap-1.5">
                ${[
                  { id: 'ALL', label: 'সব স্টক' },
                  { id: 'FABRICS', label: 'ফেব্রিক্স (গজ)' },
                  { id: 'PRODUCT', label: 'প্রোডাক্ট (পিস)' },
                  { id: 'LOW', label: 'কম স্টক অ্যালার্ট' }
                ].map((tab) => `
                  <button type="button" onclick="state.stockFilter='${tab.id}'; renderApp();" class="px-3 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer ${f === tab.id ? 'bg-emerald-800 text-amber-300' : 'bg-slate-100 text-slate-700'}">
                    ${tab.label}
                  </button>
                `).join('')}
              </div>
              <button type="button" onclick="openAddInventoryModal('Fabrics')" class="px-3.5 py-2 rounded-xl bg-emerald-700 text-white text-xs font-extrabold cursor-pointer">+ নতুন পণ্য/কাপড় যোগ</button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-extrabold">

                    <th class="p-3">ক্যাটাগরি</th>

                  ${list.map((item) => {
                    const isLow = Number(item.stock || 0) <= Number(item.minStock || 5);

                      <tr>
                        <td class="p-3">
                          <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-slate-200">${item.code}</span>
                          <span class="font-extrabold text-slate-900 ml-1">${item.name}</span>
                        </td>
                        <td class="p-3 font-bold">${item.category}</td>
                        <td class="p-3">
                          <span class="px-2.5 py-1 rounded-full font-extrabold ${isLow ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-800'}">
                            ${toBnNum(item.stock)} ${item.unit}
                          </span>
                        </td>
                        <td class="p-3 text-right">
                          <button type="button" onclick="openQuickStockInModal('${item.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold cursor-pointer">+ স্টক ইন</button>

          </div>
        </div>

          <h3 class="text-sm font-extrabold text-amber-300">+ স্টক ইন — ${item.name}</h3>

    function renderKarigorLedger() {
      const karigorStats = (state.karigors || []).map((k, idx) => {
        let totalPieces = 0;
        let totalEarned = 0;
        state.orders.forEach((ord) => {
          (ord.items || []).forEach((it) => {
            if (it.type === 'tailor') {
              const assigned = it.karigorName || state.karigors[0]?.name;
              if (assigned === k.name || (idx === 0 && !it.karigorName)) {
                totalPieces += Number(it.qty || 1);
                totalEarned += Number(it.karigorFee || 0) * Number(it.qty || 1);
              }
            }
          });
        });
        const paid = Number(k.paid || 0);
        const payable = Math.max(0, totalEarned - paid);
        return { ...k, totalPieces, totalEarned, paid, payable };
      });

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-slate-200 flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-extrabold text-slate-900">🪡 কারিগর ও মাস্টার হিসাব খাতা</h2>

          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            ${karigorStats.map((k) => `
              <div class="bg-white rounded-2xl p-4 border border-slate-200 space-y-2.5 text-xs">
                <div>
                  <div class="font-extrabold text-sm text-slate-900">${k.name}</div>
                  <div class="text-slate-500">${k.role || 'কারিগর'} • 📞 ${k.phone || '-'}</div>
                </div>
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                  <div class="flex justify-between"><span>মোট সেলাই কাজ:</span><b>${toBnNum(k.totalPieces)} পিস</b></div>
                  <div class="flex justify-between"><span>মোট অর্জিত মজুরি:</span><b>${formatTk(k.totalEarned)}</b></div>
                  <div class="flex justify-between"><span>পরিশোধিত:</span><b class="text-emerald-700">${formatTk(k.paid)}</b></div>
                  <div class="flex justify-between border-t pt-1 font-extrabold"><span>বর্তমান পাওনা:</span><span class="text-rose-600">${formatTk(k.payable)}</span></div>
                </div>
                <button type="button" onclick="openPayKarigorModal('${k.id}', ${k.payable})" class="w-full py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold cursor-pointer">

      const html = `

          <h3 class="text-sm font-extrabold text-amber-300">৳ বকেয়া আদায় — ${cust.name}</h3>

          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>

    function submitCustomerDueCollection(e, custId) {
      e.preventDefault();
      const cust = state.customers.find((c) => c.id === custId);
      if (!cust) return;
      let payAmt = Number(document.getElementById('cust-due-pay')?.value || 0);
      if (payAmt <= 0) return;

      cust.due = Math.max(0, Number(cust.due || 0) - payAmt);
      state.orders.forEach((o) => {
        if (payAmt <= 0) return;
        if ((cust.phone && cust.phone !== 'N/A' && o.customerPhone === cust.phone) || o.customerName === cust.name) {
          const bd = calculateFinancials([o]).orderBreakdown[0];
          if (bd.due > 0) {
            const apply = Math.min(bd.due, payAmt);
            o.paidAmount = Number(o.paidAmount || 0) + apply;
            payAmt -= apply;
          }
        }
      });

      persistState();
      closeModal();
      showToast('বকেয়া আদায় সফল হয়েছে!', 'success');
      renderApp();
    }

    function submitNewPurchaseBill(e) {
      e.preventDefault();
      const supId = document.getElementById('pur-sup-id')?.value;
      const invId = document.getElementById('pur-inv-id')?.value;
      const qty = Number(document.getElementById('pur-qty')?.value || 0);
      const rate = Number(document.getElementById('pur-rate')?.value || 0);
      const sup = state.suppliers.find((s) => s.id === supId);
      const inv = state.inventory.find((i) => i.id === invId);
      if (!inv || qty <= 0) return;

      inv.stock = Number(inv.stock || 0) + qty;
      inv.buyPrice = rate;

      state.purchases.unshift({
        id: 'PUR-' + Date.now(),
        date: new Date().toISOString(),
        supplierName: sup ? sup.name : 'মহাজন',
        itemName: inv.name,
        unit: inv.unit,
        qty,
        rate,
        total: qty * rate
      });

      persistState();
      closeModal();
      showToast('ক্রয় এন্ট্রি সম্পন্ন ও স্টক আপডেট হয়েছে!', 'success');
      renderApp();
    }

      const filteredOrders = state.orders.filter((o) => {
        if (reportAllTimeMode) return true;
        const dStr = (o.orderDate || '').split('T')[0];

        if (reportFromDate && dStr < reportFromDate) return false;
        if (reportToDate && dStr > reportToDate) return false;
        return true;
      });

      const filteredExpenses = (state.expenses || []).filter((ex) => {
        if (reportAllTimeMode) return true;
        const dStr = ex.date || '';
        if (!dStr) return true;

        if (reportToDate && dStr > reportToDate) return false;
        return true;
