    function loadInitialState() {
      const base = getDefaultState();
      try {
        const raw = safeGetStorage(STORAGE_KEY);
        if (raw) {

          return {
            ...base,
            activeTab: parsed.activeTab || 'dashboard',
            lastBackupTime: parsed.lastBackupTime || 'স্বয়ংক্রিয় সক্রিয়',
            shop: parsed.shop || base.shop,
            inventory: Array.isArray(parsed.inventory) && parsed.inventory.length ? parsed.inventory : base.inventory,
            garments: Array.isArray(parsed.garments) && parsed.garments.length ? parsed.garments : base.garments,
            orders: Array.isArray(parsed.orders) ? parsed.orders : [],
            customers: Array.isArray(parsed.customers) ? parsed.customers : [],
            suppliers: Array.isArray(parsed.suppliers) && parsed.suppliers.length ? parsed.suppliers : base.suppliers,
            cart: Array.isArray(parsed.cart) ? parsed.cart : [],
            draftCustomer: parsed.draftCustomer || base.draftCustomer
          };

      return base;

        orders: state.orders,
        customers: state.customers,

    function toBnNum(val) {
      const map = { '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯' };
      return String(val ?? '').replace(/[0-9]/g, (d) => map[d]);
    }

    function formatTk(amount) {
      const num = Math.round(Number(amount || 0));
      return '৳ ' + toBnNum(num.toLocaleString('en-US'));
    }

    function formatDateNice(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

      const el = document.createElement('div');
      const bg = type === 'warn' ? 'bg-amber-600' : type === 'error' ? 'bg-rose-600' : 'bg-emerald-800';
      el.className = `${bg} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold flex items-center gap-2 border border-white/20 transition-all`;
      el.innerHTML = `<span>${type === 'warn' ? '⚠️' : type === 'error' ? '✕' : '✓'}</span><span>${msg}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 2600);
    }

    function calculateFinancials(ordersSubset = state.orders) {
      let totalSales = 0;
      let totalCollected = 0;
      let totalDue = 0;
      let tailorWagesProfit = 0;
      let productFabricsProfit = 0;

      const orderBreakdown = ordersSubset.map((ord) => {
        const subTotal = (ord.items || []).reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
        const discount = Number(ord.discount || 0);
        const netTotal = Math.max(0, subTotal - discount);
        const paid = Number(ord.paidAmount || 0);
        const due = Math.max(0, netTotal - paid);

        totalSales += netTotal;
        totalCollected += paid;
        totalDue += due;

        (ord.items || []).forEach((it) => {
          const q = Number(it.qty || 1);
          if (it.type === 'tailor') {
            const fee = Number(it.karigorFee || 0);
            tailorWagesProfit += (Number(it.price || 0) - fee) * q;
          } else {
            const inv = state.inventory.find((x) => x.id === it.refId);
            const buy = inv ? Number(inv.buyPrice || 0) : Number(it.buyPrice || 0);
            productFabricsProfit += (Number(it.price || 0) - buy) * q;
          }
        });

        return { id: ord.id, subTotal, discount, netTotal, paid, due };
      });

      return {
        totalSales,
        totalCollected,
        totalDue,
        tailorWagesProfit,
        productFabricsProfit,
        netProfit: tailorWagesProfit + productFabricsProfit,
        orderBreakdown
      };
    }

        paidAmount: 0,
        paymentMethod: 'Cash',
        note: ''

    function loadOrderIntoFullEditor(orderId) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      editingOrderId = ord.id;
      state.cart = JSON.parse(JSON.stringify(ord.items || []));
      state.draftCustomer = {
        name: ord.customerName || '',
        phone: ord.customerPhone || '',
        address: ord.customerAddress || '',
        deliveryDate: ord.deliveryDate || new Date().toISOString().split('T')[0],
        discount: Number(ord.discount || 0),
        paidAmount: Number(ord.paidAmount || 0),
        paymentMethod: ord.paymentMethod || 'Cash',
        note: ord.note || ''
      };
      navigateToTab('new-order');
      showToast(`মেমো #${ord.id.replace('ORD-', '')} সম্পূর্ণ কাস্টমাইজ মোডে খোলা হয়েছে`, 'success');
    }

      const tailorItems = (ord.items || []).filter((it) => it.type === 'tailor');

        showToast('এই অর্ডারে কোনো সেলাইয়ের মেজারমেন্ট আইটেম নেই।', 'warn');

            <h3 class="text-sm font-extrabold text-amber-300">📏 মেজারমেন্ট ও ডিজাইন এডিট — #${ord.id.replace('ORD-', '')}</h3>
            <p class="text-[11px] text-emerald-200">${ord.customerName} • পরিমাণ অনুযায়ী কোড নির্ধারিত</p>

        </div>
        <form onsubmit="saveMeasurementOnlyEdit(event, '${ord.id}')" class="p-4 sm:p-5 space-y-4 max-h-[78vh] overflow-y-auto text-xs">

            const measEntries = Object.entries(it.measurements || {});
            return `
              <div class="p-3.5 rounded-xl border border-slate-200 bg-slate-50 space-y-2.5">
                <div class="flex items-center justify-between">
                  <span class="font-extrabold text-sm text-emerald-900">${idx + 1}. ${it.name} (পরিমাণ: ${toBnNum(it.qty)})</span>
                </div>
                <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
                  ${measEntries.map(([k, v]) => `
                    <div>
                      <label class="block text-[10px] font-bold text-slate-600 mb-0.5">${k}</label>
                      <input type="text" data-item-uid="${it.uid}" data-meas-key="${k}" value="${v || ''}" class="meas-edit-inp w-full px-2 py-1.5 rounded-lg border border-slate-300 bg-white font-bold text-center outline-none focus:border-emerald-600" />
                    </div>
                  `).join('')}
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-slate-600 mb-0.5">ডিজাইন ও কারিগর নোট</label>
                  <input type="text" data-item-uid="${it.uid}" value="${it.designNotes || ''}" class="design-edit-inp w-full px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white font-semibold outline-none focus:border-emerald-600" />
                </div>
              </div>
            `;
          }).join('')}
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold cursor-pointer">✓ মেজারমেন্ট সেভ করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-2xl');
    }

    function saveMeasurementOnlyEdit(e, orderId) {
      e.preventDefault();
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;

      document.querySelectorAll('.meas-edit-inp').forEach((inp) => {
        const uid = inp.getAttribute('data-item-uid');
        const key = inp.getAttribute('data-meas-key');
        const item = ord.items.find((x) => x.uid === uid);
        if (item && item.measurements) {
          item.measurements[key] = inp.value;
        }
      });

      document.querySelectorAll('.design-edit-inp').forEach((inp) => {
        const uid = inp.getAttribute('data-item-uid');
        const item = ord.items.find((x) => x.uid === uid);
        if (item) {
          item.designNotes = inp.value;
        }
      });

      persistState();
      closeModal();
      showToast('মেজারমেন্ট ও ডিজাইন আপডেট হয়েছে!', 'success');
      renderApp();
    }

      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;
      const existing = editCartUid ? state.cart.find((c) => c.uid === editCartUid) : null;
      const initMeas = existing?.measurements || {};
      const initDesigns = existing?.selectedDesigns || [];

      const html = `
        <div class="px-5 py-4 border-b border-slate-200 royal-gradient text-white flex items-center justify-between">
          <div>
            <h3 class="text-sm sm:text-base font-extrabold text-amber-300">${grm.icon} ${grm.name} — মাপ ও ডিজাইন</h3>
            <p class="text-[11px] text-emerald-200">মজুরি: ${formatTk(grm.price)} | কারিগর ফি: ${formatTk(grm.karigorFee)}</p>

          <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-white/10 text-white cursor-pointer">✕</button>

              <label class="block font-bold text-slate-700 mb-1">পরিমাণ (Qty)</label>
              <input id="grm-qty" type="number" min="1" value="${existing ? existing.qty : 1}" required class="w-full px-3 py-2 rounded-xl border border-emerald-400 font-extrabold text-sm outline-none" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">সেলাই মজুরি (৳)</label>
              <input id="grm-price" type="number" min="0" value="${existing ? existing.price : grm.price}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 font-extrabold text-sm outline-none" />
            </div>
            <div class="col-span-2 sm:col-span-1">
              <label class="block font-bold text-slate-700 mb-1">কারিগর ফি (৳)</label>
              <input id="grm-kfee" type="number" min="0" value="${existing ? existing.karigorFee : grm.karigorFee}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold text-sm outline-none" />
            </div>
          </div>

          <div>
            <div class="font-extrabold text-slate-800 mb-2">📏 ইঞ্চি মেজারমেন্ট দিন:</div>
            <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
              ${(grm.fields || []).map((f) => `
                <div class="bg-slate-50 p-2 rounded-xl border border-slate-200">
                  <label class="block text-[10px] font-bold text-slate-600 mb-1">${f}</label>
                  <input type="text" data-field="${f}" value="${initMeas[f] || ''}" placeholder="0" class="grm-meas-field w-full px-2 py-1.5 rounded-lg border border-slate-300 bg-white font-extrabold text-center text-xs outline-none focus:border-emerald-600" />
                </div>
              `).join('')}
            </div>
          </div>

          <div>
            <div class="font-extrabold text-slate-800 mb-1.5">🎨 ডিজাইন অপশন নির্বাচন করুন:</div>
            <div class="flex flex-wrap gap-1.5">
              ${(grm.designs || []).map((d) => {
                const checked = initDesigns.includes(d);
                return `
                  <label class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-emerald-50 cursor-pointer font-semibold">
                    <input type="checkbox" value="${d}" ${checked ? 'checked' : ''} class="grm-design-chk accent-emerald-700" />
                    <span>${d}</span>
                  </label>
                `;
              }).join('')}
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">অতিরিক্ত ডিজাইন নোট (যদি থাকে)</label>
            <input id="grm-extra-note" type="text" value="${existing?.extraNote || ''}" placeholder="যেমন: কলার শক্ত হবে, পকেটে চেইন..." class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold outline-none" />
          </div>

          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold cursor-pointer">
              ✓ অর্ডার তালিকায় যুক্ত করুন

      openModal(html, 'max-w-2xl');
    }

    function submitGarmentToCart(e, garmentId, editCartUid) {
      e.preventDefault();
      const grm = state.garments.find((g) => g.id === garmentId);
      if (!grm) return;

      const qty = Math.max(1, Number(document.getElementById('grm-qty')?.value || 1));
      const price = Number(document.getElementById('grm-price')?.value || grm.price);
      const karigorFee = Number(document.getElementById('grm-kfee')?.value || grm.karigorFee);
      const extraNote = (document.getElementById('grm-extra-note')?.value || '').trim();

      const measurements = {};
      document.querySelectorAll('.grm-meas-field').forEach((inp) => {
        measurements[inp.getAttribute('data-field')] = inp.value.trim();
      });

      const selectedDesigns = [];
      document.querySelectorAll('.grm-design-chk:checked').forEach((chk) => {
        selectedDesigns.push(chk.value);
      });

      const designNotes = [...selectedDesigns, extraNote].filter(Boolean).join(', ');

      const itemObj = {
        uid: editCartUid || 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        type: 'tailor',
        refId: grm.id,
        name: grm.name,
        qty,
        price,
        karigorFee,
        measurements,
        selectedDesigns,
        extraNote,
        designNotes
      };

      if (editCartUid) {
        const idx = state.cart.findIndex((c) => c.uid === editCartUid);
        if (idx !== -1) state.cart[idx] = itemObj;
      } else {
        state.cart.push(itemObj);
      }

      persistState();
      closeModal();
      showToast(`${grm.name} (${toBnNum(qty)}টি) কার্টে যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function addInventoryItemToCart(invId) {
      const inv = state.inventory.find((i) => i.id === invId);
      if (!inv) return;
      const existing = state.cart.find((c) => c.refId === inv.id && c.type !== 'tailor');
      if (existing) {
        existing.qty = Number(existing.qty || 1) + 1;
      } else {
        state.cart.push({
          uid: 'CART-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
          type: inv.category === 'Fabrics' ? 'fabric' : 'product',
          refId: inv.id,
          code: inv.code,
          name: inv.name,
          unit: inv.unit,
          qty: 1,
          price: Number(inv.sellPrice || 0),
          buyPrice: Number(inv.buyPrice || 0)
        });
      }
      persistState();
      showToast(`${inv.name} যুক্ত হয়েছে!`, 'success');
      renderApp();
    }

    function updateCartItemQty(uid, newQty) {
      const item = state.cart.find((c) => c.uid === uid);
      if (!item) return;
      const q = Number(newQty);
      if (q <= 0) {
        state.cart = state.cart.filter((c) => c.uid !== uid);
      } else {
        item.qty = q;
      }
      persistState();
      renderApp();
    }

    function removeCartItem(uid) {
      state.cart = state.cart.filter((c) => c.uid !== uid);
      persistState();
      renderApp();
    }

    function renderNewOrder() {
      const subTotal = state.cart.reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const discount = Number(state.draftCustomer.discount || 0);
      const netTotal = Math.max(0, subTotal - discount);
      const paid = Number(state.draftCustomer.paidAmount || 0);
      const due = Math.max(0, netTotal - paid);

      const fabricsList = state.inventory.filter((i) => i.category === 'Fabrics');
      const productsList = state.inventory.filter((i) => i.category === 'Product');

      return `
        <div class="space-y-4">
          ${editingOrderId ? `
            <div class="p-3 rounded-xl bg-amber-100 border border-amber-400 text-amber-950 flex items-center justify-between text-xs font-extrabold">
              <span>🔄 আপনি মেমো #${editingOrderId.replace('ORD-', '')} সম্পূর্ণ কাস্টমাইজ এডিট করছেন</span>
              <button type="button" onclick="startFreshNewOrder()" class="px-3 py-1 rounded-lg bg-white border border-amber-400 text-xs font-bold cursor-pointer">নতুন অর্ডারে ফিরুন</button>
            </div>
          ` : ''}

              <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs">
                <h3 class="text-sm font-extrabold text-emerald-900 mb-3">✂️ ১. সেলাইয়ের পোশাক ও মাপ নির্বাচন করুন</h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                  ${state.garments.map((g) => `
                    <button type="button" onclick="openGarmentMeasurementModal('${g.id}')" class="p-3 rounded-xl border border-slate-200 hover:border-emerald-600 hover:bg-emerald-50/70 text-left transition flex flex-col justify-between gap-1.5 cursor-pointer">
                      <div class="flex items-center justify-between">
                        <span class="text-2xl">${g.icon || '👘'}</span>

    function submitFinalOrder(e) {
      e.preventDefault();
      if (state.cart.length === 0) {
        showToast('অন্তত একটি পোশাক, কাপড় বা প্রোডাক্ট যোগ করুন!', 'warn');
        return;
      }

      const name = (state.draftCustomer.name || '').trim() || 'সম্মানিত কাস্টমার';
      const phone = (state.draftCustomer.phone || '').trim() || 'N/A';
      const address = (state.draftCustomer.address || '').trim();
      const deliveryDate = state.draftCustomer.deliveryDate;
      const discount = Number(state.draftCustomer.discount || 0);
      const paidAmount = Number(state.draftCustomer.paidAmount || 0);

      let orderId = editingOrderId;
      if (editingOrderId) {
        const existingIdx = state.orders.findIndex((o) => o.id === editingOrderId);
        if (existingIdx !== -1) {
          const oldOrd = state.orders[existingIdx];
          (oldOrd.items || []).forEach((it) => {
            if (it.type !== 'tailor') {
              const inv = state.inventory.find((x) => x.id === it.refId);
              if (inv) inv.stock = Number(inv.stock || 0) + Number(it.qty || 0);
            }
          });
          state.cart.forEach((it) => {
            if (it.type !== 'tailor') {
              const inv = state.inventory.find((x) => x.id === it.refId);
              if (inv) inv.stock = Math.max(0, Number(inv.stock || 0) - Number(it.qty || 0));
            }
          });
          state.orders[existingIdx] = {
            ...oldOrd,
            customerName: name,
            customerPhone: phone,
            customerAddress: address,
            deliveryDate,
            discount,
            paidAmount,
            items: JSON.parse(JSON.stringify(state.cart))
          };
        }
      } else {
        const nextSerial = 5660 + state.orders.length + 1;
        orderId = 'ORD-' + nextSerial;
        state.cart.forEach((it) => {
          if (it.type !== 'tailor') {
            const inv = state.inventory.find((x) => x.id === it.refId);
            if (inv) inv.stock = Math.max(0, Number(inv.stock || 0) - Number(it.qty || 0));
          }
        });
        state.orders.unshift({
          id: orderId,
          orderDate: new Date().toISOString(),
          deliveryDate,
          customerName: name,
          customerPhone: phone,
          customerAddress: address,
          status: 'Cutting',
          discount,
          paidAmount,
          paymentMethod: state.draftCustomer.paymentMethod || 'Cash',
          items: JSON.parse(JSON.stringify(state.cart))
        });
      }

      const subTotal = state.cart.reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const netTotal = Math.max(0, subTotal - discount);
      const due = Math.max(0, netTotal - paidAmount);
      let cust = state.customers.find((c) => phone !== 'N/A' && c.phone === phone);
      if (!cust) {
        state.customers.unshift({
          id: 'CUST-' + Date.now(),
          name,
          phone,
          address,
          due
        });
      } else {
        cust.name = name;
        if (address) cust.address = address;
      }

      editingOrderId = null;
      state.cart = [];
      state.draftCustomer = {
        name: '',
        phone: '',
        address: '',
        deliveryDate: new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0],
        discount: 0,
        paidAmount: 0,
        paymentMethod: 'Cash',
        note: ''
      };
      state.activeTab = 'orders';
      persistState();
      showToast('অর্ডার সফলভাবে সেভ হয়েছে!', 'success');
      renderApp();
      printOrderMemo(orderId);
    }

    // ==========================================
    // 6. DUAL A4 MEMO PRINT (CUSTOMER + KARIGOR)
    // ==========================================
    function buildDualA4MemoHtml(ord) {
      const serialNum = toBnNum(ord.id.replace('ORD-', ''));
      const orderDateStr = new Date(ord.orderDate || Date.now()).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      const delivDateStr = formatDateNice(ord.deliveryDate);

      const subTotal = (ord.items || []).reduce((s, it) => s + Number(it.price || 0) * Number(it.qty || 1), 0);
      const discount = Number(ord.discount || 0);
      const netTotal = Math.max(0, subTotal - discount);
      const paid = Number(ord.paidAmount || 0);
      const due = Math.max(0, netTotal - paid);

      const tailorItems = (ord.items || []).filter((it) => it.type === 'tailor');
      const sortedTailorItems = [...tailorItems].sort((a, b) => {
        const rank = (name) => {
          if (name.includes('পাঞ্জাবি') || name.includes('কাবলি') || name.includes('জুব্বা')) return 1;
          if (name.includes('পাজামা')) return 2;
          return 3;
        };
        return rank(a.name) - rank(b.name);
      });

      const pages = [];
      if (sortedTailorItems.length === 0) {
        pages.push([]);
      } else {
        for (let i = 0; i < sortedTailorItems.length; i += 6) {
          pages.push(sortedTailorItems.slice(i, i + 6));
        }
      }

      let codeSeq = Number(ord.id.replace('ORD-', '')) * 10;

      return pages.map((pageCards, pageIdx) => `
        <div style="page-break-after: ${pageIdx < pages.length - 1 ? 'always' : 'auto'}; font-family: 'Hind Siliguri', sans-serif; color: #000; padding: 4mm;">
          <div style="border: 1.5px solid #000; border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; background: #f8fafc;">
            <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 5px;">
              <div style="width: 52px; height: 52px;">${getRoyalBrandLogoSvg('memo_' + pageIdx)}</div>
              <div style="text-align: center; flex: 1;">
                <div style="font-size: 18px; font-weight: 800; line-height: 1.1;">${state.shop.nameBn}</div>
                <div style="font-size: 11px; font-weight: 600;">${state.shop.address}</div>
                <div style="font-size: 10px; font-weight: 700;">মোবাইল: ${state.shop.phones}</div>
              </div>
              <div style="text-align: right; font-size: 11px; font-weight: 800; border: 1px solid #000; padding: 3px 7px; border-radius: 4px;">
                কাস্টমার কপি<br/>Serial: ${serialNum}
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 800; margin-bottom: 6px;">
              <span>কাস্টমারের নাম: ${ord.customerName}</span>
              <span>মোবাইল: ${ord.customerPhone}</span>
              <span>ডেলিভারি: ${delivDateStr}</span>
            </div>

            <div style="display: grid; grid-template-columns: 1.1fr 1.6fr 1fr; gap: 6px; font-size: 10px;">
              <div style="border: 1px solid #64748b; padding: 4px; border-radius: 4px;">
                <table style="width: 100%; border-collapse: collapse;">
                  <tr><td style="font-weight: 700;">Serial:</td><td style="font-weight: 800;">${serialNum}</td></tr>
                  <tr><td style="font-weight: 700;">Order Date:</td><td>${orderDateStr}</td></tr>
                  <tr><td style="font-weight: 700;">Delivery:</td><td style="font-weight: 800;">${delivDateStr}</td></tr>
                  <tr><td style="font-weight: 700;">Name:</td><td style="font-weight: 800;">${ord.customerName}</td></tr>
                  <tr><td style="font-weight: 700;">Mobile:</td><td style="font-weight: 800;">${ord.customerPhone}</td></tr>
                </table>
                <div style="margin-top: 4px; font-size: 8.5px; line-height: 1.25; white-space: pre-line; border-top: 1px dashed #94a3b8; padding-top: 3px;">
                  ${state.shop.memoNotice}
                </div>
              </div>

              <div style="border: 1px solid #64748b; padding: 4px; border-radius: 4px;">
                <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                  <thead>
                    <tr style="border-bottom: 1px solid #000; text-align: left;">
                      <th style="padding: 2px;">Description</th>
                      <th style="padding: 2px; text-align: center;">Qty</th>
                      <th style="padding: 2px; text-align: right;">Rate</th>
                      <th style="padding: 2px; text-align: right;">Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(ord.items || []).map((it) => `
                      <tr style="border-bottom: 1px dotted #cbd5e1;">
                        <td style="padding: 2px; font-weight: 700;">${it.name}</td>
                        <td style="padding: 2px; text-align: center;">×${toBnNum(it.qty)}</td>
                        <td style="padding: 2px; text-align: right;">${toBnNum(it.price)}</td>
                        <td style="padding: 2px; text-align: right; font-weight: 700;">${toBnNum(Math.round(it.price * it.qty))}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <div style="border: 1px solid #64748b; padding: 4px; border-radius: 4px; display: flex; flex-direction: column; justify-content: space-between;">
                <table style="width: 100%; border-collapse: collapse; font-size: 10.5px;">
                  <tr><td style="padding: 2px;">Total</td><td style="text-align: right; font-weight: 700;">${toBnNum(subTotal)}</td></tr>
                  ${discount > 0 ? `<tr><td style="padding: 2px;">Discount</td><td style="text-align: right;">-${toBnNum(discount)}</td></tr>` : ''}
                  <tr style="border-top: 1px solid #000;"><td style="padding: 2px; font-weight: 800;">Payable</td><td style="text-align: right; font-weight: 800;">${toBnNum(netTotal)}</td></tr>
                  <tr><td style="padding: 2px; font-weight: 700;">Paid</td><td style="text-align: right; font-weight: 800;">${toBnNum(paid)}</td></tr>
                  <tr style="border-top: 1px solid #000;"><td style="padding: 2px; font-weight: 800;">Due</td><td style="text-align: right; font-weight: 800;">${toBnNum(due)}</td></tr>
                </table>
                <div style="text-align: right; font-size: 9px; font-weight: 700; border-top: 1px solid #000; padding-top: 2px; margin-top: 14px;">
                  Authority Signature
                </div>
              </div>
            </div>
          </div>

          <div style="text-align: center; font-size: 10px; font-weight: 700; border-top: 1.5px dashed #000; border-bottom: 1.5px dashed #000; padding: 2px 0; margin: 5px 0;">
            ✂️ কারিগর কপি (শুধুমাত্র সেলাই ও মেজারমেন্ট) — Thank you, please come again ✂️
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">
            ${pageCards.map((item) => {
              const qtyCount = Math.max(1, Math.round(Number(item.qty || 1)));
              const headerTags = [];
              for (let q = 0; q < qtyCount; q++) {
                codeSeq += 1;
                headerTags.push({ serial: serialNum, code: toBnNum(codeSeq), name: ord.customerName, phone: ord.customerPhone });
              }
              const measPairs = Object.entries(item.measurements || {}).filter(([, val]) => String(val || '').trim() !== '');

              return `
                <div style="border: 1.5px solid #000; border-radius: 5px; padding: 6px; font-size: 10.5px; display: flex; flex-direction: column; justify-content: space-between;">
                  <div>
                    <div style="display: grid; grid-template-columns: repeat(${Math.min(headerTags.length, 2)}, 1fr); gap: 4px; margin-bottom: 5px;">
                      ${headerTags.map((tag) => `
                        <div style="border: 1px solid #475569; background: #f1f5f9; padding: 3px 5px; border-radius: 3px; font-size: 9.5px; font-weight: 800;">

                          <div>${tag.name} - ${tag.phone}</div>
                        </div>
                      `).join('')}
                    </div>

                    <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 11.5px; border-bottom: 1px solid #000; padding-bottom: 2px; margin-bottom: 4px;">
                      <span>${item.name}</span>
                      <span>Delivery: ${delivDateStr} | Qty: ${toBnNum(qtyCount)}</span>
                    </div>

                    ${item.designNotes ? `
                      <div style="font-size: 10px; font-weight: 700; margin-bottom: 4px;">
                        ডিজাইন: ${item.designNotes}
                      </div>
                    ` : ''}

                    <div style="font-size: 10.5px; font-weight: 800; margin-bottom: 5px;">
                      Karigor Fee: ${toBnNum(item.karigorFee || 0)}
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center;">
                      ${measPairs.map(([k, v]) => `
                        <div style="border: 1px solid #94a3b8; border-radius: 3px; padding: 2px;">
                          <div style="font-size: 9px; font-weight: 700; border-bottom: 1px solid #cbd5e1;">${k}</div>
                          <div style="font-size: 11px; font-weight: 800;">${toBnNum(v)}</div>

                    </div>
                  </div>
                  <div style="text-align: right; font-size: 9px; font-weight: 800; margin-top: 6px;">AKPT</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function printOrderMemo(orderId) {
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const memoHtml = buildDualA4MemoHtml(ord);
      const printArea = document.getElementById('print-area');
      if (printArea) {
        printArea.innerHTML = memoHtml;
        printArea.classList.remove('hidden');
      }

      renderApp();
    }

      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const fin = calculateFinancials([ord]);
      const bd = fin.orderBreakdown[0];
      const dueAmt = Number(bd?.due || 0);

      const html = `
        <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between royal-gradient text-white">
          <div>
            <h3 class="text-base font-extrabold text-amber-300">৳ পেমেন্ট জমা নিন — #${ord.id.replace('ORD-', '')}</h3>
            <p class="text-[11px] text-emerald-200">${ord.customerName} (${ord.customerPhone})</p>
          </div>
          <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-white/10 text-white cursor-pointer">✕</button>
        </div>

            <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200">

              <div class="text-sm font-extrabold text-emerald-800">${formatTk(ord.paidAmount)}</div>
            </div>
            <div class="p-2.5 rounded-xl bg-rose-50 border border-rose-200">
              <div class="text-[10px] text-rose-700 font-bold">বর্তমান বাকি</div>
              <div class="text-sm font-extrabold text-rose-700">${formatTk(dueAmt)}</div>
            </div>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">নতুন জমার পরিমাণ (৳)</label>
            <input id="pay-modal-amount" type="number" min="1" value="${dueAmt > 0 ? dueAmt : ''}" required class="w-full px-3 py-2.5 rounded-xl border border-emerald-400 font-extrabold text-base outline-none" />
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">পেমেন্ট মাধ্যম</label>
            <select id="pay-modal-method" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold">
              <option value="Cash">Cash (নগদ)</option>
              <option value="bKash">bKash (বিকাশ)</option>
              <option value="Nagad">Nagad (নগদ অ্যাপ)</option>
              <option value="Bank">Bank (ব্যাংক)</option>
            </select>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold cursor-pointer">✓ জমা নিশ্চিত করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-md');
    }

    function submitOrderPayment(e, orderId) {
      e.preventDefault();
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      const addPay = Number(document.getElementById('pay-modal-amount')?.value || 0);
      if (addPay <= 0) return;

      ord.paidAmount = Number(ord.paidAmount || 0) + addPay;
      ord.paymentMethod = document.getElementById('pay-modal-method')?.value || ord.paymentMethod || 'Cash';

      const cust = state.customers.find(
        (c) => (ord.customerPhone && ord.customerPhone !== 'N/A' && c.phone === ord.customerPhone) || c.name === ord.customerName
      );
      if (cust) {
        cust.due = Math.max(0, Number((Number(cust.due || 0) - addPay).toFixed(2)));
      }

      persistState();
      closeModal();
      showToast(`${formatTk(addPay)} পেমেন্ট সফলভাবে জমা নেওয়া হয়েছে!`, 'success');
      renderApp();
    }

    function deleteOrderRecord(orderId) {
      const idx = state.orders.findIndex((o) => o.id === orderId);
      if (idx === -1) return;
      state.orders.splice(idx, 1);
      persistState();
      showToast('অর্ডারটি তালিকা থেকে মুছে ফেলা হয়েছে।', 'warn');
      renderApp();
    }

    function openCustomerDueCollectModal(custId) {
      const cust = state.customers.find((c) => c.id === custId);
      if (!cust) return;
      const html = `
        <div class="px-5 py-4 border-b royal-gradient text-white flex justify-between">

        </div>
        <form onsubmit="submitCustomerDueCollect(event, '${cust.id}')" class="p-5 space-y-3 text-xs">
          <div class="font-bold">মোট বকেয়া: <span class="text-rose-600 font-extrabold">${formatTk(cust.due)}</span></div>
          <div><label class="block font-bold mb-1">জমার পরিমাণ (৳)</label><input id="cust-due-pay" type="number" min="1" max="${cust.due}" value="${cust.due}" required class="w-full px-3 py-2 rounded-xl border font-extrabold" /></div>
          <div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button><button type="submit" class="px-4 py-2 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ জমা নিন</button></div>
        </form>
      `;
      openModal(html, 'max-w-sm');
    }

    function submitCustomerDueCollect(e, custId) {
      e.preventDefault();
      const cust = state.customers.find((c) => c.id === custId);
      if (!cust) return;
      const amt = Number(document.getElementById('cust-due-pay').value || 0);
      if (amt <= 0) return;
      cust.due = Math.max(0, Number(cust.due || 0) - amt);
      let rem = amt;
      state.orders.forEach((ord) => {
        if (rem > 0 && (ord.customerPhone === cust.phone || ord.customerName === cust.name)) {
          const bd = calculateFinancials([ord]).orderBreakdown[0];
          if (bd.due > 0) {
            const take = Math.min(rem, bd.due);
            ord.paidAmount = Number(ord.paidAmount || 0) + take;
            rem -= take;
          }
        }
      });
      persistState();
      closeModal();
      showToast(`${formatTk(amt)} বকেয়া আদায় সম্পন্ন হয়েছে!`, 'success');
      renderApp();
    }

              <div class="text-xs font-bold text-slate-500">মোট কালেকশন (Paid)</div>
              <div class="text-2xl font-extrabold text-emerald-700 mt-1">${formatTk(fin.totalCollected)}</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-bold text-slate-500">মোট বকেয়া (Total Due)</div>
              <div class="text-2xl font-extrabold text-rose-600 mt-1">${formatTk(fin.totalDue)}</div>
            </div>
            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200">
              <div class="text-xs font-bold text-emerald-800">টেইলার সেক্টর মজুরি লাভ</div>
              <div class="text-2xl font-extrabold text-emerald-900 mt-1">${formatTk(fin.tailorWagesProfit)}</div>
            </div>
            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-200">
              <div class="text-xs font-bold text-indigo-800">ফেব্রিক্স ও প্রোডাক্ট লাভ</div>
              <div class="text-2xl font-extrabold text-indigo-900 mt-1">${formatTk(fin.productFabricsProfit)}</div>
            </div>
            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-300">
              <div class="text-xs font-bold text-amber-900">সর্বমোট নিট লাভ (Net Profit)</div>
              <div class="text-2xl font-extrabold text-amber-950 mt-1">${formatTk(fin.netProfit)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderSettings() {
      return `
        <div class="space-y-4">
          <form onsubmit="saveShopSettingsForm(event)" class="bg-white rounded-2xl p-5 border border-slate-200 space-y-3 text-xs">
            <h2 class="text-base font-extrabold text-slate-900">⚙️ দোকানের তথ্য ও মেমো সেটিংস</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">দোকানের নাম (বাংলা)</label>
                <input id="set-name-bn" type="text" value="${state.shop.nameBn}" required class="w-full px-3 py-2 rounded-xl border font-bold" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">মোবাইল নম্বরসমূহ</label>
                <input id="set-phones" type="text" value="${state.shop.phones}" required class="w-full px-3 py-2 rounded-xl border font-bold" />
              </div>
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">দোকানের ঠিকানা</label>
              <input id="set-address" type="text" value="${state.shop.address}" required class="w-full px-3 py-2 rounded-xl border font-bold" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">মেমো শর্তাবলী ও নোটিশ</label>
              <textarea id="set-notice" rows="3" class="w-full px-3 py-2 rounded-xl border font-semibold">${state.shop.memoNotice}</textarea>
            </div>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 text-white font-extrabold cursor-pointer">✓ সেটিংস সেভ করুন</button>
          </form>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 space-y-3 text-xs">
            <h3 class="text-sm font-extrabold text-slate-900">☁️ ডাটা ব্যাকআপ ও সিঙ্ক</h3>
            <p class="text-slate-600">অফলাইনে কাজ করলে ফোনের মেমোরিতে ডাটা সেভ থাকে এবং ইন্টারনেট সংযুক্ত হওয়ার সাথে সাথেই স্বয়ংক্রিয়ভাবে ব্যাকআপ সিঙ্ক হয়।</p>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="syncCloudBackupNow(false)" class="px-4 py-2 rounded-xl bg-emerald-800 text-amber-300 font-extrabold cursor-pointer">☁️ এখনই অটো ব্যাকআপ সিঙ্ক করুন</button>
              <button type="button" onclick="downloadJsonBackup()" class="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold cursor-pointer">⬇️ সম্পূর্ণ ব্যাকআপ ফাইল ডাউনলোড (JSON)</button>
              <label class="px-4 py-2 rounded-xl bg-amber-100 text-amber-950 border border-amber-300 font-bold cursor-pointer">
                ⬆️ ব্যাকআপ ফাইল রিস্টোর (JSON)
                <input type="file" accept=".json" onchange="restoreJsonBackup(event)" class="hidden" />
              </label>
            </div>
          </div>
        </div>
      `;
    }

    function saveShopSettingsForm(e) {
      e.preventDefault();
      state.shop.nameBn = document.getElementById('set-name-bn').value.trim();
      state.shop.phones = document.getElementById('set-phones').value.trim();
      state.shop.address = document.getElementById('set-address').value.trim();
      state.shop.memoNotice = document.getElementById('set-notice').value.trim();
      persistState();
      showToast('দোকানের সেটিংস সফলভাবে আপডেট হয়েছে!', 'success');
      renderApp();
    }

    function downloadJsonBackup() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AlKarim_Backup_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('সম্পূর্ণ ব্যাকআপ ফাইল ডাউনলোড হয়েছে!', 'success');
    }

    function restoreJsonBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && parsed.inventory) {
            state = { ...getDefaultState(), ...parsed };
            persistState();
            showToast('ব্যাকআপ ফাইল সফলভাবে রিস্টোর হয়েছে!', 'success');
            renderApp();
          } else {
            showToast('সঠিক ব্যাকআপ ফাইল নয়!', 'error');
          }
        } catch (err) {
          showToast('ফাইল পড়তে সমস্যা হয়েছে!', 'error');
        }
      };
      reader.readAsText(file);
    }

    // ==========================================
    // 9. MAIN APP SHELL & BOOTSTRAP
    // ==========================================
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      const navGroups = [
        {
          title: 'প্রধান মেনু',
          items: [
            { id: 'dashboard', label: 'ড্যাশবোর্ড', icon: '🏠' },
            { id: 'menu-hub', label: 'মেনু হাব', icon: '🎛️' },
            { id: 'new-order', label: 'নতুন অর্ডার', icon: '➕' },
            { id: 'orders', label: 'অর্ডার তালিকা', icon: '📋', badge: state.orders.length },
            { id: 'quick-sale', label: 'কুইক সেল', icon: '⚡' }
          ]
        },
        {
          title: 'পণ্য, ফেব্রিক্স ও স্টক',
          items: [
            { id: 'stock', label: 'স্টক (Stock)', icon: '📦' },
            { id: 'products', label: 'প্রোডাক্ট (পণ্য)', icon: '🧢', badge: state.inventory.filter(i => i.category === 'Product').length },
            { id: 'fabrics', label: 'ফেব্রিক্স (কাপড়)', icon: '🧵', badge: state.inventory.filter(i => i.category === 'Fabrics').length },
            { id: 'purchases', label: 'ক্রয় ও সাপ্লায়ার', icon: '🚚' }
          ]
        },
        {
          title: 'হিসাব ও সেটিংস',
          items: [
            { id: 'customers', label: 'কাস্টমার', icon: '👥', badge: state.customers.length },
            { id: 'services', label: 'পোশাক ও মাপ', icon: '✂️' },
            { id: 'reports', label: 'রিপোর্ট ও লাভ', icon: '📊' },
            { id: 'settings', label: 'সেটিংস ও ব্যাকআপ', icon: '⚙️' }
          ]
        }
      ];

      const renderSidebarContent = () => `
        <div class="p-4 royal-gradient text-white border-b border-emerald-800/70 flex items-center gap-3">
          <div class="w-12 h-12 rounded-full overflow-hidden shrink-0 shadow-md border-2 border-amber-400 bg-[#fdf8e8]">
            ${getRoyalBrandLogoSvg('sidebar')}
          </div>
          <div class="min-w-0">
            <div class="font-extrabold text-sm text-amber-300 truncate">${state.shop.nameBn}</div>
            <div class="text-[10px] text-emerald-200 truncate">বাকেরগঞ্জ, বরিশাল</div>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-4">
          ${navGroups.map((grp) => `
            <div>
              <div class="px-2.5 mb-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">${grp.title}</div>
              <div class="space-y-1">
                ${grp.items.map((item) => {
                  const active = state.activeTab === item.id;
                  return `
                    <button type="button" onclick="${item.id === 'new-order' ? 'startFreshNewOrder()' : `navigateToTab('${item.id}')`}" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-extrabold transition cursor-pointer ${active ? 'bg-emerald-800 text-amber-300 shadow-xs' : 'text-slate-700 hover:bg-slate-100'}">
                      <span class="flex items-center gap-2.5">
                        <span class="text-sm">${item.icon}</span>
                        <span>${item.label}</span>
                      </span>
                      ${typeof item.badge !== 'undefined' ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${active ? 'bg-amber-400 text-slate-950' : 'bg-slate-200 text-slate-700'}">${toBnNum(item.badge)}</span>` : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>

        <div class="p-3 border-t border-slate-200 bg-slate-50 text-[11px] space-y-1.5">
          <div class="flex items-center justify-between font-bold">
            <span class="text-slate-600">স্ট্যাটাস:</span>
            <span class="${navigator.onLine ? 'text-emerald-700' : 'text-amber-600'} font-extrabold">${navigator.onLine ? '🟢 অনলাইন (সিঙ্কড)' : '🟠 অফলাইন মোড'}</span>
          </div>
          <button type="button" onclick="syncCloudBackupNow(false)" class="w-full py-1.5 rounded-lg bg-white hover:bg-emerald-50 text-emerald-800 border border-emerald-200 font-bold cursor-pointer">
            ☁️ অটো ব্যাকআপ সিঙ্ক
          </button>
        </div>
      `;

      let pageContent = '';
      if (state.activeTab === 'dashboard') pageContent = renderDashboard();
      else if (state.activeTab === 'menu-hub') pageContent = renderMenuHub();
      else if (state.activeTab === 'new-order') pageContent = renderNewOrder();
      else if (state.activeTab === 'orders') pageContent = renderOrdersList();
      else if (state.activeTab === 'quick-sale') pageContent = renderQuickSale();
      else if (state.activeTab === 'stock') pageContent = renderStockManagement();
      else if (state.activeTab === 'products') pageContent = renderInventory('Product');
      else if (state.activeTab === 'fabrics') pageContent = renderInventory('Fabrics');
      else if (state.activeTab === 'purchases') pageContent = renderPurchases();
      else if (state.activeTab === 'customers') pageContent = renderCustomers();
      else if (state.activeTab === 'services') pageContent = renderServicesAndMeasurements();
      else if (state.activeTab === 'reports') pageContent = renderReports();
      else if (state.activeTab === 'settings') pageContent = renderSettings();
      else pageContent = renderDashboard();

      const currentTitleMap = {
        dashboard: 'ড্যাশবোর্ড',
        'menu-hub': 'মেনু হাব',
        'new-order': editingOrderId ? 'সম্পূর্ণ অর্ডার কাস্টমাইজ' : 'নতুন অর্ডার',
        orders: 'অর্ডার তালিকা',
        'quick-sale': 'কুইক সেল',
        stock: 'স্টক ম্যানেজমেন্ট',
        products: 'প্রোডাক্ট (পণ্য) তালিকা',
        fabrics: 'ফেব্রিক্স (কাপড়) তালিকা',
        purchases: 'ক্রয় ও সাপ্লায়ার',
        customers: 'কাস্টমার তালিকা',
        services: 'পোশাক ও মাপ',
        reports: 'রিপোর্ট ও লাভ',
        settings: 'সেটিংস ও ব্যাকআপ'
      };

      root.innerHTML = `
        <div class="min-h-screen flex bg-slate-100 text-slate-900">
          <!-- Desktop Left Sidebar -->
          <aside class="hidden lg:flex lg:w-64 lg:flex-col lg:fixed lg:inset-y-0 bg-white border-r border-slate-200 z-30">
            ${renderSidebarContent()}
          </aside>

          <!-- Mobile Drawer Sidebar -->
          ${state.mobileDrawerOpen ? `
            <div class="fixed inset-0 z-50 lg:hidden flex">
              <div onclick="state.mobileDrawerOpen = false; renderApp();" class="fixed inset-0 bg-slate-950/60"></div>
              <aside class="relative w-72 max-w-[82vw] bg-white h-full flex flex-col z-10 shadow-2xl">
                ${renderSidebarContent()}
              </aside>
            </div>
          ` : ''}

          <!-- Main Content Area -->
          <div class="flex-1 lg:pl-64 flex flex-col min-w-0">
            <header class="sticky top-0 z-20 bg-white border-b border-slate-200 px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <button type="button" onclick="state.mobileDrawerOpen = !state.mobileDrawerOpen; renderApp();" class="lg:hidden p-2 rounded-xl bg-emerald-900 text-amber-300 font-extrabold cursor-pointer">
                  ☰
                </button>
                <h1 class="text-sm sm:text-base font-extrabold text-slate-900 truncate">${currentTitleMap[state.activeTab] || 'ড্যাশবোর্ড'}</h1>
              </div>

              <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button type="button" onclick="startFreshNewOrder()" class="px-3 py-1.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold shadow-2xs cursor-pointer">
                  + নতুন অর্ডার
                </button>
                <button type="button" onclick="navigateToTab('orders')" class="hidden sm:inline-flex px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold cursor-pointer">
                  অর্ডার তালিকা
                </button>
                <button type="button" onclick="navigateToTab('menu-hub')" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-extrabold cursor-pointer" title="মেনু হাব">
                  🎛️
                </button>
              </div>
            </header>

            <main class="flex-1 p-3 sm:p-5 max-w-7xl w-full mx-auto">
              ${pageContent}
            </main>
          </div>
        </div>
      `;
    }

    function navigateToTab(tabId) {
      state.activeTab = tabId;
      state.mobileDrawerOpen = false;
      renderApp();
    }

    window.addEventListener('online', () => {
      showToast('ইন্টারনেট সংযুক্ত হয়েছে — অটো ব্যাকআপ সিঙ্ক হচ্ছে...', 'success');
      syncCloudBackupNow(true);
      renderApp();
    });

    window.addEventListener('offline', () => {
      showToast('অফলাইন মোড চালু — সব কাজ ফোনে সেভ থাকবে।', 'warn');
      renderApp();
    });

    function initAppBoot() {
      try {
        renderApp();
      } catch (err) {
        const root = document.getElementById('app-root');
        if (root) {
          root.innerHTML = `<div class="p-6 m-4 rounded-2xl bg-rose-50 border border-rose-300 text-rose-800 text-sm font-bold">রেন্ডার ত্রুটি: ${err.message}</div>`;
        }
      }
    }

    initAppBoot();
    window.addEventListener('DOMContentLoaded', initAppBoot);
    window.addEventListener('load', initAppBoot);
  </script>
</body>
</html>
