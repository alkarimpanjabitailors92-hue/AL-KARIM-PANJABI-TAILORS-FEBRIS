    const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    function toBnNum(val) {
      if (val === null || val === undefined || isNaN(val)) return '০';
      const formatted = Number(val).toLocaleString('en-US', { maximumFractionDigits: 2 });
      return formatted.replace(/\d/g, (d) => bnDigits[Number(d)]);
    }

    function formatTk(amount) {
      const num = Number(amount || 0);
      const sign = num < 0 ? '-' : '';
      return `${sign}৳ ${toBnNum(Math.abs(num))}`;
    }

    function todayISO() {
      return new Date().toISOString().split('T')[0];
    }

    function addDaysISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + Number(days || 0));
      return d.toISOString().split('T')[0];
    }

        <line x1="120" y1="40" x2="120" y2="128" stroke="${fg}" stroke-width="3" stroke-dasharray="4 4"/>
        <text x="120" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="${fg}">${safeTitle}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);

    function calculateFinancials(ordersList = state.orders) {
      let tailorRevenue = 0;
      let tailorKarigarCost = 0;
      let fabricRevenue = 0;
      let fabricCost = 0;
      let totalDiscount = 0;
      let totalPaid = 0;
      let totalBilled = 0;

      const orderBreakdown = ordersList.map((ord) => {
        let ordTailorRev = 0;
        let ordTailorCost = 0;
        let ordFabricRev = 0;
        let ordFabricCost = 0;

        (ord.items || []).forEach((item) => {
          const itemQty = Number(item.qty || 1);
          const fQty = Number(item.fabricQty || 0);
          const fSell = Number(item.fabricUnitPrice || 0);
          const fCost = Number(item.fabricCostPrice || 0);

          if (item.type === 'tailor') {
            ordTailorRev += Number(item.stitchCharge || 0) * itemQty;
            ordTailorCost += Number(item.karigarCost || 0) * itemQty;
          }

          ordFabricRev += fQty * fSell;
          ordFabricCost += fQty * fCost;
        });

        const rawTotal = ordTailorRev + ordFabricRev;
        const discount = Number(ord.discount || 0);
        const netTotal = Math.max(0, rawTotal - discount);
        const paid = Number(ord.paidAmount || 0);
        const due = Math.max(0, netTotal - paid);

        const ordTailorProfit = ordTailorRev - ordTailorCost;
        const ordFabricProfit = ordFabricRev - ordFabricCost;
        const ordTotalProfit = (ordTailorProfit + ordFabricProfit) - discount;

        tailorRevenue += ordTailorRev;
        tailorKarigarCost += ordTailorCost;
        fabricRevenue += ordFabricRev;
        fabricCost += ordFabricCost;
        totalDiscount += discount;
        totalPaid += paid;
        totalBilled += netTotal;

        return {
          ...ord,
          ordTailorRev,
          ordTailorCost,
          ordTailorProfit,
          ordFabricRev,
          ordFabricCost,
          ordFabricProfit,
          rawTotal,
          discount,
          netTotal,
          paid,
          due,
          ordTotalProfit
        };
      });

      const tailorProfit = tailorRevenue - tailorKarigarCost;
      const fabricProfit = fabricRevenue - fabricCost;
      const combinedProfit = (tailorProfit + fabricProfit) - totalDiscount;
      const totalDue = Math.max(0, totalBilled - totalPaid);

      return {
        tailorRevenue,
        tailorKarigarCost,
        tailorProfit,
        fabricRevenue,
        fabricCost,
        fabricProfit,
        totalDiscount,
        totalPaid,
        totalBilled,
        totalDue,
        combinedProfit,
        orderBreakdown
      };
    }

      const baseDate = new Date();
      baseDate.setDate(1);
      baseDate.setMonth(baseDate.getMonth() + state.calendarMonthOffset);
      const year = baseDate.getFullYear();
      const month = baseDate.getMonth();
      const firstDayOfWeek = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const bnMonths = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
      const bnDays = ['রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহস্পতি', 'শুক্র', 'শনি'];

      let calendarCells = '';
      for (let i = 0; i < firstDayOfWeek; i++) {

      }
      for (let d = 1; d <= daysInMonth; d++) {

        const dayOrders = ordersByDeliveryDate[dateKey] || [];
        const isToday = dateKey === todayISO();

        calendarCells += `
          <div class="min-h-[96px] rounded-xl border ${isToday ? 'border-emerald-500 bg-emerald-50/40 ring-1 ring-emerald-400' : 'border-slate-200 bg-white'} p-1.5 flex flex-col justify-between transition hover:border-slate-300">

              ${dayOrders.length > 0 ? `<span class="text-[10px] font-bold text-slate-600 bg-slate-100 px-1.5 rounded">${toBnNum(dayOrders.length)}টি</span>` : ''}

    function recalcGarmentModalRate() {
      if (!selectedGarmentForModal) return;
      let extraSum = 0;
      state.specialDesigns.forEach((sp, idx) => {
        const cb = document.getElementById(`gm-sp-${idx}`);
        if (cb && cb.checked) {
          extraSum += Number(sp.extra || 0);
        }
      });
      const rateInput = document.getElementById('gm-rate');
      if (rateInput) {
        rateInput.value = Number(selectedGarmentForModal.baseRate || 0) + extraSum;
      }
    }

    function saveGarmentModalToDraft() {
      if (!selectedGarmentForModal) return;
      const qty = Math.max(1, Number(document.getElementById('gm-qty')?.value || 1));
      const rate = Number(document.getElementById('gm-rate')?.value || selectedGarmentForModal.baseRate);
      const priority = document.getElementById('gm-priority')?.value || 'Normal';

      const measurements = {};
      state.measurementTypes.forEach((m) => {
        const val = document.getElementById(`gm-m-${m.name}`)?.value?.trim();
        if (val) measurements[m.name] = val;
      });

      const designParts = [];
      for (let i = 1; i <= 4; i++) {
        const v = document.getElementById(`gm-dd-${i}`)?.value?.trim();
        if (v) designParts.push(v);
      }
      state.specialDesigns.forEach((sp, idx) => {
        const cb = document.getElementById(`gm-sp-${idx}`);
        if (cb && cb.checked) designParts.push(sp.name);
      });

      const groupName = document.getElementById('gm-group-name')?.value?.trim();
      const lotNo = document.getElementById('gm-lot-no')?.value?.trim();
      const masterName = document.getElementById('gm-master-name')?.value?.trim();
      const karigarName = document.getElementById('gm-karigar-name')?.value?.trim();

      if (groupName) designParts.push(`গ্রুপ: ${groupName}`);
      if (lotNo) designParts.push(`লট: ${lotNo}`);
      if (masterName) designParts.push(`মাস্টার: ${masterName}`);
      if (karigarName) designParts.push(`কারিগর: ${karigarName}`);
      if (priority !== 'Normal') designParts.push(`প্রায়োরিটি: ${priority}`);

      state.draftOrder.items.push({
        type: 'tailor',
        serviceId: selectedGarmentForModal.id,
        serviceName: selectedGarmentForModal.name,
        fabricId: null,
        fabricName: lotNo ? `লট ${lotNo}` : 'কাস্টমারের কাপড় / স্টক',
        fabricQty: 0,
        fabricUnitPrice: 0,
        fabricCostPrice: 0,
        stitchCharge: rate,
        karigarCost: selectedGarmentForModal.karigarCost,
        qty,
        designNote: designParts.join(', '),
        measurements
      });

      closeModal();
      showToast(`"${selectedGarmentForModal.name}" (${toBnNum(qty)}টি) কার্টে যুক্ত হয়েছে।`, 'success');
      renderApp();
    }

      const inv = state.inventory.find((i) => i.id === pendingFabricSelection.invId);

        fabricQty: qty,

        qty,

      state.draftOrder.items.push({

        measurements: {}
      });

      pendingProductSelection = null;
      showToast(`প্রোডাক্ট "${inv.name}" (${toBnNum(qty)} ${inv.unit}) কার্টে যুক্ত হয়েছে।`, 'success');

    function adjustDraftItemQty(index, delta) {
      const item = state.draftOrder.items[index];
      if (!item) return;
      const isFabric = item.fabricId && !item.stitchCharge && !String(item.designNote || '').includes('প্রোডাক্ট');
      const step = isFabric ? 0.5 : 1;
      const currentQty = Number(item.qty || 1);
      const nextQty = Number((currentQty + (delta * step)).toFixed(2));

      if (nextQty <= 0) {
        state.draftOrder.items.splice(index, 1);
        showToast('আইটেমটি কার্ট থেকে সরানো হয়েছে।', 'info');
        renderApp();
        return;
      }

      item.qty = nextQty;
      if (item.fabricId && !item.stitchCharge) {
        item.fabricQty = nextQty;
        const inv = state.inventory.find((i) => i.id === item.fabricId);
        const unitLabel = inv ? inv.unit : 'গজ/পিস';
        item.serviceName = `${item.fabricName} (${toBnNum(nextQty)} ${unitLabel})`;
      }
      renderApp();
    }

    function removeDraftItem(index) {
      state.draftOrder.items.splice(index, 1);
      renderApp();
    }

    function submitNewOrder() {
      const nameEl = document.getElementById('draft-cust-name');
      const phoneEl = document.getElementById('draft-cust-phone');
      const addrEl = document.getElementById('draft-cust-addr');
      const ordDateEl = document.getElementById('draft-ord-date');
      const delDateEl = document.getElementById('draft-del-date');
      const payMethodEl = document.getElementById('draft-pay-method');
      const discEl = document.getElementById('draft-discount');
      const paidEl = document.getElementById('draft-paid');

      const custName = nameEl.value.trim();
      const custPhone = phoneEl.value.trim();

      if (!custName) {
        showToast('কাস্টমারের নাম লিখুন।', 'error');
        nameEl.focus();
        return;
      }
      if (state.draftOrder.items.length === 0) {
        showToast('অন্তত একটি আইটেম কার্টে যুক্ত করুন।', 'error');
        return;
      }

      let tailorRev = 0, fabRev = 0;
      state.draftOrder.items.forEach((it) => {
        tailorRev += Number(it.stitchCharge || 0) * Number(it.qty || 1);
        fabRev += Number(it.fabricQty || 0) * Number(it.fabricUnitPrice || 0);
        if (it.fabricId && Number(it.fabricQty || 0) > 0) {
          const invItem = state.inventory.find((i) => i.id === it.fabricId);
          if (invItem) {
            invItem.stock = Number((Number(invItem.stock) - Number(it.fabricQty)).toFixed(2));
          }
        }
      });

      const discount = Number(discEl.value || 0);
      const paidAmount = Number(paidEl.value || 0);
      const netTotal = Math.max(0, tailorRev + fabRev - discount);
      const dueAmount = Math.max(0, netTotal - paidAmount);

      const orderCode = `ORD-${state.shop.nextOrderNumber++}`;
      const existingCust = state.customers.find((c) => (custPhone && c.phone === custPhone) || c.name === custName);
      const prevDueSnapshot = existingCust ? Number(existingCust.due || 0) : 0;

      state.orders.unshift({
        id: orderCode,
        orderDate: ordDateEl.value || todayISO(),
        orderTime: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }),
        deliveryDate: delDateEl.value || addDaysISO(state.shop.defaultDeliveryDays),
        customerName: custName,
        customerPhone: custPhone || 'N/A',
        customerAddress: addrEl.value.trim(),
        status: 'Cutting',
        paymentMethod: payMethodEl.value || 'Cash',
        previousDue: prevDueSnapshot,
        discount,
        paidAmount,
        items: JSON.parse(JSON.stringify(state.draftOrder.items))
      });

      if (existingCust) {
        existingCust.totalOrders = Number(existingCust.totalOrders || 0) + 1;
        existingCust.due = prevDueSnapshot + dueAmount;
      } else {
        state.customers.unshift({
          id: `cust-${Date.now()}`,
          name: custName,
          phone: custPhone || '01700000000',
          address: addrEl.value.trim() || 'বাকেরগঞ্জ',
          totalOrders: 1,
          due: dueAmount,
          active: true
        });
      }

      state.draftOrder = {
        customerName: '',
        customerPhone: '',
        customerAddress: '',
        orderDate: todayISO(),
        deliveryDate: addDaysISO(state.shop.defaultDeliveryDays),
        paymentMethod: 'Cash',
        discount: 0,
        paidAmount: 0,
        items: []
      };

      showToast(`অর্ডার #${orderCode} সফলভাবে তৈরি হয়েছে!`, 'success');
      state.activeTab = 'orders';
      renderApp();
      openOrderConfirmedA4Modal(orderCode);
    }

    function renderNewOrder() {
      const draftItems = state.draftOrder.items;
      const filterText = (state.searchQuery || '').trim().toLowerCase();

      const filteredGarments = state.garmentGallery.filter(
        (g) => !filterText || g.name.toLowerCase().includes(filterText)

      const fabricItems = state.inventory.filter(
        (i) => i.active && i.category === 'Fabrics' && (!filterText || i.name.toLowerCase().includes(filterText) || i.code.toLowerCase().includes(filterText))
      );

      const otherProductItems = state.inventory.filter(
        (i) => i.active && i.category !== 'Fabrics' && (!filterText || i.name.toLowerCase().includes(filterText) || i.code.toLowerCase().includes(filterText))
      );

      let draftTailorRev = 0, draftTailorCost = 0, draftFabRev = 0, draftFabCost = 0;
      draftItems.forEach((it) => {
        const qNum = Number(it.qty || 1);
        if (it.type === 'tailor') {
          draftTailorRev += Number(it.stitchCharge || 0) * qNum;
          draftTailorCost += Number(it.karigarCost || 0) * qNum;
        }
        draftFabRev += Number(it.fabricQty || 0) * Number(it.fabricUnitPrice || 0);
        draftFabCost += Number(it.fabricQty || 0) * Number(it.fabricCostPrice || 0);
      });

      const draftGross = draftTailorRev + draftFabRev;
      const draftDiscount = Number(state.draftOrder.discount || 0);
      const draftNet = Math.max(0, draftGross - draftDiscount);
      const draftPaid = Number(state.draftOrder.paidAmount || 0);
      const draftDue = Math.max(0, draftNet - draftPaid);

      const activeFabricObj = pendingFabricSelection
        ? state.inventory.find((i) => i.id === pendingFabricSelection.invId)
        : null;

        ? state.inventory.find((i) => i.id === pendingProductSelection.invId)
        : null;

                <input id="draft-cust-phone" type="tel" value="${state.draftOrder.customerPhone}" oninput="state.draftOrder.customerPhone=this.value" placeholder="কাস্টমারের নম্বর" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:border-emerald-600 outline-none text-xs font-bold" />
              </div>
              <div class="sm:col-span-4">
                <input id="draft-cust-addr" type="text" value="${state.draftOrder.customerAddress}" oninput="state.draftOrder.customerAddress=this.value" placeholder="গ্রাহকের ঠিকানা" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:border-emerald-600 outline-none text-xs" />
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
            <div class="lg:col-span-9 bg-white rounded-2xl border border-slate-200 p-3.5 shadow-xs space-y-4">
              <div class="grid grid-cols-3 gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
                <button type="button" onclick="setNewOrderMode('fabrics')" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-1.5 cursor-pointer ${

                    ? 'bg-amber-500 text-slate-950 shadow-sm'
                    : 'bg-white text-slate-700 hover:bg-amber-50'
                }">
                  <i data-lucide="layers" class="w-4 h-4 shrink-0"></i>
                  <span>ফেব্রিক্স</span>
                </button>

                    ? 'bg-emerald-700 text-white shadow-sm'
                    : 'bg-white text-slate-700 hover:bg-emerald-50'
                }">

                    : 'bg-white text-slate-700 hover:bg-indigo-50'

              ${newOrderMode === 'fabrics' ? `
                <div class="space-y-3">

                    </div>
                  </div>

                  ${activeFabricObj ? `

                      </div>
                    </div>
                  ` : ''}

                  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 max-h-[480px] overflow-y-auto pr-0.5">

                      const isSelected = activeFabricObj && activeFabricObj.id === fab.id;
                      return `
                        <button type="button" onclick="selectFabricForSale('${fab.id}')" class="text-left p-3 rounded-xl border transition flex flex-col justify-between gap-1.5 cursor-pointer ${
                          isSelected
                            ? 'bg-amber-100/80 border-amber-500 ring-2 ring-amber-300'

                          <div class="flex items-start justify-between gap-2">
                            <span class="font-bold text-xs text-slate-900 leading-snug">${fab.name}</span>
                            <span class="text-[11px] font-extrabold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-md shrink-0">${formatTk(fab.sellPrice)}/${fab.unit}</span>

                      <p class="text-[11px] text-slate-500">পোশাকের পিকচারে ক্লিক করে কাস্টমারের মাপ ও ডিজাইন সিলেক্ট করুন</p>
                    </div>
                    <div class="relative w-full sm:w-64">
                      <input type="text" value="${state.searchQuery}" oninput="state.searchQuery=this.value; renderApp();" placeholder="🔍 পোশাকের নাম খুঁজুন..." class="w-full px-3 py-2 rounded-xl border border-emerald-300 bg-emerald-50/40 focus:border-emerald-600 outline-none text-xs font-bold" />

                  </div>
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    ${filteredGarments.map((g) => `

                        <div class="aspect-square w-full bg-slate-100 overflow-hidden">
                          <img src="${g.img}" alt="${g.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-200" />
                        </div>
                        <div class="bg-amber-400 text-slate-950 text-[11px] font-extrabold py-1.5 px-1 truncate">
                          ${g.name}
                        </div>
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              ${newOrderMode === 'products' ? `
                <div class="space-y-3">
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
                    <div>
                      <h3 class="text-sm font-extrabold text-indigo-950">প্রোডাক্ট (রেডিমেড, আতর, তসবি ও অন্যান্য)</h3>
                      <p class="text-[11px] text-slate-500">কাপড় ছাড়া দোকানের অন্যান্য পণ্য সিলেক্ট করে কার্টে যুক্ত করুন</p>
                    </div>
                    <div class="relative w-full sm:w-64">
                      <input type="text" value="${state.searchQuery}" oninput="state.searchQuery=this.value; renderApp();" placeholder="🔍 প্রোডাক্ট বা কোড খুঁজুন..." class="w-full px-3 py-2 rounded-xl border border-indigo-300 bg-indigo-50/40 focus:border-indigo-600 outline-none text-xs font-bold" />
                    </div>
                  </div>

                  ${activeProductObj ? `
                    <div class="bg-indigo-50 border-2 border-indigo-400 rounded-2xl p-3.5 space-y-3 text-xs">
                      <div class="flex items-center justify-between">
                        <div>
                          <span class="px-2 py-0.5 rounded bg-indigo-600 text-white font-bold text-[10px]">নির্বাচিত প্রোডাক্ট</span>
                          <h4 class="text-sm font-extrabold text-slate-900 mt-1">${activeProductObj.name}</h4>
                          <p class="text-[11px] text-slate-600">স্টকে আছে: <b>${toBnNum(activeProductObj.stock)} ${activeProductObj.unit}</b></p>

                        <button type="button" onclick="pendingProductSelection=null; renderApp();" class="text-slate-500 hover:text-rose-600 font-bold cursor-pointer">✕</button>

                      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 items-end">

                          <label class="block text-[11px] font-bold text-slate-700 mb-1">পরিমাণ (${activeProductObj.unit})</label>
                          <div class="flex items-center gap-1">
                            <button type="button" onclick="pendingProductSelection.qty = Math.max(1, Number(pendingProductSelection.qty||1) - 1); renderApp();" class="px-2.5 py-1.5 rounded-lg bg-white border border-indigo-300 font-extrabold cursor-pointer">-</button>
                            <input type="number" min="1" value="${pendingProductSelection.qty}" oninput="pendingProductSelection.qty = Number(this.value || 1)" class="w-full px-2.5 py-1.5 rounded-lg border border-indigo-400 bg-white font-extrabold text-center outline-none" />
                            <button type="button" onclick="pendingProductSelection.qty = Number(pendingProductSelection.qty||1) + 1; renderApp();" class="px-2.5 py-1.5 rounded-lg bg-white border border-indigo-300 font-extrabold cursor-pointer">+</button>
                          </div>
                        </div>

                        <div>
                          <label class="block text-[11px] font-bold text-slate-700 mb-1">দর (৳ / ${activeProductObj.unit})</label>
                          <input type="number" min="0" value="${pendingProductSelection.sellPrice}" oninput="pendingProductSelection.sellPrice = Number(this.value || 0)" class="w-full px-3 py-1.5 rounded-lg border border-indigo-400 bg-white font-extrabold text-emerald-800 outline-none" />
                        </div>

                        <button type="button" onclick="confirmPendingProductToCart()" class="w-full py-2 px-3 rounded-xl bg-indigo-700 hover:bg-indigo-800 text-white font-extrabold text-xs shadow-sm cursor-pointer">

    function handleModalProductFileChange(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      processImageFileToDataUrl(file, function(finalUrl) {
        modalUploadedProductDataUrl = finalUrl;
        const preview = document.getElementById('inv-live-preview');
        if (preview) preview.src = finalUrl;
        showToast('পণ্যের ছবি লোড হয়েছে!', 'info');
      });
    }

    function handleProductPasteZone(e) {
      const items = (e.clipboardData || window.clipboardData)?.items || [];
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          processImageFileToDataUrl(blob, function(finalUrl) {
            modalUploadedProductDataUrl = finalUrl;
            const preview = document.getElementById('inv-live-preview');
            if (preview) preview.src = finalUrl;
            showToast('কপি করা পণ্যের ছবি যুক্ত হয়েছে!', 'success');
          });
          e.preventDefault();
          return;
        }
      }
    }

    function handleAddInventoryItem(e) {
      e.preventDefault();
      const name = document.getElementById('new-inv-name').value.trim();
      const code = document.getElementById('new-inv-code').value.trim();
      const category = document.getElementById('new-inv-cat').value;
      const unit = document.getElementById('new-inv-unit').value;
      const costPrice = Number(document.getElementById('new-inv-cost').value || 0);
      const sellPrice = Number(document.getElementById('new-inv-sell').value || 0);
      const stock = Number(document.getElementById('new-inv-stock').value || 0);

      state.inventory.unshift({
        id: `inv-${Date.now()}`,
        code,
        name,
        category,
        unit,
        costPrice,
        sellPrice,
        stock,
        minAlert: 10,
        active: true,
        img: modalUploadedProductDataUrl || garmentSvgDataUri(name, category === 'Fabrics' ? '#fffbeb' : '#eef2ff', category === 'Fabrics' ? '#92400e' : '#3730a3')
      });
      modalUploadedProductDataUrl = null;
      closeModal();
      showToast(`"${name}" পণ্যের তালিকায় যোগ হয়েছে।`, 'success');
      renderApp();
    }

    function renderInventory() {
      const currentFilter = state.inventoryFilter || 'all';

          currentFilter === 'all'
            ? true
            : currentFilter === 'fabrics'
            ? item.category === 'Fabrics'
            : item.category !== 'Fabrics';
        const matchesSearch =
          !searchVal ||
          item.name.toLowerCase().includes(searchVal) ||
          item.code.toLowerCase().includes(searchVal) ||
          (item.category || '').toLowerCase().includes(searchVal);
        return matchesType && matchesSearch;

      const productsCount = state.inventory.filter((i) => i.category !== 'Fabrics').length;

          </div>

            <table class="w-full text-left border-collapse text-xs sm:text-sm">

                </tr>

              <tbody class="divide-y divide-slate-100">
                ${filteredList.length === 0 ? `
                  <tr><td colspan="7" class="py-8 text-center text-slate-400">কোনো পণ্য পাওয়া যায়নি।</td></tr>

                          <span class="block w-4 h-4 rounded-full bg-white transition-transform ${i.active ? 'translate-x-5' : 'translate-x-0'}"></span>
                        </button>
                      </td>
                      <td class="py-2.5 px-3 text-right">
                        <div class="inline-flex items-center gap-1">
                          <button onclick="openEditInventoryModal('${i.id}')" class="px-2.5 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-bold cursor-pointer">ছবি / এডিট</button>
                          <button onclick="deleteInventoryItem('${i.id}')" class="px-2 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold cursor-pointer">✕</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

    function handleUpdateInventoryItem(e, invId) {
      e.preventDefault();
      const item = state.inventory.find((i) => i.id === invId);
      if (!item) return;
      item.name = document.getElementById('edit-inv-name').value.trim();
      item.code = document.getElementById('edit-inv-code').value.trim();
      item.category = document.getElementById('edit-inv-cat').value;
      item.stock = Number(document.getElementById('edit-inv-stock').value || 0);
      item.costPrice = Number(document.getElementById('edit-inv-cost').value || 0);
      item.sellPrice = Number(document.getElementById('edit-inv-sell').value || 0);
      if (modalUploadedProductDataUrl) {
        item.img = modalUploadedProductDataUrl;
      }
      modalUploadedProductDataUrl = null;
      closeModal();
      showToast(`"${item.name}" ও ছবি আপডেট হয়েছে।`, 'success');
      renderApp();

    function handleUpdateOrder(e, orderId) {
      e.preventDefault();
      const ord = state.orders.find((o) => o.id === orderId);
      if (!ord) return;
      ord.customerName = document.getElementById('edit-ord-cname').value.trim();
      ord.customerPhone = document.getElementById('edit-ord-cphone').value.trim();
      ord.orderDate = document.getElementById('edit-ord-odate').value;
      ord.deliveryDate = document.getElementById('edit-ord-ddate').value;
      ord.discount = Number(document.getElementById('edit-ord-disc').value || 0);
      ord.paidAmount = Number(document.getElementById('edit-ord-paid').value || 0);
      ord.status = document.getElementById('edit-ord-status').value;
      ord.paymentMethod = document.getElementById('edit-ord-paymethod').value;
      closeModal();
      showToast(`অর্ডার #${ord.id} আপডেট করা হয়েছে।`, 'success');
      renderApp();
    }

    function deleteOrderRecord(orderId) {
      state.orders = state.orders.filter((o) => o.id !== orderId);
      showToast('অর্ডারটি ডিলিট করা হয়েছে।', 'warn');
      renderApp();
    }

    function addQuickCartItem(invId) {
      const inv = state.inventory.find((i) => i.id === invId);
      if (!inv) return;
      const existing = quickCart.find((c) => c.invId === invId);
      if (existing) {
        existing.qty = Number((existing.qty + 1).toFixed(2));
      } else {
        quickCart.push({ invId: inv.id, name: inv.name, unit: inv.unit, sellPrice: inv.sellPrice, costPrice: inv.costPrice, qty: 1 });
      }
      renderApp();
    }

    function checkoutQuickSale() {
      if (quickCart.length === 0) {
        showToast('কার্টে কোনো আইটেম নেই।', 'error');
        return;
      }
      const custName = (document.getElementById('qs-cust-name')?.value || '').trim() || 'ক্যাশ কাস্টমার';
      let fabRev = 0;
      const items = quickCart.map((c) => {
        fabRev += Number(c.qty) * Number(c.sellPrice);
        const inv = state.inventory.find((i) => i.id === c.invId);
        if (inv) inv.stock = Number((Number(inv.stock) - Number(c.qty)).toFixed(2));
        return {
          type: 'product',
          serviceId: c.invId,
          serviceName: `${c.name} (${toBnNum(c.qty)} ${c.unit})`,
          fabricId: c.invId,
          fabricName: c.name,
          fabricQty: c.qty,
          fabricUnitPrice: c.sellPrice,
          fabricCostPrice: c.costPrice,
          stitchCharge: 0,
          karigarCost: 0,
          qty: c.qty,
          designNote: 'Quick Sale',
          measurements: {}
        };
      });

      const orderCode = `ORD-${state.shop.nextOrderNumber++}`;
      state.orders.unshift({
        id: orderCode,
        orderDate: todayISO(),
        deliveryDate: todayISO(),
        customerName: custName,
        customerPhone: 'N/A',
        customerAddress: '',
        status: 'Delivered',
        paymentMethod: 'Cash',
        discount: 0,
        paidAmount: fabRev,
        items
      });

      quickCart = [];
      showToast(`কুইক সেল #${orderCode} সম্পন্ন হয়েছে!`, 'success');
      setTab('orders');
    }

      const category = document.getElementById('new-inv-cat').value;
      const unit = document.getElementById('new-inv-unit').value;

      const sellPrice = Number(document.getElementById('new-inv-sell').value || 0);
      const stock = Number(document.getElementById('new-inv-stock').value || 0);

      state.inventory.unshift({
        id: `inv-${Date.now()}`,

        name,
        category,
        unit,
        costPrice,
        sellPrice,
        stock,
        minAlert: 10,
        active: true

    let modalUploadedGarmentDataUrl = null;

    function processImageFileToDataUrl(file, onDone) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const rawDataUrl = ev.target.result;
        const img = new Image();
        img.onload = function() {
          try {
            const canvas = document.createElement('canvas');
            const maxDim = 280;
            let w = img.width || maxDim;
            let h = img.height || maxDim;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            onDone(canvas.toDataURL('image/jpeg', 0.8));
          } catch (err) {
            onDone(rawDataUrl);
          }
        };
        img.onerror = function() {
          onDone(rawDataUrl);
        };
        img.src = rawDataUrl;
      };
      reader.readAsDataURL(file);
    }

    async function pasteImageFromClipboardForModal() {
      try {
        if (!navigator.clipboard || !navigator.clipboard.read) {
          showToast('নিচের বক্সে ছবি পেস্ট (Paste) করুন অথবা বিল্ট-ইন গ্যালারি থেকে বাছাই করুন।', 'warn');
          return;
        }
        const items = await navigator.clipboard.read();
        for (const item of items) {
          const imgType = item.types.find((t) => t.startsWith('image/'));
          if (imgType) {
            const blob = await item.getType(imgType);
            processImageFileToDataUrl(blob, function(finalUrl) {
              modalUploadedGarmentDataUrl = finalUrl;
              const preview = document.getElementById('gg-live-preview');
              if (preview) preview.src = finalUrl;
              showToast('ক্লিপবোর্ড থেকে ছবি সেট হয়েছে!', 'success');
            });
            return;
          }
        }
        showToast('ক্লিপবোর্ডে কোনো ছবি কপি করা নেই। গ্যালারি থেকে ছবি Copy করে আবার চেষ্টা করুন।', 'warn');
      } catch (err) {
        showToast('নিচের "ছবি পেস্ট বক্সে" ট্যাপ করে Paste চাপুন।', 'info');
        const box = document.getElementById('gg-paste-zone');
        if (box) box.focus();
      }
    }

    function handlePasteEventOnZone(e) {
      const items = (e.clipboardData || window.clipboardData)?.items || [];
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          processImageFileToDataUrl(blob, function(finalUrl) {
            modalUploadedGarmentDataUrl = finalUrl;
            const preview = document.getElementById('gg-live-preview');
            if (preview) preview.src = finalUrl;
            showToast('কপি করা ছবি সফলভাবে যুক্ত হয়েছে!', 'success');
          });
          e.preventDefault();
          return;
        }
      }
    }

    function handleSaveGarmentGalleryItem(e, garmentId) {
      e.preventDefault();
      const name = document.getElementById('gg-name').value.trim();
      const baseRate = Number(document.getElementById('gg-rate').value || 0);
      const karigarCost = Number(document.getElementById('gg-karigar').value || 0);
      const urlVal = document.getElementById('gg-img-url').value.trim();
      const chosenImg = modalUploadedGarmentDataUrl || urlVal || null;

      if (garmentId) {
        const g = state.garmentGallery.find((x) => x.id === garmentId);
        if (g) {
          g.name = name;
          g.baseRate = baseRate;
          g.karigarCost = karigarCost;
          if (chosenImg) g.img = chosenImg;
        }
      } else {
        state.garmentGallery.push({
          id: `g-${Date.now()}`,
          name,
          baseRate,
          karigarCost,
          img: chosenImg || garmentSvgDataUri(name, '#ecfdf5', '#065f46')
        });
      }

      modalUploadedGarmentDataUrl = null;
      persistState();
      closeModal();
      showToast(`"${name}"-এর ছবি ও রেট সেভ হয়েছে!`, 'success');
      renderApp();
    }

    function handleSavePurchase(e) {
      e.preventDefault();
      const supplier = document.getElementById('pur-supplier').value;
      const date = document.getElementById('pur-date').value || todayISO();
      const invId = document.getElementById('pur-inv-id').value;
      const qty = Number(document.getElementById('pur-qty').value || 0);
      const rate = Number(document.getElementById('pur-rate').value || 0);
      const paid = Number(document.getElementById('pur-paid').value || 0);
      const total = qty * rate;

      const inv = state.inventory.find((i) => i.id === invId);
      if (inv) {
        inv.stock = Number((Number(inv.stock || 0) + qty).toFixed(2));
        inv.costPrice = rate;
      }

      state.purchases.unshift({
        id: `PUR-${String(state.purchases.length + 30).padStart(5, '0')}`,
        date,
        supplier,
        itemName: inv ? inv.name : 'পণ্য',
        qty,
        unit: inv ? inv.unit : 'গজ',
        rate,
        total,
        paid,
        due: Math.max(0, total - paid)
      });

      closeModal();
      showToast('নতুন ক্রয় সেভ হয়েছে এবং ইনভেন্টরি স্টক আপডেট হয়েছে!', 'success');
      renderApp();
    }

          <button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100 cursor-pointer">✕</button>
        </div>
        <form onsubmit="handleSaveSpecialDesign(event, ${idx})" class="p-5 space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">ডিজাইনের নাম *</label>
            <input id="spd-name" type="text" value="${sp ? sp.name : ''}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">অতিরিক্ত চার্জ (৳)</label>
            <input id="spd-extra" type="number" min="0" value="${sp ? sp.extra : 0}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 text-white font-extrabold cursor-pointer">সেভ করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-sm');
    }

    function handleSaveSpecialDesign(e, idx) {
      e.preventDefault();
      const name = document.getElementById('spd-name').value.trim();
      const extra = Number(document.getElementById('spd-extra').value || 0);
      if (idx >= 0) {
        state.specialDesigns[idx] = { name, extra };
      } else {
        state.specialDesigns.push({ name, extra });
      }
      closeModal();
      showToast('স্পেশাল ডিজাইন সেভ হয়েছে।', 'success');
      renderApp();
    }

    function openUserProfileEditModal(userId) {
      const u = userId ? state.staffProfiles.find((x) => x.id === userId) : null;
      const html = `
        <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-base font-extrabold text-slate-900">${u ? 'ইউজার ও পাসওয়ার্ড এডিট' : 'নতুন ইউজার যোগ'}</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100 cursor-pointer">✕</button>
        </div>
        <form onsubmit="handleSaveUserProfile(event, '${u ? u.id : ''}')" class="p-5 space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">নাম *</label>
            <input id="usr-name" type="text" value="${u ? u.name : ''}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">মোবাইল নম্বর *</label>
            <input id="usr-phone" type="text" value="${u ? u.phone : ''}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">পাসওয়ার্ড *</label>
            <input id="usr-pass" type="text" value="${u ? u.password : ''}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">রোল / পদবি</label>
            <input id="usr-role" type="text" value="${u ? u.roleLabel : 'স্টাফ / কারিগর'}" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
          </div>
          <label class="inline-flex items-center gap-2 font-bold text-slate-700 cursor-pointer">
            <input id="usr-rep" type="checkbox" ${!u || u.canViewReports ? 'checked' : ''} class="rounded accent-emerald-600" />
            <span>লাভের রিপোর্ট দেখার অনুমতি দিন</span>
          </label>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border font-bold cursor-pointer">বাতিল</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 text-white font-extrabold cursor-pointer">সেভ করুন</button>
          </div>
        </form>
      `;
      openModal(html, 'max-w-md');
    }

    function handleSaveUserProfile(e, userId) {
      e.preventDefault();
      const name = document.getElementById('usr-name').value.trim();
      const phone = document.getElementById('usr-phone').value.trim();
      const password = document.getElementById('usr-pass').value.trim();
      const roleLabel = document.getElementById('usr-role').value.trim();
      const canViewReports = document.getElementById('usr-rep').checked;

      if (userId) {
        const u = state.staffProfiles.find((x) => x.id === userId);
        if (u) {
          u.name = name;
          u.phone = phone;
          u.password = password;
          u.roleLabel = roleLabel;
          u.canViewReports = canViewReports;
          if (state.currentUser.id === u.id) {
            state.currentUser = { ...u };
          }
        }
      } else {
        state.staffProfiles.push({ id: `usr-${Date.now()}`, name, phone, password, roleLabel, canViewReports });
      }
      closeModal();
      showToast('ইউজার প্রোফাইল ও পাসওয়ার্ড আপডেট হয়েছে।', 'success');
      renderApp();
    }

    function exportFullBackupJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `alkarim-erp-backup-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('ব্যাকআপ JSON ফাইল ডাউনলোড হয়েছে।', 'success');
    }

    function importFullBackupJson(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && typeof parsed === 'object') {
            state = { ...state, ...parsed };
            persistState();
            showToast('ব্যাকআপ ডাটা রিস্টোর হয়েছে!', 'success');
            renderApp();
          }
        } catch (err) {
          showToast('সঠিক JSON ব্যাকআপ ফাইল দিন।', 'error');
        }
      };
      reader.readAsText(file);
    }

    function resetAllToFactoryDefault() {
      localStorage.removeItem(STORAGE_KEY_ERP);
      state = JSON.parse(JSON.stringify(initialState));
      showToast('ডিফল্ট সেটিংস রিসেট করা হয়েছে।', 'info');
      renderApp();
    }

    function renderApp() {
      const root = document.getElementById('app');
      let bodyContent = '';

      switch (state.activeTab) {
        case 'dashboard': bodyContent = renderDashboard(); break;
        case 'menu-hub': bodyContent = renderMenuHub(); break;
        case 'new-order': bodyContent = renderNewOrder(); break;
        case 'orders': bodyContent = renderOrdersList(); break;
        case 'quick-sale': bodyContent = renderQuickSale(); break;
        case 'purchases': bodyContent = renderPurchasesAndSuppliers(); break;
        case 'inventory': bodyContent = renderInventory(); break;
        case 'customers': bodyContent = renderCustomers(); break;
        case 'services': bodyContent = renderServicesAndMeasurements(); break;
        case 'profit-report': bodyContent = renderProfitReport(); break;
        case 'settings': bodyContent = renderSettings(); break;
        default: bodyContent = renderDashboard();
      }

      root.innerHTML = `
        <div class="min-h-screen flex bg-[#f3f5f4]">
          ${renderLeftSidebar()}
          <div class="flex-1 flex flex-col min-w-0">
            ${renderTopNav()}
            <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-6">
              ${bodyContent}
            </main>
            <footer class="bg-white border-t border-slate-200 py-3.5 px-4 text-center text-xs text-slate-500 no-print">
              ${state.shop.name} • মোবাইল ও ল্যাপটপ রেসপন্সিভ টেইলার্স ও ইনভেন্টরি সিস্টেম
            </footer>
          </div>
        </div>
      `;

      if (window.lucide) lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupPwaSupport();
      renderApp();
    });

    let deferredInstallPrompt = null;

    function setupPwaSupport() {
      try {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#042f2e"/>
              <stop offset="100%" stop-color="#065f46"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="110" fill="url(#bg)"/>
          <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="14"/>
          <text x="256" y="255" text-anchor="middle" font-size="145" fill="#fbbf24">✂️</text>
          <text x="256" y="365" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#ffffff">আল-কারীম</text>
        </svg>`;
        const iconDataUrl = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(iconSvg);

        const appleIcon = document.getElementById('pwa-apple-icon');
        if (appleIcon) appleIcon.href = iconDataUrl;

        const manifestObj = {
          name: 'আল-কারীম পাঞ্জাবী টেইলার্স এন্ড ফেব্রিক্স',
          short_name: 'আল-কারীম টেইলার্স',
          description: 'Royal Atelier, Tailoring & Fabrics Inventory ERP',
          start_url: window.location.href,
          scope: './',
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#042f2e',
          theme_color: '#042f2e',
          icons: [
            {
              src: iconDataUrl,
              sizes: '192x192',
              type: 'image/svg+xml',
              purpose: 'any maskable'
            },
            {
              src: iconDataUrl,
              sizes: '512x512',
              type: 'image/svg+xml',
              purpose: 'any maskable'
            }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.getElementById('pwa-manifest-link');
        if (manifestLink) manifestLink.setAttribute('href', manifestUrl);

        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          const swCode = `
            const CACHE_NAME = 'alkarim-offline-v1';
            const OFFLINE_ASSETS = [
              './',
              './index.html',
              'https://cdn.tailwindcss.com',
              'https://unpkg.com/lucide@latest',
              'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css',
              'https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap'
            ];

            self.addEventListener('install', (e) => {
              e.waitUntil(
                caches.open(CACHE_NAME).then((cache) => {
                  return Promise.allSettled(OFFLINE_ASSETS.map((url) => cache.add(url)));
                })
              );
              self.skipWaiting();
            });

            self.addEventListener('activate', (e) => {
              e.waitUntil(
                caches.keys().then((keys) =>
                  Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))
                ).then(() => clients.claim())
              );
            });

            self.addEventListener('fetch', (e) => {
              e.respondWith(
                caches.match(e.request).then((cached) => {
                  const networkFetch = fetch(e.request).then((res) => {
                    if (res && res.status === 200) {
                      const copy = res.clone();
                      caches.open(CACHE_NAME).then((cache) => cache.put(e.request, copy));
                    }
                    return res;
                  }).catch(() => cached);
                  return cached || networkFetch;
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        }
      } catch (err) {}
    }

    window.addEventListener('online', () => {
      showToast('ইন্টারনেট সংযোগ ফিরে এসেছে (অনলাইন)।', 'success');
      renderApp();
    });

    window.addEventListener('offline', () => {
      showToast('অফলাইন মোড চালু! ডাটা ছাড়াই অর্ডার, স্টক ও মেমো সব চলবে।', 'warn');
      renderApp();
    });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.classList.remove('hidden');
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      showToast('অ্যাপটি সফলভাবে আপনার ফোনে ইনস্টল হয়েছে!', 'success');
    });

    async function triggerPwaInstall() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        if (choice && choice.outcome === 'accepted') {
          showToast('অ্যাপ ইনস্টল শুরু হয়েছে...', 'success');
        }
        deferredInstallPrompt = null;
        return;
      }

      const html = `
        <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between royal-gradient text-white">
          <h3 class="text-base font-extrabold text-amber-300">📲 ফোনে অ্যাপ ইনস্টল করার নিয়ম</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-white/10 text-white cursor-pointer">✕</button>
        </div>
        <div class="p-5 space-y-3 text-xs text-slate-700 leading-relaxed">
          <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 font-bold text-emerald-950">
            ১. আপনার লাইভ GitHub লিংকটি সরাসরি Google Chrome ব্রাউজারে ওপেন করুন:
            <div class="mt-1 font-mono text-[11px] text-emerald-800 break-all select-all">https://alkarimpanjabitailors92-hue.github.io/AL-KARIM-PANJABI-TAILORS-FEBRIS/</div>
          </div>
          <div class="space-y-1.5">
            <div><b>২. Android (Chrome ব্রাউজার):</b> ওপরে ডানপাশে <b>⋮ (তিন ডট মেনু)</b> চাপুন → <b>"Install app"</b> অথবা <b>"Add to Home screen"</b> চাপুন → <b>Install</b> দিন।</div>
            <div><b>৩. iPhone (Safari ব্রাউজার):</b> নিচে মাঝখানে <b>Share (↑)</b> বাটনে চাপুন → <b>"Add to Home Screen"</b> সিলেক্ট করে <b>Add</b> দিন।</div>
          </div>
          <div class="p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-950 font-semibold">
            ইনস্টল হয়ে গেলে ফোনের হোম স্ক্রিনে <b>"আল-কারীম টেইলার্স"</b> নামে আইকন চলে আসবে এবং সাধারণ অ্যাপের মতো ফুল-স্ক্রিনে চলবে।
          </div>
        </div>
        <div class="px-5 py-3 border-t border-slate-200 flex justify-end">
          <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-emerald-700 text-white font-bold text-xs cursor-pointer">বুঝেছি</button>
        </div>
      `;
      openModal(html, 'max-w-md');
    }
  </script>
</body>
</html>
